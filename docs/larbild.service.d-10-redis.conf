# Install on Sibbis as /etc/systemd/system/larbild.service.d/10-redis.conf
# (then: sudo systemctl daemon-reload && sudo systemctl restart larbild.service)
# Drop-in for the main larbild.service (UI/API, :6868): gives the API the Redis
# auth + ComfyUI bridge target it needs to enqueue render jobs. The referenced
# /etc/larbild/render.env is a host secret and is NOT committed.
[Service]
# Redis auth (queue enqueue needs it) + ComfyUI bridge target. Render is now
# wired (P9 + first live render, 2026-06-02); the API can enqueue jobs.
EnvironmentFile=/etc/larbild/render.env
