<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Alfapartikel (α)</text>
<!-- Big unstable nucleus on the left -->
<circle cx="240" cy="250" r="80" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<g>
<circle cx="215" cy="225" r="13" fill="#dc2626"/><circle cx="245" cy="215" r="13" fill="#6b7280"/>
<circle cx="270" cy="235" r="13" fill="#dc2626"/><circle cx="220" cy="258" r="13" fill="#6b7280"/>
<circle cx="252" cy="262" r="13" fill="#dc2626"/><circle cx="278" cy="270" r="13" fill="#6b7280"/>
<circle cx="232" cy="290" r="13" fill="#dc2626"/><circle cx="262" cy="292" r="13" fill="#6b7280"/>
</g>
<text x="240" y="365" font-family="Arial,sans-serif" font-size="14" fill="#92400e" text-anchor="middle" font-weight="bold">Instabil atomkärna</text>
<!-- emission arrow -->
<line x1="340" y1="230" x2="500" y2="200" stroke="#1f2937" stroke-width="2.5"/>
<polygon points="512,198 498,194 500,208" fill="#1f2937"/>
<text x="420" y="180" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">skjuts ut</text>
<!-- the emitted alpha particle: 2 protons (red) + 2 neutrons (gray) -->
<circle cx="560" cy="210" r="55" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,3"/>
<circle cx="545" cy="195" r="15" fill="#dc2626"/><text x="545" y="200" font-family="Arial,sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="bold">p+</text>
<circle cx="578" cy="198" r="15" fill="#6b7280"/><text x="578" y="203" font-family="Arial,sans-serif" font-size="13" fill="white" text-anchor="middle">n</text>
<circle cx="545" cy="228" r="15" fill="#6b7280"/><text x="545" y="233" font-family="Arial,sans-serif" font-size="13" fill="white" text-anchor="middle">n</text>
<circle cx="578" cy="230" r="15" fill="#dc2626"/><text x="578" y="235" font-family="Arial,sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="bold">p+</text>
<text x="640" y="215" font-family="Arial,sans-serif" font-size="16" fill="#2563eb" text-anchor="start" font-weight="bold">α</text>
<text x="560" y="295" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">2 protoner + 2 neutroner</text>
<!-- legend -->
<circle cx="300" cy="430" r="9" fill="#dc2626"/><text x="315" y="435" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="start">proton (p+)</text>
<circle cx="450" cy="430" r="9" fill="#6b7280"/><text x="465" y="435" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="start">neutron (n)</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">En tung bit som skjuts ut från en atomkärna — två protoner och två neutroner ihop</text>
</svg>
