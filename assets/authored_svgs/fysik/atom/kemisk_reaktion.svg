<text x="596" y="345" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">nytt ämne (vatten, 2 H₂O)</text>
<text x="400" y="365" font-family="Arial,sans-serif" font-size="15" fill="#1e40af" text-anchor="middle" font-weight="bold">2 H₂ + O₂ → 2 H₂O</text>
<rect x="160" y="377" width="480" height="40" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" rx="6"/>
<text x="400" y="402" font-family="Arial,sans-serif" font-size="12" fill="#92400e" text-anchor="middle">Att steka ägg är en kemisk reaktion — det går inte att göra ogjort</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Vid en kemisk reaktion ombildas atomerna till helt nya ämnen</text>
</svg>
