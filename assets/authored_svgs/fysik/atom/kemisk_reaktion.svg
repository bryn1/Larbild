<circle cx="618.1" cy="223.1" r="12" fill="#2563eb" stroke="#374151" stroke-width="1.5"/>
<text x="618.1" y="227" font-family="Arial,sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">H</text>
