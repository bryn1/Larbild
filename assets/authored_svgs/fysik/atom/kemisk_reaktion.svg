<text x="104" y="335" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">väte (2 H₂)</text>
<text x="185" y="245" font-family="Arial,sans-serif" font-size="26" fill="#1f2937" text-anchor="middle">+</text>
<circle cx="258.0" cy="240" r="20" fill="#dc2626" stroke="#374151" stroke-width="1.5"/>
<text x="258.0" y="245" font-family="Arial,sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="bold">O</text>
<circle cx="302.0" cy="240" r="20" fill="#dc2626" stroke="#374151" stroke-width="1.5"/>
