<text x="423" y="222" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle">reagerar</text>
<!-- water molecule 1: bent ~104.5°, large central O, two smaller H overlapping -->
<line x1="596" y1="206" x2="573.9" y2="223.1" stroke="#374151" stroke-width="3"/>
