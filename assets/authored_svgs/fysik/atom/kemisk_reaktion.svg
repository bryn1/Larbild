<text x="400" y="397" font-family="Arial,sans-serif" font-size="12" fill="#92400e" text-anchor="middle">Att steka ägg är en kemisk reaktion — det går inte att göra ogjort</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Vid en kemisk reaktion ombildas atomerna till helt nya ämnen</text>
