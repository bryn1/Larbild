<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Halveringstid (t½)</text>

<!-- axes -->
<!-- y axis -->
<line x1="120" y1="80" x2="120" y2="380" stroke="#1f2937" stroke-width="2.5"/>
<polygon points="120,72 114,86 126,86" fill="#1f2937"/>
<!-- x axis -->
<line x1="120" y1="380" x2="730" y2="380" stroke="#1f2937" stroke-width="2.5"/>
<polygon points="738,380 724,374 724,386" fill="#1f2937"/>
<text x="60" y="220" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold" transform="rotate(-90 60 220)">Mängd radioaktiva atomer</text>
<text x="430" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Efter varje halveringstid (t½) är hälften av atomerna kvar — 100% → 50% → 25% → 12,5%</text>
<text x="420" y="412" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Tid →</text>

<!-- gridline percentages on y -->
<!-- 100% at y=100, 50% at y=200, 25% at y=270, 12.5% at y=320 (decay style) -->
<line x1="116" y1="100" x2="730" y2="100" stroke="#e5e7eb" stroke-width="1"/>
<text x="110" y="105" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="end" font-weight="bold">100%</text>
<line x1="116" y1="200" x2="730" y2="200" stroke="#e5e7eb" stroke-width="1"/>
<text x="110" y="205" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="end" font-weight="bold">50%</text>
<line x1="116" y1="270" x2="730" y2="270" stroke="#e5e7eb" stroke-width="1"/>
<text x="110" y="275" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="end" font-weight="bold">25%</text>
<line x1="116" y1="320" x2="730" y2="320" stroke="#e5e7eb" stroke-width="1"/>
<text x="110" y="324" font-family="Arial,sans-serif" font-size="11" fill="#1f2937" text-anchor="end" font-weight="bold">12,5%</text>

<!-- decay curve: from (120,100) halving each t1/2; t1/2 spacing 150px -->
<path d="M 120 100 C 200 100 230 175 270 200 C 310 225 320 255 420 270 C 480 280 490 305 570 320 C 630 330 650 345 720 352" fill="none" stroke="#dc2626" stroke-width="3.5"/>

<!-- markers at each half-life -->
<!-- t=0 -->
<circle cx="120" cy="100" r="5" fill="#dc2626"/>
<!-- 1 t1/2 at x=270 -->
<circle cx="270" cy="200" r="5" fill="#dc2626"/>
<line x1="270" y1="200" x2="270" y2="380" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4,3"/>
<!-- 2 t1/2 at x=420 -->
<circle cx="420" cy="270" r="5" fill="#dc2626"/>
<line x1="420" y1="270" x2="420" y2="380" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4,3"/>
<!-- 3 t1/2 at x=570 -->
<circle cx="570" cy="320" r="5" fill="#dc2626"/>
<line x1="570" y1="320" x2="570" y2="380" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4,3"/>

<!-- x-axis half-life tick labels -->
<text x="270" y="398" font-family="Arial,sans-serif" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="bold">1 × t½</text>
<text x="420" y="398" font-family="Arial,sans-serif" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="bold">2 × t½</text>
<text x="570" y="398" font-family="Arial,sans-serif" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="bold">3 × t½</text>

<!-- callout: what t1/2 means -->
<rect x="500" y="110" width="250" height="80" fill="white" stroke="#9ca3af" stroke-width="1.5" rx="6"/>
<text x="625" y="135" font-family="Arial,sans-serif" font-size="15" fill="#1e40af" text-anchor="middle" font-weight="bold">t½ = halveringstid</text>
<text x="625" y="158" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">tiden då hälften av atomerna</text>
<text x="625" y="176" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">har sönderfallit</text>

<!-- half-step braces showing "halverat" between markers -->
<text x="195" y="160" font-family="Arial,sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="bold">halveras</text>
<text x="345" y="248" font-family="Arial,sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="bold">halveras</text>
<text x="495" y="308" font-family="Arial,sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="bold">halveras</text>
</svg>
