<text x="400" y="100" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Energi som rör sig som vågor med ljusets fart</text>
<text x="740" y="118" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"></text>
<text x="400" y="210" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Det elektromagnetiska spektrumet:</text>
<rect x="90" y="225" width="88" height="46" fill="#7f1d1d"/>
<text x="134.0" y="254" font-family="Arial,sans-serif" font-size="11" fill="white" text-anchor="middle">Radio</text>
