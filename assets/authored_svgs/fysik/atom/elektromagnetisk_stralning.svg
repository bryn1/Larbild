<text x="120" y="320" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">lång våglängd</text>
<text x="670" y="320" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">kort våglängd</text>
<text x="120" y="290" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">låg energi</text>
<text x="670" y="290" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">hög energi</text>
<text x="400" y="380" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Synligt ljus, radiovågor och röntgen är samma sorts strålning</text>
<text x="400" y="405" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">— de skiljer sig bara i våglängd och energi</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Elektromagnetisk strålning är energi som vandrar som vågor genom rymden</text>
