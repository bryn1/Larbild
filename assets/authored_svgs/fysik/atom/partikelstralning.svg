<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Partikelstrålning — genomträngning</text>
<circle cx="90" cy="250" r="22" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="90" y="255" font-family="Arial,sans-serif" font-size="10" fill="#92400e" text-anchor="middle">källa</text>
<rect x="300" y="120" width="16" height="260" fill="#f59e0b" stroke="#1f2937" stroke-width="1"/>
<text x="308" y="405" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">papper</text>
<rect x="470" y="120" width="16" height="260" fill="#9ca3af" stroke="#1f2937" stroke-width="1"/>
<text x="478" y="405" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">plåt (aluminium)</text>
<rect x="640" y="120" width="16" height="260" fill="#374151" stroke="#1f2937" stroke-width="1"/>
<text x="648" y="405" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">bly</text>
<line x1="115.0" y1="170.0" x2="287.0" y2="170.0" stroke="#dc2626" stroke-width="3"/>
<polygon points="296.0,170.0 287.0,174.5 287.0,165.5" fill="#dc2626"/>
<text x="200" y="160" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold">alfa (α)</text>
<line x1="304" y1="155" x2="304" y2="185" stroke="#dc2626" stroke-width="2"/>
<line x1="115.0" y1="250.0" x2="457.0" y2="250.0" stroke="#16a34a" stroke-width="3"/>
<polygon points="466.0,250.0 457.0,254.5 457.0,245.5" fill="#16a34a"/>
<text x="360" y="240" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="bold">beta (β)</text>
<line x1="474" y1="235" x2="474" y2="265" stroke="#16a34a" stroke-width="2"/>
<line x1="115.0" y1="330.0" x2="711.0" y2="330.0" stroke="#2563eb" stroke-width="3"/>
<polygon points="720.0,330.0 711.0,334.5 711.0,325.5" fill="#2563eb"/>
<text x="560" y="320" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="bold">gamma (γ)</text>
<text x="400" y="90" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Olika strålslag stoppas av olika material</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Alfa stoppas av papper, beta av plåt, gamma kräver tjockt bly</text>
</svg>
