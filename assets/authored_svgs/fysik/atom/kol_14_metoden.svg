<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Kol-14-metoden (åldersbestämning)</text>
<text x="400" y="72" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">Mängden kol-14 halveras med jämna mellanrum (halveringstid)</text>
<line x1="130.0" y1="400.0" x2="710.0" y2="400.0" stroke="#1f2937" stroke-width="2"/>
<polygon points="720.0,400.0 710.0,396.0 710.0,404.0" fill="#1f2937"/>
<line x1="130.0" y1="400.0" x2="130.0" y2="130.0" stroke="#1f2937" stroke-width="2"/>
<polygon points="130.0,120.0 126.0,130.0 134.0,130.0" fill="#1f2937"/>
<text x="425" y="442" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">tid →</text>
<text x="112" y="260" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" transform="rotate(-90 112 260)">kol-14 kvar</text>
<polyline points="130.0,130.0 270.0,265.0 410.0,332.5 550.0,366.2 690.0,383.1" fill="none" stroke="#2563eb" stroke-width="3"/>
<circle cx="130.0" cy="130.0" r="5" fill="#1e40af"/>
<text x="130.0" y="118.0" font-family="Arial,sans-serif" font-size="11" fill="#1e40af" text-anchor="middle">100%</text>
<circle cx="270.0" cy="265.0" r="5" fill="#1e40af"/>
<text x="270.0" y="253.0" font-family="Arial,sans-serif" font-size="11" fill="#1e40af" text-anchor="middle">50%</text>
<line x1="270.0" y1="400" x2="270.0" y2="406" stroke="#1f2937" stroke-width="1.5"/>
<text x="270.0" y="422" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">1 HT</text>
<circle cx="410.0" cy="332.5" r="5" fill="#1e40af"/>
<text x="410.0" y="320.5" font-family="Arial,sans-serif" font-size="11" fill="#1e40af" text-anchor="middle">25%</text>
<line x1="410.0" y1="400" x2="410.0" y2="406" stroke="#1f2937" stroke-width="1.5"/>
<text x="410.0" y="422" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">2 HT</text>
<circle cx="550.0" cy="366.25" r="5" fill="#1e40af"/>
<text x="550.0" y="354.25" font-family="Arial,sans-serif" font-size="11" fill="#1e40af" text-anchor="middle">12,5%</text>
<line x1="550.0" y1="400" x2="550.0" y2="406" stroke="#1f2937" stroke-width="1.5"/>
<text x="550.0" y="422" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">3 HT</text>
<circle cx="690.0" cy="383.125" r="5" fill="#1e40af"/>
<text x="690.0" y="371.125" font-family="Arial,sans-serif" font-size="11" fill="#1e40af" text-anchor="middle">6,25%</text>
<line x1="690.0" y1="400" x2="690.0" y2="406" stroke="#1f2937" stroke-width="1.5"/>
<text x="690.0" y="422" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">4 HT</text>
<text x="150" y="422" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">0</text>
<text x="560" y="200" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">HT = halveringstid</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Genom att mäta hur mycket kol-14 som är kvar kan man räkna ut åldern</text>
</svg>
