<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Masstal (A = Z + N)</text>
<circle cx="240" cy="230" r="60" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<circle cx="218" cy="212" r="11" fill="#dc2626"/>
<text x="218" y="216" font-family="Arial,sans-serif" font-size="9" fill="white" text-anchor="middle">p+</text>
<circle cx="260" cy="208" r="11" fill="#dc2626"/>
<text x="260" y="212" font-family="Arial,sans-serif" font-size="9" fill="white" text-anchor="middle">p+</text>
<circle cx="238" cy="252" r="11" fill="#dc2626"/>
<text x="238" y="256" font-family="Arial,sans-serif" font-size="9" fill="white" text-anchor="middle">p+</text>
<circle cx="258" cy="246" r="11" fill="#6b7280"/>
<text x="258" y="250" font-family="Arial,sans-serif" font-size="9" fill="white" text-anchor="middle">n</text>
<circle cx="214" cy="238" r="11" fill="#6b7280"/>
<text x="214" y="242" font-family="Arial,sans-serif" font-size="9" fill="white" text-anchor="middle">n</text>
<circle cx="268" cy="228" r="11" fill="#6b7280"/>
<text x="268" y="232" font-family="Arial,sans-serif" font-size="9" fill="white" text-anchor="middle">n</text>
<circle cx="242" cy="228" r="11" fill="#6b7280"/>
<text x="242" y="232" font-family="Arial,sans-serif" font-size="9" fill="white" text-anchor="middle">n</text>
<text x="240" y="320" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Atomkärna</text>
<text x="560" y="160" font-family="Arial,sans-serif" font-size="30" fill="#1e40af" text-anchor="middle" font-weight="bold">A = Z + N</text>
<text x="560" y="200" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">masstal = antal protoner + antal neutroner</text>
<rect x="430" y="240" width="260" height="120" fill="white" stroke="#2563eb" stroke-width="2" rx="4"/>
<text x="560" y="270" font-family="Arial,sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">Exempel: litium</text>
<text x="560" y="298" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">Z = 3 protoner</text>
<text x="560" y="320" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">N = 4 neutroner</text>
<text x="560" y="345" font-family="Arial,sans-serif" font-size="15" fill="#1e40af" text-anchor="middle" font-weight="bold">A = 3 + 4 = 7</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Masstalet räknar alla byggstenar (protoner + neutroner) i kärnan</text>
</svg>
