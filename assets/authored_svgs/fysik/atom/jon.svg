<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Jon</text>
<!-- LEFT: neutral atom -->
<circle cx="200" cy="250" r="100" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4" fill="none"/>
<circle cx="200" cy="250" r="28" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="200" y="248" font-family="Arial,sans-serif" font-size="11" fill="#92400e" text-anchor="middle">11 p⁺</text>
<text x="200" y="262" font-family="Arial,sans-serif" font-size="9" fill="#92400e" text-anchor="middle">kärna</text>
<circle cx="300" cy="250" r="9" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
<text x="300" y="254" font-family="Arial,sans-serif" font-size="8" fill="white" text-anchor="middle">e⁻</text>
<circle cx="160" cy="160" r="9" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
<circle cx="120" cy="290" r="9" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
<text x="200" y="385" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Neutral atom</text>
<text x="200" y="405" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle">+11 och −11 → laddning 0</text>
<!-- arrow: loses one electron -->
<line x1="330" y1="250" x2="470" y2="250" stroke="#1f2937" stroke-width="2.5"/>
<polygon points="482,250 468,245 468,255" fill="#1f2937"/>
<text x="400" y="235" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">tappar 1 e⁻</text>
<!-- the freed electron flying off -->
<circle cx="400" cy="300" r="9" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
<text x="400" y="304" font-family="Arial,sans-serif" font-size="8" fill="white" text-anchor="middle">e⁻</text>
<line x1="360" y1="270" x2="395" y2="295" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3,3"/>
<!-- RIGHT: positive ion -->
<circle cx="610" cy="250" r="100" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4" fill="none"/>
<circle cx="610" cy="250" r="28" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="610" y="248" font-family="Arial,sans-serif" font-size="11" fill="#991b1b" text-anchor="middle">11 p⁺</text>
<text x="610" y="262" font-family="Arial,sans-serif" font-size="9" fill="#991b1b" text-anchor="middle">kärna</text>
<circle cx="710" cy="250" r="9" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
<circle cx="570" cy="160" r="9" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
<text x="610" y="385" font-family="Arial,sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold">Positiv jon (Na⁺)</text>
<text x="610" y="405" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">+11 och −10 → laddning +1</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">En atom som fått eller tappat en elektron blir en jon med elektrisk laddning</text>
</svg>
