<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Formelmassa (H₂O som exempel)</text>
<text x="400" y="78" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Räkna ihop massan av alla atomer i formeln</text>
<circle cx="360" cy="175" r="30" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
<text x="360" y="180" font-family="Arial,sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">O</text>
<circle cx="300" cy="215" r="18" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
<text x="300" y="220" font-family="Arial,sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">H</text>
<circle cx="420" cy="215" r="18" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
<text x="420" y="220" font-family="Arial,sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">H</text>
<line x1="338" y1="192" x2="312" y2="205" stroke="#374151" stroke-width="3"/>
<line x1="382" y1="192" x2="408" y2="205" stroke="#374151" stroke-width="3"/>
<text x="360" y="270" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">vattenmolekyl H₂O</text>
<rect x="500" y="130" width="270" height="170" fill="white" stroke="#16a34a" stroke-width="2" rx="6"/>
<text x="635" y="158" font-family="Arial,sans-serif" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="bold">Formelmassa</text>
<text x="520" y="190" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="start">2 × H = 2 × 1 u = 2 u</text>
<text x="520" y="218" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="start">1 × O = 1 × 16 u = 16 u</text>
<line x1="515" y1="232" x2="755" y2="232" stroke="#9ca3af" stroke-width="1.5"/>
<text x="520" y="262" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">Summa:</text>
<text x="755" y="262" font-family="Arial,sans-serif" font-size="18" fill="#1e40af" text-anchor="end" font-weight="bold">18 u</text>
<text x="635" y="288" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(u = atommassenhet)</text>
<text x="400" y="360" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Formelmassan är summan av atommassorna i en kemisk formel</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Lägg ihop massan av varje atom som ingår i formeln</text>
</svg>
