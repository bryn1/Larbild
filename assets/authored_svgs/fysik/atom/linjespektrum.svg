<text x="675" y="138" font-family="Arial,sans-serif" font-size="11" fill="#dc2626" text-anchor="end">rött</text>
<text x="400" y="110" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Varje ämne ger sitt eget mönster av färgade streck</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Ett glödande ämne skickar bara ut ljus vid bestämda våglängder</text>
