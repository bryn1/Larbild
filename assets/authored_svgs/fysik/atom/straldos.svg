<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Stråldos — mått på strålning (sievert)</text>
<defs><linearGradient id="dose" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#16a34a"/><stop offset="50%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#dc2626"/></linearGradient></defs>
<rect x="100" y="200" width="600" height="40" fill="url(#dose)" rx="4"/>
<line x1="100.0" y1="270.0" x2="691.0" y2="270.0" stroke="#6b7280" stroke-width="2"/>
<polygon points="700.0,270.0 691.0,274.5 691.0,265.5" fill="#6b7280"/>
<text x="100" y="188" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="bold">låg dos</text>
<text x="700" y="188" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="end" font-weight="bold">hög dos</text>
<text x="150" y="295" font-family="Arial,sans-serif" font-size="11" fill="#16a34a" text-anchor="middle">tandröntgen (mycket liten)</text>
<text x="400.0" y="295" font-family="Arial,sans-serif" font-size="11" fill="#92400e" text-anchor="middle">årlig bakgrund</text>
<text x="630" y="295" font-family="Arial,sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">akut strålsjuka</text>
<line x1="150.0" y1="197" x2="150.0" y2="243" stroke="#1f2937" stroke-width="2"/>
<line x1="400.0" y1="197" x2="400.0" y2="243" stroke="#1f2937" stroke-width="2"/>
<line x1="630.0" y1="197" x2="630.0" y2="243" stroke="#1f2937" stroke-width="2"/>
<text x="400" y="120" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Enhet: sievert (Sv). Små doser = ofarliga, stora = farliga.</text>
<text x="400.0" y="325" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">ökande stråldos →</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Stråldosen mäter hur mycket strålning kroppen tagit upp</text>
</svg>
