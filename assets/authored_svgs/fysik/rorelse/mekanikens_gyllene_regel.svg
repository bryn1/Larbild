<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Mekanikens gyllene regel</text>

<!-- ramp: base at (120,400) up to top (560,200). Slope direction (up the ramp) = (440,-200) normalised = (0.910,-0.414). -->
<polygon points="120,400 560,400 560,200" fill="#e5e7eb" stroke="#1f2937" stroke-width="2.5"/>
<line x1="120" y1="400" x2="560" y2="200" stroke="#2563eb" stroke-width="3"/>

<!-- ground hatching -->
<line x1="120" y1="400" x2="700" y2="400" stroke="#1f2937" stroke-width="2"/>
<line x1="150" y1="400" x2="138" y2="412" stroke="#9ca3af" stroke-width="1.3"/>
<line x1="210" y1="400" x2="198" y2="412" stroke="#9ca3af" stroke-width="1.3"/>
<line x1="270" y1="400" x2="258" y2="412" stroke="#9ca3af" stroke-width="1.3"/>
<line x1="330" y1="400" x2="318" y2="412" stroke="#9ca3af" stroke-width="1.3"/>
<line x1="390" y1="400" x2="378" y2="412" stroke="#9ca3af" stroke-width="1.3"/>
<line x1="450" y1="400" x2="438" y2="412" stroke="#9ca3af" stroke-width="1.3"/>
<line x1="510" y1="400" x2="498" y2="412" stroke="#9ca3af" stroke-width="1.3"/>
<line x1="570" y1="400" x2="558" y2="412" stroke="#9ca3af" stroke-width="1.3"/>
<line x1="630" y1="400" x2="618" y2="412" stroke="#9ca3af" stroke-width="1.3"/>
<line x1="690" y1="400" x2="678" y2="412" stroke="#9ca3af" stroke-width="1.3"/>

<!-- box on the ramp. Place at parameter ~0.55 along ramp. Point on ramp: (120+0.55*440, 400-0.55*200)=(362,290). Box sits ON the surface. -->
<rect x="338" y="266" width="42" height="26" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="3" transform="rotate(-24.4 359 279)"/>
<text x="359" y="255" font-family="Arial,sans-serif" font-size="11" fill="#2563eb" text-anchor="middle">låda</text>

<!-- SMALL force UP ALONG the ramp (correct direction): from box up-right along slope.
     start (362,290), direction (0.910,-0.414)*100 -> end (453,249). -->
<line x1="362" y1="290" x2="453" y2="249" stroke="#16a34a" stroke-width="5"/>
<polygon points="468,242 451,242 458,257" fill="#16a34a"/>
<text x="455" y="300" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="bold">Liten kraft</text>
<text x="455" y="318" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle">längs rampen (lång väg)</text>

<!-- height h (vertical rise) -->
<line x1="572" y1="200" x2="572" y2="400" stroke="#92400e" stroke-width="2" stroke-dasharray="5,4"/>
<line x1="566" y1="200" x2="578" y2="200" stroke="#92400e" stroke-width="2"/>
<line x1="566" y1="400" x2="578" y2="400" stroke="#92400e" stroke-width="2"/>
<text x="600" y="305" font-family="Arial,sans-serif" font-size="13" fill="#92400e" text-anchor="start">höjd h</text>

<!-- BIG force lifting straight up (short way) -->
<line x1="660" y1="400" x2="660" y2="225" stroke="#dc2626" stroke-width="5"/>
<polygon points="660,209 651,225 669,225" fill="#dc2626"/>
<text x="690" y="300" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="start" font-weight="bold">Stor kraft</text>
<text x="690" y="318" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="start">rakt upp (kort väg)</text>

<text x="400" y="466" font-family="Arial,sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Det du vinner i kraft förlorar du i väg — arbetet blir lika stort</text>
</svg>
