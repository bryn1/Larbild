<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Spett (hävstång)</text>

<!-- ground -->
<line x1="100" y1="360" x2="700" y2="360" stroke="#1f2937" stroke-width="2"/>
<line x1="140" y1="360" x2="128" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="200" y1="360" x2="188" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="260" y1="360" x2="248" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="330" y1="360" x2="318" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="400" y1="360" x2="388" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="470" y1="360" x2="458" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="540" y1="360" x2="528" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="610" y1="360" x2="598" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="670" y1="360" x2="658" y2="372" stroke="#9ca3af" stroke-width="1.5"/>

<!-- fulcrum (stödpunkt) -->
<polygon points="308,358 352,358 330,320" fill="#9ca3af" stroke="#1f2937" stroke-width="2"/>
<text x="330" y="378" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Stödpunkt</text>

<!-- the spett (lever): left end low (under the stone), right end high (where you push) -->
<line x1="220" y1="340" x2="620" y2="250" stroke="#6b7280" stroke-width="9"/>
<line x1="220" y1="340" x2="620" y2="250" stroke="#1f2937" stroke-width="2"/>
<text x="520" y="244" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">Spett (lång stång)</text>

<!-- stone on the short (left) end -->
<polygon points="184,334 210,296 242,300 250,332 220,344" fill="#a8a29e" stroke="#57534e" stroke-width="2.5"/>
<text x="214" y="318" font-family="Arial,sans-serif" font-size="12" fill="#44403c" text-anchor="middle" font-weight="bold">Sten</text>

<!-- stone is lifted UP (green arrow up on the short side) -->
<line x1="210" y1="288" x2="210" y2="244" stroke="#16a34a" stroke-width="3.5"/>
<polygon points="210,230 217,244 203,244" fill="#16a34a"/>
<text x="210" y="218" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle">Stenen lyfts</text>

<!-- LITEN KRAFT: you push DOWN on the long (right) end.
     Start above the lever end (620,250) up at y=176, arrow points DOWN to the lever. -->
<line x1="620" y1="176" x2="620" y2="232" stroke="#dc2626" stroke-width="5"/>
<polygon points="620,248 611,232 629,232" fill="#dc2626"/>
<text x="620" y="164" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">Liten kraft nedåt</text>

<!-- hävarm comparison along the bottom -->
<line x1="330" y1="430" x2="230" y2="430" stroke="#7c3aed" stroke-width="2"/>
<line x1="330" y1="423" x2="330" y2="437" stroke="#7c3aed" stroke-width="2"/>
<line x1="230" y1="423" x2="230" y2="437" stroke="#7c3aed" stroke-width="2"/>
<text x="280" y="450" font-family="Arial,sans-serif" font-size="11" fill="#7c3aed" text-anchor="middle">kort</text>
<line x1="330" y1="430" x2="620" y2="430" stroke="#16a34a" stroke-width="2"/>
<line x1="620" y1="423" x2="620" y2="437" stroke="#16a34a" stroke-width="2"/>
<text x="475" y="450" font-family="Arial,sans-serif" font-size="11" fill="#16a34a" text-anchor="middle">lång hävarm (där du trycker)</text>

<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Ett spett är en lång hävstång — ju längre spett, desto mindre kraft behövs</text>
</svg>
