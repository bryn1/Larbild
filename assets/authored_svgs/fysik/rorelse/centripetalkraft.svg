<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Centripetalkraft (inåtriktad kraft)</text>

<!-- circular path -->
<circle cx="360" cy="280" r="150" fill="none" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="9,7"/>

<!-- hand at the centre -->
<circle cx="360" cy="280" r="16" fill="#fde68a" stroke="#f59e0b" stroke-width="2.5"/>
<text x="360" y="285" font-family="Arial,sans-serif" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="bold">hand</text>

<!-- string from hand to ball (ball at top, 90deg) -->
<line x1="360" y1="280" x2="360" y2="130" stroke="#f59e0b" stroke-width="3"/>
<text x="300" y="200" font-family="Arial,sans-serif" font-size="15" fill="#b45309" text-anchor="middle" font-weight="bold">snöre</text>

<!-- ball on the rim at top -->
<circle cx="360" cy="130" r="20" fill="#2563eb" stroke="#1e40af" stroke-width="2.5"/>
<text x="360" y="135" font-family="Arial,sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">boll</text>

<!-- centripetal force: ball -> centre (straight down) -->
<line x1="360" y1="152" x2="360" y2="246" stroke="#dc2626" stroke-width="6"/>
<polygon points="360,262 351,246 369,246" fill="#dc2626"/>
<text x="470" y="232" font-family="Arial,sans-serif" font-size="16" fill="#dc2626" text-anchor="start" font-weight="bold">Centripetalkraft</text>
<text x="470" y="254" font-family="Arial,sans-serif" font-size="14" fill="#dc2626" text-anchor="start">drar inåt mot mitten</text>
<line x1="460" y1="226" x2="372" y2="200" stroke="#dc2626" stroke-width="1.5"/>

<!-- velocity: tangent at top -> points to the right (horizontal) -->
<line x1="360" y1="130" x2="500" y2="130" stroke="#16a34a" stroke-width="5"/>
<polygon points="516,130 500,138 500,122" fill="#16a34a"/>
<text x="455" y="112" font-family="Arial,sans-serif" font-size="15" fill="#16a34a" text-anchor="middle" font-weight="bold">Fart</text>

<!-- if no force: flies straight on, dashed gray continuing the tangent -->
<line x1="500" y1="130" x2="640" y2="130" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="6,5"/>
<text x="630" y="170" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="end">Utan kraften:</text>
<text x="630" y="188" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="end">bollen flyger rakt fram</text>

<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Centripetalkraften drar föremålet in mot mitten och håller det kvar i cirkeln</text>
</svg>
