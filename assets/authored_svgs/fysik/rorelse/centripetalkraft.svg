<text x="560" y="350" font-family="Arial,sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold">Centripetalkraft</text>
<text x="560" y="368" font-family="Arial,sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">(inåt mot mitten)</text>
<line x1="560.0" y1="338.0" x2="484.9" y2="257.3" stroke="#dc2626" stroke-width="1.5"/>
