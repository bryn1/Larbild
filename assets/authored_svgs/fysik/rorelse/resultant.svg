<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Resultant (summan av krafter)</text>
<line x1="150.0" y1="200.0" x2="650.0" y2="200.0" stroke="#92400e" stroke-width="5"/>
<circle cx="400.0" cy="200.0" r="8.0" fill="#f59e0b" stroke="#991b1b" stroke-width="2"/>
<text x="400" y="184" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">knut</text>
<line x1="390.0" y1="200.0" x2="266.0" y2="200.0" stroke="#2563eb" stroke-width="5"/>
<polygon points="250.0,200.0 266.0,191.2 266.0,208.8" fill="#2563eb"/>
<text x="300" y="228" font-family="Arial,sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">Lag A drar  (200 N)</text>
<line x1="410.0" y1="200.0" x2="584.0" y2="200.0" stroke="#dc2626" stroke-width="5"/>
<polygon points="600.0,200.0 584.0,208.8 584.0,191.2" fill="#dc2626"/>
<text x="520" y="178" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">Lag B drar  (300 N)</text>
<line x1="150.0" y1="300.0" x2="650.0" y2="300.0" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,4"/>
<text x="400" y="290" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Resultant (nettokraft):</text>
<line x1="400.0" y1="330.0" x2="482.0" y2="330.0" stroke="#16a34a" stroke-width="6"/>
<polygon points="500.0,330.0 482.0,339.9 482.0,320.1" fill="#16a34a"/>
<text x="450" y="322" font-family="Arial,sans-serif" font-size="13" fill="#15803d" text-anchor="middle">100 N åt höger</text>
<text x="450" y="360" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle">→ Lag B vinner, knuten rör sig åt höger</text>
<rect x="170" y="390" width="460" height="50" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="8"/>
<text x="400" y="420" font-family="Arial,sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">300 N − 200 N = 100 N  (resultant åt höger)</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Resultanten är summan av alla krafter — den visar åt vilket håll föremålet dras</text>
</svg>
