<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Kil</text>

<!-- the two halves of the log being split apart -->
<rect x="250" y="300" width="130" height="140" fill="#c8945c" stroke="#92400e" stroke-width="2.5"/>
<rect x="420" y="300" width="130" height="140" fill="#c8945c" stroke="#92400e" stroke-width="2.5"/>
<line x1="258" y1="330" x2="372" y2="330" stroke="#92400e" stroke-width="1"/>
<line x1="428" y1="330" x2="542" y2="330" stroke="#92400e" stroke-width="1"/>
<line x1="258" y1="370" x2="372" y2="370" stroke="#92400e" stroke-width="1"/>
<line x1="428" y1="370" x2="542" y2="370" stroke="#92400e" stroke-width="1"/>
<line x1="258" y1="410" x2="372" y2="410" stroke="#92400e" stroke-width="1"/>
<line x1="428" y1="410" x2="542" y2="410" stroke="#92400e" stroke-width="1"/>
<text x="310" y="380" font-family="Arial,sans-serif" font-size="13" fill="#92400e" text-anchor="middle">Vedträ</text>
<text x="490" y="380" font-family="Arial,sans-serif" font-size="13" fill="#92400e" text-anchor="middle">klyvs i två</text>

<!-- WEDGE turned 180deg: THICK at TOP (y=160), SHARP POINT DOWN into the wood (apex at y=320) -->
<polygon points="354,160 446,160 400,320" fill="#9ca3af" stroke="#1f2937" stroke-width="2.5"/>
<polygon points="400,160 446,160 400,320" fill="#cbd5e1" stroke="#1f2937" stroke-width="2.5"/>
<text x="400" y="215" font-family="Arial,sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Kil</text>

<text x="600" y="172" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="start">tjock upptill</text>
<line x1="448" y1="166" x2="594" y2="168" stroke="#6b7280" stroke-width="1"/>
<text x="600" y="250" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="start">smal spets nedåt</text>
<line x1="404" y1="300" x2="594" y2="246" stroke="#6b7280" stroke-width="1"/>

<!-- force DOWN onto the thick top of the wedge -->
<line x1="400" y1="80" x2="400" y2="140" stroke="#dc2626" stroke-width="5"/>
<polygon points="400,156 391,140 409,140" fill="#dc2626"/>
<text x="400" y="68" font-family="Arial,sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold">Kraft nedåt</text>

<!-- the wedge pushes the wood apart sideways at the split (near the point) -->
<line x1="360" y1="300" x2="312" y2="300" stroke="#16a34a" stroke-width="4"/>
<polygon points="298,300 312,292 312,308" fill="#16a34a"/>
<line x1="440" y1="300" x2="488" y2="300" stroke="#16a34a" stroke-width="4"/>
<polygon points="502,300 488,292 488,308" fill="#16a34a"/>
<text x="400" y="455" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="bold">Kraften nedåt pressas ut åt sidorna</text>

<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">En kil är tjock i ena änden och smal i andra — den pressar isär eller håller fast</text>
</svg>
