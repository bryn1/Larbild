<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Talja</text>
<!-- ceiling / support beam -->
<rect x="250" y="70" width="320" height="16" fill="#6b7280"/>
<line x1="258" y1="86" x2="270" y2="74" stroke="#374151" stroke-width="1.5"/>
<line x1="288" y1="86" x2="300" y2="74" stroke="#374151" stroke-width="1.5"/>
<line x1="318" y1="86" x2="330" y2="74" stroke="#374151" stroke-width="1.5"/>
<line x1="348" y1="86" x2="360" y2="74" stroke="#374151" stroke-width="1.5"/>
<line x1="378" y1="86" x2="390" y2="74" stroke="#374151" stroke-width="1.5"/>
<!-- fixed (upper) pulley -->
<circle cx="430" cy="125" r="28" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<circle cx="430" cy="125" r="4" fill="#1e40af"/>
<line x1="430" y1="86" x2="430" y2="97" stroke="#374151" stroke-width="2"/>
<text x="495" y="123" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="start">fast hjul</text>
<!-- movable (lower) pulley -->
<circle cx="350" cy="320" r="28" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<circle cx="350" cy="320" r="4" fill="#1e40af"/>
<text x="415" y="318" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="start">rörligt hjul</text>
<!-- rope strand 1: anchored at beam straight down to movable pulley (left side) -->
<line x1="322" y1="86" x2="322" y2="320" stroke="#92400e" stroke-width="3"/>
<!-- rope wraps under movable pulley (semicircle) -->
<path d="M 322 320 A 28 28 0 0 0 378 320" stroke="#92400e" stroke-width="3" fill="none"/>
<!-- rope strand 2: up from movable pulley right side to fixed pulley left side -->
<line x1="378" y1="320" x2="402" y2="125" stroke="#92400e" stroke-width="3"/>
<!-- rope wraps over fixed pulley (top semicircle) -->
<path d="M 402 125 A 28 28 0 0 1 458 125" stroke="#92400e" stroke-width="3" fill="none"/>
<!-- free end: down from fixed pulley right side to hand -->
<line x1="458" y1="125" x2="458" y2="270" stroke="#92400e" stroke-width="3"/>
<!-- pulling force arrow (down) at free end -->
<line x1="458" y1="220" x2="458" y2="275" stroke="#dc2626" stroke-width="3"/>
<polygon points="458,285 454,275 462,275" fill="#dc2626"/>
<text x="475" y="245" font-family="Arial,sans-serif" font-size="16" fill="#dc2626" text-anchor="start" font-weight="bold">F</text>
<text x="475" y="265" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="start">liten kraft</text>
<!-- load hanging from movable pulley -->
<line x1="350" y1="348" x2="350" y2="372" stroke="#374151" stroke-width="2"/>
<rect x="312" y="372" width="76" height="58" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="3"/>
<text x="350" y="407" font-family="Arial,sans-serif" font-size="16" fill="#92400e" text-anchor="middle" font-weight="bold">tung last</text>
<!-- weight force arrow (down) -->
<line x1="350" y1="430" x2="350" y2="455" stroke="#dc2626" stroke-width="3"/>
<polygon points="350,465 346,455 354,455" fill="#dc2626"/>
<!-- formula box (left) -->
<text x="150" y="320" font-family="Arial,sans-serif" font-size="20" fill="#1e40af" text-anchor="middle" font-weight="bold">F = tyngd / 2</text>
<text x="150" y="348" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">2 repdelar bär lasten</text>
<!-- bottom caption -->
<text x="400" y="488" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Med flera hjul krävs mindre kraft för att lyfta en tung last</text>
</svg>
