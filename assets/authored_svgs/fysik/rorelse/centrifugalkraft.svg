<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Centrifugalkraft (sedd uppifrån i en kurva)</text>
<text x="400" y="58" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Vy rakt uppifrån — en bil svänger åt vänster</text>

<!-- curved road, top-down. Centre of curve at (650,470), radius 330. Arc from lower-left up to the right, staying below the subtitle. -->
<path d="M 320 470 A 330 330 0 0 1 650 140" fill="none" stroke="#9ca3af" stroke-width="70"/>
<path d="M 320 470 A 330 330 0 0 1 650 140" fill="none" stroke="#eef0f2" stroke-width="64"/>
<!-- centre dashed lane line -->
<path d="M 320 470 A 330 330 0 0 1 650 140" fill="none" stroke="#facc15" stroke-width="2.5" stroke-dasharray="14,12"/>

<!-- curve centre marker -->
<circle cx="650" cy="470" r="4" fill="#1f2937"/>
<text x="650" y="455" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">kurvans mitt</text>

<!-- Car on the arc at 135deg from centre(650,470): x=650-233.3=416.7 y=470-233.3=236.7 -->
<g transform="translate(417,237) rotate(-45)">
  <rect x="-23" y="-15" width="46" height="30" rx="7" fill="#2563eb" stroke="#1e40af" stroke-width="2.5"/>
  <rect x="6" y="-11" width="13" height="22" rx="2" fill="#bfdbfe"/>
  <circle cx="-7" cy="0" r="5.5" fill="#1f2937"/>
</g>

<!-- Fart: tangent to the curve, pointing the SAME way the car's nose faces (up-right, the direction of travel). -->
<line x1="430" y1="224" x2="502" y2="152" stroke="#16a34a" stroke-width="4"/>
<polygon points="512,142 500,159 495,148" fill="#16a34a"/>
<text x="560" y="150" font-family="Arial,sans-serif" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="bold">Fart (rakt fram)</text>
<text x="560" y="168" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle">— bilens färdriktning</text>

<!-- real inward pull (centripetal) toward curve centre -->
<line x1="417" y1="237" x2="500" y2="320" stroke="#6b7280" stroke-width="2" stroke-dasharray="5,4"/>
<text x="540" y="330" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="start">vägen tvingar in mot mitten</text>

<!-- Centrifugal: APPARENT outward force, directly AWAY from curve centre.
     Direction from centre(650,470) to car(417,237) = (-233,-233) normalised -> up-left. -->
<line x1="417" y1="237" x2="307" y2="127" stroke="#dc2626" stroke-width="7"/>
<polygon points="293,113 314,121 306,133" fill="#dc2626"/>
<text x="170" y="300" font-family="Arial,sans-serif" font-size="17" fill="#dc2626" text-anchor="middle" font-weight="bold">Centrifugalkraft</text>
<text x="170" y="322" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">du kastas UTÅT i svängen</text>
<line x1="200" y1="288" x2="330" y2="155" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>

<rect x="585" y="200" width="200" height="78" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="8"/>
<text x="685" y="230" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Känns bara av</text>
<text x="685" y="254" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">den som åker med</text>

<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Centrifugalkraften känns utåt av den som åker med i svängen — inte av någon utanför</text>
</svg>
