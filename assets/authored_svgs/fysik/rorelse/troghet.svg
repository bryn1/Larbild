<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Tröghet</text>
<!-- divider -->
<line x1="400" y1="70" x2="400" y2="410" stroke="#e5e7eb" stroke-width="2"/>
<!-- ===== LEFT PANEL: bus moving steadily ===== -->
<text x="200" y="95" font-family="Arial,sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Bussen kör framåt</text>
<!-- bus body -->
<rect x="70" y="170" width="240" height="120" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="10"/>
<!-- windows -->
<rect x="85" y="185" width="60" height="45" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="3"/>
<rect x="235" y="185" width="60" height="45" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="3"/>
<!-- wheels -->
<circle cx="120" cy="295" r="20" fill="#374151"/>
<circle cx="260" cy="295" r="20" fill="#374151"/>
<!-- passenger upright (seat at x=185) -->
<circle cx="185" cy="205" r="11" fill="#f59e0b"/>
<line x1="185" y1="216" x2="185" y2="252" stroke="#f59e0b" stroke-width="5"/>
<!-- motion arrow of bus -->
<line x1="320" y1="230" x2="375" y2="230" stroke="#16a34a" stroke-width="3"/>
<polygon points="385,230 375,234 375,226" fill="#16a34a"/>
<text x="350" y="218" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle">fart</text>
<!-- ground -->
<line x1="60" y1="315" x2="380" y2="315" stroke="#1f2937" stroke-width="2.5"/>
<text x="200" y="345" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Du sitter rakt upp</text>
<!-- ===== RIGHT PANEL: bus brakes, passenger thrown forward ===== -->
<text x="600" y="95" font-family="Arial,sans-serif" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">Bussen bromsar</text>
<!-- bus body -->
<rect x="470" y="170" width="240" height="120" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="10"/>
<rect x="485" y="185" width="60" height="45" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="3"/>
<rect x="635" y="185" width="60" height="45" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="3"/>
<circle cx="520" cy="295" r="20" fill="#374151"/>
<circle cx="660" cy="295" r="20" fill="#374151"/>
<!-- passenger leaning forward (pivoting at seat x=585) -->
<g transform="rotate(28 585 252)">
<circle cx="585" cy="205" r="11" fill="#f59e0b"/>
<line x1="585" y1="216" x2="585" y2="252" stroke="#f59e0b" stroke-width="5"/>
</g>
<!-- braking arrow (bus decelerates: red arrow backward) -->
<line x1="465" y1="335" x2="430" y2="335" stroke="#dc2626" stroke-width="3"/>
<polygon points="420,335 430,331 430,339" fill="#dc2626"/>
<text x="445" y="358" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">broms</text>
<!-- inertia arrow on passenger (forward) -->
<line x1="610" y1="160" x2="660" y2="160" stroke="#dc2626" stroke-width="3"/>
<polygon points="670,160 660,164 660,156" fill="#dc2626"/>
<text x="640" y="148" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">tröghet</text>
<!-- ground -->
<line x1="460" y1="315" x2="720" y2="315" stroke="#1f2937" stroke-width="2.5"/>
<text x="600" y="380" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Du kastas framåt — kroppen</text>
<text x="600" y="397" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">vill fortsätta i samma fart</text>
<!-- bottom caption -->
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Tröghet är ett föremåls motvilja mot att ändra sin rörelse</text>
</svg>
