<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Luftmotstånd</text>

<!-- ground -->
<line x1="80" y1="350" x2="720" y2="350" stroke="#1f2937" stroke-width="3"/>

<!-- ===== clear bicycle, riding to the right ===== -->
<!-- wheels -->
<circle cx="300" cy="320" r="32" fill="none" stroke="#1f2937" stroke-width="4"/>
<circle cx="300" cy="320" r="3" fill="#1f2937"/>
<circle cx="420" cy="320" r="32" fill="none" stroke="#1f2937" stroke-width="4"/>
<circle cx="420" cy="320" r="3" fill="#1f2937"/>
<!-- spokes (a few each) -->
<line x1="300" y1="288" x2="300" y2="352" stroke="#9ca3af" stroke-width="1.3"/>
<line x1="268" y1="320" x2="332" y2="320" stroke="#9ca3af" stroke-width="1.3"/>
<line x1="420" y1="288" x2="420" y2="352" stroke="#9ca3af" stroke-width="1.3"/>
<line x1="388" y1="320" x2="452" y2="320" stroke="#9ca3af" stroke-width="1.3"/>
<!-- frame: rear wheel -> crank -> seat tube, down tube, top tube, head tube -->
<line x1="300" y1="320" x2="360" y2="320" stroke="#2563eb" stroke-width="4"/>
<line x1="360" y1="320" x2="345" y2="262" stroke="#2563eb" stroke-width="4"/>
<line x1="360" y1="320" x2="430" y2="270" stroke="#2563eb" stroke-width="4"/>
<line x1="345" y1="262" x2="430" y2="270" stroke="#2563eb" stroke-width="4"/>
<line x1="420" y1="320" x2="430" y2="270" stroke="#2563eb" stroke-width="4"/>
<!-- crank + pedal -->
<circle cx="360" cy="320" r="6" fill="#1f2937"/>
<line x1="360" y1="320" x2="360" y2="338" stroke="#1f2937" stroke-width="3"/>
<!-- seat -->
<line x1="335" y1="258" x2="355" y2="258" stroke="#1f2937" stroke-width="4"/>
<!-- handlebars -->
<line x1="430" y1="270" x2="448" y2="252" stroke="#1f2937" stroke-width="4"/>
<line x1="440" y1="252" x2="458" y2="252" stroke="#1f2937" stroke-width="4"/>

<!-- ===== rider (leaning forward over the bars) ===== -->
<!-- back: hip(350,258) -> shoulder(400,222) -->
<line x1="350" y1="258" x2="400" y2="222" stroke="#dc2626" stroke-width="8"/>
<!-- thigh/shin to pedal -->
<line x1="350" y1="258" x2="360" y2="320" stroke="#1e40af" stroke-width="7"/>
<line x1="360" y1="320" x2="362" y2="340" stroke="#1e40af" stroke-width="6"/>
<!-- head just above shoulders -->
<circle cx="408" cy="210" r="14" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
<!-- arm: shoulder -> handlebar -->
<line x1="400" y1="224" x2="450" y2="252" stroke="#dc2626" stroke-width="6"/>

<!-- forward motion -->
<line x1="500" y1="320" x2="600" y2="320" stroke="#16a34a" stroke-width="5"/>
<polygon points="618,320 600,329 600,311" fill="#16a34a"/>
<text x="560" y="342" font-family="Arial,sans-serif" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="bold">Rörelse framåt</text>

<!-- air resistance: arrows pushing BACK (to the left) against the rider -->
<line x1="270" y1="170" x2="200" y2="170" stroke="#dc2626" stroke-width="4"/>
<polygon points="184,170 200,161 200,179" fill="#dc2626"/>
<line x1="270" y1="200" x2="200" y2="200" stroke="#dc2626" stroke-width="4"/>
<polygon points="184,200 200,191 200,209" fill="#dc2626"/>
<line x1="270" y1="230" x2="200" y2="230" stroke="#dc2626" stroke-width="4"/>
<polygon points="184,230 200,221 200,239" fill="#dc2626"/>
<text x="150" y="195" font-family="Arial,sans-serif" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">Luft-</text>
<text x="150" y="214" font-family="Arial,sans-serif" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">motstånd</text>

<rect x="470" y="400" width="280" height="42" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="8"/>
<text x="610" y="427" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Större yta → större luftmotstånd</text>

<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Luftmotståndet är luftens bromsande kraft mot något som rör sig genom den</text>
</svg>
