<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Gränshastighet</text>

<!-- ===== PARACHUTE canopy ===== -->
<path d="M 175 150 A 110 90 0 0 1 395 150 Z" fill="#ef4444" stroke="#991b1b" stroke-width="2.5"/>
<!-- canopy panel seams -->
<path d="M 230 150 A 110 90 0 0 1 230 130" fill="none" stroke="#991b1b" stroke-width="1"/>
<line x1="285" y1="150" x2="285" y2="105" stroke="#991b1b" stroke-width="1"/>
<line x1="340" y1="150" x2="332" y2="118" stroke="#991b1b" stroke-width="1"/>
<line x1="230" y1="150" x2="238" y2="118" stroke="#991b1b" stroke-width="1"/>
<text x="285" y="100" font-family="Arial,sans-serif" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="bold">Fallskärm</text>

<!-- shroud lines from canopy edge to the jumper's shoulders -->
<line x1="178" y1="152" x2="270" y2="232" stroke="#6b7280" stroke-width="1.5"/>
<line x1="240" y1="156" x2="278" y2="232" stroke="#6b7280" stroke-width="1.5"/>
<line x1="330" y1="156" x2="292" y2="232" stroke="#6b7280" stroke-width="1.5"/>
<line x1="392" y1="152" x2="300" y2="232" stroke="#6b7280" stroke-width="1.5"/>

<!-- ===== Jumper ===== -->
<circle cx="285" cy="222" r="14" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
<rect x="272" y="236" width="26" height="46" fill="#2563eb" stroke="#1e40af" stroke-width="2" rx="6"/>
<line x1="272" y1="246" x2="246" y2="234" stroke="#1e40af" stroke-width="5"/>
<line x1="298" y1="246" x2="324" y2="234" stroke="#1e40af" stroke-width="5"/>
<line x1="278" y1="282" x2="266" y2="322" stroke="#1e40af" stroke-width="6"/>
<line x1="292" y1="282" x2="304" y2="322" stroke="#1e40af" stroke-width="6"/>

<!-- air resistance UP (balanced, big) -->
<line x1="285" y1="200" x2="285" y2="138" stroke="#16a34a" stroke-width="6"/>
<polygon points="285,122 276,138 294,138" fill="#16a34a"/>
<!-- (label moved to ground area below to avoid the canopy) -->

<!-- gravity DOWN (balanced, equal) -->
<line x1="285" y1="338" x2="285" y2="400" stroke="#dc2626" stroke-width="6"/>
<polygon points="285,416 276,400 294,400" fill="#dc2626"/>
<text x="285" y="440" font-family="Arial,sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold">Tyngdkraft (nedåt)</text>
<text x="150" y="356" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="bold">Luftmotstånd</text>
<text x="150" y="374" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle">(uppåt)</text>
<line x1="178" y1="350" x2="278" y2="200" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="4,3"/>

<!-- explanation box -->
<rect x="470" y="200" width="300" height="150" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="8"/>
<text x="620" y="232" font-family="Arial,sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Krafterna är lika stora</text>
<text x="620" y="262" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">Luftmotstånd = Tyngdkraft</text>
<text x="620" y="300" font-family="Arial,sans-serif" font-size="16" fill="#15803d" text-anchor="middle" font-weight="bold">→ farten ökar inte mer</text>
<text x="620" y="328" font-family="Arial,sans-serif" font-size="15" fill="#15803d" text-anchor="middle" font-weight="bold">= gränshastighet</text>

<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Gränshastighet: luftmotståndet är lika stort som tyngdkraften — farten slutar öka</text>
</svg>
