<text x="300" y="112" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="bold">Luftmotstånd (uppåt)</text>
<rect x="500" y="200" width="260" height="130" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="8"/>
