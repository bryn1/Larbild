<text x="630" y="312" font-family="Arial,sans-serif" font-size="13" fill="#15803d" text-anchor="middle">= gränshastighet</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Gränshastighet: luftmotståndet är lika stort som tyngdkraften, farten slutar öka</text>
