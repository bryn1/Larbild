<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Tyngdpunkt och stödyta</text>

<!-- ============================================================ -->
<!-- LEFT PANEL: STABLE (lodlinje inside the base)                -->
<!-- ============================================================ -->
<text x="200" y="80" font-family="Arial,sans-serif" font-size="16" fill="#15803d" text-anchor="middle" font-weight="bold">Står stadigt</text>

<!-- ground -->
<line x1="60" y1="360" x2="350" y2="360" stroke="#1f2937" stroke-width="3"/>
<line x1="78" y1="360" x2="66" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="108" y1="360" x2="96" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="138" y1="360" x2="126" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="168" y1="360" x2="156" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="198" y1="360" x2="186" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="228" y1="360" x2="216" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="258" y1="360" x2="246" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="288" y1="360" x2="276" y2="372" stroke="#9ca3af" stroke-width="1.5"/>

<!-- upright box: base 155..245 (centre 200) -->
<rect x="155" y="200" width="90" height="160" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>

<!-- support base (stödyta) highlighted -->
<line x1="155" y1="364" x2="245" y2="364" stroke="#15803d" stroke-width="6"/>
<text x="200" y="392" font-family="Arial,sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="bold">stödyta</text>

<!-- centre of gravity -->
<circle cx="200" cy="280" r="9" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
<line x1="194" y1="280" x2="206" y2="280" stroke="#b45309" stroke-width="1.5"/>
<line x1="200" y1="274" x2="200" y2="286" stroke="#b45309" stroke-width="1.5"/>
<text x="270" y="250" font-family="Arial,sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="bold">tyngdpunkt</text>
<line x1="245" y1="254" x2="209" y2="276" stroke="#b45309" stroke-width="1.2"/>

<!-- plumb / lodlinje straight down -> lands INSIDE base -->
<line x1="200" y1="280" x2="200" y2="360" stroke="#15803d" stroke-width="2.5" stroke-dasharray="6,4"/>
<polygon points="200,360 195,348 205,348" fill="#15803d"/>
<text x="120" y="320" font-family="Arial,sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="bold">lodlinje</text>
<line x1="135" y1="320" x2="196" y2="320" stroke="#15803d" stroke-width="1"/>

<text x="200" y="425" font-family="Arial,sans-serif" font-size="13" fill="#15803d" text-anchor="middle" font-weight="bold">Lodlinjen är INNANFÖR stödytan</text>
<text x="200" y="444" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">→ välter ej</text>

<!-- divider -->
<line x1="400" y1="60" x2="400" y2="452" stroke="#e5e7eb" stroke-width="2"/>

<!-- ============================================================ -->
<!-- RIGHT PANEL: TIPPING (lodlinje OUTSIDE the base)            -->
<!-- ============================================================ -->
<text x="600" y="80" font-family="Arial,sans-serif" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold">Välter</text>

<!-- ground -->
<line x1="450" y1="360" x2="745" y2="360" stroke="#1f2937" stroke-width="3"/>
<line x1="468" y1="360" x2="456" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="498" y1="360" x2="486" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="528" y1="360" x2="516" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="558" y1="360" x2="546" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="588" y1="360" x2="576" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="618" y1="360" x2="606" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="648" y1="360" x2="636" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="678" y1="360" x2="666" y2="372" stroke="#9ca3af" stroke-width="1.5"/>

<!-- the stödyta the box would need: its footprint, now only touching at the pivot.
     Original upright footprint shown faint to make 'outside' unmistakable. -->
<line x1="520" y1="364" x2="600" y2="364" stroke="#15803d" stroke-width="6" opacity="0.35"/>
<text x="540" y="392" font-family="Arial,sans-serif" font-size="11" fill="#15803d" text-anchor="middle" opacity="0.8">stödyta</text>

<!-- Tilted box, pivoting on its bottom-right corner (vältkant) at (600,360), tilt 41 deg CW. -->
<polygon points="600.0,360.0 539.8,307.3 651.8,179.4 712.0,232.1" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>

<!-- pivot / vältkant -->
<circle cx="600" cy="360" r="5.5" fill="#dc2626"/>
<text x="600" y="340" font-family="Arial,sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="bold">vältkant</text>

<!-- centre of gravity of tilted box -->
<circle cx="625.9" cy="269.7" r="9" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
<line x1="619.9" y1="269.7" x2="631.9" y2="269.7" stroke="#b45309" stroke-width="1.5"/>
<line x1="625.9" y1="263.7" x2="625.9" y2="275.7" stroke="#b45309" stroke-width="1.5"/>
<text x="690" y="250" font-family="Arial,sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="bold">tyngdpunkt</text>
<line x1="667" y1="254" x2="634" y2="266" stroke="#b45309" stroke-width="1.2"/>

<!-- plumb / lodlinje straight down from CoG -> lands clearly to the RIGHT, OUTSIDE the base -->
<line x1="625.9" y1="269.7" x2="625.9" y2="378" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6,4"/>
<polygon points="625.9,378 620.9,366 630.9,366" fill="#dc2626"/>
<text x="690" y="318" font-family="Arial,sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="bold">lodlinje</text>
<line x1="668" y1="318" x2="628" y2="318" stroke="#dc2626" stroke-width="1"/>

<!-- gap marker: plumb lands OUTSIDE the support, to the right of the vältkant -->
<line x1="600" y1="386" x2="625.9" y2="386" stroke="#dc2626" stroke-width="2"/>
<line x1="600" y1="381" x2="600" y2="391" stroke="#dc2626" stroke-width="1.5"/>
<line x1="625.9" y1="381" x2="625.9" y2="391" stroke="#dc2626" stroke-width="1.5"/>
<text x="640" y="404" font-family="Arial,sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="bold">utanför stödytan</text>

<!-- rotation arrow: it tips over the edge to the right -->
<path d="M 695 250 A 70 70 0 0 1 712 312" fill="none" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="712,312 703,301 715,299" fill="#dc2626"/>

<text x="600" y="425" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">Lodlinjen är UTANFÖR stödytan</text>
<text x="600" y="444" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">→ välter</text>

<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Faller lodlinjen från tyngdpunkten innanför stödytan står föremålet kvar — hamnar den utanför välter det</text>
</svg>
