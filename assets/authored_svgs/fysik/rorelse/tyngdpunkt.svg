<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Tyngdpunkt och stödyta</text>

<!-- ===================== LEFT: STABLE ===================== -->
<text x="210" y="80" font-family="Arial,sans-serif" font-size="16" fill="#15803d" text-anchor="middle" font-weight="bold">Står stadigt</text>

<!-- ground -->
<line x1="60" y1="360" x2="360" y2="360" stroke="#1f2937" stroke-width="3"/>
<!-- hatching under ground -->
<line x1="80" y1="360" x2="68" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="110" y1="360" x2="98" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="140" y1="360" x2="128" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="170" y1="360" x2="158" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="200" y1="360" x2="188" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="230" y1="360" x2="218" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="260" y1="360" x2="248" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="290" y1="360" x2="278" y2="372" stroke="#9ca3af" stroke-width="1.5"/>

<!-- upright box: base 150..270 (centre 210) -->
<rect x="150" y="200" width="120" height="160" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>

<!-- support base (stödyta) highlighted on the ground -->
<line x1="150" y1="364" x2="270" y2="364" stroke="#15803d" stroke-width="6"/>
<text x="210" y="392" font-family="Arial,sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="bold">stödyta</text>

<!-- centre of gravity (tyngdpunkt) at centre x=210, y=280 -->
<circle cx="210" cy="280" r="9" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
<line x1="204" y1="280" x2="216" y2="280" stroke="#b45309" stroke-width="1.5"/>
<line x1="210" y1="274" x2="210" y2="286" stroke="#b45309" stroke-width="1.5"/>
<text x="285" y="262" font-family="Arial,sans-serif" font-size="12" fill="#b45309" text-anchor="start" font-weight="bold">tyngdpunkt</text>
<line x1="219" y1="278" x2="282" y2="262" stroke="#b45309" stroke-width="1.2"/>

<!-- plumb / lodlinje straight down from CoG, lands INSIDE the base -->
<line x1="210" y1="280" x2="210" y2="360" stroke="#15803d" stroke-width="2.5" stroke-dasharray="6,4"/>
<polygon points="210,360 205,348 215,348" fill="#15803d"/>
<text x="120" y="330" font-family="Arial,sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="bold">lodlinje</text>
<line x1="135" y1="330" x2="206" y2="330" stroke="#15803d" stroke-width="1"/>

<!-- verdict -->
<text x="210" y="430" font-family="Arial,sans-serif" font-size="13" fill="#15803d" text-anchor="middle" font-weight="bold">Lodlinjen hamnar INNANFÖR stödytan</text>
<text x="210" y="448" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">→ föremålet välter inte</text>

<!-- divider -->
<line x1="400" y1="60" x2="400" y2="455" stroke="#e5e7eb" stroke-width="2"/>

<!-- ===================== RIGHT: TIPPING ===================== -->
<text x="590" y="80" font-family="Arial,sans-serif" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold">Välter</text>

<!-- ground -->
<line x1="440" y1="360" x2="740" y2="360" stroke="#1f2937" stroke-width="3"/>
<line x1="460" y1="360" x2="448" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="490" y1="360" x2="478" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="520" y1="360" x2="508" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="550" y1="360" x2="538" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="580" y1="360" x2="568" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="610" y1="360" x2="598" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="640" y1="360" x2="628" y2="372" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="670" y1="360" x2="658" y2="372" stroke="#9ca3af" stroke-width="1.5"/>

<!--
  Tilted box, pivoting on its bottom-right corner (vältkant) at P=(575,360).
  Tilt 18deg clockwise. Geometry computed: W=120 H=150.
  corners: BR(575,360) BL(460.9,322.9) TL(507.2,180.3) TR(621.4,217.3)
  CoG(541.1,270.1) -> plumb at x=541.1 lands 33.9px LEFT of pivot => outside support => tips.
-->
<polygon points="575,360 460.9,322.9 507.2,180.3 621.4,217.3" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>

<!-- support base / contact: box now rests only near the right corner. Show the (now too narrow) stödyta. -->
<line x1="560" y1="364" x2="575" y2="364" stroke="#dc2626" stroke-width="6"/>
<text x="610" y="392" font-family="Arial,sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="bold">smal stödyta</text>

<!-- pivot / tipping edge -->
<circle cx="575" cy="360" r="5" fill="#dc2626"/>
<text x="575" y="338" font-family="Arial,sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="bold">vältkant</text>

<!-- centre of gravity of tilted box -->
<circle cx="541.1" cy="270.1" r="9" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
<line x1="535.1" y1="270.1" x2="547.1" y2="270.1" stroke="#b45309" stroke-width="1.5"/>
<line x1="541.1" y1="264.1" x2="541.1" y2="276.1" stroke="#b45309" stroke-width="1.5"/>
<text x="470" y="248" font-family="Arial,sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="bold">tyngdpunkt</text>
<line x1="490" y1="252" x2="534" y2="266" stroke="#b45309" stroke-width="1.2"/>

<!-- plumb / lodlinje straight down from tilted CoG, lands OUTSIDE (left of) the vältkant -->
<line x1="541.1" y1="270.1" x2="541.1" y2="375" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6,4"/>
<polygon points="541.1,375 536.1,363 546.1,363" fill="#dc2626"/>
<text x="503" y="320" font-family="Arial,sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="bold">lodlinje</text>
<line x1="518" y1="320" x2="538" y2="320" stroke="#dc2626" stroke-width="1"/>

<!-- gap marker: how far the plumb misses the support -->
<line x1="541.1" y1="383" x2="575" y2="383" stroke="#dc2626" stroke-width="1.5"/>
<text x="558" y="402" font-family="Arial,sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">utanför</text>

<!-- rotation arrow showing it tips over the edge -->
<path d="M 632 250 A 60 60 0 0 1 650 305" fill="none" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="650,305 641,295 653,292" fill="#dc2626"/>

<!-- verdict -->
<text x="590" y="430" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">Lodlinjen hamnar UTANFÖR stödytan</text>
<text x="590" y="448" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">→ föremålet välter</text>

<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Faller lodlinjen från tyngdpunkten innanför stödytan står föremålet kvar — hamnar den utanför välter det</text>
</svg>
