<text x="418" y="228" font-family="Arial,sans-serif" font-size="14" fill="#dc2626" text-anchor="start" font-weight="bold">Gravitationskraft</text>
<text x="418" y="246" font-family="Arial,sans-serif" font-size="11" fill="#dc2626" text-anchor="start">(drar nedåt mot jorden)</text>
<text x="400" y="325" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Alla föremål med massa dras mot varandra</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Gravitationskraften drar föremål mot varandra — allt dras ner mot marken</text>
