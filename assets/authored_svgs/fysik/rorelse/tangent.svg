<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Tangent</text>
<!-- LEFT: the circle (kurva) -->
<circle cx="300" cy="280" r="115" fill="none" stroke="#2563eb" stroke-width="3"/>
<text x="300" y="285" font-family="Arial,sans-serif" font-size="14" fill="#2563eb" text-anchor="middle">kurva</text>
<!-- radius (gray, dashed) from center to tangent point -->
<line x1="300" y1="280" x2="381.3" y2="198.7" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,3"/>
<circle cx="300" cy="280" r="3" fill="#6b7280"/>
<!-- right-angle marker at tangent point (radius perpendicular to tangent) -->
<polyline points="368.4,191.4 375.5,184.2 382.7,191.4" fill="none" stroke="#6b7280" stroke-width="1.3"/>
<!-- tangent line touching at exactly one point -->
<line x1="275.3" y1="92.6" x2="487.4" y2="304.7" stroke="#dc2626" stroke-width="3"/>
<polygon points="487.4,304.7 477.2,300.6 483.2,294.6" fill="#dc2626"/>
<polygon points="275.3,92.6 285.4,96.8 279.4,102.8" fill="#dc2626"/>
<text x="455" y="130" font-family="Arial,sans-serif" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">tangent</text>
<!-- the single touch point (amber highlight) -->
<circle cx="381.3" cy="198.7" r="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
<text x="398" y="183" font-family="Arial,sans-serif" font-size="12" fill="#92400e" text-anchor="start">nuddar i</text>
<text x="398" y="197" font-family="Arial,sans-serif" font-size="12" fill="#92400e" text-anchor="start">EN punkt</text>
<!-- RIGHT: slingshot example -->
<text x="615" y="115" font-family="Arial,sans-serif" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="bold">Slangbella</text>
<!-- circular path (dashed) the stone whirls on -->
<circle cx="600" cy="300" r="55" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,3"/>
<circle cx="600" cy="300" r="3" fill="#6b7280"/>
<!-- stone at release point -->
<circle cx="572.5" cy="252.4" r="8" fill="#374151"/>
<!-- stone flies off along the tangent -->
<line x1="572.5" y1="252.4" x2="676.4" y2="192.4" stroke="#dc2626" stroke-width="3"/>
<polygon points="676.4,192.4 669.8,201.1 665.5,193.7" fill="#dc2626"/>
<text x="700" y="180" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">stenen</text>
<text x="700" y="194" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">flyger iväg</text>
<!-- bottom caption -->
<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">En tangent är en rät linje som nuddar en kurva i exakt en punkt</text>
</svg>
