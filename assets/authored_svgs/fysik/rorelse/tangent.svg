<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Tangent</text>

<!-- the circle (kurva), centred for a big clear figure. Centre (360,290) r=150. -->
<circle cx="360" cy="290" r="150" fill="none" stroke="#2563eb" stroke-width="3.5"/>
<text x="360" y="360" font-family="Arial,sans-serif" font-size="15" fill="#2563eb" text-anchor="middle">cirkel (kurva)</text>
<circle cx="360" cy="290" r="3.5" fill="#6b7280"/>
<text x="372" y="295" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="start">mittpunkt</text>

<!-- tangent point at the TOP of the circle (360,140) -> tangent is a clean HORIZONTAL line. -->
<!-- radius from centre up to the point (vertical) -->
<line x1="360" y1="290" x2="360" y2="140" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="335" y="220" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="end">radie</text>

<!-- right-angle marker where radius meets tangent -->
<polyline points="360,156 376,156 376,140" fill="none" stroke="#6b7280" stroke-width="1.6"/>

<!-- the tangent: a long horizontal line touching the top point only -->
<line x1="140" y1="140" x2="600" y2="140" stroke="#dc2626" stroke-width="3.5"/>
<polygon points="618,140 600,149 600,131" fill="#dc2626"/>
<polygon points="122,140 140,131 140,149" fill="#dc2626"/>
<text x="560" y="118" font-family="Arial,sans-serif" font-size="17" fill="#dc2626" text-anchor="middle" font-weight="bold">tangent</text>

<!-- the single touch point, highlighted -->
<circle cx="360" cy="140" r="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
<text x="490" y="175" font-family="Arial,sans-serif" font-size="14" fill="#b45309" text-anchor="middle" font-weight="bold">nuddar i EN punkt</text>
<line x1="420" y1="170" x2="368" y2="144" stroke="#f59e0b" stroke-width="1.5"/>

<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">En tangent är en rät linje som nuddar en kurva i exakt en punkt</text>
</svg>
