<polygon points="630.0,180.0 643.0,172.8 643.0,187.2" fill="#7c3aed"/>
<text x="690" y="164" font-family="Arial,sans-serif" font-size="12" fill="#7c3aed" text-anchor="middle">Broms (bakåt)</text>
<text x="640" y="274" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Cykeln bromsar in</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Retardation är motsatsen till acceleration — farten minskar när något bromsar</text>
