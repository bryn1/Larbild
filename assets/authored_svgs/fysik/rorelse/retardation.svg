<circle cx="614.0" cy="230.0" r="18.0" fill="none" stroke="#1f2937" stroke-width="3"/>
<circle cx="666.0" cy="230.0" r="18.0" fill="none" stroke="#1f2937" stroke-width="3"/>
<polyline points="614.0,230.0 646.0,230.0 632.0,196.0 614.0,230.0" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round"/>
