<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Retardation (inbromsning)</text>
<line x1="150.0" y1="400.0" x2="150.0" y2="110.0" stroke="#1f2937" stroke-width="2"/>
