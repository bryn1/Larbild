<text x="138" y="106" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="end">fart (v)</text>
<text x="530" y="420" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">tid (t)</text>
<line x1="150.0" y1="120.0" x2="500.0" y2="400.0" stroke="#dc2626" stroke-width="4"/>
<text x="180" y="138" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="start">hög fart</text>
<text x="470" y="388" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="end">står stilla</text>
<line x1="300.0" y1="250.0" x2="347.9" y2="297.9" stroke="#6b7280" stroke-width="2"/>
