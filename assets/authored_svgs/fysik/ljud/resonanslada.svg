<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Resonanslåda – förstärker svaga ljud</text>

<!-- divider -->
<line x1="400" y1="70" x2="400" y2="430" stroke="#e5e7eb" stroke-width="2"/>

<!-- ===== LEFT: ELECTRIC GUITAR (solid body, weak alone, needs amplifier) ===== -->
<text x="200" y="86" font-family="Arial,sans-serif" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">Elgitarr</text>
<text x="200" y="104" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">solid kropp – ingen låda</text>

<!-- solid (filled, no sound-hole) guitar body -->
<path d="M 150 210 C 124 210 110 230 116 250 C 104 260 96 278 96 298
         C 96 334 122 360 156 360 C 190 360 216 334 216 298
         C 216 278 208 260 196 250 C 200 230 192 210 150 210 Z"
      fill="#b91c1c" stroke="#7f1d1d" stroke-width="2.5"/>
<!-- neck: vertical, rising straight from the body's upper bout (aligned with the string) -->
<rect x="153" y="120" width="14" height="92" rx="3" fill="#a16207" stroke="#7c2d12" stroke-width="1.8"/>
<!-- string -->
<line x1="160" y1="122" x2="160" y2="320" stroke="#374151" stroke-width="1.4"/>
<path d="M 168 240 q 10 -6 1 -12" fill="none" stroke="#1f2937" stroke-width="1.6"/>

<!-- weak sound from string alone -->
<path d="M 224 280 A 22 22 0 0 1 224 236" fill="none" stroke="#9ca3af" stroke-width="1.8"/>
<text x="252" y="262" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">svagt</text>

<!-- needs amplifier -->
<rect x="250" y="300" width="92" height="58" rx="4" fill="#374151" stroke="#111827" stroke-width="2"/>
<text x="296" y="326" font-family="Arial,sans-serif" font-size="11" fill="white" text-anchor="middle">Förstärkare</text>
<text x="296" y="342" font-family="Arial,sans-serif" font-size="10" fill="white" text-anchor="middle">+ högtalare</text>
<line x1="232" y1="320" x2="248" y2="328" stroke="#dc2626" stroke-width="2"/>
<polygon points="248,328 238,328 244,320" fill="#dc2626"/>
<text x="200" y="392" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold">Behöver el för att höras</text>

<!-- ===== RIGHT: ACOUSTIC GUITAR (hollow resonance box, loud by itself) ===== -->
<text x="600" y="86" font-family="Arial,sans-serif" font-size="15" fill="#16a34a" text-anchor="middle" font-weight="bold">Akustisk gitarr</text>
<text x="600" y="104" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">ihålig resonanslåda</text>

<!-- hollow guitar body (figure-8) -->
<path d="M 560 210 C 534 210 520 230 524 250 C 512 260 504 278 504 298
         C 504 334 530 360 564 360 C 598 360 624 334 624 298
         C 624 278 616 260 604 250 C 608 230 600 210 560 210 Z"
      fill="#fde68a" stroke="#b45309" stroke-width="2.5"/>
<!-- sound-hole -->
<circle cx="564" cy="298" r="22" fill="#7c2d12" stroke="#92400e" stroke-width="2"/>
<text x="564" y="334" font-family="Arial,sans-serif" font-size="10" fill="#92400e" text-anchor="middle">resonanslåda</text>
<!-- neck: vertical, rising straight from the body's upper bout (aligned with the string) -->
<rect x="557" y="120" width="14" height="92" rx="3" fill="#a16207" stroke="#7c2d12" stroke-width="1.8"/>
<!-- string -->
<line x1="564" y1="122" x2="564" y2="320" stroke="#374151" stroke-width="1.4"/>
<path d="M 572 240 q 10 -6 1 -12" fill="none" stroke="#1f2937" stroke-width="1.6"/>

<!-- strong sound straight from the box -->
<path d="M 630 280 A 40 40 0 0 1 612 234" fill="none" stroke="#16a34a" stroke-width="2.5"/>
<path d="M 648 290 A 60 60 0 0 1 624 222" fill="none" stroke="#16a34a" stroke-width="2.5"/>
<path d="M 666 300 A 80 80 0 0 1 636 210" fill="none" stroke="#16a34a" stroke-width="2.5"/>
<text x="700" y="240" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="bold">starkt ljud</text>
<text x="600" y="392" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="bold">Hörs starkt helt utan el</text>

<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Den ihåliga resonanslådan svänger med och förstärker det svaga strängljudet helt utan elektronik</text>
</svg>
