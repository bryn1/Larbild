<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Ljud – vibrationer som sprider sig</text>

<!-- sound source: a small bell/speaker on the left that vibrates -->
<path d="M 95 250 C 95 214 118 198 142 198 C 166 198 189 214 189 250 L 197 266 L 87 266 Z"
      fill="#fde68a" stroke="#b45309" stroke-width="2.5"/>
<circle cx="142" cy="274" r="6" fill="#92400e"/>
<text x="142" y="302" font-family="Arial,sans-serif" font-size="12" fill="#92400e" text-anchor="middle" font-weight="bold">Ljudkälla</text>
<text x="142" y="318" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(svänger)</text>

<!-- EVENLY SPACED, well-separated concentric wavefronts (full circles), NOT piled up -->
<!-- centred on the source (172,250); radii step by a constant 44 px -->
<circle cx="172" cy="250" r="44"  fill="none" stroke="#2563eb" stroke-width="2.2"/>
<circle cx="172" cy="250" r="88"  fill="none" stroke="#2563eb" stroke-width="2.2"/>
<circle cx="172" cy="250" r="132" fill="none" stroke="#2563eb" stroke-width="2.2"/>
<circle cx="172" cy="250" r="176" fill="none" stroke="#2563eb" stroke-width="2.2"/>
<circle cx="172" cy="250" r="220" fill="none" stroke="#2563eb" stroke-width="2.2"/>

<text x="450" y="116" font-family="Arial,sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">Ljudvågor sprider sig jämnt utåt</text>
<!-- one labelled gap = one våglängd, to stress they are separate -->
<line x1="304" y1="250" x2="348" y2="250" stroke="#1f2937" stroke-width="1.4"/>
<text x="326" y="244" font-family="Arial,sans-serif" font-size="10" fill="#1f2937" text-anchor="middle">en våg</text>

<!-- ear on the right that hears it -->
<path d="M 648 200 C 690 194 700 246 678 274 C 690 300 662 318 642 306
         C 632 318 612 311 616 293 C 600 291 600 268 614 266
         C 606 242 626 220 650 226 Z" fill="#fcd9c8" stroke="#b45309" stroke-width="2"/>
<circle cx="640" cy="262" r="8" fill="#7c2d12"/>
<text x="660" y="336" font-family="Arial,sans-serif" font-size="12" fill="#92400e" text-anchor="middle">Örat hör ljudet</text>
<!-- arrow points INTO the ear (rightward), starting clearly outside the ear so it reads as sound entering, not leaving -->
<line x1="556" y1="262" x2="628" y2="262" stroke="#2563eb" stroke-width="3"/>
<polygon points="642,262 626,254 626,270" fill="#2563eb"/>
<text x="576" y="248" font-family="Arial,sans-serif" font-size="11" fill="#2563eb" text-anchor="middle">ljudet går in</text>

<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Ljud är vibrationer som sprider sig som vågor genom luft, vatten eller fasta ämnen</text>
</svg>
