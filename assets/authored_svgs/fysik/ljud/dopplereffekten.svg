<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Dopplereffekten</text>
<circle cx="310.0" cy="250.0" r="22.0" fill="none" stroke="#2563eb" stroke-width="2"/>
<circle cx="340.0" cy="250.0" r="50.0" fill="none" stroke="#2563eb" stroke-width="2"/>
<circle cx="370.0" cy="250.0" r="78.0" fill="none" stroke="#2563eb" stroke-width="2"/>
<circle cx="400.0" cy="250.0" r="106.0" fill="none" stroke="#2563eb" stroke-width="2"/>
<rect x="376" y="234" width="48" height="32" fill="#ef4444" stroke="#991b1b" stroke-width="2" rx="4"/>
<text x="400" y="255" font-family="Arial,sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Källa</text>
<line x1="428.0" y1="250.0" x2="470.0" y2="250.0" stroke="#1f2937" stroke-width="2.5"/>
<polygon points="480.0,250.0 470.0,255.5 470.0,244.5" fill="#1f2937"/>
<text x="455" y="238" font-family="Arial,sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">rör sig</text>
<text x="640" y="150" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">Framför:</text>
<text x="640" y="170" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">vågorna trängs ihop</text>
<text x="640" y="188" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">→ ljusare ton (högre)</text>
<text x="150" y="150" font-family="Arial,sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">Bakom:</text>
<text x="150" y="170" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">vågorna glesnar</text>
<text x="150" y="188" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">→ mörkare ton (lägre)</text>
<circle cx="150.0" cy="250.0" r="9.0" fill="none" stroke="#1f2937" stroke-width="2"/>
<text x="150" y="275" font-family="Arial,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">lyssnare</text>
<circle cx="660.0" cy="250.0" r="9.0" fill="none" stroke="#1f2937" stroke-width="2"/>
<text x="660" y="275" font-family="Arial,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">lyssnare</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">När källan rör sig trängs vågorna ihop framåt och glesnar bakåt – tonen ändras</text>
</svg>
