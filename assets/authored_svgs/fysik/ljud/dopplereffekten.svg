<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Dopplereffekten</text>

<!-- Wavefronts drawn as half-circles. Source moves RIGHT, so the fronts BUNCH ahead
     (right) and STRETCH apart behind (left). Front halves red (compressed), back halves blue. -->
<!-- BEHIND (left): stretched-apart half-circles -->
<path d="M 250,130 A 120 120 0 0 0 250,370" fill="none" stroke="#2563eb" stroke-width="2.2"/>
<path d="M 300,158 A 92 92 0 0 0 300,342" fill="none" stroke="#2563eb" stroke-width="2.2"/>
<path d="M 345,184 A 66 66 0 0 0 345,316" fill="none" stroke="#2563eb" stroke-width="2.2"/>
<path d="M 385,208 A 42 42 0 0 0 385,292" fill="none" stroke="#2563eb" stroke-width="2.2"/>
<path d="M 418,228 A 22 22 0 0 0 418,272" fill="none" stroke="#2563eb" stroke-width="2.2"/>
<!-- AHEAD (right): bunched-together half-circles = compressed sound in front of the source -->
<path d="M 250,130 A 120 120 0 0 1 250,370" fill="none" stroke="#dc2626" stroke-width="2.2"/>
<path d="M 300,158 A 92 92 0 0 1 300,342" fill="none" stroke="#dc2626" stroke-width="2.2"/>
<path d="M 345,184 A 66 66 0 0 1 345,316" fill="none" stroke="#dc2626" stroke-width="2.2"/>
<path d="M 385,208 A 42 42 0 0 1 385,292" fill="none" stroke="#dc2626" stroke-width="2.2"/>
<path d="M 418,228 A 22 22 0 0 1 418,272" fill="none" stroke="#dc2626" stroke-width="2.2"/>

<!-- moving source -->
<circle cx="440" cy="250" r="15" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>
<line x1="458" y1="250" x2="505" y2="250" stroke="#1f2937" stroke-width="3"/>
<polygon points="516,250 503,257 503,243" fill="#1f2937"/>
<text x="487" y="238" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">rör sig →</text>
<text x="440" y="290" font-family="Arial,sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="bold">källa</text>

<!-- AHEAD (right): waves bunched = shorter våglängd = higher pitch -->
<text x="660" y="120" font-family="Arial,sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold">Framför</text>
<text x="660" y="140" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">vågorna trängs ihop</text>
<text x="660" y="158" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">kort våglängd</text>
<text x="660" y="178" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">→ högre ton</text>
<circle cx="690" cy="250" r="9" fill="none" stroke="#1f2937" stroke-width="2"/>
<text x="690" y="278" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">lyssnare</text>

<!-- BEHIND (left): waves stretched = longer våglängd = lower pitch -->
<text x="120" y="120" font-family="Arial,sans-serif" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="bold">Bakom</text>
<text x="120" y="140" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">vågorna glesnar</text>
<text x="120" y="158" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">lång våglängd</text>
<text x="120" y="178" font-family="Arial,sans-serif" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="bold">→ lägre ton</text>
<circle cx="120" cy="250" r="9" fill="none" stroke="#1f2937" stroke-width="2"/>
<text x="120" y="278" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">lyssnare</text>

<text x="400" y="450" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Källan hinner ifatt vågorna framåt (de trängs) och lämnar dem bakåt (de glesnar)</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">När en ljudkälla rör sig ändras tonen: högre framför, lägre bakom</text>
</svg>
