<text x="585" y="320" font-family="Arial,sans-serif" font-size="13" fill="#0e7490" text-anchor="middle" font-weight="bold">Hörselsnäckan</text>
<text x="585" y="338" font-family="Arial,sans-serif" font-size="11" fill="#0e7490" text-anchor="middle">(spiralformad – som en gyllene spiral)</text>

<!-- ===== Flow summary ===== -->
<text x="400" y="400" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Trumhinnan → hammaren → städet → stigbygeln → snäckan</text>

<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">De tre små hörselbenen för trumhinnans vibrationer in i den spiralformade snäckan</text>
</svg>
