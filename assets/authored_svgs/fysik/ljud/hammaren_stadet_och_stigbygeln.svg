<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Hammaren, städet och stigbygeln</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Hörselbenen för vidare ljudet till hörselsnäckan</text>

<!-- ===== Trumhinna (eardrum) ===== -->
<line x1="120" y1="150" x2="120" y2="330" stroke="#b45309" stroke-width="4"/>
<text x="120" y="355" font-family="Arial,sans-serif" font-size="12" fill="#92400e" text-anchor="middle">Trumhinna</text>

<!-- incoming sound -->
<line x1="58" y1="240" x2="105" y2="240" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="115,240 104,245.5 104,234.5" fill="#2563eb"/>
<text x="80" y="225" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">ljud</text>

<!-- ===== Hammaren (malleus) - attached to eardrum ===== -->
<line x1="122" y1="240" x2="215" y2="195" stroke="#7c3aed" stroke-width="9"/>
<circle cx="215" cy="195" r="15" fill="#c4b5fd" stroke="#7c3aed" stroke-width="2.5"/>
<text x="215" y="162" font-family="Arial,sans-serif" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="bold">Hammaren</text>

<!-- ===== Städet (incus) ===== -->
<line x1="220" y1="200" x2="330" y2="232" stroke="#1d4ed8" stroke-width="9"/>
<circle cx="330" cy="232" r="15" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2.5"/>
<text x="330" y="278" font-family="Arial,sans-serif" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="bold">Städet</text>

<!-- ===== Stigbygeln (stapes) - footplate against oval window / cochlea ===== -->
<line x1="335" y1="229" x2="455" y2="215" stroke="#16a34a" stroke-width="9"/>
<path d="M 455 198 L 472 204 L 472 226 L 455 232 Z" fill="#86efac" stroke="#15803d" stroke-width="2.5"/>
<text x="448" y="172" font-family="Arial,sans-serif" font-size="13" fill="#15803d" text-anchor="middle" font-weight="bold">Stigbygeln</text>

<!-- vibration passed from stapes footplate into the cochlea -->
<line x1="475" y1="222" x2="522" y2="234" stroke="#0891b2" stroke-width="2.5"/>
<polygon points="531,236 519,240 521,229" fill="#0891b2"/>

