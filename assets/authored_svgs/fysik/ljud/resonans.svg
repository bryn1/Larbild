<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Resonans – svänger kraftigt vid rätt takt</text>

<!-- ===== LEFT: tuning fork on a resonance box (resonanslåda) ===== -->
<text x="195" y="78" font-family="Arial,sans-serif" font-size="14" fill="#92400e" text-anchor="middle" font-weight="bold">Resonanslåda</text>

<!-- resonance box (hollow) -->
<rect x="120" y="300" width="150" height="90" fill="#fde9b5" stroke="#b45309" stroke-width="3" rx="6"/>
<rect x="134" y="314" width="122" height="62" fill="none" stroke="#b45309" stroke-width="1.4" rx="4" stroke-dasharray="5,4"/>
<text x="195" y="350" font-family="Arial,sans-serif" font-size="11" fill="#92400e" text-anchor="middle">luften inne</text>
<text x="195" y="366" font-family="Arial,sans-serif" font-size="11" fill="#92400e" text-anchor="middle">svänger med</text>

<!-- tuning fork (stamgaffel) standing on the box -->
<rect x="190" y="285" width="12" height="18" fill="#9ca3af" stroke="#374151" stroke-width="1.5"/>
<rect x="175" y="160" width="9" height="128" rx="3" fill="#9ca3af" stroke="#374151" stroke-width="1.5"/>
<rect x="208" y="160" width="9" height="128" rx="3" fill="#9ca3af" stroke="#374151" stroke-width="1.5"/>
<rect x="175" y="284" width="42" height="9" rx="3" fill="#9ca3af" stroke="#374151" stroke-width="1.5"/>
<text x="196" y="150" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">stämgaffel</text>

<!-- vibration arcs (it swings) -->
<path d="M 224 200 A 26 26 0 0 1 224 168" fill="none" stroke="#16a34a" stroke-width="2"/>
<path d="M 234 210 A 38 38 0 0 1 234 158" fill="none" stroke="#16a34a" stroke-width="2"/>
<text x="260" y="190" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="start" font-weight="bold">starkt</text>
<text x="260" y="208" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="start" font-weight="bold">ljud</text>

<text x="195" y="412" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">Lådan svänger i samma takt</text>
<text x="195" y="430" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">→ ljudet blir mycket starkare</text>

<!-- divider -->
<line x1="320" y1="70" x2="320" y2="440" stroke="#e5e7eb" stroke-width="2"/>

<!-- ===== RIGHT: growing-amplitude wave (clean envelope) ===== -->
<text x="560" y="78" font-family="Arial,sans-serif" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="bold">Knuffar i rätt takt → större svängning</text>

<!-- centre baseline -->
<line x1="360" y1="250" x2="760" y2="250" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="4,3"/>

<!-- growing amplitude envelope (two diverging dashed guide lines) -->
<line x1="360" y1="244" x2="752" y2="150" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="6,5"/>
<line x1="360" y1="256" x2="752" y2="350" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="6,5"/>

<!-- the swing wave with growing amplitude, drawn as a smooth path of quadratic bumps -->
<path d="M 360 250
         Q 384 238 408 250 Q 432 262 456 250
         Q 482 232 508 250 Q 534 268 560 250
         Q 588 222 616 250 Q 644 278 672 250
         Q 702 206 732 250 Q 748 272 760 250"
      fill="none" stroke="#dc2626" stroke-width="3"/>

<text x="395" y="300" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">liten</text>
<text x="710" y="395" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold">allt större</text>

<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Resonans: drivs något i sin egen takt (frekvens) byggs svängningen upp och blir allt kraftigare</text>
</svg>
