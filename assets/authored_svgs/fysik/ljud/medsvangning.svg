<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Medsvängning – rätt frekvens får något att svänga</text>

<!-- sound source: a loudspeaker (högtalare) -->
<rect x="55" y="200" width="40" height="70" rx="4" fill="#374151" stroke="#111827" stroke-width="2"/>
<polygon points="95,212 118,196 118,274 95,258" fill="#6b7280" stroke="#111827" stroke-width="2"/>
<circle cx="95" cy="235" r="9" fill="#1f2937" stroke="#111827" stroke-width="1.5"/>
<text x="92" y="296" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Högtalare</text>
<text x="92" y="312" font-family="Arial,sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">frekvens f</text>

<!-- sound waves with longer spacing between them -->
<path d="M 115,183 A 52 52 0 0 1 115,287" fill="none" stroke="#2563eb" stroke-width="2"/>
<path d="M 115,141 A 94 94 0 0 1 115,329" fill="none" stroke="#2563eb" stroke-width="2"/>
<path d="M 115,99 A 136 136 0 0 1 115,371" fill="none" stroke="#2563eb" stroke-width="2"/>
<path d="M 115,57 A 178 178 0 0 1 115,413" fill="none" stroke="#2563eb" stroke-width="2"/>

<text x="370" y="150" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">rätt frekvens träffar</text>
<line x1="315.0" y1="240.0" x2="510.0" y2="240.0" stroke="#2563eb" stroke-width="2"/>
<polygon points="520.0,240.0 510.0,244.5 510.0,235.5" fill="#2563eb"/>

<rect x="555" y="160" width="10" height="160" fill="#bfdbfe" stroke="#2563eb" stroke-width="2" rx="0"/>
<rect x="525" y="160" width="10" height="160" fill="none" stroke="#93c5fd" stroke-width="1.5" rx="0" stroke-dasharray="4,3"/>
<rect x="585" y="160" width="10" height="160" fill="none" stroke="#93c5fd" stroke-width="1.5" rx="0" stroke-dasharray="4,3"/>
<line x1="575.0" y1="240.0" x2="597.0" y2="240.0" stroke="#16a34a" stroke-width="2"/>
<polygon points="605.0,240.0 597.0,244.4 597.0,235.6" fill="#16a34a"/>
<line x1="545.0" y1="240.0" x2="523.0" y2="240.0" stroke="#16a34a" stroke-width="2"/>
<polygon points="515.0,240.0 523.0,235.6 523.0,244.4" fill="#16a34a"/>
<text x="560" y="145" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="bold">Fönsterruta</text>
<text x="560" y="345" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle">börjar svänga av sig själv</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Om ett ljud har precis rätt frekvens börjar ett föremål svänga med av sig självt</text>
</svg>
