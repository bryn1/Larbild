<text x="560" y="285" font-family="Arial,sans-serif" font-size="12" fill="#92400e" text-anchor="middle">Örat</text>
<rect x="150" y="320" width="500" height="95" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="6"/>
<text x="400" y="345" font-family="Arial,sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="bold">Buller kan ge:</text>
<text x="400" y="368" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">trötthet   •   irritation   •   svårt att höra</text>
<text x="400" y="392" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">skadad hörsel om det pågår länge</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Buller är ljud man inte vill ha – starkt eller långvarigt buller skadar hörseln</text>
</svg>
