<text x="400" y="352" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">men olika övertoner ovanpå</text>
<text x="400" y="380" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">→ därför känner du igen olika röster och instrument</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Klangfärgen är vilka övertoner som följer med – den får samma ton att låta olika</text>
