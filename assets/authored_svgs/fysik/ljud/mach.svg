<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Mach – fart jämfört med ljudet (Mach 1 = ljudfart)</text>
<line x1="100.0" y1="250.0" x2="700.0" y2="250.0" stroke="#1f2937" stroke-width="2.5"/>
<line x1="700.0" y1="250.0" x2="725.0" y2="250.0" stroke="#1f2937" stroke-width="2"/>
<polygon points="735.0,250.0 725.0,255.5 725.0,244.5" fill="#1f2937"/>
<text x="718" y="240" font-family="Arial,sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">fart</text>
<line x1="100.0" y1="242.0" x2="100.0" y2="258.0" stroke="#1f2937" stroke-width="2"/>
<line x1="400.0" y1="242.0" x2="400.0" y2="258.0" stroke="#1f2937" stroke-width="2"/>
<line x1="700.0" y1="242.0" x2="700.0" y2="258.0" stroke="#1f2937" stroke-width="2"/>
<text x="100" y="280" font-family="Arial,sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">stilla</text>
<text x="400" y="280" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold">ljudets fart</text>
<text x="660" y="280" font-family="Arial,sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">dubbla ljudfarten</text>
<line x1="400.0" y1="150.0" x2="400.0" y2="250.0" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,4"/>
<text x="400" y="135" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">Mach 1 = lika fort som ljudet</text>
<path d="M 470 180 L 540 192 L 560 192 L 540 200 L 470 200 L 455 196 Z" fill="#374151" stroke="#111827" stroke-width="1.5"/>
<path d="M 500 192 L 515 175 L 525 192 Z" fill="#6b7280" stroke="#111827" stroke-width="1"/>
<text x="520" y="168" font-family="Arial,sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">flygplan</text>
<rect x="180" y="330" width="440" height="95" fill="white" stroke="#2563eb" stroke-width="2" rx="6"/>
<text x="400" y="358" font-family="Arial,sans-serif" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="bold">Mach-tal = farten ÷ ljudets fart</text>
<text x="400" y="385" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Mach 1 → lika fort som ljudet i luften</text>
<text x="400" y="408" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Mach 2 → dubbelt så fort</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Mach anger fart i förhållande till ljudets hastighet – Mach 1 är ljudets fart</text>
</svg>
