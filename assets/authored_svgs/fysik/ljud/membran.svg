<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Membran – tunt skinn som skakar av ljud</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Mikrofonens membran</text>

<!-- incoming sound: separated, evenly-spaced wave arcs (NOT piled up) -->
<path d="M 70 290 A 50 50 0 0 1 70 210" fill="none" stroke="#2563eb" stroke-width="2.2"/>
<path d="M 92 312 A 80 80 0 0 1 92 188" fill="none" stroke="#2563eb" stroke-width="2.2"/>
<path d="M 114 334 A 110 110 0 0 1 114 166" fill="none" stroke="#2563eb" stroke-width="2.2"/>
<text x="92" y="150" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="bold">Ljudvågor</text>

<!-- ===== MICROPHONE (recognizable handheld mic) ===== -->
<!-- round mic head (grille) -->
<circle cx="300" cy="250" r="58" fill="#9ca3af" stroke="#374151" stroke-width="3"/>
<circle cx="300" cy="250" r="58" fill="none" stroke="#1f2937" stroke-width="1"/>
<!-- grille lines -->
<line x1="252" y1="225" x2="348" y2="225" stroke="#4b5563" stroke-width="1.2"/>
<line x1="246" y1="240" x2="354" y2="240" stroke="#4b5563" stroke-width="1.2"/>
<line x1="244" y1="255" x2="356" y2="255" stroke="#4b5563" stroke-width="1.2"/>
<line x1="248" y1="270" x2="352" y2="270" stroke="#4b5563" stroke-width="1.2"/>
<!-- mic handle -->
<rect x="338" y="232" width="150" height="36" rx="16" fill="#374151" stroke="#111827" stroke-width="2.5"/>
<text x="300" y="338" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Mikrofon</text>

<!-- membrane inside the mic head: a thin vertical strip that flexes -->
<line x1="278" y1="206" x2="278" y2="294" stroke="#f59e0b" stroke-width="4"/>
<path d="M 278 206 Q 262 250 278 294" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="5,3"/>
<path d="M 278 206 Q 294 250 278 294" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="5,3"/>
<text x="240" y="186" font-family="Arial,sans-serif" font-size="12" fill="#92400e" text-anchor="middle" font-weight="bold">Membran</text>
<text x="240" y="201" font-family="Arial,sans-serif" font-size="11" fill="#92400e" text-anchor="middle">(tunt, spänt)</text>
<line x1="248" y1="200" x2="272" y2="232" stroke="#92400e" stroke-width="1.2"/>
<!-- flex arrows on membrane -->
<line x1="266" y1="250" x2="256" y2="250" stroke="#dc2626" stroke-width="2"/>
<polygon points="248,250 257,246 257,254" fill="#dc2626"/>
<line x1="290" y1="250" x2="300" y2="250" stroke="#dc2626" stroke-width="2"/>
<polygon points="308,250 299,246 299,254" fill="#dc2626"/>
<text x="278" y="312" font-family="Arial,sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">skakar fram och tillbaka</text>

<!-- ENERGY CONVERSION: sound -> electrical signal -->
<line x1="490" y1="250" x2="548" y2="250" stroke="#7c3aed" stroke-width="3"/>
<polygon points="560,250 547,256 547,244" fill="#7c3aed"/>
<!-- a clean sine = electrical signal -->
<path d="M 570 250 q 11 -22 22 0 t 22 0 t 22 0 t 22 0" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
<text x="630" y="226" font-family="Arial,sans-serif" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="bold">Elektrisk signal</text>

<!-- energy-conversion caption between -->
<rect x="430" y="290" width="320" height="58" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" rx="6"/>
<text x="590" y="314" font-family="Arial,sans-serif" font-size="13" fill="#5b21b6" text-anchor="middle" font-weight="bold">Energiomvandling</text>
<text x="590" y="334" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">ljudenergi → elektrisk energi</text>

<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Ljudet får mikrofonens membran att skaka – rörelsen omvandlas till en elektrisk signal</text>
</svg>
