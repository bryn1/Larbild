<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Våglängd — avståndet mellan två toppar</text>

<!-- midline (jämviktsläge) -->
<line x1="100" y1="250" x2="710" y2="250" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,5"/>
<text x="725" y="254" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="start">viloläge</text>

<!-- the wave -->
<path d="M 110 250.0 L 114 239.0 L 118 228.4 L 122 218.2 L 126 208.9 L 130 200.5 L 134 193.4 L 138 187.6 L 142 183.4 L 146 180.9 L 150 180.0 L 154 180.9 L 158 183.4 L 162 187.6 L 166 193.4 L 170 200.5 L 174 208.9 L 178 218.2 L 182 228.4 L 186 239.0 L 190 250.0 L 194 261.0 L 198 271.6 L 202 281.8 L 206 291.1 L 210 299.5 L 214 306.6 L 218 312.4 L 222 316.6 L 226 319.1 L 230 320.0 L 234 319.1 L 238 316.6 L 242 312.4 L 246 306.6 L 250 299.5 L 254 291.1 L 258 281.8 L 262 271.6 L 266 261.0 L 270 250.0 L 274 239.0 L 278 228.4 L 282 218.2 L 286 208.9 L 290 200.5 L 294 193.4 L 298 187.6 L 302 183.4 L 306 180.9 L 310 180.0 L 314 180.9 L 318 183.4 L 322 187.6 L 326 193.4 L 330 200.5 L 334 208.9 L 338 218.2 L 342 228.4 L 346 239.0 L 350 250.0 L 354 261.0 L 358 271.6 L 362 281.8 L 366 291.1 L 370 299.5 L 374 306.6 L 378 312.4 L 382 316.6 L 386 319.1 L 390 320.0 L 394 319.1 L 398 316.6 L 402 312.4 L 406 306.6 L 410 299.5 L 414 291.1 L 418 281.8 L 422 271.6 L 426 261.0 L 430 250.0 L 434 239.0 L 438 228.4 L 442 218.2 L 446 208.9 L 450 200.5 L 454 193.4 L 458 187.6 L 462 183.4 L 466 180.9 L 470 180.0 L 474 180.9 L 478 183.4 L 482 187.6 L 486 193.4 L 490 200.5 L 494 208.9 L 498 218.2 L 502 228.4 L 506 239.0 L 510 250.0 L 514 261.0 L 518 271.6 L 522 281.8 L 526 291.1 L 530 299.5 L 534 306.6 L 538 312.4 L 542 316.6 L 546 319.1 L 550 320.0 L 554 319.1 L 558 316.6 L 562 312.4 L 566 306.6 L 570 299.5 L 574 291.1 L 578 281.8 L 582 271.6 L 586 261.0 L 590 250.0 L 594 239.0 L 598 228.4 L 602 218.2 L 606 208.9 L 610 200.5 L 614 193.4 L 618 187.6 L 622 183.4 L 626 180.9 L 630 180.0 L 634 180.9 L 638 183.4 L 642 187.6 L 646 193.4 L 650 200.5 L 654 208.9 L 658 218.2 L 662 228.4 L 666 239.0 L 670 250.0 L 674 261.0 L 678 271.6 L 682 281.8 L 686 291.1 L 690 299.5 L 694 306.6 L 698 312.4" fill="none" stroke="#1d4ed8" stroke-width="3.5"/>

<!-- crest + trough small labels -->
<text x="150" y="168" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">vågtopp</text>
<text x="470" y="168" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">vågtopp</text>
<text x="230" y="342" font-family="Arial,sans-serif" font-size="12" fill="#15803d" text-anchor="middle">vågdal</text>
<text x="550" y="342" font-family="Arial,sans-serif" font-size="12" fill="#15803d" text-anchor="middle">vågdal</text>

<!-- dots on the two crests being measured (above) -->
<circle cx="150" cy="180" r="4.5" fill="#dc2626"/>
<circle cx="310" cy="180" r="4.5" fill="#dc2626"/>
<!-- vertical guide lines up from crests -->
<line x1="150" y1="180" x2="150" y2="115" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3"/>
<line x1="310" y1="180" x2="310" y2="115" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3"/>
<!-- wavelength arrow ABOVE: crest to crest -->
<line x1="150" y1="120" x2="310" y2="120" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="150,120 164,114 164,126" fill="#dc2626"/>
<polygon points="310,120 296,114 296,126" fill="#dc2626"/>
<text x="230" y="108" font-family="Arial,sans-serif" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold">λ (våglängd)</text>
<text x="230" y="138" font-family="Arial,sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">topp till topp</text>

<!-- dots on two troughs being measured (below) -->
<circle cx="230" cy="320" r="4.5" fill="#15803d"/>
<circle cx="390" cy="320" r="4.5" fill="#15803d"/>
<!-- vertical guide lines down from troughs -->
<line x1="230" y1="320" x2="230" y2="385" stroke="#15803d" stroke-width="1.2" stroke-dasharray="4,3"/>
<line x1="390" y1="320" x2="390" y2="385" stroke="#15803d" stroke-width="1.2" stroke-dasharray="4,3"/>
<!-- wavelength arrow BELOW: trough to trough -->
<line x1="230" y1="390" x2="390" y2="390" stroke="#15803d" stroke-width="2.5"/>
<polygon points="230,390 244,384 244,396" fill="#15803d"/>
<polygon points="390,390 376,384 376,396" fill="#15803d"/>
<text x="310" y="412" font-family="Arial,sans-serif" font-size="16" fill="#15803d" text-anchor="middle" font-weight="bold">λ (våglängd)</text>
<text x="310" y="430" font-family="Arial,sans-serif" font-size="11" fill="#15803d" text-anchor="middle">dal till dal</text>

<!-- note: both give the same wavelength -->
<text x="600" y="400" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Båda avstånden</text>
<text x="600" y="420" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">är lika långa</text>

<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Våglängden (λ) är avståndet för en hel våg — från en vågtopp till nästa, eller från en vågdal till nästa</text>
</svg>