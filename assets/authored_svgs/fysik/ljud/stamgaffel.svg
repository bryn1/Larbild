<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Stämgaffel – ger en ren ton</text>

<!-- ===== CORRECT TUNING FORK: U of two prongs joined at the bottom, single stem below ===== -->
<!-- Single closed outline: left prong up, round U-bend at bottom, right prong up,
     then down the inner side; stem hangs from the centre of the bend. -->
<!-- prongs + U-bend as one stroked path (metal) -->
<path d="M 352 130
         L 352 300
         Q 352 340 392 340
         Q 432 340 432 300
         L 432 130"
      fill="none" stroke="#9ca3af" stroke-width="14" stroke-linecap="round"/>
<!-- darker centre line to give the metal a rounded look -->
<path d="M 352 130
         L 352 300
         Q 352 340 392 340
         Q 432 340 432 300
         L 432 130"
      fill="none" stroke="#d1d5db" stroke-width="5" stroke-linecap="round"/>

<!-- single stem / handle hanging down from the centre of the bend -->
<rect x="384" y="338" width="16" height="92" rx="6" fill="#9ca3af" stroke="#4b5563" stroke-width="2"/>
<rect x="386" y="340" width="5" height="88" rx="2" fill="#d1d5db"/>
<text x="392" y="452" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">skaft (hålls här)</text>

<!-- label the two prongs -->
<text x="392" y="116" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">två armar (klykor)</text>

<!-- prongs vibrate: arrows + dashed swing outlines -->
<line x1="338" y1="180" x2="320" y2="180" stroke="#2563eb" stroke-width="2"/>
<polygon points="310,180 322,175 322,185" fill="#2563eb"/>
<line x1="446" y1="180" x2="464" y2="180" stroke="#2563eb" stroke-width="2"/>
<polygon points="474,180 462,175 462,185" fill="#2563eb"/>
<path d="M 344 130 L 326 130 L 326 296 Q 326 312 338 318" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3"/>
<path d="M 440 130 L 458 130 L 458 296 Q 458 312 446 318" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="392" y="210" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">armarna svänger</text>

<!-- struck here -->
<text x="510" y="300" font-family="Arial,sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">slå här</text>
<line x1="500" y1="296" x2="440" y2="270" stroke="#dc2626" stroke-width="2"/>
<polygon points="431,266 445,266 438,276" fill="#dc2626"/>

<!-- pure tone: one clean sine wave out to the right -->
<path d="M 488 150 q 14 -26 28 0 t 28 0 t 28 0 t 28 0 t 28 0 t 28 0"
      fill="none" stroke="#16a34a" stroke-width="2.5"/>
<text x="600" y="120" font-family="Arial,sans-serif" font-size="15" fill="#16a34a" text-anchor="middle" font-weight="bold">Ren ton</text>
<text x="600" y="170" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">en enda jämn frekvens</text>

<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">En U-formad metallgaffel med två armar på ett skaft – slår man på den ger den en ren ton</text>
</svg>
