<!-- ===== SENSORY HAIR CELLS (sinnesceller) inside the cochlea — zoom callout ===== -->
<circle cx="430" cy="285" r="20" fill="none" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="3,3"/>
