<path d="M 575 360 C 588 368 583 382 596 387" fill="none" stroke="#7c3aed" stroke-width="1.4"/>
<text x="600" y="436" font-family="Arial,sans-serif" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="bold">Hjärnan tolkar</text>

<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Sinnescellerna i snäckan känner av ljudsvängningen och skickar nervsignaler till hjärnan</text>
