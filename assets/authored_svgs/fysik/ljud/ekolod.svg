<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Ekolod (djup = ljudfart · tid / 2)</text>

<!-- water -->
<rect x="60" y="110" width="680" height="250" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
<!-- water surface line -->
<line x1="60" y1="110" x2="740" y2="110" stroke="#3b82f6" stroke-width="2"/>

<!-- boat on the surface -->
<path d="M 330 92 L 430 92 L 414 110 L 346 110 Z" fill="#92400e" stroke="#7c2d12" stroke-width="2"/>
<line x1="380" y1="92" x2="380" y2="66" stroke="#374151" stroke-width="2"/>
<text x="380" y="58" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Båt</text>
<!-- sonar transducer under the hull -->
<rect x="368" y="110" width="24" height="12" rx="2" fill="#374151" stroke="#111827" stroke-width="1.5"/>
<text x="320" y="124" font-family="Arial,sans-serif" font-size="11" fill="#374151" text-anchor="middle">ekolod</text>

<!-- seabed -->
<path d="M 60 350 Q 250 322 400 346 Q 560 368 740 338 L 740 360 L 60 360 Z" fill="#a16207" stroke="#854d0e" stroke-width="2"/>
<text x="640" y="340" font-family="Arial,sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Botten</text>

<!-- DOWN beam: a thick ray from transducer to a point on the seabed (slightly angled) -->
<line x1="380" y1="124" x2="360" y2="344" stroke="#dc2626" stroke-width="4"/>
<polygon points="359,353 351,338 370,341" fill="#dc2626"/>
<!-- a couple of wave ticks along the down beam to read as 'sound' -->
<path d="M 372 175 q 10 4 1 12" fill="none" stroke="#dc2626" stroke-width="1.6"/>
<path d="M 368 235 q 10 4 1 12" fill="none" stroke="#dc2626" stroke-width="1.6"/>
<text x="300" y="240" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">Ljudpuls ned</text>

<!-- reflection point on seabed -->
<circle cx="360" cy="344" r="5" fill="#1f2937"/>

<!-- UP beam: reflected ray back up to the boat (mirror angle) -->
<line x1="360" y1="344" x2="392" y2="124" stroke="#16a34a" stroke-width="4"/>
<polygon points="393,115 386,131 401,128" fill="#16a34a"/>
<path d="M 380 235 q 10 4 1 12" fill="none" stroke="#16a34a" stroke-width="1.6"/>
<path d="M 384 175 q 10 4 1 12" fill="none" stroke="#16a34a" stroke-width="1.6"/>
<text x="470" y="240" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="bold">Eko upp</text>
<text x="470" y="258" font-family="Arial,sans-serif" font-size="11" fill="#16a34a" text-anchor="middle">reflekteras tillbaka</text>

<!-- formula box -->
<rect x="150" y="385" width="500" height="72" fill="white" stroke="#2563eb" stroke-width="2" rx="6"/>
<text x="400" y="410" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Ljudet går ned, studsar mot botten och kommer tillbaka – mät tiden</text>
<text x="400" y="438" font-family="Arial,sans-serif" font-size="15" fill="#1e40af" text-anchor="middle" font-weight="bold">djup = ljudfart · tid / 2</text>
</svg>
