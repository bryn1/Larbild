<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Hörselgång – kanalen in till trumhinnan</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Genomskärning av örat</text>

<!-- outer ear (pinna) on the left -->
<path d="M 120 175 C 78 168 66 258 104 310 C 120 342 158 340 162 312
         C 178 328 204 312 192 290 C 214 286 214 254 194 252
         C 208 228 186 202 160 214 C 160 182 146 172 120 175 Z"
      fill="#fcd9c8" stroke="#b45309" stroke-width="2"/>
<text x="118" y="368" font-family="Arial,sans-serif" font-size="12" fill="#92400e" text-anchor="middle">Ytteröra</text>

<!-- ear canal (hörselgång): horizontal channel from pinna to inner end -->
<path d="M 175 240 L 500 236 L 500 296 L 175 290 Z" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
<text x="335" y="220" font-family="Arial,sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="bold">Hörselgång (kanal)</text>

<!-- sound led in -->
<line x1="210" y1="266" x2="455" y2="266" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="466,266 453,272 453,260" fill="#2563eb"/>
<text x="330" y="282" font-family="Arial,sans-serif" font-size="11" fill="#2563eb" text-anchor="middle">ljudet leds in</text>

<!-- eardrum (trumhinna) at the inner end, rendered at 90 deg to the canal (vertical, since canal is horizontal) -->
<line x1="505" y1="232" x2="505" y2="300" stroke="#7c2d12" stroke-width="6"/>
<!-- faint frame ring around it to read as a stretched skin, aligned upright with the membrane -->
<ellipse cx="505" cy="266" rx="9" ry="36" fill="none" stroke="#92400e" stroke-width="1.4" stroke-dasharray="4,3"/>
<text x="600" y="200" font-family="Arial,sans-serif" font-size="13" fill="#7c2d12" text-anchor="middle" font-weight="bold">Trumhinna</text>
<line x1="568" y1="206" x2="520" y2="248" stroke="#7c2d12" stroke-width="1.5"/>
<polygon points="512,254 518,241 526,250" fill="#7c2d12"/>

<!-- it vibrates -->
<path d="M 516 250 q 12 6 2 16" fill="none" stroke="#dc2626" stroke-width="1.8"/>
<path d="M 524 266 q 12 6 2 16" fill="none" stroke="#dc2626" stroke-width="1.8"/>
<text x="585" y="300" font-family="Arial,sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">skakar av ljudet</text>

<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Hörselgången leder ljudvågorna in till trumhinnan, som sitter rakt över kanalen längst in</text>
</svg>
