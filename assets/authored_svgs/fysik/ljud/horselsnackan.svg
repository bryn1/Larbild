<circle cx="692" cy="244" r="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="692" y="292" font-family="Arial,sans-serif" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="bold">Hjärnan</text>
<text x="692" y="249" font-family="Arial,sans-serif" font-size="12" fill="#7c3aed" text-anchor="middle">tolkar</text>

<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Hörselsnäckan gör om vibrationer till nervsignaler som hjärnan tolkar som ljud</text>
</svg>
