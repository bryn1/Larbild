<!-- oval window where vibration enters the spiral mouth (outer start ~466,218) -->
<circle cx="466" cy="218" r="9" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
<line x1="200" y1="228" x2="448" y2="222" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,4"/>
<polygon points="458,221 444,226 445,216" fill="#2563eb"/>

<!-- inside: hair cells turn vibration into signals (label below the spiral, clear of strokes) -->
<text x="225" y="368" font-family="Arial,sans-serif" font-size="11" fill="#0e7490" text-anchor="middle">hårcellerna känner</text>
<text x="225" y="383" font-family="Arial,sans-serif" font-size="11" fill="#0e7490" text-anchor="middle">av svängningen</text>
<line x1="278" y1="372" x2="358" y2="270" stroke="#0891b2" stroke-width="1" stroke-dasharray="3,3"/>

<!-- nerve signal out from the spiral to the brain -->
<path d="M 446 290 C 512 304 548 250 602 244" fill="none" stroke="#7c3aed" stroke-width="3"/>
<line x1="602" y1="244" x2="648" y2="244" stroke="#7c3aed" stroke-width="2.5"/>
<polygon points="660,244 647,250 647,238" fill="#7c3aed"/>
