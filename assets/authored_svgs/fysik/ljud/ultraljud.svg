<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Ultraljud</text>
<!-- frequency axis -->
<line x1="80" y1="160" x2="740" y2="160" stroke="#1f2937" stroke-width="2"/>
<polygon points="740,160 728,155 728,165" fill="#1f2937"/>
<text x="735" y="195" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="end">frekvens (Hz) →</text>
<!-- three bands -->
<rect x="80" y="120" width="160" height="40" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
<text x="160" y="145" font-family="Arial,sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">infraljud</text>
<rect x="240" y="120" width="280" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="380" y="145" font-family="Arial,sans-serif" font-size="13" fill="#15803d" text-anchor="middle" font-weight="bold">hörbart ljud</text>
<rect x="520" y="120" width="220" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="630" y="145" font-family="Arial,sans-serif" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="bold">ultraljud</text>
<!-- band boundary tick labels -->
<line x1="240" y1="160" x2="240" y2="175" stroke="#1f2937" stroke-width="1.5"/>
<text x="240" y="192" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">20 Hz</text>
<line x1="520" y1="160" x2="520" y2="175" stroke="#1f2937" stroke-width="1.5"/>
<text x="520" y="192" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">20 000 Hz</text>
<text x="380" y="218" font-family="Arial,sans-serif" font-size="12" fill="#15803d" text-anchor="middle">människan hör här</text>
<text x="630" y="218" font-family="Arial,sans-serif" font-size="12" fill="#1e40af" text-anchor="middle">för högt för örat</text>
<!-- human ear icon left -->
<path d="M 150 290 a 30 30 0 1 1 6 28 q -2 12 -14 12" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
<text x="160" y="370" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">örat</text>
<!-- bat using ultrasound (application) -->
<text x="560" y="300" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Djur och apparater</text>
<text x="560" y="320" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">använder ultraljud</text>
<!-- emitter sending ultrasound pulses + echo (e.g. ultrasound scan) -->
<rect x="430" y="350" width="44" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="3"/>
<g fill="none" stroke="#2563eb" stroke-width="2">
<path d="M 480 350 A 22 22 0 0 1 480 380"/>
<path d="M 500 345 A 30 30 0 0 1 500 385"/>
</g>
<polygon points="525,365 513,359 513,371" fill="#2563eb"/>
<text x="452" y="403" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">t.ex. ultraljudsbild</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Ljud som svänger så snabbt att människans öra inte kan höra det</text>
</svg>
