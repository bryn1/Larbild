<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Ultraljud — ljud vi inte kan höra</text>

<!-- frequency axis bar, three zones -->
<!-- infraljud zone -->
<rect x="80" y="150" width="180" height="70" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
<!-- hörbart zone -->
<rect x="260" y="150" width="280" height="70" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
<!-- ultraljud zone -->
<rect x="540" y="150" width="180" height="70" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>

<!-- zone labels (inside bands) -->
<text x="170" y="180" font-family="Arial,sans-serif" font-size="15" fill="#1e3a8a" text-anchor="middle" font-weight="bold">Infraljud</text>
<text x="170" y="202" font-family="Arial,sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle">hör ej</text>

<text x="400" y="180" font-family="Arial,sans-serif" font-size="15" fill="#14532d" text-anchor="middle" font-weight="bold">Hörbart ljud</text>
<text x="400" y="202" font-family="Arial,sans-serif" font-size="12" fill="#14532d" text-anchor="middle">vi hör detta</text>

<text x="630" y="180" font-family="Arial,sans-serif" font-size="15" fill="#7c2d12" text-anchor="middle" font-weight="bold">Ultraljud</text>
<text x="630" y="202" font-family="Arial,sans-serif" font-size="12" fill="#7c2d12" text-anchor="middle">hör ej</text>

<!-- the long axis line with arrow (frequency increases to the right) -->
<line x1="80" y1="250" x2="726" y2="250" stroke="#1f2937" stroke-width="3"/>
<polygon points="740,250 724,243 724,257" fill="#1f2937"/>
<text x="400" y="290" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Frekvens (svängningar per sekund, Hz) →</text>

<!-- boundary tick marks + values -->
<line x1="260" y1="242" x2="260" y2="258" stroke="#1f2937" stroke-width="2.5"/>
<text x="260" y="320" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">20 Hz</text>
<line x1="540" y1="242" x2="540" y2="258" stroke="#1f2937" stroke-width="2.5"/>
<text x="540" y="320" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">20 000 Hz</text>
<text x="540" y="337" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(20 kHz)</text>

<!-- examples row -->
<text x="170" y="375" font-family="Arial,sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle" font-weight="bold">Exempel:</text>
<text x="170" y="395" font-family="Arial,sans-serif" font-size="12" fill="#374151" text-anchor="middle">elefanter,</text>
<text x="170" y="412" font-family="Arial,sans-serif" font-size="12" fill="#374151" text-anchor="middle">jordbävningar</text>

<text x="400" y="375" font-family="Arial,sans-serif" font-size="12" fill="#14532d" text-anchor="middle" font-weight="bold">Exempel:</text>
<text x="400" y="395" font-family="Arial,sans-serif" font-size="12" fill="#374151" text-anchor="middle">tal, musik,</text>
<text x="400" y="412" font-family="Arial,sans-serif" font-size="12" fill="#374151" text-anchor="middle">de flesta ljud</text>

<text x="630" y="375" font-family="Arial,sans-serif" font-size="12" fill="#7c2d12" text-anchor="middle" font-weight="bold">Exempel:</text>
<text x="630" y="395" font-family="Arial,sans-serif" font-size="12" fill="#374151" text-anchor="middle">fladdermöss,</text>
<text x="630" y="412" font-family="Arial,sans-serif" font-size="12" fill="#374151" text-anchor="middle">ultraljud hos läkaren</text>

<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Människan hör mellan 20 Hz och 20 000 Hz. Infraljud är för långsamt och ultraljud för snabbt för vårt öra</text>
</svg>
