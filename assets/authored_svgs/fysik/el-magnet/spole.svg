<text x="400" y="360" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">När ström går genom spolen beter den sig som en magnet</text>
<text x="400" y="388" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Används i dörrklockor, elmotorer och högtalare</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">En spole är en tråd lindad i många varv runt en kärna</text>
