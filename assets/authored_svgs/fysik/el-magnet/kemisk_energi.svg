<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Kemisk energi</text>
<text x="400" y="78" font-family="Arial,sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Energi lagrad i bindningarna mellan atomer</text>

<!-- sugar molecule (glucose) with bonds storing energy -->
<text x="200" y="120" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Före: lagrad i bindningar</text>
<text x="200" y="138" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">socker (glukos), C₆H₁₂O₆</text>

<!-- pyranose ring: 5 carbons + 1 oxygen, drawn as a hexagon -->
<!-- ring vertices (cx,cy): top-O, then carbons clockwise -->
<!-- bonds of the ring (orange = energy stored in the bonds) -->
<line x1="200" y1="175" x2="248" y2="203" stroke="#f59e0b" stroke-width="4"/>
<line x1="248" y1="203" x2="248" y2="259" stroke="#f59e0b" stroke-width="4"/>
<line x1="248" y1="259" x2="200" y2="287" stroke="#f59e0b" stroke-width="4"/>
<line x1="200" y1="287" x2="152" y2="259" stroke="#f59e0b" stroke-width="4"/>
<line x1="152" y1="259" x2="152" y2="203" stroke="#f59e0b" stroke-width="4"/>
<line x1="152" y1="203" x2="200" y2="175" stroke="#f59e0b" stroke-width="4"/>
<!-- bonds out to OH / H groups -->
<line x1="248" y1="203" x2="288" y2="180" stroke="#f59e0b" stroke-width="3"/>
<line x1="248" y1="259" x2="288" y2="282" stroke="#f59e0b" stroke-width="3"/>
<line x1="152" y1="259" x2="112" y2="282" stroke="#f59e0b" stroke-width="3"/>
<line x1="152" y1="203" x2="112" y2="180" stroke="#f59e0b" stroke-width="3"/>
<line x1="200" y1="287" x2="200" y2="320" stroke="#f59e0b" stroke-width="3"/>
<!-- ring atoms: oxygen at top, carbons elsewhere -->
<circle cx="200" cy="175" r="16" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
<text x="200" y="180" font-family="Arial,sans-serif" font-size="13" fill="white" text-anchor="middle">O</text>
<circle cx="248" cy="203" r="18" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
<text x="248" y="208" font-family="Arial,sans-serif" font-size="13" fill="white" text-anchor="middle">C</text>
<circle cx="248" cy="259" r="18" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
<text x="248" y="264" font-family="Arial,sans-serif" font-size="13" fill="white" text-anchor="middle">C</text>
<circle cx="200" cy="287" r="18" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
<text x="200" y="292" font-family="Arial,sans-serif" font-size="13" fill="white" text-anchor="middle">C</text>
<circle cx="152" cy="259" r="18" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
<text x="152" y="264" font-family="Arial,sans-serif" font-size="13" fill="white" text-anchor="middle">C</text>
<circle cx="152" cy="203" r="18" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
<text x="152" y="208" font-family="Arial,sans-serif" font-size="13" fill="white" text-anchor="middle">C</text>
<!-- OH / H groups around the ring -->
<text x="300" y="176" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle">OH</text>
<text x="300" y="288" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle">OH</text>
<text x="100" y="288" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle">OH</text>
<text x="100" y="176" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle">OH</text>
<text x="200" y="338" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle">CH₂OH</text>

<!-- reaction arrow -->
<line x1="335" y1="240" x2="420" y2="240" stroke="#dc2626" stroke-width="4"/>
<polygon points="435,240 419,233 419,247" fill="#dc2626"/>
<text x="377" y="225" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">reagerar</text>
<text x="377" y="265" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">(förbränns)</text>

<!-- after: energy released -->
<text x="600" y="130" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Efter: energin frigörs</text>
<circle cx="600" cy="240" r="40" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<line x1="600" y1="180" x2="600" y2="160" stroke="#f59e0b" stroke-width="3"/>
<line x1="600" y1="300" x2="600" y2="320" stroke="#f59e0b" stroke-width="3"/>
<line x1="540" y1="240" x2="520" y2="240" stroke="#f59e0b" stroke-width="3"/>
<line x1="660" y1="240" x2="680" y2="240" stroke="#f59e0b" stroke-width="3"/>
<line x1="558" y1="198" x2="544" y2="184" stroke="#f59e0b" stroke-width="3"/>
<line x1="642" y1="198" x2="656" y2="184" stroke="#f59e0b" stroke-width="3"/>
<line x1="558" y1="282" x2="544" y2="296" stroke="#f59e0b" stroke-width="3"/>
<line x1="642" y1="282" x2="656" y2="296" stroke="#f59e0b" stroke-width="3"/>
<text x="600" y="246" font-family="Arial,sans-serif" font-size="13" fill="#b45309" text-anchor="middle" font-weight="bold">energi</text>

<text x="400" y="400" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">Maten du äter ger kemisk energi som musklerna sedan använder</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Frigörs när ämnet reagerar – t.ex. när socker förbränns i kroppen</text>
</svg>