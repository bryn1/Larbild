<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Joule (J) – enhet för energi</text>
<text x="400" y="80" font-family="Arial,sans-serif" font-size="30" fill="#1e40af" text-anchor="middle" font-weight="bold">1 J = 1 N · 1 m</text>
<text x="400" y="110" font-family="Arial,sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Joule mäter all slags energi – värme, rörelse och el</text>

<!-- three forms of energy boxes -->
<rect x="80" y="160" width="200" height="110" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5" rx="6"/>
<text x="180" y="195" font-family="Arial,sans-serif" font-size="16" fill="#991b1b" text-anchor="middle" font-weight="bold">Värme</text>
<text x="180" y="225" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">varm choklad</text>
<text x="180" y="252" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">mäts i joule</text>

<rect x="300" y="160" width="200" height="110" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5" rx="6"/>
<text x="400" y="195" font-family="Arial,sans-serif" font-size="16" fill="#1e40af" text-anchor="middle" font-weight="bold">Rörelse</text>
<text x="400" y="225" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">rullande boll</text>
<text x="400" y="252" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">mäts i joule</text>

<rect x="520" y="160" width="200" height="110" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5" rx="6"/>
<text x="620" y="195" font-family="Arial,sans-serif" font-size="16" fill="#b45309" text-anchor="middle" font-weight="bold">El</text>
<text x="620" y="225" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">i en sladd</text>
<text x="620" y="252" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">mäts i joule</text>

<!-- example -->
<rect x="180" y="330" width="440" height="70" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5" rx="6"/>
<text x="400" y="358" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">På mjölkpaketet står hur många joule</text>
<text x="400" y="382" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">energi ett glas mjölk ger dig</text>

<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">1 joule är energin när en kraft på 1 newton flyttar något 1 meter</text>
</svg>