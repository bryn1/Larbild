<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="33" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Ohms lag</text>
<text x="400" y="58" font-family="Arial,sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Spänning, ström och resistans hänger ihop</text>

<!-- big formula -->
<text x="400" y="100" font-family="Arial,sans-serif" font-size="32" fill="#1e40af" text-anchor="middle" font-weight="bold">U = R · I</text>
<text x="400" y="128" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">U = spänning (volt, V)   ·   R = resistans (ohm, Ω)   ·   I = ström (ampere, A)</text>

<!-- ============ LEFT: simple circuit, battery U clearly visible ============ -->
<text x="215" y="165" font-family="Arial,sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Kretsen</text>
<!-- wire loop -->
<line x1="110" y1="195" x2="320" y2="195" stroke="#1f2937" stroke-width="3"/>
<line x1="320" y1="195" x2="320" y2="370" stroke="#1f2937" stroke-width="3"/>
<line x1="320" y1="370" x2="110" y2="370" stroke="#1f2937" stroke-width="3"/>
<line x1="110" y1="195" x2="110" y2="255" stroke="#1f2937" stroke-width="3"/>
<line x1="110" y1="315" x2="110" y2="370" stroke="#1f2937" stroke-width="3"/>

<!-- BATTERY on the left: long(+)/short(-), with a BIG clear U label -->
<line x1="85" y1="267" x2="135" y2="267" stroke="#1f2937" stroke-width="3"/>
<line x1="97" y1="303" x2="123" y2="303" stroke="#1f2937" stroke-width="7"/>
<text x="68" y="273" font-family="Arial,sans-serif" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold">+</text>
<text x="68" y="309" font-family="Arial,sans-serif" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">−</text>
<!-- U label on a tinted badge so it's clearly visible -->
<rect x="138" y="270" width="60" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="168" y="291" font-family="Arial,sans-serif" font-size="16" fill="#1e40af" text-anchor="middle" font-weight="bold">U = 12 V</text>
<text x="110" y="392" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">batteri</text>

<!-- RESISTOR on top side -->
<rect x="180" y="184" width="70" height="22" fill="#fef3c7" stroke="#1f2937" stroke-width="2.5"/>
<text x="215" y="201" font-family="Arial,sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">R</text>
<!-- R = 4 Ohm label placed BELOW the resistor in open space, clear of "Kretsen" title and the wires -->
<text x="215" y="232" font-family="Arial,sans-serif" font-size="13" fill="#92400e" text-anchor="middle">R = 4 Ω</text>

<!-- current arrow -->
<line x1="320" y1="250" x2="320" y2="300" stroke="#dc2626" stroke-width="1"/>
<polygon points="320,250 313,262 327,262" fill="#dc2626"/>
<text x="338" y="285" font-family="Arial,sans-serif" font-size="14" fill="#dc2626" text-anchor="start" font-weight="bold">I</text>

<!-- ============ RIGHT: worked example with a REAL fraction ============ -->
<rect x="420" y="150" width="350" height="230" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="595" y="178" font-family="Arial,sans-serif" font-size="16" fill="#1e40af" text-anchor="middle" font-weight="bold">Räkneexempel</text>
<text x="595" y="205" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">U = 12 V,  R = 4 Ω.  Hur stor blir I?</text>

<!-- I = (U / R) as a stacked fraction -->
<text x="475" y="285" font-family="Arial,sans-serif" font-size="24" fill="#1f2937" text-anchor="middle" font-weight="bold">I =</text>
<!-- fraction 1: U over R (symbols) -->
<text x="545" y="272" font-family="Arial,sans-serif" font-size="22" fill="#2563eb" text-anchor="middle" font-weight="bold">U</text>
<line x1="520" y1="282" x2="570" y2="282" stroke="#1f2937" stroke-width="2.5"/>
<text x="545" y="306" font-family="Arial,sans-serif" font-size="22" fill="#92400e" text-anchor="middle" font-weight="bold">R</text>
<text x="595" y="285" font-family="Arial,sans-serif" font-size="24" fill="#1f2937" text-anchor="middle" font-weight="bold">=</text>
<!-- fraction 2: 12 over 4 (numbers) -->
<text x="640" y="272" font-family="Arial,sans-serif" font-size="22" fill="#2563eb" text-anchor="middle" font-weight="bold">12 V</text>
<line x1="615" y1="282" x2="665" y2="282" stroke="#1f2937" stroke-width="2.5"/>
<text x="640" y="306" font-family="Arial,sans-serif" font-size="22" fill="#92400e" text-anchor="middle" font-weight="bold">4 Ω</text>
<!-- result -->
<text x="700" y="285" font-family="Arial,sans-serif" font-size="24" fill="#16a34a" text-anchor="middle" font-weight="bold">= 3 A</text>
<text x="595" y="350" font-family="Arial,sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Täljaren är U (spänning), nämnaren är R (resistans)</text>

<text x="400" y="415" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">Större spänning → större ström.  Större resistans → mindre ström.</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Ändras en av dem så ändras de andra också</text>
</svg>
