<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Magnetfält</text>
<!-- bar magnet centered -->
<rect x="320" y="225" width="80" height="60" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
<rect x="400" y="225" width="80" height="60" fill="#2563eb" stroke="#1e3a8a" stroke-width="2"/>
<text x="360" y="263" font-family="Arial,sans-serif" font-size="24" fill="white" text-anchor="middle" font-weight="bold">N</text>
<text x="440" y="263" font-family="Arial,sans-serif" font-size="24" fill="white" text-anchor="middle" font-weight="bold">S</text>
<!-- field lines: emerge from N (left), arc around, enter S (right). Outside the magnet the field points N -> S, i.e. left -> right along the top and bottom arcs. -->
<g fill="none" stroke="#1f2937" stroke-width="1.8">
<path d="M 340 225 C 320 120, 480 120, 460 225"/>
<path d="M 345 225 C 330 165, 470 165, 455 225"/>
<path d="M 340 285 C 320 380, 480 380, 460 285"/>
<path d="M 345 285 C 330 335, 470 335, 455 285"/>
</g>
<!-- direction arrowheads sitting ON the arc apexes, pointing N->S (rightward) -->
<polygon points="412,146 398,141 398,151" fill="#1f2937"/>
<polygon points="412,354 398,349 398,359" fill="#1f2937"/>
<polygon points="408,181 396,177 396,185" fill="#1f2937"/>
<polygon points="408,329 396,325 396,333" fill="#1f2937"/>
<text x="250" y="135" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">fältlinjer går från N till S</text>
<text x="400" y="430" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">Fältet är starkast närmast polerna</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Området runt magneten där järnföremål och andra magneter påverkas</text>
</svg>
