<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="33" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Energiform</text>
<text x="400" y="58" font-family="Arial,sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Samma energi kan se ut på många olika sätt</text>

<!-- 3 x 3 grid, 9 cards. card w=242 h=104. cols x=30,279,528 ; rows y=72,186,300 -->

<!-- 1 Rörelseenergi (motion) -->
<rect x="30" y="72" width="242" height="104" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<circle cx="78" cy="118" r="16" fill="#16a34a"/>
<line x1="100" y1="118" x2="132" y2="118" stroke="#16a34a" stroke-width="3"/>
<polygon points="142,118 132,113 132,123" fill="#16a34a"/>
<text x="151" y="162" font-family="Arial,sans-serif" font-size="15" fill="#166534" text-anchor="middle" font-weight="bold">Rörelseenergi</text>

<!-- 2 Lägesenergi (position) -->
<rect x="279" y="72" width="242" height="104" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<circle cx="320" cy="100" r="13" fill="#16a34a"/>
<line x1="305" y1="158" x2="360" y2="158" stroke="#6b7280" stroke-width="3"/>
<line x1="320" y1="113" x2="320" y2="152" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="400" y="162" font-family="Arial,sans-serif" font-size="15" fill="#166534" text-anchor="middle" font-weight="bold">Lägesenergi</text>

<!-- 3 Elastisk energi (spring) -->
<rect x="528" y="72" width="242" height="104" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<line x1="560" y1="115" x2="575" y2="115" stroke="#dc2626" stroke-width="3"/>
<path d="M575 115 l8 -14 l8 28 l8 -28 l8 28 l8 -28 l8 28 l8 -14" fill="none" stroke="#dc2626" stroke-width="3"/>
<line x1="631" y1="115" x2="650" y2="115" stroke="#dc2626" stroke-width="3"/>
<text x="649" y="162" font-family="Arial,sans-serif" font-size="15" fill="#991b1b" text-anchor="middle" font-weight="bold">Elastisk energi</text>

<!-- 4 Värmeenergi (heat) -->
<rect x="30" y="186" width="242" height="104" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<circle cx="80" cy="230" r="20" fill="#f59e0b"/>
<line x1="80" y1="201" x2="80" y2="192" stroke="#f59e0b" stroke-width="3"/>
<line x1="80" y1="259" x2="80" y2="268" stroke="#f59e0b" stroke-width="3"/>
<line x1="51" y1="230" x2="42" y2="230" stroke="#f59e0b" stroke-width="3"/>
<line x1="109" y1="230" x2="118" y2="230" stroke="#f59e0b" stroke-width="3"/>
<text x="156" y="276" font-family="Arial,sans-serif" font-size="15" fill="#92400e" text-anchor="middle" font-weight="bold">Värmeenergi</text>

<!-- 5 Strålningsenergi (radiation / light) -->
<rect x="279" y="186" width="242" height="104" rx="8" fill="#fefce8" stroke="#f59e0b" stroke-width="2"/>
<circle cx="322" cy="226" r="17" fill="#fde047" stroke="#f59e0b" stroke-width="2"/>
<line x1="322" y1="200" x2="322" y2="190" stroke="#facc15" stroke-width="3"/>
<line x1="346" y1="210" x2="356" y2="200" stroke="#facc15" stroke-width="3"/>
<line x1="298" y1="210" x2="288" y2="200" stroke="#facc15" stroke-width="3"/>
<line x1="346" y1="242" x2="356" y2="252" stroke="#facc15" stroke-width="3"/>
<line x1="298" y1="242" x2="288" y2="252" stroke="#facc15" stroke-width="3"/>
<text x="412" y="262" font-family="Arial,sans-serif" font-size="15" fill="#92400e" text-anchor="middle" font-weight="bold">Strålningsenergi</text>
<text x="412" y="280" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">(ljus och strålning)</text>

<!-- 6 Ljudenergi (sound) -->
<rect x="528" y="186" width="242" height="104" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<rect x="575" y="218" width="14" height="26" fill="#1e40af"/>
<polygon points="589,231 610,211 610,251" fill="#1e40af"/>
<path d="M620 215 A24 24 0 0 1 620 247" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<path d="M628 207 A36 36 0 0 1 628 255" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<text x="660" y="276" font-family="Arial,sans-serif" font-size="15" fill="#1e40af" text-anchor="middle" font-weight="bold">Ljudenergi</text>

<!-- 7 Elektrisk energi (electricity) -->
<rect x="30" y="300" width="242" height="104" rx="8" fill="#fefce8" stroke="#f59e0b" stroke-width="2"/>
<polygon points="84,322 61,360 78,360 66,392 98,352 81,352 94,322" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
<text x="160" y="362" font-family="Arial,sans-serif" font-size="15" fill="#92400e" text-anchor="middle" font-weight="bold">Elektrisk energi</text>

<!-- 8 Kemisk energi (chemical) -->
<rect x="279" y="300" width="242" height="104" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
<rect x="318" y="328" width="42" height="54" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<rect x="332" y="322" width="14" height="8" fill="#7c3aed"/>
<text x="339" y="363" font-family="Arial,sans-serif" font-size="18" fill="#7c3aed" text-anchor="middle" font-weight="bold">+</text>
<text x="425" y="358" font-family="Arial,sans-serif" font-size="15" fill="#6d28d9" text-anchor="middle" font-weight="bold">Kemisk energi</text>

<!-- 9 Kärnenergi (nuclear) - NEW -->
<rect x="528" y="300" width="242" height="104" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<circle cx="572" cy="352" r="9" fill="#ea580c"/>
<ellipse cx="572" cy="352" rx="26" ry="11" fill="none" stroke="#ea580c" stroke-width="2"/>
<ellipse cx="572" cy="352" rx="26" ry="11" fill="none" stroke="#ea580c" stroke-width="2" transform="rotate(60 572 352)"/>
<ellipse cx="572" cy="352" rx="26" ry="11" fill="none" stroke="#ea580c" stroke-width="2" transform="rotate(120 572 352)"/>
<text x="660" y="362" font-family="Arial,sans-serif" font-size="15" fill="#c2410c" text-anchor="middle" font-weight="bold">Kärnenergi</text>

<text x="400" y="430" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">Ljusenergi kallas också strålningsenergi. Kärnenergi finns i atomkärnan.</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Energiform betyder hur energin ser ut just nu</text>
</svg>
