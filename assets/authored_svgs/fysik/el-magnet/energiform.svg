<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Energiform</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Samma energi kan se ut på många olika sätt</text>

<!-- 8 cards in a 4 x 2 grid. card w=170 h=140, gap, margins inside bounds -->
<!-- row 1 y=90..230 ; row 2 y=250..390. cols x = 40,230,420,610 -->

<!-- 1 Värmeenergi (amber sun/heat) -->
<rect x="40" y="90" width="160" height="130" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<circle cx="120" cy="140" r="22" fill="#f59e0b"/>
<line x1="120" y1="108" x2="120" y2="98" stroke="#f59e0b" stroke-width="3"/>
<line x1="120" y1="172" x2="120" y2="182" stroke="#f59e0b" stroke-width="3"/>
<line x1="88" y1="140" x2="78" y2="140" stroke="#f59e0b" stroke-width="3"/>
<line x1="152" y1="140" x2="162" y2="140" stroke="#f59e0b" stroke-width="3"/>
<text x="120" y="205" font-family="Arial,sans-serif" font-size="15" fill="#92400e" text-anchor="middle" font-weight="bold">Värmeenergi</text>

<!-- 2 Ljusenergi (light - lamp with rays) -->
<rect x="230" y="90" width="160" height="130" rx="8" fill="#fefce8" stroke="#f59e0b" stroke-width="2"/>
<circle cx="310" cy="138" r="20" fill="#fde047" stroke="#f59e0b" stroke-width="2"/>
<line x1="310" y1="108" x2="310" y2="96" stroke="#facc15" stroke-width="3"/>
<line x1="338" y1="120" x2="348" y2="110" stroke="#facc15" stroke-width="3"/>
<line x1="282" y1="120" x2="272" y2="110" stroke="#facc15" stroke-width="3"/>
<line x1="340" y1="150" x2="352" y2="156" stroke="#facc15" stroke-width="3"/>
<line x1="280" y1="150" x2="268" y2="156" stroke="#facc15" stroke-width="3"/>
<text x="310" y="205" font-family="Arial,sans-serif" font-size="15" fill="#92400e" text-anchor="middle" font-weight="bold">Ljusenergi</text>

<!-- 3 Ljudenergi (sound - speaker + waves) -->
<rect x="420" y="90" width="160" height="130" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<rect x="475" y="125" width="14" height="26" fill="#1e40af"/>
<polygon points="489,138 510,118 510,158" fill="#1e40af"/>
<path d="M520 122 A24 24 0 0 1 520 154" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<path d="M528 114 A36 36 0 0 1 528 162" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<text x="500" y="205" font-family="Arial,sans-serif" font-size="15" fill="#1e40af" text-anchor="middle" font-weight="bold">Ljudenergi</text>

<!-- 4 Rörelseenergi (motion - car/ball moving) -->
<rect x="610" y="90" width="160" height="130" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<circle cx="675" cy="140" r="18" fill="#16a34a"/>
<line x1="700" y1="140" x2="735" y2="140" stroke="#16a34a" stroke-width="3"/>
<polygon points="745,140 735,135 735,145" fill="#16a34a"/>
<text x="690" y="205" font-family="Arial,sans-serif" font-size="15" fill="#166534" text-anchor="middle" font-weight="bold">Rörelseenergi</text>

<!-- 5 Lägesenergi (position - object up high) -->
<rect x="40" y="250" width="160" height="130" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<circle cx="80" cy="278" r="14" fill="#16a34a"/>
<line x1="60" y1="355" x2="160" y2="355" stroke="#6b7280" stroke-width="3"/>
<line x1="80" y1="292" x2="80" y2="348" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="120" y="320" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle">högt upp</text>
<text x="120" y="372" font-family="Arial,sans-serif" font-size="15" fill="#166534" text-anchor="middle" font-weight="bold">Lägesenergi</text>

<!-- 6 Elektrisk energi (electricity - bolt) -->
<rect x="230" y="250" width="160" height="130" rx="8" fill="#fefce8" stroke="#f59e0b" stroke-width="2"/>
<polygon points="318,275 295,320 312,320 300,355 332,310 315,310 328,275" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
<text x="310" y="372" font-family="Arial,sans-serif" font-size="15" fill="#92400e" text-anchor="middle" font-weight="bold">Elektrisk energi</text>

<!-- 7 Kemisk energi (chemical - battery/food) -->
<rect x="420" y="250" width="160" height="130" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
<rect x="478" y="282" width="44" height="56" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<rect x="492" y="276" width="16" height="8" fill="#7c3aed"/>
<text x="500" y="318" font-family="Arial,sans-serif" font-size="20" fill="#7c3aed" text-anchor="middle" font-weight="bold">+</text>
<text x="500" y="372" font-family="Arial,sans-serif" font-size="15" fill="#6d28d9" text-anchor="middle" font-weight="bold">Kemisk energi</text>

<!-- 8 Elastisk energi (elastic - stretched spring) -->
<rect x="610" y="250" width="160" height="130" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<line x1="635" y1="312" x2="650" y2="312" stroke="#dc2626" stroke-width="3"/>
<path d="M650 312 l8 -14 l8 28 l8 -28 l8 28 l8 -28 l8 28 l8 -14" fill="none" stroke="#dc2626" stroke-width="3"/>
<line x1="706" y1="312" x2="730" y2="312" stroke="#dc2626" stroke-width="3"/>
<polygon points="740,312 730,307 730,317" fill="#dc2626"/>
<text x="690" y="372" font-family="Arial,sans-serif" font-size="15" fill="#991b1b" text-anchor="middle" font-weight="bold">Elastisk energi</text>

<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Energiform betyder hur energin ser ut just nu</text>
</svg>
