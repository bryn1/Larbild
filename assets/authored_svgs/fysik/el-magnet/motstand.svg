<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="36" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Motstånd — bromsar strömmen i hela kretsen</text>

<!-- Closed series circuit loop -->
<rect x="160" y="110" width="480" height="260" rx="6" fill="none" stroke="#1f2937" stroke-width="3"/>

<!-- Battery on the left side -->
<line x1="160" y1="225" x2="160" y2="240" stroke="white" stroke-width="6"/>
<line x1="160" y1="255" x2="160" y2="240" stroke="white" stroke-width="6"/>
<line x1="146" y1="222" x2="174" y2="222" stroke="#1f2937" stroke-width="3"/>
<line x1="153" y1="236" x2="167" y2="236" stroke="#1f2937" stroke-width="6"/>
<line x1="146" y1="250" x2="174" y2="250" stroke="#1f2937" stroke-width="3"/>
<line x1="153" y1="264" x2="167" y2="264" stroke="#1f2937" stroke-width="6"/>
<text x="118" y="245" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">Batteri</text>

<!-- Resistor on the top edge (zigzag) -->
<polyline points="320,110 336,96 356,124 376,96 396,124 416,96 436,124 456,96 472,110" fill="none" stroke="#1f2937" stroke-width="3"/>
<text x="396" y="146" font-family="Arial,sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Motstånd</text>

<!-- Heat cue to the right of the resistor (clear of title) -->
<path d="M 600 116 q 6 -10 0 -18 q -6 -8 0 -16" fill="none" stroke="#dc2626" stroke-width="2"/>
<path d="M 620 116 q 6 -10 0 -18 q -6 -8 0 -16" fill="none" stroke="#dc2626" stroke-width="2"/>
<path d="M 640 116 q 6 -10 0 -18 q -6 -8 0 -16" fill="none" stroke="#dc2626" stroke-width="2"/>
<text x="620" y="158" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">blir varmt</text>

<!-- Current arrows: SAME size all around the loop (series current is equal everywhere) -->
<!-- top, left of resistor -->
<polygon points="270,110 254,104 254,116" fill="#2563eb"/>
<!-- top, right of resistor -->
<polygon points="560,110 544,104 544,116" fill="#2563eb"/>
<!-- right side, going down -->
<polygon points="640,250 634,234 646,234" fill="#2563eb"/>
<!-- bottom, going left -->
<polygon points="380,370 396,364 396,376" fill="#2563eb"/>
<!-- left side, going up -->
<polygon points="160,160 154,176 166,176" fill="#2563eb"/>

<text x="400" y="245" font-family="Arial,sans-serif" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">Strömmen är lika stor</text>
<text x="400" y="266" font-family="Arial,sans-serif" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">runt hela kretsen</text>

<text x="400" y="420" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">Ett motstånd gör det svårare för strömmen att passera —</text>
<text x="400" y="442" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">ju större motstånd (ohm), desto mindre ström i hela kretsen</text>
<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Glödtråden i en lampa är ett motstånd som blir så varmt att det lyser</text>
</svg>
