<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Energi</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Det som behövs för att något ska hända – maten ger oss energi</text>

<!-- SOURCE: food (an apple) -->
<rect x="60" y="195" width="170" height="120" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
<circle cx="145" cy="245" r="26" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>
<rect x="142" y="214" width="6" height="10" fill="#15803d"/>
<path d="M148 218 q14 -6 18 4 q-14 2 -18 -4" fill="#22c55e"/>
<text x="145" y="298" font-family="Arial,sans-serif" font-size="15" fill="#92400e" text-anchor="middle" font-weight="bold">Mat (energi)</text>

<!-- arrow source -> outcomes -->
<line x1="232" y1="255" x2="300" y2="255" stroke="#16a34a" stroke-width="4"/>
<polygon points="314,255 298,247 298,263" fill="#16a34a"/>
<text x="273" y="240" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="bold">energi</text>

<!-- OUTCOME 1: heat (värme) -->
<rect x="340" y="120" width="200" height="80" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<circle cx="378" cy="160" r="16" fill="#dc2626"/>
<line x1="378" y1="138" x2="378" y2="130" stroke="#dc2626" stroke-width="2.5"/>
<line x1="378" y1="182" x2="378" y2="190" stroke="#dc2626" stroke-width="2.5"/>
<line x1="356" y1="160" x2="348" y2="160" stroke="#dc2626" stroke-width="2.5"/>
<line x1="400" y1="160" x2="408" y2="160" stroke="#dc2626" stroke-width="2.5"/>
<text x="470" y="155" font-family="Arial,sans-serif" font-size="15" fill="#991b1b" text-anchor="middle" font-weight="bold">Värme</text>
<text x="470" y="175" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">kroppen håller sig varm</text>

<!-- OUTCOME 2: thinking (tänka) -->
<rect x="340" y="215" width="200" height="80" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<circle cx="378" cy="255" r="17" fill="#c4b5fd" stroke="#7c3aed" stroke-width="2"/>
<path d="M370 250 q4 -8 10 0 q6 -6 8 4" fill="none" stroke="#7c3aed" stroke-width="2"/>
<text x="470" y="250" font-family="Arial,sans-serif" font-size="15" fill="#6d28d9" text-anchor="middle" font-weight="bold">Tänka</text>
<text x="470" y="270" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">hjärnan arbetar</text>

<!-- OUTCOME 3: cycling (cykla) -->
<rect x="340" y="310" width="200" height="80" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<circle cx="368" cy="362" r="14" fill="none" stroke="#16a34a" stroke-width="2.5"/>
<circle cx="408" cy="362" r="14" fill="none" stroke="#16a34a" stroke-width="2.5"/>
<line x1="368" y1="362" x2="388" y2="340" stroke="#16a34a" stroke-width="2.5"/>
<line x1="388" y1="340" x2="408" y2="362" stroke="#16a34a" stroke-width="2.5"/>
<line x1="388" y1="340" x2="368" y2="362" stroke="#16a34a" stroke-width="2.5"/>
<text x="470" y="350" font-family="Arial,sans-serif" font-size="15" fill="#166534" text-anchor="middle" font-weight="bold">Cykla</text>
<text x="470" y="370" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">röra sig (rörelse)</text>

<!-- bracket connecting outcomes -->
<text x="650" y="250" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">Energin</text>
<text x="650" y="270" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">används</text>

<text x="400" y="430" font-family="Arial,sans-serif" font-size="15" fill="#1e40af" text-anchor="middle" font-weight="bold">Energi mäts i joule (J)</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Energi kan inte försvinna – den omvandlas bara från en form till en annan</text>
</svg>
