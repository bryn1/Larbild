<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Jordfelsbrytare</text>
<text x="400" y="78" font-family="Arial,sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Känner av ström som läcker fel väg och stänger av snabbt</text>

<!-- the breaker box -->
<rect x="320" y="110" width="160" height="90" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" rx="6"/>
<text x="400" y="150" font-family="Arial,sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">Jordfelsbrytare</text>
<text x="400" y="175" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">jämför in och ut</text>

<!-- normal: current in == out -->
<line x1="120" y1="240" x2="380" y2="240" stroke="#1f2937" stroke-width="3"/>
<line x1="380" y1="240" x2="380" y2="200" stroke="#1f2937" stroke-width="3"/>
<line x1="420" y1="200" x2="420" y2="240" stroke="#1f2937" stroke-width="3"/>
<line x1="420" y1="240" x2="680" y2="240" stroke="#1f2937" stroke-width="3"/>

<!-- in arrow -->
<line x1="170" y1="223" x2="210" y2="223" stroke="#16a34a" stroke-width="3"/>
<polygon points="222,223 208,217 208,229" fill="#16a34a"/>
<text x="195" y="213" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle">5 A in</text>
<!-- out arrow -->
<line x1="590" y1="223" x2="630" y2="223" stroke="#16a34a" stroke-width="3"/>
<polygon points="642,223 628,217 628,229" fill="#16a34a"/>
<text x="615" y="213" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle">5 A ut</text>
<text x="400" y="280" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle">Lika mycket in som ut → allt OK</text>

<!-- fault: leakage, hair dryer in sink -->
<rect x="300" y="320" width="200" height="60" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5" rx="6"/>
<text x="400" y="345" font-family="Arial,sans-serif" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="bold">Ström läcker ut fel väg</text>
<text x="400" y="367" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">(t.ex. hårtork i handfat)</text>
<!-- leak arrow -->
<line x1="400" y1="300" x2="400" y2="318" stroke="#dc2626" stroke-width="3"/>
<polygon points="400,318 394,306 406,306" fill="#dc2626"/>

<text x="400" y="430" font-family="Arial,sans-serif" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">in ≠ ut → bryter strömmen direkt</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Skyddar mot stöt – reagerar mycket snabbare än en vanlig säkring</text>
</svg>