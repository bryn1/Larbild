<text x="430" y="175" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">strålning genom luften</text>
<circle cx="600" cy="270" r="16" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
<text x="600" y="320" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Känner värmen</text>
<text x="400" y="380" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Energi som rör sig genom luft eller tomrum, t.ex. ljus eller värme</text>
<text x="400" y="408" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Du behöver inte röra vid källan för att känna den</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Strålningsenergi rör sig utan att behöva en ledning</text>
