<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Automatsäkring</text>
<text x="400" y="78" font-family="Arial,sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Bryter strömmen vid för hög ström</text>

<!-- NORMAL: breaker ON, current flows -->
<rect x="90" y="130" width="280" height="220" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="6"/>
<text x="230" y="158" font-family="Arial,sans-serif" font-size="15" fill="#16a34a" text-anchor="middle" font-weight="bold">Normal ström – PÅ</text>
<rect x="180" y="185" width="60" height="90" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="4"/>
<text x="210" y="215" font-family="Arial,sans-serif" font-size="13" fill="#166534" text-anchor="middle">PÅ</text>
<rect x="195" y="225" width="30" height="20" fill="#16a34a" rx="3"/>
<!-- closed circuit line -->
<line x1="110" y1="310" x2="180" y2="310" stroke="#1f2937" stroke-width="3"/>
<line x1="180" y1="310" x2="180" y2="290" stroke="#1f2937" stroke-width="3"/>
<line x1="180" y1="290" x2="240" y2="290" stroke="#1f2937" stroke-width="3"/>
<line x1="240" y1="290" x2="240" y2="310" stroke="#1f2937" stroke-width="3"/>
<line x1="240" y1="310" x2="350" y2="310" stroke="#1f2937" stroke-width="3"/>
<line x1="270" y1="293" x2="300" y2="293" stroke="#dc2626" stroke-width="3"/>
<polygon points="310,293 300,297 300,289" fill="#dc2626"/>
<text x="230" y="335" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle">Strömmen går runt</text>

<!-- OVERLOAD: breaker tripped, broken -->
<rect x="430" y="130" width="280" height="220" fill="#fef2f2" stroke="#dc2626" stroke-width="2" rx="6"/>
<text x="570" y="158" font-family="Arial,sans-serif" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">För mycket ström – AV</text>
<rect x="520" y="185" width="60" height="90" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="4"/>
<text x="550" y="215" font-family="Arial,sans-serif" font-size="13" fill="#991b1b" text-anchor="middle">AV</text>
<rect x="535" y="248" width="30" height="20" fill="#dc2626" rx="3"/>
<!-- broken circuit -->
<line x1="450" y1="310" x2="520" y2="310" stroke="#1f2937" stroke-width="3"/>
<line x1="520" y1="310" x2="520" y2="295" stroke="#1f2937" stroke-width="3"/>
<line x1="580" y1="295" x2="580" y2="310" stroke="#1f2937" stroke-width="3"/>
<line x1="580" y1="310" x2="690" y2="310" stroke="#1f2937" stroke-width="3"/>
<text x="550" y="290" font-family="Arial,sans-serif" font-size="24" fill="#dc2626" text-anchor="middle" font-weight="bold">/</text>
<text x="570" y="335" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">Bruten – strömmen stoppas</text>

<text x="400" y="400" font-family="Arial,sans-serif" font-size="15" fill="#1f2937" text-anchor="middle">För många apparater → för hög ström → säkringen slår ifrån</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">En knapp i elskåpet som bryter strömmen om det går för mycket ström</text>
</svg>