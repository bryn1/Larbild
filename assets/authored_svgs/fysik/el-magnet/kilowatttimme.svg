<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Kilowattimme (kWh) – enhet för energi</text>
<text x="400" y="80" font-family="Arial,sans-serif" font-size="28" fill="#1e40af" text-anchor="middle" font-weight="bold">E = P · t</text>
<text x="400" y="110" font-family="Arial,sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Energi = effekt × tid</text>

<!-- worked example box -->
<rect x="120" y="150" width="560" height="150" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="6"/>
<text x="160" y="185" font-family="Arial,sans-serif" font-size="15" fill="#166534" text-anchor="start" font-weight="bold">Exempel: en värmefläkt</text>
<text x="160" y="220" font-family="Arial,sans-serif" font-size="15" fill="#1f2937" text-anchor="start">Effekt P = 1 kW (1000 W)</text>
<text x="160" y="250" font-family="Arial,sans-serif" font-size="15" fill="#1f2937" text-anchor="start">Tid t = 1 timme</text>
<text x="160" y="285" font-family="Arial,sans-serif" font-size="18" fill="#16a34a" text-anchor="start" font-weight="bold">E = 1 kW · 1 h = 1 kWh</text>

<!-- visual: 1 kW lamp on for 1 hour -->
<rect x="250" y="330" width="120" height="50" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
<text x="310" y="362" font-family="Arial,sans-serif" font-size="14" fill="#b45309" text-anchor="middle">1 kW</text>
<line x1="380" y1="355" x2="430" y2="355" stroke="#6b7280" stroke-width="2"/>
<polygon points="442,355 428,349 428,361" fill="#6b7280"/>
<rect x="450" y="330" width="120" height="50" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="4"/>
<text x="510" y="362" font-family="Arial,sans-serif" font-size="14" fill="#2563eb" text-anchor="middle">i 1 timme</text>

<text x="400" y="425" font-family="Arial,sans-serif" font-size="15" fill="#1f2937" text-anchor="middle">Elräkningen hemma räknas i kilowattimmar (kWh)</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">1 kWh är energin när 1 kilowatt används under en hel timme</text>
</svg>