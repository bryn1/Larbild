<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Komponent i en krets</text>
<text x="400" y="78" font-family="Arial,sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">En liten del i en elektrisk krets – var och en har sin uppgift</text>

<!-- closed circuit rectangle -->
<line x1="200" y1="160" x2="600" y2="160" stroke="#1f2937" stroke-width="3"/>
<line x1="600" y1="160" x2="600" y2="360" stroke="#1f2937" stroke-width="3"/>
<line x1="600" y1="360" x2="200" y2="360" stroke="#1f2937" stroke-width="3"/>
<line x1="200" y1="360" x2="200" y2="160" stroke="#1f2937" stroke-width="3"/>

<!-- battery component (left side) -->
<rect x="170" y="235" width="60" height="50" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5" rx="3"/>
<text x="200" y="265" font-family="Arial,sans-serif" font-size="14" fill="#92400e" text-anchor="middle">+   −</text>
<text x="200" y="310" font-family="Arial,sans-serif" font-size="13" fill="#b45309" text-anchor="middle" font-weight="bold">Batteri</text>
<text x="200" y="328" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">ger energi</text>

<!-- switch component (top) -->
<circle cx="370" cy="160" r="5" fill="#1f2937"/>
<circle cx="430" cy="160" r="5" fill="#1f2937"/>
<line x1="370" y1="160" x2="425" y2="140" stroke="#16a34a" stroke-width="3"/>
<text x="400" y="120" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="bold">Brytare</text>
<text x="400" y="103" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">slår på/av</text>

<!-- lamp component (right) -->
<circle cx="600" cy="260" r="26" fill="#fff7ed" stroke="#f59e0b" stroke-width="2.5"/>
<line x1="590" y1="250" x2="610" y2="270" stroke="#f59e0b" stroke-width="2"/>
<line x1="610" y1="250" x2="590" y2="270" stroke="#f59e0b" stroke-width="2"/>
<text x="665" y="256" font-family="Arial,sans-serif" font-size="13" fill="#b45309" text-anchor="middle" font-weight="bold">Lampa</text>
<text x="665" y="274" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">lyser</text>

<!-- current arrow -->
<line x1="280" y1="160" x2="320" y2="160" stroke="#dc2626" stroke-width="3"/>
<polygon points="332,160 318,154 318,166" fill="#dc2626"/>
<text x="306" y="148" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">ström</text>

<text x="400" y="415" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">Batteri, brytare och lampa är alla komponenter i kretsen</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Inuti en ficklampa sitter flera komponenter, bland annat lampan och brytaren</text>
</svg>