<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Elmotor</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Ström i en spole mellan magneter ger rörelse (el → rörelse)</text>

<!-- N magnet (left) -->
<rect x="110" y="160" width="60" height="160" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
<text x="140" y="248" font-family="Arial,sans-serif" font-size="30" fill="white" text-anchor="middle" font-weight="bold">N</text>
<!-- S magnet (right) -->
<rect x="500" y="160" width="60" height="160" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
<text x="530" y="248" font-family="Arial,sans-serif" font-size="30" fill="white" text-anchor="middle" font-weight="bold">S</text>

<!-- field lines N -> S between magnets (straight, 3) -->
<line x1="175" y1="200" x2="495" y2="200" stroke="#9ca3af" stroke-width="1.5"/>
<polygon points="340,200 330,196.5 330,203.5" fill="#9ca3af"/>
<line x1="175" y1="280" x2="495" y2="280" stroke="#9ca3af" stroke-width="1.5"/>
<polygon points="340,280 330,276.5 330,283.5" fill="#9ca3af"/>

<!-- rotating coil (rectangle loop) in the middle -->
<rect x="290" y="190" width="100" height="100" fill="none" stroke="#b45309" stroke-width="4"/>
<!-- axle -->
<line x1="340" y1="160" x2="340" y2="190" stroke="#6b7280" stroke-width="3"/>
<line x1="340" y1="290" x2="340" y2="320" stroke="#6b7280" stroke-width="3"/>
<text x="340" y="148" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">spole (lindad tråd)</text>

<!-- rotation arrow -->
<path d="M408 215 A40 40 0 0 1 408 265" fill="none" stroke="#16a34a" stroke-width="3"/>
<polygon points="408,265 400,255 414,253" fill="#16a34a"/>
<text x="445" y="245" font-family="Arial,sans-serif" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="bold">snurrar</text>

<!-- leads down to battery -->
<line x1="290" y1="290" x2="290" y2="390" stroke="#b45309" stroke-width="3"/>
<line x1="290" y1="390" x2="350" y2="390" stroke="#b45309" stroke-width="3"/>
<line x1="390" y1="290" x2="390" y2="390" stroke="#b45309" stroke-width="3"/>
<line x1="390" y1="390" x2="450" y2="390" stroke="#b45309" stroke-width="3"/>
<!-- close the loop along the bottom is wrong; battery sits between the two leads -->

<!-- BATTERY symbol between the two bottom leads -->
<line x1="358" y1="368" x2="358" y2="412" stroke="#1f2937" stroke-width="3"/>
<line x1="382" y1="378" x2="382" y2="402" stroke="#1f2937" stroke-width="6"/>
<text x="351" y="358" font-family="Arial,sans-serif" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold">+</text>
<text x="389" y="358" font-family="Arial,sans-serif" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold">−</text>
<text x="450" y="395" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">batteri</text>

<!-- current direction arrows on leads -->
<polygon points="290,345 286,335 294,335" fill="#dc2626"/>
<text x="270" y="345" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="end">ström</text>

<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">En elmotor gör om elektrisk energi till rörelse</text>
</svg>
