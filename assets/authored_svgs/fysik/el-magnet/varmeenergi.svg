<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Värmeenergi</text>
<rect x="160" y="230" width="120" height="90" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="220" y="215" font-family="Arial,sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold">Varmt</text>
<path d="M 190 225 q 7 -12 0 -22 q -7 -10 0 -20" fill="none" stroke="#dc2626" stroke-width="2"/>
<path d="M 220 225 q 7 -12 0 -22 q -7 -10 0 -20" fill="none" stroke="#dc2626" stroke-width="2"/>
<path d="M 250 225 q 7 -12 0 -22 q -7 -10 0 -20" fill="none" stroke="#dc2626" stroke-width="2"/>
<circle cx="185" cy="300" r="5" fill="#dc2626"/>
<circle cx="215" cy="270" r="5" fill="#dc2626"/>
<circle cx="250" cy="305" r="5" fill="#dc2626"/>
<circle cx="230" cy="290" r="5" fill="#dc2626"/>
<circle cx="200" cy="280" r="5" fill="#dc2626"/>
<circle cx="255" cy="275" r="5" fill="#dc2626"/>
<text x="220" y="345" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">partiklar rör sig snabbt</text>
<rect x="520" y="230" width="120" height="90" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="580" y="215" font-family="Arial,sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">Kallt</text>
<circle cx="545" cy="300" r="5" fill="#2563eb"/>
<circle cx="575" cy="290" r="5" fill="#2563eb"/>
<circle cx="610" cy="305" r="5" fill="#2563eb"/>
<circle cx="560" cy="280" r="5" fill="#2563eb"/>
<text x="580" y="345" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">partiklar rör sig långsamt</text>
<line x1="290.0" y1="275.0" x2="497.0" y2="275.0" stroke="#dc2626" stroke-width="3"/>
<polygon points="510.0,275.0 497.0,280.5 497.0,269.5" fill="#dc2626"/>
<text x="400" y="265" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">värme flyttar från varmt till kallt</text>
<text x="400" y="400" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Ju varmare en sak är, desto mer värmeenergi har den lagrad</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Värmeenergi finns i något varmt</text>
