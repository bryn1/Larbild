<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Elektrisk potential (spänning U)</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Skillnaden mellan polernas laddning är spänningen som driver strömmen</text>

<!-- battery drawn as a box split into two chambers -->
<rect x="150" y="120" width="500" height="240" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/>
<text x="400" y="148" font-family="Arial,sans-serif" font-size="16" fill="#92400e" text-anchor="middle" font-weight="bold">Batteri – två rum</text>
<!-- divider -->
<line x1="400" y1="160" x2="400" y2="345" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,5"/>

<!-- LEFT chamber: MINUS pole, MANY electrons -->
<rect x="170" y="165" width="210" height="175" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="275" y="190" font-family="Arial,sans-serif" font-size="22" fill="#2563eb" text-anchor="middle" font-weight="bold">− pol</text>
<text x="275" y="210" font-family="Arial,sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">många elektroner</text>
<!-- many e- dots (5 x 4 grid) -->
<g fill="#2563eb">
<circle cx="200" cy="235" r="9"/><circle cx="237" cy="235" r="9"/><circle cx="274" cy="235" r="9"/><circle cx="311" cy="235" r="9"/><circle cx="348" cy="235" r="9"/>
<circle cx="200" cy="268" r="9"/><circle cx="237" cy="268" r="9"/><circle cx="274" cy="268" r="9"/><circle cx="311" cy="268" r="9"/><circle cx="348" cy="268" r="9"/>
<circle cx="200" cy="301" r="9"/><circle cx="237" cy="301" r="9"/><circle cx="274" cy="301" r="9"/><circle cx="311" cy="301" r="9"/><circle cx="348" cy="301" r="9"/>
</g>
<g font-family="Arial,sans-serif" font-size="8" fill="white" text-anchor="middle">
<text x="200" y="238">e-</text><text x="237" y="238">e-</text><text x="274" y="238">e-</text><text x="311" y="238">e-</text><text x="348" y="238">e-</text>
<text x="200" y="271">e-</text><text x="237" y="271">e-</text><text x="274" y="271">e-</text><text x="311" y="271">e-</text><text x="348" y="271">e-</text>
<text x="200" y="304">e-</text><text x="237" y="304">e-</text><text x="274" y="304">e-</text><text x="311" y="304">e-</text><text x="348" y="304">e-</text>
</g>

<!-- RIGHT chamber: PLUS pole, FEW electrons -->
<rect x="420" y="165" width="210" height="175" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="525" y="190" font-family="Arial,sans-serif" font-size="22" fill="#dc2626" text-anchor="middle" font-weight="bold">+ pol</text>
<text x="525" y="210" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">få elektroner</text>
<!-- few e- dots (only 3) -->
<g fill="#2563eb">
<circle cx="470" cy="250" r="9"/><circle cx="560" cy="270" r="9"/><circle cx="510" cy="305" r="9"/>
</g>
<g font-family="Arial,sans-serif" font-size="8" fill="white" text-anchor="middle">
<text x="470" y="253">e-</text><text x="560" y="273">e-</text><text x="510" y="308">e-</text>
</g>

<!-- the difference = voltage -->
<text x="400" y="400" font-family="Arial,sans-serif" font-size="16" fill="#1e40af" text-anchor="middle" font-weight="bold">Skillnaden i antal elektroner = spänning U (volt)</text>
<text x="400" y="428" font-family="Arial,sans-serif" font-size="14" fill="#16a34a" text-anchor="middle">Ju större skillnad, desto högre spänning</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Elektronerna vill flytta från det fulla rummet (−) till det tomma (+)</text>
</svg>
