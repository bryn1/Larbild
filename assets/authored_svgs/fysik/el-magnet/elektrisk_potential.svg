<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Elektrisk potential</text>
<text x="400" y="78" font-family="Arial,sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Skillnaden i potential (spänning) driver strömmen</text>

<!-- battery body -->
<rect x="120" y="190" width="120" height="140" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5" rx="4"/>
<text x="180" y="170" font-family="Arial,sans-serif" font-size="14" fill="#92400e" text-anchor="middle" font-weight="bold">Batteri</text>
<!-- + pole high potential -->
<rect x="160" y="170" width="40" height="20" fill="#dc2626" rx="2"/>
<text x="180" y="186" font-family="Arial,sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">+</text>
<text x="280" y="215" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">hög potential (+)</text>
<text x="280" y="320" font-family="Arial,sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">låg potential (−)</text>

<!-- circuit wires to a lamp -->
<line x1="200" y1="170" x2="200" y2="120" stroke="#1f2937" stroke-width="3"/>
<line x1="200" y1="120" x2="600" y2="120" stroke="#1f2937" stroke-width="3"/>
<line x1="600" y1="120" x2="600" y2="200" stroke="#1f2937" stroke-width="3"/>
<line x1="600" y1="260" x2="600" y2="370" stroke="#1f2937" stroke-width="3"/>
<line x1="600" y1="370" x2="180" y2="370" stroke="#1f2937" stroke-width="3"/>
<line x1="180" y1="370" x2="180" y2="330" stroke="#1f2937" stroke-width="3"/>

<!-- lamp (ficklampa) -->
<circle cx="600" cy="230" r="28" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
<line x1="590" y1="220" x2="610" y2="240" stroke="#f59e0b" stroke-width="2"/>
<line x1="610" y1="220" x2="590" y2="240" stroke="#f59e0b" stroke-width="2"/>
<text x="660" y="235" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Ficklampa</text>

<!-- current arrow -->
<line x1="360" y1="120" x2="420" y2="120" stroke="#dc2626" stroke-width="3"/>
<polygon points="432,120 418,114 418,126" fill="#dc2626"/>
<text x="395" y="108" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">ström</text>

<text x="400" y="425" font-family="Arial,sans-serif" font-size="15" fill="#1e40af" text-anchor="middle" font-weight="bold">Potentialskillnad = spänning (U), mäts i volt</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Skillnaden mellan plus- och minuspol driver strömmen genom kretsen</text>
</svg>