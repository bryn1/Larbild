<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Attrahera – dra till sig</text>
<text x="400" y="78" font-family="Arial,sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Olika poler dras mot varandra</text>

<!-- left magnet N (red) | S (blue) -->
<rect x="120" y="200" width="100" height="70" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
<rect x="220" y="200" width="100" height="70" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
<text x="170" y="245" font-family="Arial,sans-serif" font-size="28" fill="white" text-anchor="middle" font-weight="bold">N</text>
<text x="270" y="245" font-family="Arial,sans-serif" font-size="28" fill="white" text-anchor="middle" font-weight="bold">S</text>

<!-- right magnet N (red) | S (blue) -->
<rect x="480" y="200" width="100" height="70" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
<rect x="580" y="200" width="100" height="70" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
<text x="530" y="245" font-family="Arial,sans-serif" font-size="28" fill="white" text-anchor="middle" font-weight="bold">N</text>
<text x="630" y="245" font-family="Arial,sans-serif" font-size="28" fill="white" text-anchor="middle" font-weight="bold">S</text>

<!-- attraction arrows pointing toward the gap -->
<line x1="340" y1="235" x2="400" y2="235" stroke="#16a34a" stroke-width="4"/>
<polygon points="410,235 398,240 398,230" fill="#16a34a"/>
<line x1="460" y1="235" x2="400" y2="235" stroke="#16a34a" stroke-width="4"/>
<polygon points="390,235 402,230 402,240" fill="#16a34a"/>
<text x="400" y="185" font-family="Arial,sans-serif" font-size="15" fill="#16a34a" text-anchor="middle" font-weight="bold">Dras ihop</text>

<text x="170" y="300" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Sydpol (S)</text>
<text x="630" y="300" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Nordpol (N)</text>
<text x="400" y="360" font-family="Arial,sans-serif" font-size="15" fill="#1f2937" text-anchor="middle">S + N = attraherar (utan att röra varandra)</text>

<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Olika poler – och plus och minus – attraherar, dvs. drar varandra närmare</text>
</svg>