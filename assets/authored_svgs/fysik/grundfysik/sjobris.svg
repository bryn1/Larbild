<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Sjöbris</text>
<!-- sky -->
<rect x="40" y="55" width="720" height="320" fill="#eff6ff"/>
<!-- sun over land -->
<circle cx="600" cy="100" r="30" fill="#fde047" stroke="#f59e0b" stroke-width="2"/>
<line x1="600" y1="55" x2="600" y2="40" stroke="#f59e0b" stroke-width="3"/>
<line x1="640" y1="80" x2="655" y2="70" stroke="#f59e0b" stroke-width="3"/>
<line x1="640" y1="120" x2="655" y2="130" stroke="#f59e0b" stroke-width="3"/>
<!-- sea (left) -->
<rect x="40" y="330" width="360" height="45" fill="#3b82f6"/>
<path d="M 60 332 q 15 -6 30 0 q 15 6 30 0 q 15 -6 30 0 q 15 6 30 0 q 15 -6 30 0 q 15 6 30 0 q 15 -6 30 0 q 15 6 30 0" fill="none" stroke="#1e40af" stroke-width="2"/>
<text x="210" y="360" font-family="Arial,sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">HAV (svalt)</text>
<!-- land (right) -->
<rect x="400" y="330" width="360" height="45" fill="#ca8a04"/>
<rect x="400" y="320" width="360" height="12" fill="#16a34a"/>
<text x="580" y="360" font-family="Arial,sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">LAND (varmt)</text>
<!-- warm air rising over land (red, up) -->
<line x1="560" y1="315" x2="560" y2="150" stroke="#dc2626" stroke-width="4"/>
<polygon points="560,138 552,156 568,156" fill="#dc2626"/>
<line x1="610" y1="315" x2="610" y2="170" stroke="#dc2626" stroke-width="4"/>
<polygon points="610,158 602,176 618,176" fill="#dc2626"/>
<text x="640" y="240" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="start">varm luft</text>
<text x="640" y="258" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="start">stiger</text>
<!-- cool sea air flowing in toward land at low level (blue, the sjöbris) -->
<line x1="120" y1="300" x2="500" y2="300" stroke="#2563eb" stroke-width="5"/>
<polygon points="515,300 497,292 497,308" fill="#2563eb"/>
<text x="300" y="290" font-family="Arial,sans-serif" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">Sjöbris — sval vind in mot land</text>
<!-- return flow up high (land -> sea) -->
<line x1="600" y1="120" x2="180" y2="120" stroke="#93c5fd" stroke-width="3" stroke-dasharray="7,5"/>
<polygon points="168,120 186,113 186,127" fill="#93c5fd"/>
<!-- down over sea -->
<line x1="180" y1="125" x2="180" y2="280" stroke="#93c5fd" stroke-width="3" stroke-dasharray="7,5"/>
<polygon points="180,290 172,273 188,273" fill="#93c5fd"/>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Solen värmer landet snabbare; varm luft stiger och sval havsluft strömmar in</text>
</svg>