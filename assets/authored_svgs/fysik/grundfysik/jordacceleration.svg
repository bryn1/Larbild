<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Jordacceleration (g ≈ 9,82 m/s²)</text>

<!-- ground -->
<rect x="0" y="420" width="800" height="80" fill="#86efac"/>
<line x1="0" y1="420" x2="800" y2="420" stroke="#15803d" stroke-width="2"/>

<!-- balcony / start -->
<rect x="155" y="95" width="90" height="18" fill="#9ca3af" stroke="#1f2937" stroke-width="1.5"/>
<text x="200" y="88" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">släpps här</text>

<!-- vertical fall path (faint) -->
<line x1="200" y1="113" x2="200" y2="418" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>

<!-- t = 1 s : fallen 1 unit -->
<circle cx="200" cy="140" r="13" fill="#6b7280" stroke="#1f2937" stroke-width="1.5"/>
<text x="225" y="144" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">t = 1 s</text>
<line x1="200" y1="153" x2="200" y2="170" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="200,179 195.9,170 204.1,170" fill="#dc2626"/>

<!-- t = 2 s : fallen 4 units (bigger gap, faster) -->
<circle cx="200" cy="230" r="13" fill="#6b7280" stroke="#1f2937" stroke-width="1.5"/>
<text x="225" y="234" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">t = 2 s</text>
<line x1="200" y1="243" x2="200" y2="278" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="200,287 195.9,278 204.1,278" fill="#dc2626"/>

<!-- t = 3 s : fallen 9 units (biggest gap, fastest) -->
<circle cx="200" cy="380" r="13" fill="#6b7280" stroke="#1f2937" stroke-width="1.5"/>
<text x="225" y="384" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">t = 3 s</text>
<line x1="200" y1="393" x2="200" y2="414" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="200,418 195.9,409 204.1,409" fill="#dc2626"/>

<!-- "farten ökar" bracket on the right of the path -->
<text x="300" y="270" font-family="Arial,sans-serif" font-size="14" fill="#dc2626" text-anchor="start" font-weight="bold">farten ökar</text>
<text x="300" y="290" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="start">för varje sekund</text>

<!-- info box -->
<rect x="450" y="120" width="320" height="150" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="610" y="150" font-family="Arial,sans-serif" font-size="15" fill="#92400e" text-anchor="middle" font-weight="bold">Jordacceleration</text>
<text x="610" y="182" font-family="Arial,sans-serif" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="bold">g ≈ 9,82 m/s²</text>
<text x="610" y="212" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Efter 1 s: ca 9,8 m/s</text>
<text x="610" y="234" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Efter 2 s: ca 19,6 m/s</text>
<text x="610" y="256" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Efter 3 s: ca 29,5 m/s</text>

<text x="540" y="360" font-family="Arial,sans-serif" font-size="13" fill="#14532d" text-anchor="middle">Avstånden mellan lägena blir större —</text>
<text x="540" y="382" font-family="Arial,sans-serif" font-size="13" fill="#14532d" text-anchor="middle">föremålet faller snabbare och snabbare</text>

<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Jordaccelerationen är hur snabbt ett fallande föremål ökar farten</text>
</svg>
