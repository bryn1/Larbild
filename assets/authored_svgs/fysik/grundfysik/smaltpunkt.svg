<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Smältpunkt — olika för olika ämnen</text>
<!-- vertical temperature axis -->
<line x1="150" y1="100" x2="150" y2="400" stroke="#1f2937" stroke-width="3"/>
<polygon points="150,90 144,105 156,105" fill="#1f2937"/>
<text x="120" y="95" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">°C</text>
<!-- ticks -->
<line x1="143" y1="360" x2="157" y2="360" stroke="#1f2937" stroke-width="2"/>
<text x="135" y="365" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="end">0</text>
<line x1="143" y1="290" x2="157" y2="290" stroke="#1f2937" stroke-width="2"/>
<text x="135" y="295" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="end">100</text>
<line x1="143" y1="200" x2="157" y2="200" stroke="#1f2937" stroke-width="2"/>
<text x="135" y="205" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="end">660</text>
<line x1="143" y1="130" x2="157" y2="130" stroke="#1f2937" stroke-width="2"/>
<text x="135" y="135" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="end">1538</text>
<!-- substances as markers at their melting point -->
<!-- smör ~32 C (just above 0 tick) -->
<circle cx="320" cy="340" r="11" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
<line x1="150" y1="345" x2="320" y2="340" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="345" y="345" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="start">Smör ≈ 32 °C</text>
<!-- is 0 C -->
<circle cx="320" cy="360" r="11" fill="#bfdbfe" stroke="#1e40af" stroke-width="2"/>
<line x1="150" y1="360" x2="320" y2="360" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="345" y="380" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="start">Is (vatten) = 0 °C</text>
<!-- aluminium 660 -->
<circle cx="450" cy="200" r="11" fill="#d1d5db" stroke="#6b7280" stroke-width="2"/>
<line x1="150" y1="200" x2="450" y2="200" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="475" y="205" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="start">Aluminium ≈ 660 °C</text>
<!-- järn 1538 -->
<circle cx="540" cy="130" r="11" fill="#6b7280" stroke="#374151" stroke-width="2"/>
<line x1="150" y1="130" x2="540" y2="130" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="565" y="135" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="start">Järn ≈ 1538 °C</text>
<!-- explanatory bracket -->
<text x="400" y="435" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">Smältpunkten är temperaturen då ett ämne börjar bli flytande</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Varje ämne har sin egen smältpunkt — smör smälter långt före järn</text>
</svg>