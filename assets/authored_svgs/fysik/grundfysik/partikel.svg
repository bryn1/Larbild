<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Partikel — en mycket liten bit</text>
<!-- sunbeam with dust particles (left) -->
<polygon points="90,90 230,90 270,330 130,330" fill="#fef9c3" opacity="0.7"/>
<text x="180" y="80" font-family="Arial,sans-serif" font-size="13" fill="#92400e" text-anchor="middle">Dammkorn i solljus</text>
<circle cx="150" cy="140" r="4" fill="#92400e"/><circle cx="200" cy="170" r="3" fill="#92400e"/><circle cx="165" cy="210" r="5" fill="#92400e"/>
<circle cx="220" cy="230" r="3" fill="#92400e"/><circle cx="140" cy="260" r="4" fill="#92400e"/><circle cx="195" cy="290" r="4" fill="#92400e"/>
<circle cx="240" cy="280" r="3" fill="#92400e"/><circle cx="170" cy="310" r="4" fill="#92400e"/>
<!-- magnifier lens over one dust grain -->
<circle cx="195" cy="290" r="38" fill="none" stroke="#374151" stroke-width="3"/>
<line x1="222" y1="317" x2="255" y2="350" stroke="#374151" stroke-width="6"/>
<!-- zoom arrow to the right showing it gets even smaller (atom) -->
<line x1="320" y1="230" x2="430" y2="230" stroke="#16a34a" stroke-width="3" stroke-dasharray="8,5"/>
<polygon points="445,230 428,238 428,222" fill="#16a34a"/>
<text x="382" y="218" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle">ännu mindre</text>
<!-- atom (right) -->
<circle cx="600" cy="230" r="85" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,4"/>
<circle cx="600" cy="230" r="22" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="600" y="235" font-family="Arial,sans-serif" font-size="11" fill="#92400e" text-anchor="middle">kärna</text>
<circle cx="685" cy="230" r="8" fill="#2563eb"/>
<circle cx="600" cy="145" r="8" fill="#2563eb"/>
<circle cx="540" cy="290" r="8" fill="#2563eb"/>
<text x="600" y="345" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Atom</text>
<text x="400" y="400" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">Både dammkorn och atomer är partiklar — olika små bitar</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">En partikel är en mycket liten bit av något, ofta för liten att se</text>
</svg>