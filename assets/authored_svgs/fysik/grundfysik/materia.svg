<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Materia — har massa och tar plats</text>
<!-- LEFT box: is matter -->
<rect x="60" y="80" width="430" height="330" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="6"/>
<text x="275" y="110" font-family="Arial,sans-serif" font-size="16" fill="#16a34a" text-anchor="middle" font-weight="bold">Materia</text>
<text x="275" y="132" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle">har massa + tar plats</text>
<!-- solid: stone -->
<polygon points="120,200 165,185 195,215 175,245 130,240" fill="#6b7280" stroke="#374151" stroke-width="2"/>
<text x="155" y="270" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Sten (fast)</text>
<!-- liquid: glass of water -->
<path d="M 250 180 L 320 180 L 312 250 L 258 250 Z" fill="#bfdbfe" stroke="#1e40af" stroke-width="2"/>
<text x="285" y="270" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Vatten (vätska)</text>
<!-- gas: balloon -->
<ellipse cx="410" cy="210" rx="35" ry="42" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
<path d="M 410 252 l -5 12 l 10 0 z" fill="#dc2626"/>
<text x="410" y="285" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Luft (gas)</text>
<text x="275" y="350" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">Fast, vätska och gas</text>
<text x="275" y="375" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle">Allt detta är materia</text>
<!-- RIGHT box: NOT matter -->
<rect x="520" y="80" width="220" height="330" fill="#fefce8" stroke="#9ca3af" stroke-width="2" rx="6"/>
<text x="630" y="110" font-family="Arial,sans-serif" font-size="16" fill="#6b7280" text-anchor="middle" font-weight="bold">Inte materia</text>
<!-- lamp emitting light rays -->
<circle cx="630" cy="200" r="28" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
<line x1="630" y1="160" x2="630" y2="140" stroke="#f59e0b" stroke-width="3"/>
<line x1="668" y1="178" x2="688" y2="165" stroke="#f59e0b" stroke-width="3"/>
<line x1="592" y1="178" x2="572" y2="165" stroke="#f59e0b" stroke-width="3"/>
<line x1="660" y1="228" x2="678" y2="245" stroke="#f59e0b" stroke-width="3"/>
<line x1="600" y1="228" x2="582" y2="245" stroke="#f59e0b" stroke-width="3"/>
<text x="630" y="285" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Ljus</text>
<text x="630" y="345" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Ljus väger inget</text>
<text x="630" y="368" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">och tar ingen plats</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Materia är allt som har massa och tar plats — ljus är inte materia</text>
</svg>