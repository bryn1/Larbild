<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Volym (hur mycket plats något tar upp)</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Volym mäts i liter (l) eller kubikmeter (m³)</text>

<!-- LEFT: a measuring jug with liquid, scale in dl/l -->
<path d="M 130 150 L 130 360 Q 130 380 150 380 L 270 380 Q 290 380 290 360 L 290 150" fill="none" stroke="#374151" stroke-width="3"/>
<!-- liquid filled to 1 liter -->
<path d="M 132 230 L 132 360 Q 132 378 150 378 L 270 378 Q 288 378 288 360 L 288 230 Z" fill="#bfdbfe" stroke="none"/>
<line x1="132" y1="230" x2="288" y2="230" stroke="#2563eb" stroke-width="2"/>
<!-- scale ticks -->
<line x1="290" y1="200" x2="310" y2="200" stroke="#374151" stroke-width="1.5"/><text x="318" y="205" font-family="Arial,sans-serif" font-size="12" fill="#374151" text-anchor="start">1,5 l</text>
<line x1="290" y1="230" x2="312" y2="230" stroke="#374151" stroke-width="2"/><text x="320" y="235" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="start" font-weight="bold">1 l</text>
<line x1="290" y1="290" x2="310" y2="290" stroke="#374151" stroke-width="1.5"/><text x="318" y="295" font-family="Arial,sans-serif" font-size="12" fill="#374151" text-anchor="start">5 dl</text>
<text x="210" y="140" font-family="Arial,sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">Vätska — 1 liter</text>
<text x="210" y="410" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Mätbägare</text>

<!-- RIGHT: a cube showing volume = side³ -->
<!-- front face -->
<rect x="470" y="220" width="130" height="130" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
<!-- top face (parallelogram) -->
<polygon points="470,220 520,175 650,175 600,220" fill="#fde68a" stroke="#b45309" stroke-width="2.5"/>
<!-- right face -->
<polygon points="600,220 650,175 650,305 600,350" fill="#fcd34d" stroke="#b45309" stroke-width="2.5"/>
<!-- edge length labels -->
<line x1="470" y1="365" x2="600" y2="365" stroke="#16a34a" stroke-width="1.5"/>
<line x1="470" y1="358" x2="470" y2="372" stroke="#16a34a" stroke-width="1.5"/>
<line x1="600" y1="358" x2="600" y2="372" stroke="#16a34a" stroke-width="1.5"/>
<text x="535" y="385" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle">1 dm</text>
<line x1="665" y1="175" x2="665" y2="305" stroke="#16a34a" stroke-width="1.5"/>
<text x="690" y="245" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle">1 dm</text>
<text x="560" y="290" font-family="Arial,sans-serif" font-size="14" fill="#b45309" text-anchor="middle" font-weight="bold">1 dm³</text>
<text x="560" y="155" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Kub: volym = sida × sida × sida</text>

<!-- equivalence note -->
<rect x="160" y="425" width="480" height="40" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
<text x="400" y="450" font-family="Arial,sans-serif" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="bold">1 liter = 1 dm³ = 1000 cm³</text>

<text x="400" y="490" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Volymen säger hur mycket plats ett föremål eller en vätska tar upp</text>
</svg>
