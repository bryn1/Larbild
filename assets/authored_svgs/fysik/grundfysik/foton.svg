<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Foton (en energibit av ljus)</text>

<!-- Sun (left) -->
<circle cx="120" cy="220" r="42" fill="#f59e0b"/>
<line x1="120" y1="160" x2="120" y2="142" stroke="#f59e0b" stroke-width="3"/>
<line x1="120" y1="298" x2="120" y2="280" stroke="#f59e0b" stroke-width="3"/>
<line x1="60" y1="220" x2="42" y2="220" stroke="#f59e0b" stroke-width="3"/>
<line x1="78" y1="178" x2="65" y2="165" stroke="#f59e0b" stroke-width="3"/>
<line x1="162" y1="178" x2="175" y2="165" stroke="#f59e0b" stroke-width="3"/>
<line x1="78" y1="262" x2="65" y2="275" stroke="#f59e0b" stroke-width="3"/>
<line x1="162" y1="262" x2="175" y2="275" stroke="#f59e0b" stroke-width="3"/>
<text x="120" y="320" font-family="Arial,sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="bold">Solen</text>

<!-- wavy light ray from sun toward the face -->
<path d="M 170 220 Q 188 206 206 220 Q 224 234 242 220 Q 260 206 278 220 Q 296 234 314 220 Q 332 206 350 220 Q 368 234 386 220 Q 404 206 422 220 Q 440 234 458 220 Q 476 206 494 220" fill="none" stroke="#f59e0b" stroke-width="3"/>
<line x1="488" y1="220" x2="506" y2="220" stroke="#f59e0b" stroke-width="3"/>
<polygon points="518,220 506,225.4 506,214.6" fill="#f59e0b"/>

<!-- photon packet on the ray -->
<circle cx="332" cy="220" r="13" fill="#f59e0b" stroke="#92400e" stroke-width="2"/>
<text x="332" y="225" font-family="Arial,sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">γ</text>
<text x="332" y="185" font-family="Arial,sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="bold">foton</text>

<!-- a clear face the light reaches -->
<circle cx="615" cy="220" r="62" fill="#fcd9b8" stroke="#d6a06a" stroke-width="2.5"/>
<!-- hair -->
<path d="M 558 195 Q 615 130 672 195 Q 660 168 615 162 Q 570 168 558 195 Z" fill="#92400e"/>
<!-- eyebrows -->
<path d="M 583 198 Q 595 192 607 198" fill="none" stroke="#5b3a1a" stroke-width="2.5"/>
<path d="M 623 198 Q 635 192 647 198" fill="none" stroke="#5b3a1a" stroke-width="2.5"/>
<!-- eyes -->
<circle cx="595" cy="212" r="7" fill="white" stroke="#1f2937" stroke-width="1.5"/>
<circle cx="595" cy="212" r="3.5" fill="#1f2937"/>
<circle cx="635" cy="212" r="7" fill="white" stroke="#1f2937" stroke-width="1.5"/>
<circle cx="635" cy="212" r="3.5" fill="#1f2937"/>
<!-- nose -->
<path d="M 615 218 L 611 234 L 619 234" fill="none" stroke="#b07a4a" stroke-width="2"/>
<!-- smiling mouth -->
<path d="M 593 248 Q 615 266 637 248" fill="none" stroke="#9b3a2a" stroke-width="2.5"/>
<!-- warm cheek where the photon lands -->
<circle cx="572" cy="240" r="11" fill="#fca5a5" fill-opacity="0.8"/>
<text x="615" y="312" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">kinden värms av ljuset</text>

<!-- info box -->
<rect x="220" y="345" width="360" height="56" rx="6" fill="white" stroke="#f59e0b" stroke-width="2"/>
<text x="400" y="368" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Rör sig jättesnabbt (ljusets fart)</text>
<text x="400" y="389" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Väger ingenting — massa = 0</text>

<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">En foton är en liten energibit av ljus utan massa</text>
</svg>
