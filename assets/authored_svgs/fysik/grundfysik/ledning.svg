<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Ledning av värme</text>
<!-- metal bar -->
<defs>
<linearGradient id="heatgrad" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#dc2626"/>
<stop offset="0.5" stop-color="#f59e0b"/>
<stop offset="1" stop-color="#dbeafe"/>
</linearGradient>
</defs>
<rect x="130" y="220" width="540" height="60" fill="url(#heatgrad)" stroke="#374151" stroke-width="2" rx="4"/>
<text x="400" y="205" font-family="Arial,sans-serif" font-size="14" fill="#374151" text-anchor="middle">Metallstav (t.ex. stekpannans skaft)</text>
<!-- flame at left (heat source) -->
<path d="M 100 320 q -10 -30 5 -45 q 5 15 10 5 q 8 18 -2 40 Z" fill="#dc2626"/>
<path d="M 102 318 q -6 -20 4 -32 q 3 12 7 3 q 5 14 -3 29 Z" fill="#f59e0b"/>
<text x="100" y="350" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">Värme</text>
<!-- particles in bar vibrating, passing energy. Hot end big amplitude, cold end small -->
<circle cx="180" cy="250" r="9" fill="#7f1d1d"/><circle cx="240" cy="250" r="9" fill="#7f1d1d"/><circle cx="300" cy="250" r="9" fill="#7f1d1d"/><circle cx="360" cy="250" r="9" fill="#7f1d1d"/><circle cx="420" cy="250" r="9" fill="#7f1d1d"/><circle cx="480" cy="250" r="9" fill="#7f1d1d"/><circle cx="540" cy="250" r="9" fill="#7f1d1d"/><circle cx="600" cy="250" r="9" fill="#7f1d1d"/>
<!-- vibration marks (energy passed along) -->
<text x="180" y="232" font-family="Arial,sans-serif" font-size="14" fill="#7f1d1d" text-anchor="middle">↔</text>
<text x="240" y="234" font-family="Arial,sans-serif" font-size="13" fill="#7f1d1d" text-anchor="middle">↔</text>
<text x="300" y="235" font-family="Arial,sans-serif" font-size="12" fill="#7f1d1d" text-anchor="middle">↔</text>
<text x="360" y="236" font-family="Arial,sans-serif" font-size="11" fill="#7f1d1d" text-anchor="middle">↔</text>
<!-- direction-of-heat arrow above bar -->
<line x1="200" y1="180" x2="600" y2="180" stroke="#dc2626" stroke-width="3"/>
<polygon points="615,180 598,188 598,172" fill="#dc2626"/>
<text x="400" y="170" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">Värmen flyttas genom materialet</text>
<!-- temperature labels -->
<text x="155" y="310" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">Hett</text>
<text x="645" y="310" font-family="Arial,sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">Svalt</text>
<text x="400" y="395" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">Partiklarna vibrerar och puttar energin vidare — men flyttar sig inte själva</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Metaller leder värme bra; därför blir hela skaftet varmt</text>
</svg>