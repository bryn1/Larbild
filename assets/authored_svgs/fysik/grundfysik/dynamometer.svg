<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Dynamometer (fjädervåg)</text>
<!-- ceiling fixture -->
<line x1="320" y1="70" x2="480" y2="70" stroke="#1f2937" stroke-width="4"/>
<line x1="400" y1="70" x2="400" y2="90" stroke="#1f2937" stroke-width="2"/>
<circle cx="400" cy="95" r="7" fill="none" stroke="#1f2937" stroke-width="2"/>
<!-- barrel -->
<rect x="360" y="105" width="80" height="230" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="6"/>
<!-- spring -->
<polyline points="400,105 380,120 420,135 380,150 420,165 380,180 420,195 400,210" fill="none" stroke="#6b7280" stroke-width="2.5"/>
<!-- scale marks 0..10 N -->
<g stroke="#1f2937" stroke-width="1.5" font-family="Arial,sans-serif" font-size="11" fill="#1f2937">
<line x1="440" y1="130" x2="455" y2="130"/><text x="460" y="134" text-anchor="start">0 N</text>
<line x1="440" y1="160" x2="450" y2="160"/>
<line x1="440" y1="190" x2="455" y2="190"/><text x="460" y="194" text-anchor="start">5 N</text>
<line x1="440" y1="220" x2="450" y2="220"/>
<line x1="440" y1="250" x2="455" y2="250"/><text x="460" y="254" text-anchor="start">10 N</text>
</g>
<!-- pointer at current reading -->
<line x1="362" y1="210" x2="438" y2="210" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="438,210 446,206 446,214" fill="#dc2626"/>
<!-- hook + weight -->
<line x1="400" y1="210" x2="400" y2="340" stroke="#1f2937" stroke-width="2"/>
<path d="M 400 340 q 14 0 14 14 q 0 14 -14 14" fill="none" stroke="#1f2937" stroke-width="3"/>
<rect x="365" y="370" width="70" height="60" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="3"/>
<text x="400" y="405" font-family="Arial,sans-serif" font-size="14" fill="#2563eb" text-anchor="middle">m</text>
<!-- force arrow (gravity pulling weight down) -->
<line x1="400" y1="430" x2="400" y2="465" stroke="#dc2626" stroke-width="3"/>
<polygon points="400,475 396,465 404,465" fill="#dc2626"/>
<text x="430" y="455" font-family="Arial,sans-serif" font-size="14" fill="#dc2626" text-anchor="start" font-weight="bold">F (tyngd)</text>
<!-- right side explanation -->
<text x="640" y="300" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">Ju större kraft,</text>
<text x="640" y="320" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">desto mer dras</text>
<text x="640" y="340" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">fjädern ut</text>
<text x="400" y="495" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">En fjäder dras ut olika mycket beroende på hur stor kraften är — skalan visar kraften i newton (N)</text>
</svg>
