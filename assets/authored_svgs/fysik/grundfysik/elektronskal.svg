<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Elektronskal (banor runt kärnan)</text>

<!-- nucleus -->
<circle cx="270" cy="255" r="26" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="270" y="259" font-family="Arial,sans-serif" font-size="11" fill="#92400e" text-anchor="middle">kärna</text>

<!-- shell k (innermost) -->
<circle cx="270" cy="255" r="65" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="226" y="214" font-family="Arial,sans-serif" font-size="15" fill="#374151" text-anchor="middle" font-weight="bold">k</text>
<circle cx="335" cy="255" r="9" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
<text x="335" y="259" font-family="Arial,sans-serif" font-size="8" fill="white" text-anchor="middle">e−</text>
<circle cx="205" cy="255" r="9" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
<text x="205" y="259" font-family="Arial,sans-serif" font-size="8" fill="white" text-anchor="middle">e−</text>

<!-- shell l (middle) -->
<circle cx="270" cy="255" r="110" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="192" y="187" font-family="Arial,sans-serif" font-size="15" fill="#374151" text-anchor="middle" font-weight="bold">l</text>
<circle cx="270" cy="145" r="9" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
<text x="270" y="149" font-family="Arial,sans-serif" font-size="8" fill="white" text-anchor="middle">e−</text>
<circle cx="380" cy="255" r="9" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
<text x="380" y="259" font-family="Arial,sans-serif" font-size="8" fill="white" text-anchor="middle">e−</text>
<circle cx="270" cy="365" r="9" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
<text x="270" y="369" font-family="Arial,sans-serif" font-size="8" fill="white" text-anchor="middle">e−</text>
<circle cx="160" cy="255" r="9" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
<text x="160" y="259" font-family="Arial,sans-serif" font-size="8" fill="white" text-anchor="middle">e−</text>

<!-- shell m (outer) -->
<circle cx="270" cy="255" r="155" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="158" y="165" font-family="Arial,sans-serif" font-size="15" fill="#374151" text-anchor="middle" font-weight="bold">m</text>
<circle cx="270" cy="100" r="9" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
<text x="270" y="104" font-family="Arial,sans-serif" font-size="8" fill="white" text-anchor="middle">e−</text>
<circle cx="425" cy="255" r="9" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
<text x="425" y="259" font-family="Arial,sans-serif" font-size="8" fill="white" text-anchor="middle">e−</text>
<circle cx="270" cy="410" r="9" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
<text x="270" y="414" font-family="Arial,sans-serif" font-size="8" fill="white" text-anchor="middle">e−</text>

<!-- info box: ALL shells listed in order (k..q), even though only k,l,m are drawn -->
<rect x="495" y="108" width="290" height="300" rx="8" fill="white" stroke="#2563eb" stroke-width="2.5"/>
<text x="640" y="136" font-family="Arial,sans-serif" font-size="16" fill="#1e40af" text-anchor="middle" font-weight="bold">Skalens plats</text>
<line x1="515" y1="150" x2="765" y2="150" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="525" y="180" font-family="Arial,sans-serif" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">k</text>
<text x="558" y="180" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="start">– innerst, max 2 e−</text>
<text x="525" y="210" font-family="Arial,sans-serif" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">l</text>
<text x="558" y="210" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="start">– max 8 e−</text>
<text x="525" y="240" font-family="Arial,sans-serif" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">m</text>
<text x="558" y="240" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="start">– max 18 e−</text>
<text x="525" y="270" font-family="Arial,sans-serif" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">n</text>
<text x="558" y="270" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="start">– max 32 e−</text>
<text x="525" y="300" font-family="Arial,sans-serif" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">o</text>
<text x="558" y="300" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="start">– max 50 e−</text>
<text x="525" y="330" font-family="Arial,sans-serif" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">p</text>
<text x="558" y="330" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="start">– max 72 e−</text>
<text x="525" y="360" font-family="Arial,sans-serif" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">q</text>
<text x="558" y="360" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="start">– ytterst, max 98 e−</text>
<text x="640" y="392" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Skalen fylls inifrån: k, sedan l, m, n ...</text>

<text x="400" y="465" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Elektronskal är tänkta banor runt kärnan — k innerst, sedan l, m och fler skal utåt</text>
</svg>
