<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Elektronskal (banor runt kärnan)</text>

<!-- nucleus -->
<circle cx="250" cy="265" r="26" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="250" y="269" font-family="Arial,sans-serif" font-size="11" fill="#92400e" text-anchor="middle">kärna</text>

<!-- shell k (innermost) -->
<circle cx="250" cy="265" r="60" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="250" y="195" font-family="Arial,sans-serif" font-size="15" fill="#374151" text-anchor="middle" font-weight="bold">k</text>
<circle cx="310" cy="265" r="9" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
<text x="310" y="269" font-family="Arial,sans-serif" font-size="8" fill="white" text-anchor="middle">e-</text>
<circle cx="190" cy="265" r="9" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
<text x="190" y="269" font-family="Arial,sans-serif" font-size="8" fill="white" text-anchor="middle">e-</text>

<!-- shell l (middle) -->
<circle cx="250" cy="265" r="105" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="250" y="150" font-family="Arial,sans-serif" font-size="15" fill="#374151" text-anchor="middle" font-weight="bold">l</text>
<circle cx="250" cy="160" r="9" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
<text x="250" y="164" font-family="Arial,sans-serif" font-size="8" fill="white" text-anchor="middle">e-</text>
<circle cx="355" cy="265" r="9" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
<text x="355" y="269" font-family="Arial,sans-serif" font-size="8" fill="white" text-anchor="middle">e-</text>
<circle cx="250" cy="370" r="9" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
<text x="250" y="374" font-family="Arial,sans-serif" font-size="8" fill="white" text-anchor="middle">e-</text>
<circle cx="145" cy="265" r="9" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
<text x="145" y="269" font-family="Arial,sans-serif" font-size="8" fill="white" text-anchor="middle">e-</text>

<!-- shell m (outer) -->
<circle cx="250" cy="265" r="150" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="250" y="105" font-family="Arial,sans-serif" font-size="15" fill="#374151" text-anchor="middle" font-weight="bold">m</text>
<circle cx="250" cy="115" r="9" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
<text x="250" y="119" font-family="Arial,sans-serif" font-size="8" fill="white" text-anchor="middle">e-</text>
<circle cx="400" cy="265" r="9" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
<text x="400" y="269" font-family="Arial,sans-serif" font-size="8" fill="white" text-anchor="middle">e-</text>
<circle cx="250" cy="415" r="9" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
<text x="250" y="419" font-family="Arial,sans-serif" font-size="8" fill="white" text-anchor="middle">e-</text>

<!-- info box: ALL shells listed (K..Q) with capacities -->
<rect x="470" y="80" width="310" height="350" rx="8" fill="white" stroke="#2563eb" stroke-width="2.5"/>
<text x="625" y="108" font-family="Arial,sans-serif" font-size="16" fill="#1e40af" text-anchor="middle" font-weight="bold">Skalens plats</text>
<line x1="490" y1="120" x2="760" y2="120" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="500" y="146" font-family="Arial,sans-serif" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold">k</text>
<text x="530" y="146" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="start">– innerst, max 2 e-</text>
<text x="500" y="174" font-family="Arial,sans-serif" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold">l</text>
<text x="530" y="174" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="start">– max 8 e-</text>
<text x="500" y="202" font-family="Arial,sans-serif" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold">m</text>
<text x="530" y="202" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="start">– max 18 e-</text>
<text x="500" y="230" font-family="Arial,sans-serif" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold">n</text>
<text x="530" y="230" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="start">– max 32 e-</text>
<text x="500" y="258" font-family="Arial,sans-serif" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold">o</text>
<text x="530" y="258" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="start">– max 50 e-</text>
<text x="500" y="286" font-family="Arial,sans-serif" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold">p</text>
<text x="530" y="286" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="start">– max 72 e-</text>
<text x="500" y="314" font-family="Arial,sans-serif" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold">q</text>
<text x="530" y="314" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="start">– ytterst, max 98 e-</text>
<line x1="490" y1="332" x2="760" y2="332" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="625" y="356" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">k fylls först, sedan l, m, n …</text>
<text x="625" y="378" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Här ritas bara de tre inre skalen</text>
<text x="625" y="400" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">(k, l, m) — alla 7 visas inte.</text>

<text x="400" y="465" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Elektronskal är tänkta banor runt kärnan — k innerst, sedan l, m, n, o, p, q</text>
</svg>
