<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Densitet (ρ = m / V)</text>
<text x="400" y="80" font-family="Arial,sans-serif" font-size="15" fill="#6b7280" text-anchor="middle">Samma volym — olika massa</text>
<!-- LEFT cube: bly (lead), densely packed -->
<rect x="120" y="150" width="160" height="160" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<g fill="#1e40af">
<circle cx="150" cy="180" r="7"/><circle cx="180" cy="180" r="7"/><circle cx="210" cy="180" r="7"/><circle cx="240" cy="180" r="7"/><circle cx="270" cy="180" r="7"/>
<circle cx="150" cy="210" r="7"/><circle cx="180" cy="210" r="7"/><circle cx="210" cy="210" r="7"/><circle cx="240" cy="210" r="7"/><circle cx="270" cy="210" r="7"/>
<circle cx="150" cy="240" r="7"/><circle cx="180" cy="240" r="7"/><circle cx="210" cy="240" r="7"/><circle cx="240" cy="240" r="7"/><circle cx="270" cy="240" r="7"/>
<circle cx="150" cy="270" r="7"/><circle cx="180" cy="270" r="7"/><circle cx="210" cy="270" r="7"/><circle cx="240" cy="270" r="7"/><circle cx="270" cy="270" r="7"/>
</g>
<text x="200" y="340" font-family="Arial,sans-serif" font-size="15" fill="#1e40af" text-anchor="middle" font-weight="bold">Bly</text>
<text x="200" y="362" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">tätt packat → tung</text>
<!-- volume bracket left -->
<line x1="120" y1="130" x2="280" y2="130" stroke="#16a34a" stroke-width="2"/>
<line x1="120" y1="122" x2="120" y2="138" stroke="#16a34a" stroke-width="2"/>
<line x1="280" y1="122" x2="280" y2="138" stroke="#16a34a" stroke-width="2"/>
<text x="200" y="118" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle">1 liter</text>
<!-- RIGHT cube: trä (wood), loosely packed -->
<rect x="520" y="150" width="160" height="160" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<g fill="#b45309">
<circle cx="560" cy="195" r="7"/><circle cx="610" cy="195" r="7"/><circle cx="650" cy="195" r="7"/>
<circle cx="560" cy="250" r="7"/><circle cx="615" cy="245" r="7"/><circle cx="650" cy="265" r="7"/>
<circle cx="585" cy="290" r="7"/><circle cx="640" cy="295" r="7"/>
</g>
<text x="600" y="340" font-family="Arial,sans-serif" font-size="15" fill="#b45309" text-anchor="middle" font-weight="bold">Trä</text>
<text x="600" y="362" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">glest packat → lätt</text>
<!-- volume bracket right -->
<line x1="520" y1="130" x2="680" y2="130" stroke="#16a34a" stroke-width="2"/>
<line x1="520" y1="122" x2="520" y2="138" stroke="#16a34a" stroke-width="2"/>
<line x1="680" y1="122" x2="680" y2="138" stroke="#16a34a" stroke-width="2"/>
<text x="600" y="118" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle">1 liter</text>
<text x="400" y="250" font-family="Arial,sans-serif" font-size="26" fill="#1e40af" text-anchor="middle" font-weight="bold">ρ = m / V</text>
<text x="400" y="410" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">Enhet: kg/m³ (eller g/cm³)</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Densitet är hur mycket massa som är packad i en viss volym — hur tätt ämnet är</text>
</svg>
