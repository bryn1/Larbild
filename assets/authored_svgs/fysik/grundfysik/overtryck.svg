<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Övertryck (högre tryck inuti än utanför)</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Gasen vill ut — därför kan något spricka eller pysa</text>

<!-- The balloon -->
<ellipse cx="400" cy="270" rx="150" ry="135" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
<!-- knot at the bottom -->
<polygon points="385,402 415,402 408,425 392,425" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>

<!-- many gas molecules packed inside -->
<circle cx="350" cy="210" r="7" fill="#dc2626"/><circle cx="410" cy="200" r="7" fill="#dc2626"/><circle cx="460" cy="240" r="7" fill="#dc2626"/>
<circle cx="330" cy="260" r="7" fill="#dc2626"/><circle cx="390" cy="255" r="7" fill="#dc2626"/><circle cx="445" cy="285" r="7" fill="#dc2626"/>
<circle cx="360" cy="310" r="7" fill="#dc2626"/><circle cx="415" cy="320" r="7" fill="#dc2626"/><circle cx="470" cy="300" r="7" fill="#dc2626"/>
<circle cx="335" cy="330" r="7" fill="#dc2626"/><circle cx="400" cy="290" r="7" fill="#dc2626"/>
<text x="400" y="160" font-family="Arial,sans-serif" font-size="14" fill="#991b1b" text-anchor="middle" font-weight="bold">Högt tryck inuti</text>
<text x="400" y="365" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">många gaspartiklar tryck-</text>
<text x="400" y="382" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">er hårt mot ballongens vägg</text>

<!-- Outward-pointing pressure arrows from inside the balloon wall -->
<line x1="400" y1="200" x2="400" y2="150" stroke="#dc2626" stroke-width="3"/><polygon points="400,138 394,151 406,151" fill="#dc2626"/>
<line x1="505" y1="215" x2="545" y2="180" stroke="#dc2626" stroke-width="3"/><polygon points="555,172 540,176 547,185" fill="#dc2626"/>
<line x1="540" y1="270" x2="595" y2="270" stroke="#dc2626" stroke-width="3"/><polygon points="608,270 595,275 595,265" fill="#dc2626"/>
<line x1="505" y1="325" x2="545" y2="360" stroke="#dc2626" stroke-width="3"/><polygon points="555,368 547,355 540,364" fill="#dc2626"/>
<line x1="295" y1="215" x2="255" y2="180" stroke="#dc2626" stroke-width="3"/><polygon points="245,172 252,185 260,176" fill="#dc2626"/>
<line x1="260" y1="270" x2="205" y2="270" stroke="#dc2626" stroke-width="3"/><polygon points="192,270 205,265 205,275" fill="#dc2626"/>
<line x1="295" y1="325" x2="255" y2="360" stroke="#dc2626" stroke-width="3"/><polygon points="245,368 260,364 252,355" fill="#dc2626"/>

<!-- outside pressure label -->
<text x="120" y="120" font-family="Arial,sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">Lägre tryck</text>
<text x="120" y="138" font-family="Arial,sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">utanför</text>
<text x="680" y="120" font-family="Arial,sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">Lägre tryck</text>
<text x="680" y="138" font-family="Arial,sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">utanför</text>

<text x="400" y="455" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle">Blåser du i för mycket luft blir övertrycket för stort och ballongen spricker</text>
<text x="400" y="482" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Övertryck betyder att trycket inuti är högre än utanför, så gasen vill ut</text>
</svg>
