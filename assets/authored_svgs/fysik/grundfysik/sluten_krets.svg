<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Sluten krets</text>

<!-- circuit wire rectangle, with a gap on the bottom for the battery -->
<rect x="200" y="130" width="400" height="240" fill="none" stroke="#1f2937" stroke-width="4"/>
<!-- erase wire where the battery sits (bottom) by drawing white over it -->
<rect x="298" y="362" width="104" height="16" fill="white"/>

<!-- BATTERY symbol (ONE cell): long thin line = +, short thick line = − -->
<!-- left lead -->
<line x1="298" y1="370" x2="344" y2="370" stroke="#1f2937" stroke-width="4"/>
<!-- short, thick plate = minus -->
<line x1="344" y1="357" x2="344" y2="383" stroke="#1f2937" stroke-width="6"/>
<text x="336" y="403" font-family="Arial,sans-serif" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold">−</text>
<!-- long, thin plate = plus -->
<line x1="360" y1="344" x2="360" y2="396" stroke="#dc2626" stroke-width="3"/>
<text x="368" y="403" font-family="Arial,sans-serif" font-size="18" fill="#dc2626" text-anchor="middle" font-weight="bold">+</text>
<!-- right lead -->
<line x1="360" y1="370" x2="402" y2="370" stroke="#1f2937" stroke-width="4"/>
<text x="352" y="438" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Batteri</text>
<text x="352" y="457" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">lång linje = plus (+), kort tjock = minus (−)</text>

<!-- lamp on right side: circle with X -->
<circle cx="600" cy="250" r="28" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
<line x1="580" y1="230" x2="620" y2="270" stroke="#f59e0b" stroke-width="2.5"/>
<line x1="620" y1="230" x2="580" y2="270" stroke="#f59e0b" stroke-width="2.5"/>
<!-- light rays shooting out in ALL directions (8 rays around the lamp) -->
<line x1="634" y1="250" x2="648" y2="250" stroke="#f59e0b" stroke-width="3"/>
<line x1="624" y1="274" x2="634" y2="284" stroke="#f59e0b" stroke-width="3"/>
<line x1="600" y1="284" x2="600" y2="298" stroke="#f59e0b" stroke-width="3"/>
<line x1="576" y1="274" x2="566" y2="284" stroke="#f59e0b" stroke-width="3"/>
<line x1="566" y1="250" x2="552" y2="250" stroke="#f59e0b" stroke-width="3"/>
<line x1="576" y1="226" x2="566" y2="216" stroke="#f59e0b" stroke-width="3"/>
<line x1="600" y1="216" x2="600" y2="202" stroke="#f59e0b" stroke-width="3"/>
<line x1="624" y1="226" x2="634" y2="216" stroke="#f59e0b" stroke-width="3"/>
<text x="600" y="335" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Lampa</text>
<text x="600" y="353" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">(lyser)</text>

<!-- switch on top side: CLOSED -->
<circle cx="370" cy="130" r="5" fill="#1f2937"/>
<circle cx="430" cy="130" r="5" fill="#1f2937"/>
<line x1="370" y1="130" x2="428" y2="130" stroke="#16a34a" stroke-width="4"/>
<text x="400" y="110" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="bold">Strömbrytare (sluten)</text>

<!-- current direction arrows sitting ON the wires (counter-clockwise: conventional
     current LEAVES the + pole, goes up the right side, left across the top, down the
     left side, and back into the - pole) -->
<!-- top wire: current flows LEFT -->
<polygon points="480,130 500,122 500,138" fill="#2563eb"/>
<!-- right side wire: current flows UP -->
<polygon points="600,210 592,228 608,228" fill="#2563eb"/>
<!-- left side wire: current flows DOWN -->
<polygon points="200,300 192,282 208,282" fill="#2563eb"/>
<text x="500" y="250" font-family="Arial,sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">strömmen</text>
<text x="500" y="268" font-family="Arial,sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">går runt</text>

<text x="400" y="488" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">En sluten krets är en obruten bana från batteriets ena pol till den andra</text>
</svg>
