<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Aneroidmätare (lufttryck utan vätska)</text>

<!-- SEALED BELLOWS BOX (left) that flexes with air pressure -->
<text x="195" y="120" font-family="Arial,sans-serif" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="bold">Lufttom metalldosa</text>
<!-- top fixed plate -->
<rect x="120" y="135" width="150" height="14" fill="#9ca3af" stroke="#1f2937" stroke-width="2"/>
<!-- corrugated bellows sides (folds) -->
<path d="M 135 149 L 150 162 L 135 175 L 150 188 L 135 201 L 150 214 L 135 227 L 150 240 L 135 253 L 150 266 L 135 279 L 150 292" fill="none" stroke="#1f2937" stroke-width="2"/>
<path d="M 255 149 L 240 162 L 255 175 L 240 188 L 255 201 L 240 214 L 255 227 L 240 240 L 255 253 L 240 266 L 255 279 L 240 292" fill="none" stroke="#1f2937" stroke-width="2"/>
<!-- inner body fill -->
<rect x="150" y="149" width="90" height="143" fill="#e5e7eb"/>
<text x="195" y="225" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">vakuum</text>
<text x="195" y="240" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(ingen luft)</text>
<!-- bottom moving plate (this end flexes up/down) -->
<rect x="120" y="292" width="150" height="14" fill="#6b7280" stroke="#1f2937" stroke-width="2"/>

<!-- air-pressure arrows pressing IN on the box from all sides -->
<line x1="195" y1="335" x2="195" y2="312" stroke="#dc2626" stroke-width="3"/>
<polygon points="195,302 189,314 201,314" fill="#dc2626"/>
<line x1="80" y1="220" x2="108" y2="220" stroke="#dc2626" stroke-width="3"/>
<polygon points="118,220 106,214 106,226" fill="#dc2626"/>
<line x1="310" y1="220" x2="282" y2="220" stroke="#dc2626" stroke-width="3"/>
<polygon points="272,220 284,214 284,226" fill="#dc2626"/>
<text x="195" y="358" font-family="Arial,sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold">Lufttryck trycker på dosan</text>

<!-- LINKAGE: a clear lever/rod from the moving plate to the dial needle -->
<circle cx="195" cy="306" r="4" fill="#1f2937"/>
<line x1="195" y1="306" x2="330" y2="220" stroke="#15803d" stroke-width="3"/>
<circle cx="330" cy="220" r="4" fill="#15803d"/>
<line x1="330" y1="220" x2="470" y2="220" stroke="#15803d" stroke-width="3"/>
<text x="360" y="200" font-family="Arial,sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="bold">länk / hävarm</text>
<text x="360" y="248" font-family="Arial,sans-serif" font-size="11" fill="#15803d" text-anchor="middle">flyttar visaren</text>

<!-- DIAL (right) with needle -->
<text x="615" y="120" font-family="Arial,sans-serif" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="bold">Visartavla</text>
<circle cx="615" cy="230" r="85" fill="white" stroke="#1f2937" stroke-width="2.5"/>
<!-- tick marks -->
<line x1="615" y1="145" x2="615" y2="157" stroke="#1f2937" stroke-width="2"/>
<line x1="700" y1="230" x2="688" y2="230" stroke="#1f2937" stroke-width="2"/>
<line x1="530" y1="230" x2="542" y2="230" stroke="#1f2937" stroke-width="2"/>
<line x1="555" y1="170" x2="563" y2="178" stroke="#1f2937" stroke-width="2"/>
<line x1="675" y1="170" x2="667" y2="178" stroke="#1f2937" stroke-width="2"/>
<line x1="555" y1="290" x2="563" y2="282" stroke="#1f2937" stroke-width="2"/>
<line x1="675" y1="290" x2="667" y2="282" stroke="#1f2937" stroke-width="2"/>
<text x="548" y="255" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">Lågt</text>
<text x="682" y="255" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">Högt</text>
<!-- needle -->
<line x1="615" y1="230" x2="660" y2="185" stroke="#dc2626" stroke-width="3"/>
<circle cx="615" cy="230" r="6" fill="#1f2937"/>
<!-- link enters the dial center -->
<line x1="470" y1="220" x2="530" y2="228" stroke="#15803d" stroke-width="3"/>

<text x="400" y="408" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Ändras lufttrycket buktar dosan ut eller trycks ihop → länken flyttar visaren</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Aneroidmätaren mäter lufttryck med en flexande metalldosa — helt utan vätska</text>
</svg>
