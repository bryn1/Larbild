<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Molekyl — atomer som sitter ihop</text>

<!-- bonds first (behind atoms) — thick, clearly the connecting links -->
<line x1="370" y1="230" x2="275" y2="310" stroke="#374151" stroke-width="11"/>
<line x1="430" y1="230" x2="525" y2="310" stroke="#374151" stroke-width="11"/>

<!-- oxygen (big, red) -->
<circle cx="400" cy="220" r="55" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
<text x="400" y="232" font-family="Arial,sans-serif" font-size="30" fill="white" text-anchor="middle" font-weight="bold">O</text>

<!-- hydrogen atoms (small, blue) -->
<circle cx="265" cy="320" r="34" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
<text x="265" y="330" font-family="Arial,sans-serif" font-size="22" fill="white" text-anchor="middle" font-weight="bold">H</text>
<circle cx="535" cy="320" r="34" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
<text x="535" y="330" font-family="Arial,sans-serif" font-size="22" fill="white" text-anchor="middle" font-weight="bold">H</text>

<!-- atom labels -->
<text x="400" y="135" font-family="Arial,sans-serif" font-size="14" fill="#dc2626" text-anchor="middle">syreatom (O)</text>
<line x1="400" y1="142" x2="400" y2="162" stroke="#dc2626" stroke-width="1.5"/>
<text x="180" y="378" font-family="Arial,sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">väteatom (H)</text>
<text x="620" y="378" font-family="Arial,sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">väteatom (H)</text>

<!-- clear leader line straight TO the right-hand bond + dot on it -->
<circle cx="478" cy="266" r="6" fill="#374151"/>
<line x1="630" y1="200" x2="484" y2="263" stroke="#374151" stroke-width="2"/>
<rect x="630" y="178" width="150" height="44" rx="6" fill="white" stroke="#374151" stroke-width="2"/>
<text x="705" y="200" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">bindning</text>
<text x="705" y="216" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">håller ihop atomerna</text>

<!-- formula -->
<text x="400" y="410" font-family="Arial,sans-serif" font-size="26" fill="#1e40af" text-anchor="middle" font-weight="bold">H₂O  (vatten)</text>
<text x="400" y="438" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">3 atomer bundna ihop = en vattenmolekyl</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">En molekyl består av två eller flera atomer som sitter ihop</text>
</svg>
