<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Molekyl — atomer som sitter ihop</text>
<!-- water molecule H2O, bent shape -->
<!-- bonds first (behind atoms) -->
<line x1="400" y1="220" x2="300" y2="300" stroke="#6b7280" stroke-width="10"/>
<line x1="400" y1="220" x2="500" y2="300" stroke="#6b7280" stroke-width="10"/>
<!-- oxygen (big, red) -->
<circle cx="400" cy="220" r="55" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
<text x="400" y="230" font-family="Arial,sans-serif" font-size="30" fill="white" text-anchor="middle" font-weight="bold">O</text>
<!-- hydrogen atoms (small, blue) -->
<circle cx="300" cy="300" r="34" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
<text x="300" y="310" font-family="Arial,sans-serif" font-size="22" fill="white" text-anchor="middle" font-weight="bold">H</text>
<circle cx="500" cy="300" r="34" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
<text x="500" y="310" font-family="Arial,sans-serif" font-size="22" fill="white" text-anchor="middle" font-weight="bold">H</text>
<!-- label callouts -->
<text x="400" y="135" font-family="Arial,sans-serif" font-size="14" fill="#dc2626" text-anchor="middle">syreatom (O)</text>
<line x1="400" y1="142" x2="400" y2="162" stroke="#dc2626" stroke-width="1.5"/>
<text x="215" y="360" font-family="Arial,sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">väteatom</text>
<text x="585" y="360" font-family="Arial,sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">väteatom</text>
<text x="640" y="240" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">bindning</text>
<line x1="600" y1="245" x2="555" y2="262" stroke="#6b7280" stroke-width="1.5"/>
<!-- formula -->
<text x="400" y="400" font-family="Arial,sans-serif" font-size="26" fill="#1e40af" text-anchor="middle" font-weight="bold">H₂O  (vatten)</text>
<text x="400" y="430" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">3 atomer bundna ihop = en vattenmolekyl</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">En molekyl består av två eller flera atomer som sitter ihop</text>
</svg>