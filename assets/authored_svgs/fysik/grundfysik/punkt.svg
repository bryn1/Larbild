<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Punkt — ett läge utan storlek</text>
<!-- coordinate grid -->
<g stroke="#e5e7eb" stroke-width="1">
<line x1="150" y1="100" x2="150" y2="380"/><line x1="210" y1="100" x2="210" y2="380"/><line x1="270" y1="100" x2="270" y2="380"/><line x1="330" y1="100" x2="330" y2="380"/><line x1="390" y1="100" x2="390" y2="380"/><line x1="450" y1="100" x2="450" y2="380"/><line x1="510" y1="100" x2="510" y2="380"/><line x1="570" y1="100" x2="570" y2="380"/><line x1="630" y1="100" x2="630" y2="380"/>
<line x1="150" y1="100" x2="630" y2="100"/><line x1="150" y1="160" x2="630" y2="160"/><line x1="150" y1="220" x2="630" y2="220"/><line x1="150" y1="280" x2="630" y2="280"/><line x1="150" y1="340" x2="630" y2="340"/>
</g>
<!-- axes -->
<line x1="150" y1="380" x2="650" y2="380" stroke="#1f2937" stroke-width="2"/>
<polygon points="660,380 645,375 645,385" fill="#1f2937"/>
<line x1="150" y1="380" x2="150" y2="90" stroke="#1f2937" stroke-width="2"/>
<polygon points="150,80 145,95 155,95" fill="#1f2937"/>
<text x="655" y="400" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">x</text>
<text x="130" y="95" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">y</text>
<!-- the point -->
<circle cx="450" cy="220" r="6" fill="#dc2626"/>
<!-- dashed guides to axes -->
<line x1="450" y1="220" x2="450" y2="380" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,4"/>
<line x1="450" y1="220" x2="150" y2="220" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,4"/>
<!-- callout -->
<line x1="456" y1="214" x2="540" y2="160" stroke="#dc2626" stroke-width="1.5"/>
<text x="585" y="155" font-family="Arial,sans-serif" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">Punkt</text>
<text x="585" y="175" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">visar ett läge</text>
<text x="450" y="400" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle">x-läge</text>
<text x="135" y="225" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="end">y-läge</text>
<text x="400" y="435" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">En punkt har ingen bredd eller höjd — den visar bara var något finns</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Punkter markerar ett läge på en karta eller i ett diagram</text>
</svg>