<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Termometer (mätinstrument för temperatur)</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Vätskan stiger i röret när det blir varmare</text>

<!-- Thermometer body: vertical tube -->
<rect x="372" y="100" width="26" height="300" rx="13" fill="#f9fafb" stroke="#374151" stroke-width="3"/>
<!-- Bulb at the bottom -->
<circle cx="385" cy="410" r="34" fill="#dc2626" stroke="#374151" stroke-width="3"/>
<!-- Red liquid column rising part-way -->
<rect x="378" y="230" width="14" height="180" fill="#dc2626"/>
<rect x="378" y="230" width="14" height="14" rx="7" fill="#dc2626"/>

<!-- Scale ticks + numbers on the right side -->
<line x1="398" y1="130" x2="418" y2="130" stroke="#374151" stroke-width="2"/>
<text x="428" y="135" font-family="Arial,sans-serif" font-size="13" fill="#374151" text-anchor="start">40 °C</text>
<line x1="398" y1="175" x2="418" y2="175" stroke="#374151" stroke-width="2"/>
<text x="428" y="180" font-family="Arial,sans-serif" font-size="13" fill="#374151" text-anchor="start">30 °C</text>
<line x1="398" y1="220" x2="418" y2="220" stroke="#374151" stroke-width="2"/>
<text x="428" y="225" font-family="Arial,sans-serif" font-size="13" fill="#374151" text-anchor="start">20 °C</text>
<line x1="398" y1="265" x2="418" y2="265" stroke="#374151" stroke-width="2"/>
<text x="428" y="270" font-family="Arial,sans-serif" font-size="13" fill="#374151" text-anchor="start">10 °C</text>
<line x1="398" y1="310" x2="418" y2="310" stroke="#374151" stroke-width="2"/>
<text x="428" y="315" font-family="Arial,sans-serif" font-size="13" fill="#374151" text-anchor="start">0 °C</text>
<!-- minor ticks on left -->
<line x1="352" y1="152" x2="372" y2="152" stroke="#9ca3af" stroke-width="1"/>
<line x1="352" y1="197" x2="372" y2="197" stroke="#9ca3af" stroke-width="1"/>
<line x1="352" y1="242" x2="372" y2="242" stroke="#9ca3af" stroke-width="1"/>
<line x1="352" y1="287" x2="372" y2="287" stroke="#9ca3af" stroke-width="1"/>

<!-- Labels with leader lines -->
<line x1="210" y1="235" x2="370" y2="235" stroke="#16a34a" stroke-width="1.5"/>
<text x="205" y="225" font-family="Arial,sans-serif" font-size="14" fill="#16a34a" text-anchor="end" font-weight="bold">Vätskepelare</text>
<text x="205" y="243" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="end">(visar temperaturen)</text>

<line x1="560" y1="220" x2="420" y2="220" stroke="#2563eb" stroke-width="1.5"/>
<text x="565" y="225" font-family="Arial,sans-serif" font-size="14" fill="#2563eb" text-anchor="start" font-weight="bold">Skala (grader)</text>

<line x1="500" y1="410" x2="420" y2="410" stroke="#dc2626" stroke-width="1.5"/>
<text x="505" y="406" font-family="Arial,sans-serif" font-size="14" fill="#dc2626" text-anchor="start" font-weight="bold">Behållare med vätska</text>
<text x="505" y="424" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="start">utvidgas vid värme</text>

<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Termometern mäter temperatur — vätskan utvidgas och stiger i röret när det blir varmare</text>
</svg>
