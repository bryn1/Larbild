<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Neutron — partikel utan laddning</text>
<!-- nucleus cluster -->
<circle cx="400" cy="230" r="95" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4"/>
<text x="400" y="135" font-family="Arial,sans-serif" font-size="14" fill="#92400e" text-anchor="middle">Atomkärna</text>
<!-- protons (red, +) -->
<circle cx="370" cy="200" r="24" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
<text x="370" y="206" font-family="Arial,sans-serif" font-size="15" fill="white" text-anchor="middle" font-weight="bold">p+</text>
<circle cx="430" cy="265" r="24" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
<text x="430" y="271" font-family="Arial,sans-serif" font-size="15" fill="white" text-anchor="middle" font-weight="bold">p+</text>
<!-- neutrons (gray, n) -->
<circle cx="435" cy="195" r="24" fill="#6b7280" stroke="#374151" stroke-width="2"/>
<text x="435" y="201" font-family="Arial,sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">n</text>
<circle cx="368" cy="262" r="24" fill="#6b7280" stroke="#374151" stroke-width="3"/>
<text x="368" y="268" font-family="Arial,sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">n</text>
<!-- callout to highlighted neutron -->
<line x1="368" y1="286" x2="320" y2="350" stroke="#374151" stroke-width="1.5"/>
<text x="245" y="368" font-family="Arial,sans-serif" font-size="14" fill="#374151" text-anchor="middle" font-weight="bold">Neutron</text>
<!-- charge legend -->
<rect x="540" y="160" width="220" height="140" fill="white" stroke="#9ca3af" stroke-width="1.5" rx="4"/>
<text x="650" y="185" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Laddning</text>
<circle cx="570" cy="215" r="12" fill="#dc2626"/>
<text x="595" y="220" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="start">Proton: laddning +1</text>
<circle cx="570" cy="250" r="12" fill="#6b7280"/>
<text x="595" y="255" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="start">Neutron: laddning 0</text>
<text x="650" y="285" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">(varken plus eller minus)</text>
<text x="400" y="405" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">Neutronen sitter i kärnan tillsammans med protonerna</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Neutronen har ingen elektrisk laddning — den är neutral</text>
</svg>