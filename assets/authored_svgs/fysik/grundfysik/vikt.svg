<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Vikt (hur mycket något väger på en våg)</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Vikt mäts ofta i gram (g) eller kilogram (kg)</text>

<!-- Items being weighed: a pile of apples -->
<circle cx="340" cy="170" r="30" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
<circle cx="400" cy="175" r="30" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
<circle cx="370" cy="135" r="30" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
<path d="M 370 105 Q 375 92 385 95" stroke="#15803d" stroke-width="3" fill="none"/>
<text x="370" y="80" font-family="Arial,sans-serif" font-size="13" fill="#15803d" text-anchor="middle">Äpplen</text>

<!-- Weighing platform / pan -->
<line x1="270" y1="210" x2="470" y2="210" stroke="#1f2937" stroke-width="5"/>
<!-- Scale body (digital kitchen scale) -->
<rect x="260" y="220" width="220" height="110" rx="10" fill="#e5e7eb" stroke="#374151" stroke-width="2.5"/>
<!-- Display showing the weight -->
<rect x="300" y="245" width="140" height="55" rx="6" fill="#1f2937"/>
<text x="370" y="285" font-family="Arial,sans-serif" font-size="26" fill="#16a34a" text-anchor="middle" font-weight="bold">750 g</text>
<text x="370" y="320" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Våg (digital köksvåg)</text>

<!-- Downward arrow: items press down on the scale -->
<line x1="540" y1="160" x2="540" y2="215" stroke="#dc2626" stroke-width="3"/>
<polygon points="540,228 534,215 546,215" fill="#dc2626"/>
<text x="640" y="185" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">Föremålet trycker</text>
<text x="640" y="203" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">neråt på vågen</text>

<!-- unit reminder -->
<rect x="140" y="370" width="520" height="60" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" rx="4"/>
<text x="400" y="395" font-family="Arial,sans-serif" font-size="14" fill="#b45309" text-anchor="middle" font-weight="bold">1 kg = 1000 g</text>
<text x="400" y="418" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Vågen visar vikten — t.ex. för att se hur mycket frukten väger i affären</text>

<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Vikt är hur mycket ett föremål väger när man mäter det på en våg</text>
</svg>
