<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Stelning — vätska blir fast</text>
<!-- BEFORE: liquid juice (loose particles) -->
<text x="175" y="100" font-family="Arial,sans-serif" font-size="16" fill="#1e40af" text-anchor="middle" font-weight="bold">Vätska (saft)</text>
<path d="M 130 150 L 220 150 L 215 270 L 135 270 Z" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
<circle cx="155" cy="180" r="8" fill="#b91c1c"/><circle cx="190" cy="195" r="8" fill="#b91c1c"/><circle cx="165" cy="225" r="8" fill="#b91c1c"/>
<circle cx="200" cy="235" r="8" fill="#b91c1c"/><circle cx="150" cy="250" r="8" fill="#b91c1c"/><circle cx="185" cy="255" r="8" fill="#b91c1c"/>
<text x="175" y="300" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">partiklar rör sig fritt</text>
<!-- arrow + cooling (freezer) -->
<line x1="260" y1="210" x2="370" y2="210" stroke="#2563eb" stroke-width="4"/>
<polygon points="385,210 368,218 368,202" fill="#2563eb"/>
<text x="322" y="195" font-family="Arial,sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">kyls ner</text>
<text x="322" y="240" font-family="Arial,sans-serif" font-size="24" fill="#2563eb" text-anchor="middle">❄</text>
<text x="322" y="270" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">i frysen</text>
<!-- AFTER: solid ice pop (ordered particles) -->
<text x="560" y="100" font-family="Arial,sans-serif" font-size="16" fill="#1e40af" text-anchor="middle" font-weight="bold">Fast (isglass)</text>
<rect x="515" y="150" width="90" height="120" fill="#bfdbfe" stroke="#1e40af" stroke-width="3"/>
<rect x="552" y="270" width="16" height="50" fill="#a16207"/>
<circle cx="535" cy="175" r="8" fill="#2563eb"/><circle cx="560" cy="175" r="8" fill="#2563eb"/><circle cx="585" cy="175" r="8" fill="#2563eb"/>
<circle cx="535" cy="205" r="8" fill="#2563eb"/><circle cx="560" cy="205" r="8" fill="#2563eb"/><circle cx="585" cy="205" r="8" fill="#2563eb"/>
<circle cx="535" cy="235" r="8" fill="#2563eb"/><circle cx="560" cy="235" r="8" fill="#2563eb"/><circle cx="585" cy="235" r="8" fill="#2563eb"/>
<text x="560" y="345" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">partiklarna låsta i ordning</text>
<text x="400" y="405" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">När vätskan kyls tillräckligt låser partiklarna fast — motsatsen till smältning</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Stelning: en vätska kyls ner så mycket att den blir fast</text>
</svg>