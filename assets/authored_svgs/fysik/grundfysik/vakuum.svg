<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Vakuum — ljud kan inte färdas</text>

<!-- ===== glass vacuum jar (bell jar) ===== -->
<path d="M 250 130 Q 250 95 320 95 Q 390 95 390 130 L 390 380 L 250 380 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="3" opacity="0.55"/>
<!-- jar base/plate -->
<rect x="232" y="380" width="176" height="20" rx="4" fill="#9ca3af" stroke="#4b5563" stroke-width="2"/>
<text x="320" y="120" font-family="Arial,sans-serif" font-size="13" fill="#1e3a8a" text-anchor="middle" font-weight="bold">Glasklocka</text>

<!-- vacuum label inside jar -->
<text x="320" y="160" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">VAKUUM</text>
<text x="320" y="178" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">nästan inga luftmolekyler</text>

<!-- speaker (sound source) inside the jar -->
<rect x="285" y="270" width="70" height="80" rx="6" fill="#374151" stroke="#111827" stroke-width="2"/>
<!-- speaker cone -->
<polygon points="298,295 320,283 320,337 298,325" fill="#9ca3af" stroke="#111827" stroke-width="1.5"/>
<circle cx="328" cy="310" r="11" fill="#1f2937" stroke="#111827" stroke-width="1.5"/>
<circle cx="328" cy="310" r="4" fill="#6b7280"/>
<text x="320" y="368" font-family="Arial,sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle" font-weight="bold">Högtalare</text>

<!-- sound waves leaving the speaker but stopped at the vacuum (faded, with a block marker) -->
<path d="M 345 310 Q 360 296 360 310 Q 360 324 345 310" fill="none" stroke="#b91c1c" stroke-width="2.5" opacity="0.7"/>
<path d="M 355 310 Q 372 290 372 310 Q 372 330 355 310" fill="none" stroke="#dc2626" stroke-width="2" opacity="0.4" stroke-dasharray="3,3"/>

<!-- "blocked" marker: the sound cannot continue outward -->
<line x1="392" y1="290" x2="392" y2="330" stroke="#b91c1c" stroke-width="4"/>
<line x1="384" y1="296" x2="400" y2="324" stroke="#b91c1c" stroke-width="4"/>
<text x="430" y="300" font-family="Arial,sans-serif" font-size="13" fill="#b91c1c" text-anchor="start" font-weight="bold">Inget ljud</text>
<text x="430" y="318" font-family="Arial,sans-serif" font-size="13" fill="#b91c1c" text-anchor="start" font-weight="bold">tar sig ut</text>

<!-- listener (ear/person) outside hears nothing -->
<circle cx="500" cy="430" r="14" fill="#fcd34d" stroke="#b45309" stroke-width="2"/>
<text x="500" y="460" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">lyssnare hör tystnad</text>

<!-- ===== thermos analogy (right) ===== -->
<text x="650" y="120" font-family="Arial,sans-serif" font-size="15" fill="#1e40af" text-anchor="middle" font-weight="bold">Samma knep: termosen</text>

<!-- outer wall -->
<rect x="600" y="150" width="100" height="220" rx="14" fill="#e5e7eb" stroke="#4b5563" stroke-width="2.5"/>
<!-- inner wall -->
<rect x="618" y="168" width="64" height="184" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
<!-- vacuum gap label -->
<text x="650" y="392" font-family="Arial,sans-serif" font-size="11" fill="#1e3a8a" text-anchor="middle" font-weight="bold">vakuum i väggen</text>
<text x="650" y="408" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">stoppar värmen</text>

<!-- hot chocolate inside -->
<rect x="626" y="230" width="48" height="114" rx="4" fill="#7c2d12" opacity="0.85"/>
<text x="650" y="300" font-family="Arial,sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">varm</text>
<text x="650" y="316" font-family="Arial,sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">choklad</text>

<!-- steam stays warm (small wisps) -->
<path d="M 638 220 Q 632 208 640 200" fill="none" stroke="#dc2626" stroke-width="2" opacity="0.6"/>
<path d="M 662 220 Q 668 208 660 200" fill="none" stroke="#dc2626" stroke-width="2" opacity="0.6"/>

<!-- arrows: vacuum gap blocks heat (like it blocks sound) -->
<line x1="690" y1="260" x2="706" y2="260" stroke="#b91c1c" stroke-width="3"/>
<polygon points="700,260 690,255 690,265" fill="#b91c1c"/>
<line x1="718" y1="246" x2="718" y2="274" stroke="#b91c1c" stroke-width="3"/>

<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Ljud behöver luft att färdas i. I vakuum finns nästan inga molekyler, så ljudet stoppas — precis som termosens vakuum stoppar värmen</text>
</svg>
