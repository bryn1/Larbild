<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Trumhinnan (tunt skinn inne i örat)</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Ljudvågor får trumhinnan att vibrera — då kan vi höra</text>

<!-- Outer ear (pinna) on the left -->
<path d="M 95 200 Q 70 250 100 320 Q 130 360 175 345 L 175 215 Q 140 185 95 200 Z" fill="#fde8d6" stroke="#d97706" stroke-width="2.5"/>
<text x="120" y="400" font-family="Arial,sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="bold">Ytteröra</text>

<!-- Ear canal (hörselgång) -->
<rect x="175" y="240" width="230" height="80" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="285" y="345" font-family="Arial,sans-serif" font-size="13" fill="#b45309" text-anchor="middle">Hörselgång</text>

<!-- Incoming sound waves (curved arcs travelling right into the canal) -->
<path d="M 120 230 Q 145 280 120 330" stroke="#2563eb" stroke-width="2.5" fill="none"/>
<path d="M 150 235 Q 173 280 150 325" stroke="#2563eb" stroke-width="2.5" fill="none"/>
<path d="M 200 245 Q 220 280 200 315" stroke="#2563eb" stroke-width="2.5" fill="none"/>
<path d="M 260 250 Q 278 280 260 310" stroke="#2563eb" stroke-width="2.5" fill="none"/>
<line x1="300" y1="280" x2="395" y2="280" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="408,280 395,285 395,275" fill="#2563eb"/>
<text x="250" y="120" font-family="Arial,sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">Ljudvågor →</text>
<line x1="250" y1="130" x2="250" y2="230" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4,3"/>

<!-- The eardrum: a membrane at the end of the canal, shown vibrating -->
<line x1="405" y1="225" x2="405" y2="335" stroke="#dc2626" stroke-width="4"/>
<!-- vibration shimmer lines -->
<line x1="395" y1="240" x2="415" y2="240" stroke="#f59e0b" stroke-width="2"/>
<line x1="393" y1="280" x2="417" y2="280" stroke="#f59e0b" stroke-width="2"/>
<line x1="395" y1="320" x2="415" y2="320" stroke="#f59e0b" stroke-width="2"/>
<text x="405" y="365" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">vibrerar</text>

<!-- Label for eardrum with leader line -->
<line x1="405" y1="200" x2="500" y2="160" stroke="#dc2626" stroke-width="1.5"/>
<text x="505" y="157" font-family="Arial,sans-serif" font-size="16" fill="#dc2626" text-anchor="start" font-weight="bold">Trumhinna</text>
<text x="505" y="177" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="start">tunt, spänt skinn</text>

<!-- Middle ear / continuation to brain -->
<path d="M 420 280 Q 520 280 560 250" stroke="#16a34a" stroke-width="2.5" fill="none"/>
<polygon points="566,246 553,247 558,255" fill="#16a34a"/>
<text x="620" y="240" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle">Signal vidare</text>
<text x="620" y="258" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle">till hjärnan</text>

<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">När ljudvågor träffar trumhinnan vibrerar den, och vibrationerna gör att vi kan höra</text>
</svg>
