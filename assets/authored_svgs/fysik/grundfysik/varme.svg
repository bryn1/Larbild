<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Värme (energi från varmt till kallt)</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Värmen flyttar sig tills temperaturen blir lika överallt</text>

<!-- Hot object (left) -->
<rect x="100" y="150" width="150" height="150" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
<text x="175" y="135" font-family="Arial,sans-serif" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">Varmt</text>
<text x="175" y="220" font-family="Arial,sans-serif" font-size="20" fill="#dc2626" text-anchor="middle" font-weight="bold">80 °C</text>
<text x="175" y="250" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">kaffekoppen</text>

<!-- Cold object (right) -->
<rect x="550" y="150" width="150" height="150" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="625" y="135" font-family="Arial,sans-serif" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">Kallt</text>
<text x="625" y="220" font-family="Arial,sans-serif" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="bold">10 °C</text>
<text x="625" y="250" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">dina händer</text>

<!-- Heat flow arrows from hot to cold (left -> right) -->
<line x1="260" y1="190" x2="540" y2="190" stroke="#f59e0b" stroke-width="4"/>
<polygon points="552,190 540,195 540,185" fill="#f59e0b"/>
<line x1="260" y1="225" x2="540" y2="225" stroke="#f59e0b" stroke-width="4"/>
<polygon points="552,225 540,230 540,220" fill="#f59e0b"/>
<line x1="260" y1="260" x2="540" y2="260" stroke="#f59e0b" stroke-width="4"/>
<polygon points="552,260 540,265 540,255" fill="#f59e0b"/>
<text x="400" y="175" font-family="Arial,sans-serif" font-size="15" fill="#b45309" text-anchor="middle" font-weight="bold">Värme →</text>
<text x="400" y="285" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">energin flödar alltid mot det kallare</text>

<!-- AFTER: arrow down to the "until equal" state -->
<line x1="400" y1="320" x2="400" y2="355" stroke="#374151" stroke-width="2"/>
<polygon points="400,368 394,355 406,355" fill="#374151"/>
<text x="450" y="345" font-family="Arial,sans-serif" font-size="12" fill="#374151" text-anchor="start">efter en stund</text>

<!-- equal temperature result -->
<rect x="250" y="375" width="140" height="70" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2.5"/>
<text x="320" y="405" font-family="Arial,sans-serif" font-size="14" fill="#374151" text-anchor="middle">45 °C</text>
<text x="320" y="428" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">lika varmt</text>
<rect x="410" y="375" width="140" height="70" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2.5"/>
<text x="480" y="405" font-family="Arial,sans-serif" font-size="14" fill="#374151" text-anchor="middle">45 °C</text>
<text x="480" y="428" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">lika varmt</text>
<text x="400" y="463" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="bold">samma temperatur — värmeflödet stannar</text>

<text x="400" y="490" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Värme är energi som flyttar från det varma till det kalla tills temperaturen blir lika</text>
</svg>
