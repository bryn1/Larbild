<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Tyngdkraft (drar allt neråt mot marken)</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Därför faller saker när man släpper dem</text>

<!-- APPLE (left): clearly an apple, big, labelled -->
<text x="245" y="105" font-family="Arial,sans-serif" font-size="18" fill="#7c2d12" text-anchor="middle" font-weight="bold">Äpple</text>
<path d="M 245 125 q 4 -14 16 -16" fill="none" stroke="#15803d" stroke-width="3"/>
<ellipse cx="268" cy="112" rx="13" ry="7" fill="#16a34a"/>
<line x1="245" y1="125" x2="245" y2="135" stroke="#5b3a1a" stroke-width="3"/>
<path d="M 245 140 C 215 140 210 175 222 195 C 230 210 245 212 245 212 C 245 212 260 210 268 195 C 280 175 275 140 245 140 Z" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
<!-- gravity arrow from apple -->
<line x1="245" y1="218" x2="245" y2="350" stroke="#dc2626" stroke-width="5"/>
<polygon points="245,368 236,348 254,348" fill="#dc2626"/>
<text x="270" y="295" font-family="Arial,sans-serif" font-size="16" fill="#dc2626" text-anchor="start" font-weight="bold">Tyngdkraft</text>
<text x="270" y="316" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="start">drar neråt</text>

<!-- BALL (right): clearly a ball, big, labelled, distinct (striped) -->
<text x="560" y="105" font-family="Arial,sans-serif" font-size="18" fill="#1e40af" text-anchor="middle" font-weight="bold">Boll</text>
<circle cx="560" cy="175" r="40" fill="#2563eb" stroke="#1e3a8a" stroke-width="2.5"/>
<path d="M 528 158 Q 560 150 592 158" fill="none" stroke="white" stroke-width="2.5"/>
<path d="M 522 190 Q 560 200 598 190" fill="none" stroke="white" stroke-width="2.5"/>
<path d="M 560 135 Q 545 175 560 215" fill="none" stroke="white" stroke-width="2.5"/>
<!-- gravity arrow from ball -->
<line x1="560" y1="218" x2="560" y2="350" stroke="#dc2626" stroke-width="5"/>
<polygon points="560,368 551,348 569,348" fill="#dc2626"/>
<text x="585" y="295" font-family="Arial,sans-serif" font-size="16" fill="#dc2626" text-anchor="start" font-weight="bold">Tyngdkraft</text>
<text x="585" y="316" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="start">drar neråt</text>

<!-- ground / Earth -->
<path d="M 60 390 Q 400 355 740 390 L 740 455 L 60 455 Z" fill="#16a34a" stroke="#15803d" stroke-width="2.5"/>
<rect x="60" y="430" width="680" height="25" fill="#92400e"/>
<text x="400" y="420" font-family="Arial,sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">JORDEN (marken)</text>
<text x="400" y="448" font-family="Arial,sans-serif" font-size="12" fill="#fde68a" text-anchor="middle">jorden drar alla föremål mot sin mitt</text>

<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Tyngdkraften drar alla föremål neråt mot jordens yta</text>
</svg>
