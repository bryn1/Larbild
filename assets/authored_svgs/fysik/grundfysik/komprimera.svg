<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Komprimera — trycka ihop luft</text>
<!-- BEFORE cylinder -->
<text x="180" y="90" font-family="Arial,sans-serif" font-size="16" fill="#1e40af" text-anchor="middle" font-weight="bold">Före</text>
<rect x="110" y="110" width="140" height="240" fill="#eff6ff" stroke="#1e40af" stroke-width="3"/>
<!-- piston near top -->
<rect x="113" y="120" width="134" height="18" fill="#6b7280" stroke="#374151" stroke-width="1.5"/>
<line x1="180" y1="120" x2="180" y2="95" stroke="#374151" stroke-width="5"/>
<!-- air particles spread out -->
<circle cx="140" cy="180" r="7" fill="#2563eb"/><circle cx="200" cy="175" r="7" fill="#2563eb"/><circle cx="160" cy="220" r="7" fill="#2563eb"/>
<circle cx="215" cy="230" r="7" fill="#2563eb"/><circle cx="135" cy="260" r="7" fill="#2563eb"/><circle cx="190" cy="280" r="7" fill="#2563eb"/>
<circle cx="225" cy="300" r="7" fill="#2563eb"/><circle cx="150" cy="315" r="7" fill="#2563eb"/>
<text x="180" y="375" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Stor volym</text>
<text x="180" y="393" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">luften glest</text>
<!-- arrow -->
<line x1="330" y1="230" x2="430" y2="230" stroke="#dc2626" stroke-width="4"/>
<polygon points="445,230 428,238 428,222" fill="#dc2626"/>
<text x="388" y="215" font-family="Arial,sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold">tryck</text>
<text x="388" y="258" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">ner kolven</text>
<!-- AFTER cylinder -->
<text x="620" y="90" font-family="Arial,sans-serif" font-size="16" fill="#1e40af" text-anchor="middle" font-weight="bold">Efter</text>
<rect x="550" y="110" width="140" height="240" fill="#eff6ff" stroke="#1e40af" stroke-width="3"/>
<!-- piston pushed far down -->
<line x1="620" y1="225" x2="620" y2="95" stroke="#374151" stroke-width="5"/>
<rect x="553" y="225" width="134" height="18" fill="#6b7280" stroke="#374151" stroke-width="1.5"/>
<!-- air compressed into small bottom region, particles dense -->
<circle cx="572" cy="265" r="7" fill="#dc2626"/><circle cx="600" cy="262" r="7" fill="#dc2626"/><circle cx="628" cy="265" r="7" fill="#dc2626"/><circle cx="658" cy="262" r="7" fill="#dc2626"/>
<circle cx="575" cy="295" r="7" fill="#dc2626"/><circle cx="603" cy="298" r="7" fill="#dc2626"/><circle cx="633" cy="295" r="7" fill="#dc2626"/><circle cx="662" cy="298" r="7" fill="#dc2626"/>
<circle cx="588" cy="325" r="7" fill="#dc2626"/><circle cx="618" cy="328" r="7" fill="#dc2626"/><circle cx="648" cy="325" r="7" fill="#dc2626"/>
<text x="620" y="375" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Liten volym</text>
<text x="620" y="393" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">luften tätt</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Att komprimera betyder att trycka ihop så att samma luft tar mindre plats</text>
</svg>