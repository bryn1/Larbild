<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Elektron (laddning −1)</text>

<!-- nucleus (positive) -->
<circle cx="360" cy="250" r="30" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="360" y="248" font-family="Arial,sans-serif" font-size="12" fill="#92400e" text-anchor="middle">kärna</text>
<text x="360" y="264" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">(+)</text>

<!-- orbit -->
<circle cx="360" cy="250" r="140" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>

<!-- the electron on the orbit (upper right) -->
<circle cx="459" cy="151" r="17" fill="#2563eb" stroke="#1e40af" stroke-width="2.5"/>
<text x="459" y="156" font-family="Arial,sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">e−</text>

<!-- single clean leader line from label box to electron (NO arrow above the electron) -->
<line x1="585" y1="150" x2="478" y2="150" stroke="#1f2937" stroke-width="1.5"/>
<rect x="585" y="120" width="200" height="62" rx="6" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="685" y="144" font-family="Arial,sans-serif" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="bold">Elektron</text>
<text x="685" y="165" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">negativ laddning (−1)</text>

<text x="400" y="395" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">Elektronen är en mycket liten, negativt laddad partikel</text>
<text x="400" y="420" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Den susar runt utanför atomkärnan</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Elektronen är en lätt, negativt laddad partikel utanför kärnan</text>
</svg>
