<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Solkurva på järnvägsräls</text>
<!-- BEFORE: straight rail (cool) -->
<text x="400" y="105" font-family="Arial,sans-serif" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">Sval räls — rak</text>
<!-- sleepers -->
<rect x="120" y="140" width="20" height="50" fill="#92400e"/><rect x="220" y="140" width="20" height="50" fill="#92400e"/><rect x="320" y="140" width="20" height="50" fill="#92400e"/><rect x="420" y="140" width="20" height="50" fill="#92400e"/><rect x="520" y="140" width="20" height="50" fill="#92400e"/><rect x="620" y="140" width="20" height="50" fill="#92400e"/>
<line x1="110" y1="150" x2="690" y2="150" stroke="#6b7280" stroke-width="5"/>
<line x1="110" y1="180" x2="690" y2="180" stroke="#6b7280" stroke-width="5"/>
<!-- sun heating -->
<circle cx="600" cy="280" r="34" fill="#fde047" stroke="#f59e0b" stroke-width="2"/>
<line x1="600" y1="234" x2="600" y2="218" stroke="#f59e0b" stroke-width="3"/>
<line x1="645" y1="258" x2="660" y2="248" stroke="#f59e0b" stroke-width="3"/>
<line x1="645" y1="302" x2="660" y2="312" stroke="#f59e0b" stroke-width="3"/>
<text x="600" y="345" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">Stark sol värmer</text>
<!-- AFTER: buckled rail (hot) -->
<text x="400" y="380" font-family="Arial,sans-serif" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">Het räls — buktar ut (solkurva)</text>
<!-- sleepers below -->
<rect x="120" y="395" width="20" height="40" fill="#92400e"/><rect x="220" y="395" width="20" height="40" fill="#92400e"/><rect x="420" y="395" width="20" height="40" fill="#92400e"/><rect x="540" y="395" width="20" height="40" fill="#92400e"/><rect x="630" y="395" width="20" height="40" fill="#92400e"/>
<!-- buckled rails: wavy path -->
<path d="M 110 410 Q 250 410 320 360 Q 390 410 530 410" fill="none" stroke="#dc2626" stroke-width="5"/>
<path d="M 110 430 Q 250 430 320 385 Q 390 430 530 430" fill="none" stroke="#dc2626" stroke-width="5"/>
<line x1="530" y1="410" x2="690" y2="410" stroke="#6b7280" stroke-width="5"/>
<line x1="530" y1="430" x2="690" y2="430" stroke="#6b7280" stroke-width="5"/>
<!-- expansion arrows pushing inward (rail got longer) -->
<line x1="160" y1="450" x2="240" y2="450" stroke="#16a34a" stroke-width="3"/><polygon points="252,450 235,442 235,458" fill="#16a34a"/>
<line x1="480" y1="450" x2="400" y2="450" stroke="#16a34a" stroke-width="3"/><polygon points="388,450 405,442 405,458" fill="#16a34a"/>
<text x="320" y="465" font-family="Arial,sans-serif" font-size="11" fill="#16a34a" text-anchor="middle">metallen utvidgas</text>
<text x="400" y="490" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Solen värmer metallen som utvidgas och buktar ut till en solkurva</text>
</svg>