<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Yta (storleken på ett platt område)</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Ytan mäts i kvadratmeter (m²)</text>

<!-- a realistic tabletop: 2,0 m long x 1,2 m wide -->
<rect x="240" y="120" width="320" height="192" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
<!-- light grid: 5 cols x 3 rows of 0,4 m squares -->
<line x1="304" y1="120" x2="304" y2="312" stroke="#f59e0b" stroke-width="1"/>
<line x1="368" y1="120" x2="368" y2="312" stroke="#f59e0b" stroke-width="1"/>
<line x1="432" y1="120" x2="432" y2="312" stroke="#f59e0b" stroke-width="1"/>
<line x1="496" y1="120" x2="496" y2="312" stroke="#f59e0b" stroke-width="1"/>
<line x1="240" y1="184" x2="560" y2="184" stroke="#f59e0b" stroke-width="1"/>
<line x1="240" y1="248" x2="560" y2="248" stroke="#f59e0b" stroke-width="1"/>
<!-- one unit square highlighted -->
<rect x="240" y="120" width="64" height="64" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
<text x="272" y="157" font-family="Arial,sans-serif" font-size="10" fill="#7c2d12" text-anchor="middle">0,4 m</text>

<text x="400" y="222" font-family="Arial,sans-serif" font-size="15" fill="#7c2d12" text-anchor="middle" font-weight="bold">Bordets yta</text>

<!-- length measurement (bottom) -->
<line x1="240" y1="335" x2="560" y2="335" stroke="#16a34a" stroke-width="2"/>
<line x1="240" y1="327" x2="240" y2="343" stroke="#16a34a" stroke-width="2"/>
<line x1="560" y1="327" x2="560" y2="343" stroke="#16a34a" stroke-width="2"/>
<text x="400" y="357" font-family="Arial,sans-serif" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="bold">längd = 2,0 m</text>

<!-- width measurement (left) -->
<line x1="215" y1="120" x2="215" y2="312" stroke="#16a34a" stroke-width="2"/>
<line x1="207" y1="120" x2="223" y2="120" stroke="#16a34a" stroke-width="2"/>
<line x1="207" y1="312" x2="223" y2="312" stroke="#16a34a" stroke-width="2"/>
<text x="150" y="210" font-family="Arial,sans-serif" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="bold">bredd</text>
<text x="150" y="228" font-family="Arial,sans-serif" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="bold">= 1,2 m</text>

<!-- area formula result -->
<rect x="170" y="395" width="460" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="400" y="425" font-family="Arial,sans-serif" font-size="16" fill="#1e40af" text-anchor="middle" font-weight="bold">Yta = längd × bredd = 2,0 × 1,2 = 2,4 m²</text>

<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Ytan är storleken på ett platt område, mätt i kvadratmeter</text>
</svg>
