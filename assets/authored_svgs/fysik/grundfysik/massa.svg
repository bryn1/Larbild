<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Massa</text>
<!-- divider -->
<line x1="400" y1="80" x2="400" y2="400" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,5"/>
<!-- LEFT: Earth -->
<text x="200" y="100" font-family="Arial,sans-serif" font-size="16" fill="#1e40af" text-anchor="middle" font-weight="bold">På jorden</text>
<circle cx="200" cy="160" r="32" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
<path d="M 175 150 q 15 -8 30 2 q 12 6 18 -2" fill="none" stroke="#16a34a" stroke-width="3"/>
<!-- carton -->
<rect x="160" y="250" width="80" height="90" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="200" y="300" font-family="Arial,sans-serif" font-size="14" fill="#92400e" text-anchor="middle" font-weight="bold">1 kg</text>
<!-- weight (heavier) arrow -->
<line x1="270" y1="270" x2="270" y2="330" stroke="#dc2626" stroke-width="5"/>
<polygon points="270,342 261,323 279,323" fill="#dc2626"/>
<text x="305" y="305" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">tyngd</text>
<text x="305" y="320" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">stor</text>
<text x="200" y="380" font-family="Arial,sans-serif" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="bold">Massa = 1 kg</text>
<!-- RIGHT: Moon -->
<text x="600" y="100" font-family="Arial,sans-serif" font-size="16" fill="#1e40af" text-anchor="middle" font-weight="bold">På månen</text>
<circle cx="600" cy="160" r="32" fill="#d1d5db" stroke="#6b7280" stroke-width="2"/>
<circle cx="588" cy="152" r="6" fill="#9ca3af"/><circle cx="610" cy="168" r="5" fill="#9ca3af"/><circle cx="605" cy="148" r="4" fill="#9ca3af"/>
<!-- same carton -->
<rect x="560" y="250" width="80" height="90" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="600" y="300" font-family="Arial,sans-serif" font-size="14" fill="#92400e" text-anchor="middle" font-weight="bold">1 kg</text>
<!-- weight (lighter) arrow -->
<line x1="670" y1="290" x2="670" y2="320" stroke="#dc2626" stroke-width="5"/>
<polygon points="670,332 661,313 679,313" fill="#dc2626"/>
<text x="705" y="305" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">tyngd</text>
<text x="705" y="320" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">liten</text>
<text x="600" y="380" font-family="Arial,sans-serif" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="bold">Massa = 1 kg</text>
<text x="400" y="430" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">Massan är densamma överallt — bara tyngden ändras</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Massa = hur mycket material ett föremål innehåller, mäts i kg</text>
</svg>