<!-- row 3 -->
<g>
<circle cx="140" cy="300" r="7" fill="#1e40af"/>
<line x1="147" y1="300" x2="178" y2="300" stroke="#1e40af" stroke-width="2.5"/>
<polygon points="188,300 178,304 178,296" fill="#1e40af"/>
</g>
