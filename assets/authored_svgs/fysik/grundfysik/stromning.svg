<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Strömning (vätska eller gas i rörelse)</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Många partiklar rör sig åt samma håll — ett flöde</text>

<!-- A pipe / channel containing the flow -->
<rect x="90" y="150" width="620" height="200" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="120" y="142" font-family="Arial,sans-serif" font-size="13" fill="#2563eb" text-anchor="start">Rör / kanal</text>

<!-- Streamlines: smooth horizontal flow lines with arrowheads pointing right -->
<line x1="120" y1="185" x2="650" y2="185" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="662,185 650,189 650,181" fill="#2563eb"/>
<line x1="120" y1="220" x2="650" y2="220" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="662,220 650,224 650,216" fill="#2563eb"/>
<line x1="120" y1="255" x2="650" y2="255" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="662,255 650,259 650,251" fill="#2563eb"/>
<line x1="120" y1="290" x2="650" y2="290" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="662,290 650,294 650,286" fill="#2563eb"/>
<line x1="120" y1="325" x2="650" y2="325" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="662,325 650,329 650,321" fill="#2563eb"/>

<!-- Particles riding the flow (small dots) -->
<circle cx="200" cy="185" r="5" fill="#1e40af"/>
<circle cx="350" cy="220" r="5" fill="#1e40af"/>
<circle cx="280" cy="290" r="5" fill="#1e40af"/>
<circle cx="450" cy="255" r="5" fill="#1e40af"/>
<circle cx="520" cy="325" r="5" fill="#1e40af"/>
<circle cx="400" cy="185" r="5" fill="#1e40af"/>

<!-- Direction label -->
<text x="400" y="395" font-family="Arial,sans-serif" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold">Strömningsriktning →</text>

<!-- Everyday example caption: cold air from fridge -->
<text x="400" y="430" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle">T.ex. kall luft som strömmar ut ur kylskåpet</text>

<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Vid strömning rör sig partiklarna i en vätska eller gas tillsammans åt samma håll</text>
</svg>
