<text x="400" y="395" font-family="Arial,sans-serif" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold">Strömningsriktning →</text>
<text x="400" y="425" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle">Varje partikel rör sig — pilen sitter på partikeln</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Vid strömning rör sig partiklarna i en vätska eller gas tillsammans åt samma håll</text>
</svg>
