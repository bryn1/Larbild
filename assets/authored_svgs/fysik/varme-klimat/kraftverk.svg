<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Kraftverk</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Gör om en energikälla till elektrisk energi som skickas ut på elnätet</text>

<!-- Step 1: energy source -->
<rect x="50" y="200" width="150" height="90" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
<text x="125" y="235" font-family="Arial,sans-serif" font-size="14" fill="#92400e" text-anchor="middle" font-weight="bold">Energikälla</text>
<text x="125" y="258" font-family="Arial,sans-serif" font-size="12" fill="#92400e" text-anchor="middle">vatten · vind</text>
<text x="125" y="275" font-family="Arial,sans-serif" font-size="12" fill="#92400e" text-anchor="middle">bränsle</text>

<line x1="200" y1="245" x2="245" y2="245" stroke="#1f2937" stroke-width="3"/>
<polygon points="255,245 243,240 243,250" fill="#1f2937"/>

<!-- Step 2: turbine -->
<rect x="260" y="200" width="120" height="90" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="4"/>
<text x="320" y="232" font-family="Arial,sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">Turbin</text>
<circle cx="320" cy="262" r="18" fill="none" stroke="#2563eb" stroke-width="2"/>
<line x1="320" y1="244" x2="320" y2="280" stroke="#2563eb" stroke-width="2"/>
<line x1="302" y1="262" x2="338" y2="262" stroke="#2563eb" stroke-width="2"/>

<line x1="380" y1="245" x2="425" y2="245" stroke="#1f2937" stroke-width="3"/>
<polygon points="435,245 423,240 423,250" fill="#1f2937"/>

<!-- Step 3: generator -->
<rect x="440" y="200" width="130" height="90" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="4"/>
<text x="505" y="232" font-family="Arial,sans-serif" font-size="14" fill="#15803d" text-anchor="middle" font-weight="bold">Generator</text>
<text x="505" y="258" font-family="Arial,sans-serif" font-size="12" fill="#15803d" text-anchor="middle">ger</text>
<text x="505" y="275" font-family="Arial,sans-serif" font-size="13" fill="#15803d" text-anchor="middle" font-weight="bold">elektricitet</text>

<line x1="570" y1="245" x2="615" y2="245" stroke="#dc2626" stroke-width="3"/>
<polygon points="625,245 613,240 613,250" fill="#dc2626"/>

<!-- Step 4: power line / grid -->
<line x1="660" y1="160" x2="660" y2="330" stroke="#6b7280" stroke-width="4"/>
<line x1="630" y1="180" x2="700" y2="180" stroke="#6b7280" stroke-width="3"/>
<line x1="635" y1="205" x2="695" y2="205" stroke="#6b7280" stroke-width="3"/>
<line x1="660" y1="180" x2="730" y2="245" stroke="#dc2626" stroke-width="2"/>
<text x="690" y="350" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Elnätet</text>
<text x="690" y="368" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">→ till hemmen</text>

<text x="400" y="430" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Rörelse → turbin snurrar → generator → elektrisk energi</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Strömmen som laddar din mobil kommer från ett kraftverk långt bort</text>
</svg>
