<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Högspänningsel</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Hög spänning gör att lite energi försvinner på långa sträckor</text>

<!-- ground -->
<line x1="40" y1="350" x2="760" y2="350" stroke="#15803d" stroke-width="2"/>
<rect x="40" y="350" width="720" height="40" fill="#dcfce7"/>

<!-- Power plant left -->
<rect x="50" y="270" width="110" height="80" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="105" y="255" font-family="Arial,sans-serif" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="bold">Kraftverk</text>

<!-- step-up transformer -->
<rect x="175" y="295" width="55" height="55" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="202" y="320" font-family="Arial,sans-serif" font-size="10" fill="#92400e" text-anchor="middle">upp-</text>
<text x="202" y="333" font-family="Arial,sans-serif" font-size="10" fill="#92400e" text-anchor="middle">trafo</text>

<!-- pylon 1 -->
<polygon points="300,350 285,150 315,150" fill="none" stroke="#6b7280" stroke-width="3"/>
<line x1="270" y1="170" x2="330" y2="170" stroke="#6b7280" stroke-width="3"/>
<line x1="278" y1="200" x2="322" y2="200" stroke="#6b7280" stroke-width="3"/>
<line x1="290" y1="250" x2="310" y2="250" stroke="#6b7280" stroke-width="2"/>
<!-- pylon 2 -->
<polygon points="500,350 485,150 515,150" fill="none" stroke="#6b7280" stroke-width="3"/>
<line x1="470" y1="170" x2="530" y2="170" stroke="#6b7280" stroke-width="3"/>
<line x1="478" y1="200" x2="522" y2="200" stroke="#6b7280" stroke-width="3"/>
<line x1="490" y1="250" x2="510" y2="250" stroke="#6b7280" stroke-width="2"/>

<!-- high voltage cables (sagging) -->
<path d="M 270 170 Q 385 200 470 170" fill="none" stroke="#dc2626" stroke-width="2.5"/>
<path d="M 278 200 Q 390 230 522 200" fill="none" stroke="#dc2626" stroke-width="2.5"/>
<path d="M 230 310 Q 250 250 270 200" fill="none" stroke="#dc2626" stroke-width="2.5"/>
<text x="385" y="150" font-family="Arial,sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold">400 000 V</text>
<text x="385" y="135" font-family="Arial,sans-serif" font-size="11" fill="#991b1b" text-anchor="middle">hög spänning – små förluster</text>

<!-- step-down transformer -->
<rect x="570" y="295" width="55" height="55" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="597" y="320" font-family="Arial,sans-serif" font-size="10" fill="#92400e" text-anchor="middle">ner-</text>
<text x="597" y="333" font-family="Arial,sans-serif" font-size="10" fill="#92400e" text-anchor="middle">trafo</text>
<path d="M 522 200 Q 550 250 597 295" fill="none" stroke="#dc2626" stroke-width="2.5"/>

<!-- house -->
<rect x="670" y="305" width="70" height="45" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<polygon points="665,305 745,305 705,280" fill="#16a34a"/>
<text x="705" y="332" font-family="Arial,sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="bold">230 V</text>
<line x1="625" y1="322" x2="668" y2="322" stroke="#16a34a" stroke-width="3"/>
<polygon points="668,322 658,318 658,326" fill="#16a34a"/>

<text x="400" y="420" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Spänningen höjs för transporten och sänks igen nära hemmet</text>
<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Hög spänning på långa ledningar minskar energiförlusten i kablarna</text>
</svg>
