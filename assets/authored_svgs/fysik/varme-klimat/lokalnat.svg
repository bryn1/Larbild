<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Lokalnät</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">De sista elledningarna fram till husen — lägre spänning än de stora ledningarna</text>

<!-- Region in (gray) -->
<line x1="70" y1="140" x2="70" y2="220" stroke="#6b7280" stroke-width="3"/>
<line x1="50" y1="160" x2="90" y2="160" stroke="#6b7280" stroke-width="2"/>
<text x="70" y="245" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Regionnät</text>

<!-- Local transformer (kiosk) -->
<rect x="150" y="160" width="80" height="70" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="3"/>
<text x="190" y="188" font-family="Arial,sans-serif" font-size="10" fill="#92400e" text-anchor="middle" font-weight="bold">Nät-</text>
<text x="190" y="202" font-family="Arial,sans-serif" font-size="10" fill="#92400e" text-anchor="middle">station</text>
<text x="190" y="220" font-family="Arial,sans-serif" font-size="9" fill="#92400e" text-anchor="middle">230/400 V</text>
<line x1="70" y1="170" x2="150" y2="190" stroke="#9ca3af" stroke-width="3"/>

<!-- LOKALNÄT: red line to houses -->
<rect x="250" y="105" width="230" height="26" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="3"/>
<text x="365" y="123" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">LOKALNÄT 230 V / 400 V</text>
<line x1="230" y1="190" x2="365" y2="160" stroke="#dc2626" stroke-width="4"/>
<line x1="365" y1="160" x2="660" y2="160" stroke="#dc2626" stroke-width="4"/>
<line x1="430" y1="160" x2="430" y2="260" stroke="#dc2626" stroke-width="3"/>
<line x1="560" y1="160" x2="560" y2="260" stroke="#dc2626" stroke-width="3"/>
<line x1="660" y1="160" x2="660" y2="260" stroke="#dc2626" stroke-width="3"/>

<!-- Three houses -->
<g>
<rect x="400" y="260" width="60" height="50" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<polygon points="395,260 430,235 465,260" fill="#2563eb"/>
</g>
<g>
<rect x="530" y="260" width="60" height="50" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<polygon points="525,260 560,235 595,260" fill="#2563eb"/>
</g>
<g>
<rect x="630" y="260" width="60" height="50" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<polygon points="625,260 660,235 695,260" fill="#2563eb"/>
</g>
<text x="545" y="330" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="bold">Husen i området</text>

<text x="290" y="385" font-family="Arial,sans-serif" font-size="14" fill="#6b7280" text-anchor="end">Stamnät  →  Regionnät  →  </text>
<text x="296" y="385" font-family="Arial,sans-serif" font-size="14" fill="#dc2626" text-anchor="start" font-weight="bold">Lokalnät (lägst spänning)</text>

<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Sladden till din spis får strömmen via lokalnätet i din gata</text>
</svg>
