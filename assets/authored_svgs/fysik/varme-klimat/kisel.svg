<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Kisel (Si)</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Ett grundämne i sand och sten – används i solceller och datachip</text>

<!-- element box, periodic-table style -->
<rect x="330" y="90" width="140" height="120" fill="#dbeafe" stroke="#1e40af" stroke-width="3" rx="4"/>
<text x="345" y="120" font-family="Arial,sans-serif" font-size="14" fill="#1e40af" text-anchor="start">14</text>
<text x="400" y="165" font-family="Arial,sans-serif" font-size="40" fill="#1e40af" text-anchor="middle" font-weight="bold">Si</text>
<text x="400" y="195" font-family="Arial,sans-serif" font-size="13" fill="#1e40af" text-anchor="middle">Kisel</text>

<!-- Source: sand -->
<ellipse cx="160" cy="320" rx="80" ry="45" fill="#fde68a" stroke="#ca8a04" stroke-width="2"/>
<circle cx="130" cy="315" r="3" fill="#a16207"/>
<circle cx="160" cy="305" r="3" fill="#a16207"/>
<circle cx="185" cy="320" r="3" fill="#a16207"/>
<circle cx="145" cy="330" r="3" fill="#a16207"/>
<circle cx="175" cy="335" r="3" fill="#a16207"/>
<text x="160" y="390" font-family="Arial,sans-serif" font-size="14" fill="#92400e" text-anchor="middle" font-weight="bold">Sand &amp; sten</text>
<text x="160" y="408" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">här finns kisel</text>

<!-- Use 1: solar cell -->
<rect x="380" y="280" width="90" height="70" fill="#1e3a8a" stroke="#1e40af" stroke-width="2"/>
<line x1="380" y1="303" x2="470" y2="303" stroke="#3b82f6" stroke-width="1"/>
<line x1="380" y1="326" x2="470" y2="326" stroke="#3b82f6" stroke-width="1"/>
<line x1="410" y1="280" x2="410" y2="350" stroke="#3b82f6" stroke-width="1"/>
<line x1="440" y1="280" x2="440" y2="350" stroke="#3b82f6" stroke-width="1"/>
<text x="425" y="390" font-family="Arial,sans-serif" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="bold">Solcell</text>
<text x="425" y="408" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">gör el av ljus</text>

<!-- Use 2: computer chip -->
<rect x="590" y="285" width="80" height="65" fill="#16a34a" stroke="#15803d" stroke-width="2" rx="3"/>
<rect x="608" y="300" width="44" height="35" fill="#052e16"/>
<line x1="590" y1="300" x2="578" y2="300" stroke="#15803d" stroke-width="2"/>
<line x1="590" y1="320" x2="578" y2="320" stroke="#15803d" stroke-width="2"/>
<line x1="670" y1="300" x2="682" y2="300" stroke="#15803d" stroke-width="2"/>
<line x1="670" y1="320" x2="682" y2="320" stroke="#15803d" stroke-width="2"/>
<text x="630" y="390" font-family="Arial,sans-serif" font-size="14" fill="#15803d" text-anchor="middle" font-weight="bold">Datachip</text>
<text x="630" y="408" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">i mobil &amp; dator</text>

<!-- arrows from element to uses -->
<line x1="240" y1="300" x2="375" y2="300" stroke="#1f2937" stroke-width="2"/>
<polygon points="378,300 368,295 368,305" fill="#1f2937"/>
<line x1="470" y1="240" x2="600" y2="280" stroke="#1f2937" stroke-width="2"/>
<polygon points="608,283 596,280 600,272" fill="#1f2937"/>

<text x="400" y="460" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Kisel renas ur sand och blir solceller och chip som styr elektronik</text>
</svg>
