<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Bergvärme</text>

<!-- sky -->
<rect x="0" y="50" width="800" height="120" fill="#dbeafe"/>
<!-- ground -->
<rect x="0" y="170" width="800" height="290" fill="#fde68a"/>
<!-- deeper warm rock -->
<rect x="0" y="320" width="800" height="140" fill="#fca5a5"/>
<line x1="0" y1="170" x2="800" y2="170" stroke="#a16207" stroke-width="2"/>
<text x="120" y="195" font-family="Arial,sans-serif" font-size="13" fill="#92400e" text-anchor="middle">Marknivå</text>
<text x="120" y="360" font-family="Arial,sans-serif" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="bold">Varmt berg</text>

<!-- house -->
<rect x="120" y="100" width="120" height="70" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
<polygon points="110,100 250,100 180,65" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
<rect x="160" y="130" width="40" height="40" fill="#2563eb"/>
<text x="180" y="90" font-family="Arial,sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">Hus</text>

<!-- heat pump box -->
<rect x="280" y="120" width="70" height="50" fill="#e5e7eb" stroke="#6b7280" stroke-width="2" rx="3"/>
<text x="315" y="150" font-family="Arial,sans-serif" font-size="10" fill="#1f2937" text-anchor="middle">Värme-</text>
<text x="315" y="163" font-family="Arial,sans-serif" font-size="10" fill="#1f2937" text-anchor="middle">pump</text>

<!-- borehole U-loop -->
<rect x="395" y="170" width="14" height="250" fill="#93c5fd"/>
<rect x="431" y="170" width="14" height="250" fill="#fca5a5"/>
<path d="M 395 420 Q 420 450 445 420" fill="none" stroke="#1f2937" stroke-width="3"/>
<path d="M 409 170 L 409 405 Q 420 425 431 405 L 431 170" fill="none" stroke="#1f2937" stroke-width="2"/>

<!-- arrows: cold down, warm up -->
<line x1="402" y1="200" x2="402" y2="380" stroke="#2563eb" stroke-width="3"/>
<polygon points="402,390 397,378 407,378" fill="#2563eb"/>
<text x="372" y="290" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">kall</text>
<text x="372" y="305" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">vätska</text>

<line x1="438" y1="380" x2="438" y2="185" stroke="#dc2626" stroke-width="3"/>
<polygon points="438,175 433,187 443,187" fill="#dc2626"/>
<text x="478" y="290" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">varm</text>
<text x="478" y="305" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">vätska</text>

<!-- connection pump to borehole top -->
<line x1="350" y1="145" x2="420" y2="145" stroke="#6b7280" stroke-width="3"/>
<line x1="420" y1="145" x2="420" y2="170" stroke="#6b7280" stroke-width="3"/>
<!-- house to pump -->
<line x1="240" y1="145" x2="280" y2="145" stroke="#dc2626" stroke-width="3"/>

<text x="620" y="250" font-family="Arial,sans-serif" font-size="13" fill="#991b1b" text-anchor="middle">Hål borrat</text>
<text x="620" y="268" font-family="Arial,sans-serif" font-size="13" fill="#991b1b" text-anchor="middle">ner i berget</text>
<text x="620" y="286" font-family="Arial,sans-serif" font-size="13" fill="#991b1b" text-anchor="middle">(ofta 100–200 m)</text>

<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">En vätska hämtar upp värme från berget och pumpen ger huset varma element</text>
</svg>
