<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Skvaltkvarn</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">En enkel vattenkvarn: ett liggande hjul snurrar av vattnet och driver kvarnstenen</text>

<!-- Mill house -->
<rect x="120" y="120" width="220" height="120" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
<polygon points="110,120 230,75 350,120" fill="#92400e"/>
<text x="230" y="190" font-family="Arial,sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="bold">Kvarnhus</text>

<!-- Kvarnsten (millstone) inside, with vertical axle -->
<ellipse cx="230" cy="225" rx="55" ry="14" fill="#9ca3af" stroke="#4b5563" stroke-width="2"/>
<text x="230" y="212" font-family="Arial,sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">Kvarnsten</text>
<!-- vertical axle from millstone down to wheel -->
<rect x="225" y="225" width="10" height="160" fill="#6b7280"/>
<line x1="270" y1="225" x2="380" y2="225" stroke="#4b5563" stroke-width="1"/>
<text x="450" y="222" font-family="Arial,sans-serif" font-size="12" fill="#4b5563" text-anchor="middle">malar mjöl</text>

<!-- axle label -->
<line x1="235" y1="310" x2="380" y2="310" stroke="#6b7280" stroke-width="1"/>
<text x="445" y="314" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">lodrät axel</text>

<!-- Water channel / stream -->
<rect x="60" y="385" width="680" height="55" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
<text x="640" y="375" font-family="Arial,sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">Bäcken (vattnet)</text>

<!-- Horizontal water wheel (liggande hjul) - drawn as ellipse with paddles -->
<ellipse cx="230" cy="405" rx="75" ry="22" fill="#a16207" stroke="#451a03" stroke-width="2"/>
<g stroke="#451a03" stroke-width="2">
<line x1="170" y1="398" x2="170" y2="412"/>
<line x1="200" y1="393" x2="200" y2="417"/>
<line x1="230" y1="392" x2="230" y2="418"/>
<line x1="260" y1="393" x2="260" y2="417"/>
<line x1="290" y1="398" x2="290" y2="412"/>
</g>
<text x="230" y="465" font-family="Arial,sans-serif" font-size="12" fill="#451a03" text-anchor="middle" font-weight="bold">Liggande vattenhjul</text>

<!-- Water flow arrow hitting wheel -->
<line x1="370" y1="405" x2="320" y2="405" stroke="#2563eb" stroke-width="4"/>
<polygon points="310,405 322,400 322,410" fill="#2563eb"/>
<!-- rotation arrow on wheel (curved) -->
<path d="M 285 388 A 60 18 0 0 1 175 388" fill="none" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="175,388 186,383 184,394" fill="#dc2626"/>
<text x="500" y="408" font-family="Arial,sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">vattnet trycker → hjulet snurrar</text>

<text x="400" y="490" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">På museet fick vi se en skvaltkvarn mala mjöl till samma bullar som vi åt</text>
</svg>
