<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Klimat = vädret över många år</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Hur det brukar vara på en plats – inte bara hur det är idag</text>

<!-- axes for a yearly temperature curve -->
<line x1="100" y1="120" x2="100" y2="380" stroke="#1f2937" stroke-width="2"/>
<line x1="100" y1="380" x2="720" y2="380" stroke="#1f2937" stroke-width="2"/>
<text x="60" y="250" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="middle" transform="rotate(-90 60 250)">Temperatur</text>
<text x="410" y="408" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">Månad (jan → dec)</text>

<!-- gridlines for zero -->
<line x1="100" y1="300" x2="720" y2="300" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,3"/>
<text x="88" y="304" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="end">0 °C</text>

<!-- average climate curve (smooth, warm summer cold winter) -->
<path d="M 120 330 Q 200 340 280 280 Q 360 200 410 170 Q 480 200 560 270 Q 640 340 700 335" fill="none" stroke="#dc2626" stroke-width="4"/>
<text x="420" y="155" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">Klimat = genomsnittet (många år)</text>

<!-- one year's actual weather (jagged, grey) -->
<polyline points="120,335 160,320 200,330 240,290 280,300 320,250 360,210 400,165 440,185 480,230 520,260 560,290 600,320 640,330 700,338" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5,3"/>
<text x="200" y="360" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">väder ett enskilt år (varierar)</text>

<!-- legend -->
<line x1="500" y1="430" x2="540" y2="430" stroke="#dc2626" stroke-width="4"/>
<text x="548" y="434" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="start">Klimat (snitt)</text>
<line x1="150" y1="430" x2="190" y2="430" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5,3"/>
<text x="198" y="434" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Väder (en dag/ett år)</text>

<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Spaniens klimat är varmare än Sveriges sett över många år</text>
</svg>
