<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Restprodukt</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Det som blir över när vi använder en energikälla</text>

<!-- Energy source in -->
<rect x="60" y="200" width="140" height="90" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
<text x="130" y="235" font-family="Arial,sans-serif" font-size="14" fill="#92400e" text-anchor="middle" font-weight="bold">Energikälla</text>
<text x="130" y="258" font-family="Arial,sans-serif" font-size="12" fill="#92400e" text-anchor="middle">kol · ved</text>
<text x="130" y="275" font-family="Arial,sans-serif" font-size="12" fill="#92400e" text-anchor="middle">kärnbränsle</text>

<line x1="200" y1="245" x2="250" y2="245" stroke="#1f2937" stroke-width="3"/>
<polygon points="260,245 248,240 248,250" fill="#1f2937"/>

<!-- Use it -->
<rect x="270" y="200" width="140" height="90" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="4"/>
<text x="340" y="235" font-family="Arial,sans-serif" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="bold">Används</text>
<text x="340" y="258" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">ger energi</text>
<text x="340" y="275" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">(värme · el)</text>

<!-- Output: useful energy (green, up) -->
<line x1="340" y1="200" x2="340" y2="150" stroke="#16a34a" stroke-width="3"/>
<polygon points="340,140 335,152 345,152" fill="#16a34a"/>
<text x="340" y="130" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="bold">nyttig energi</text>

<!-- Output: restprodukt (red/gray, right) -->
<line x1="410" y1="245" x2="465" y2="245" stroke="#dc2626" stroke-width="3"/>
<polygon points="475,245 463,240 463,250" fill="#dc2626"/>
<text x="442" y="232" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold">blir över</text>

<!-- Restprodukter box -->
<rect x="490" y="160" width="250" height="180" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" rx="6"/>
<text x="615" y="188" font-family="Arial,sans-serif" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">Restprodukter</text>
<!-- ash -->
<ellipse cx="545" cy="240" rx="28" ry="18" fill="#9ca3af"/>
<text x="545" y="280" font-family="Arial,sans-serif" font-size="12" fill="#4b5563" text-anchor="middle">aska</text>
<!-- smoke -->
<g stroke="#6b7280" stroke-width="3" fill="none">
<path d="M 630 255 q 12 -14 0 -28 q -12 -14 0 -28"/>
</g>
<text x="630" y="280" font-family="Arial,sans-serif" font-size="12" fill="#4b5563" text-anchor="middle">rök</text>
<!-- spent fuel -->
<rect x="685" y="215" width="30" height="40" fill="#92400e" stroke="#451a03" stroke-width="2"/>
<text x="700" y="280" font-family="Arial,sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">använt</text>
<text x="700" y="296" font-family="Arial,sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">bränsle</text>

<text x="400" y="430" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Restprodukten är det avfall som vi måste ta hand om efteråt</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Askan i grillen är en restprodukt från kolen du grillade korven på</text>
</svg>
