<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Parallellkoppling</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Flera komponenter kopplas så att strömmen kan välja olika vägar</text>

<!-- Battery -->
<line x1="120" y1="140" x2="120" y2="360" stroke="#1f2937" stroke-width="3"/>
<rect x="105" y="235" width="30" height="30" fill="white" stroke="#1f2937" stroke-width="2"/>
<line x1="120" y1="225" x2="120" y2="235" stroke="#1f2937" stroke-width="5"/>
<line x1="112" y1="265" x2="128" y2="265" stroke="#1f2937" stroke-width="2"/>
<text x="95" y="245" font-family="Arial,sans-serif" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold">+</text>
<text x="95" y="275" font-family="Arial,sans-serif" font-size="16" fill="#2563eb" text-anchor="middle">−</text>
<text x="120" y="385" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">Batteri</text>

<!-- Top rail -->
<line x1="120" y1="140" x2="680" y2="140" stroke="#1f2937" stroke-width="3"/>
<!-- Bottom rail -->
<line x1="120" y1="360" x2="680" y2="360" stroke="#1f2937" stroke-width="3"/>
<line x1="680" y1="140" x2="680" y2="360" stroke="#1f2937" stroke-width="3"/>

<!-- Three parallel branches each with a lamp -->
<!-- Branch 1 -->
<line x1="280" y1="140" x2="280" y2="210" stroke="#1f2937" stroke-width="2"/>
<circle cx="280" cy="250" r="28" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
<line x1="262" y1="232" x2="298" y2="268" stroke="#f59e0b" stroke-width="2"/>
<line x1="298" y1="232" x2="262" y2="268" stroke="#f59e0b" stroke-width="2"/>
<line x1="280" y1="278" x2="280" y2="360" stroke="#1f2937" stroke-width="2"/>
<text x="280" y="305" font-family="Arial,sans-serif" font-size="11" fill="#92400e" text-anchor="middle">lampa 1</text>

<!-- Branch 2 -->
<line x1="430" y1="140" x2="430" y2="210" stroke="#1f2937" stroke-width="2"/>
<circle cx="430" cy="250" r="28" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
<line x1="412" y1="232" x2="448" y2="268" stroke="#f59e0b" stroke-width="2"/>
<line x1="448" y1="232" x2="412" y2="268" stroke="#f59e0b" stroke-width="2"/>
<line x1="430" y1="278" x2="430" y2="360" stroke="#1f2937" stroke-width="2"/>
<text x="430" y="305" font-family="Arial,sans-serif" font-size="11" fill="#92400e" text-anchor="middle">lampa 2</text>

<!-- Branch 3 (broken / trasig) -->
<line x1="580" y1="140" x2="580" y2="210" stroke="#1f2937" stroke-width="2"/>
<circle cx="580" cy="250" r="28" fill="#f3f4f6" stroke="#9ca3af" stroke-width="3"/>
<line x1="562" y1="232" x2="598" y2="268" stroke="#9ca3af" stroke-width="2"/>
<line x1="580" y1="278" x2="580" y2="360" stroke="#1f2937" stroke-width="2"/>
<!-- break mark -->
<line x1="572" y1="244" x2="588" y2="256" stroke="#dc2626" stroke-width="3"/>
<text x="580" y="305" font-family="Arial,sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="bold">trasig</text>

<!-- current direction arrows on rails -->
<polygon points="200,140 188,135 188,145" fill="#dc2626"/>
<polygon points="600,360 612,355 612,365" fill="#dc2626"/>

<!-- explanation box -->
<text x="400" y="420" font-family="Arial,sans-serif" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="bold">Lampa 1 och 2 lyser ändå — strömmen tar de andra vägarna</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Lamporna hemma är parallellkopplade, så köket lyser även om sovrumslampan går sönder</text>
</svg>
