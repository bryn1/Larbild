<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Fjärrvärme - sluten krets</text>

<!-- ===== Värmecentral (left) ===== -->
<rect x="70" y="150" width="150" height="170" rx="8" fill="#eff6ff" stroke="#1e40af" stroke-width="3"/>
<text x="145" y="178" font-family="Arial,sans-serif" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="bold">Värmecentral</text>
<!-- flame / boiler -->
<rect x="110" y="205" width="70" height="70" rx="6" fill="#fff7ed" stroke="#f59e0b" stroke-width="2.5"/>
<path d="M145 268 q-16 -14 -8 -32 q4 12 12 10 q-8 -18 6 -30 q-2 22 14 30 q8 10 -2 22 q-6 6 -22 0 z" fill="#f97316" stroke="#dc2626" stroke-width="1.5"/>
<text x="145" y="300" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">värmer vattnet</text>

<!-- ===== Houses (right) ===== -->
<!-- house 1 -->
<rect x="600" y="120" width="110" height="70" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<polygon points="595,120 655,82 715,120" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
<rect x="638" y="155" width="26" height="35" fill="#92400e"/>
<!-- house 2 -->
<rect x="600" y="300" width="110" height="70" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<polygon points="595,300 655,262 715,300" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
<rect x="638" y="335" width="26" height="35" fill="#92400e"/>
<text x="655" y="408" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Hus</text>

<!-- ===== SUPPLY pipe (hot, red) : central -> houses (top route) ===== -->
<!-- thick red pipe outline -->
<polyline points="220,200 420,200 420,150 590,150" fill="none" stroke="#dc2626" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="220,200 420,200 420,150 590,150" fill="none" stroke="#fca5a5" stroke-width="3" stroke-linejoin="round"/>
<!-- direction arrows (towards houses) -->
<polygon points="320,200 304,193 304,207" fill="#7f1d1d"/>
<polygon points="540,150 524,143 524,157" fill="#7f1d1d"/>
<text x="430" y="138" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">Tillopp - varmt vatten ut</text>

<!-- ===== RETURN pipe (cooled, blue) : houses -> central (bottom route) ===== -->
<polyline points="590,340 420,340 420,290 220,290" fill="none" stroke="#2563eb" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="590,340 420,340 420,290 220,290" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linejoin="round"/>
<!-- direction arrows (back towards central) -->
<polygon points="490,340 506,333 506,347" fill="#1e3a8a"/>
<polygon points="300,290 284,283 284,297" fill="#1e3a8a"/>
<text x="400" y="372" font-family="Arial,sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">Retur - avkylt vatten tillbaka</text>

<!-- closed-loop connectors at the house (vertical link top->bottom) -->
<line x1="590" y1="150" x2="600" y2="150" stroke="#dc2626" stroke-width="9" stroke-linecap="round"/>
<line x1="590" y1="340" x2="600" y2="340" stroke="#2563eb" stroke-width="9" stroke-linecap="round"/>

<text x="400" y="455" font-family="Arial,sans-serif" font-size="14" fill="#374151" text-anchor="middle" font-weight="bold">Samma vatten cirkulerar runt i en sluten krets</text>
<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Varmt vatten pumpas ut i tilloppet, lämnar värme i husen och rinner avkylt tillbaka i returen</text>
</svg>
