<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Väderkarta</text>

<!-- map background -->
<rect x="60" y="60" width="680" height="360" rx="8" fill="#f0fdf4" stroke="#9ca3af" stroke-width="2"/>

<!-- ===== Isobars (concentric pressure lines) around HIGH ===== -->
<circle cx="230" cy="220" r="40" fill="none" stroke="#6b7280" stroke-width="1.8"/>
<circle cx="230" cy="220" r="75" fill="none" stroke="#6b7280" stroke-width="1.8"/>
<circle cx="230" cy="220" r="110" fill="none" stroke="#6b7280" stroke-width="1.8"/>
<text x="230" y="125" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">1020</text>
<text x="230" y="157" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">1024</text>
<!-- HIGH pressure marker -->
<text x="230" y="232" font-family="Arial,sans-serif" font-size="46" fill="#2563eb" text-anchor="middle" font-weight="bold">H</text>
<text x="230" y="270" font-family="Arial,sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">Högtryck</text>
<text x="230" y="288" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">torrt, soligt väder</text>

<!-- ===== Isobars around LOW ===== -->
<circle cx="560" cy="230" r="38" fill="none" stroke="#6b7280" stroke-width="1.8"/>
<circle cx="560" cy="230" r="70" fill="none" stroke="#6b7280" stroke-width="1.8"/>
<circle cx="560" cy="230" r="102" fill="none" stroke="#6b7280" stroke-width="1.8"/>
<text x="560" y="148" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">1000</text>
<text x="560" y="180" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">996</text>
<!-- LOW pressure marker -->
<text x="560" y="244" font-family="Arial,sans-serif" font-size="46" fill="#dc2626" text-anchor="middle" font-weight="bold">L</text>
<text x="560" y="282" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">Lågtryck</text>
<text x="560" y="300" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">moln och regn</text>

<!-- isobar label -->
<text x="120" y="105" font-family="Arial,sans-serif" font-size="11" fill="#6b7280">isobarer (lika lufttryck)</text>

<!-- ===== WARM FRONT (red, semicircles point in direction of movement) ===== -->
<path d="M310 360 L470 360" fill="none" stroke="#dc2626" stroke-width="3"/>
<path d="M325 360 a11 11 0 0 1 22 0" fill="#dc2626"/>
<path d="M370 360 a11 11 0 0 1 22 0" fill="#dc2626"/>
<path d="M415 360 a11 11 0 0 1 22 0" fill="#dc2626"/>
<text x="390" y="390" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold">Varmfront</text>

<!-- ===== COLD FRONT (blue, triangles point in direction of movement) ===== -->
<path d="M470 360 L630 360" fill="none" stroke="#2563eb" stroke-width="3"/>
<polygon points="482,360 494,349 506,360" fill="#2563eb"/>
<polygon points="527,360 539,349 551,360" fill="#2563eb"/>
<polygon points="572,360 584,349 596,360" fill="#2563eb"/>
<text x="552" y="390" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="bold">Kallfront</text>

<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">H = högtryck (fint väder), L = lågtryck (regn). Fronter visar var varm och kall luft möts.</text>
</svg>
