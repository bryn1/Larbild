<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Mättad luft</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Luften är mättad när den inte kan hålla mer vattenånga — då bildas dimma, moln eller dagg</text>

<!-- NOT saturated -->
<rect x="80" y="110" width="280" height="210" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="6"/>
<text x="220" y="138" font-family="Arial,sans-serif" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">Inte mättad</text>
<text x="220" y="158" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">får plats med mer ånga</text>
<circle cx="150" cy="200" r="5" fill="#2563eb"/>
<circle cx="250" cy="210" r="5" fill="#2563eb"/>
<circle cx="200" cy="245" r="5" fill="#2563eb"/>
<circle cx="300" cy="235" r="5" fill="#2563eb"/>
<circle cx="160" cy="255" r="5" fill="#2563eb"/>
<text x="220" y="300" font-family="Arial,sans-serif" font-size="19" fill="#16a34a" text-anchor="middle" font-weight="bold">JA, plats kvar</text>

<!-- arrow -->
<line x1="370" y1="215" x2="425" y2="215" stroke="#1f2937" stroke-width="3"/>
<polygon points="435,215 423,210 423,220" fill="#1f2937"/>
<text x="400" y="200" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">kyls / mer ånga</text>

<!-- Saturated -->
<rect x="440" y="110" width="280" height="210" fill="#dbeafe" stroke="#1e40af" stroke-width="2" rx="6"/>
<text x="580" y="138" font-family="Arial,sans-serif" font-size="15" fill="#1e40af" text-anchor="middle" font-weight="bold">Mättad (100%)</text>
<text x="580" y="158" font-family="Arial,sans-serif" font-size="12" fill="#1e40af" text-anchor="middle">full — kan inte hålla mer</text>
<g fill="#1e40af">
<circle cx="480" cy="185" r="5"/><circle cx="525" cy="185" r="5"/><circle cx="570" cy="185" r="5"/><circle cx="615" cy="185" r="5"/><circle cx="660" cy="185" r="5"/>
<circle cx="500" cy="215" r="5"/><circle cx="545" cy="215" r="5"/><circle cx="590" cy="215" r="5"/><circle cx="635" cy="215" r="5"/><circle cx="680" cy="215" r="5"/>
<circle cx="480" cy="245" r="5"/><circle cx="525" cy="245" r="5"/><circle cx="570" cy="245" r="5"/><circle cx="615" cy="245" r="5"/><circle cx="660" cy="245" r="5"/>
</g>
<!-- extra droplet condensing out (bigger) -->
<circle cx="580" cy="290" r="9" fill="#1e40af"/>
<text x="600" y="296" font-family="Arial,sans-serif" font-size="12" fill="#1e40af" text-anchor="start">droppe bildas → dagg</text>

<!-- key -->
<circle cx="290" cy="375" r="5" fill="#1e40af"/>
<text x="312" y="380" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="start">= vattenånga i luften</text>

<text x="400" y="430" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Kall luft kan hålla mindre ånga än varm luft — kyls den blir den mättad</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">På morgonen var luften mättad och gräset blev vått av dagg</text>
</svg>
