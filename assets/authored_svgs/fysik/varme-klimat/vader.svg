<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Väder — hur det är i luften just nu</text>
<!-- sky background -->
<rect x="60" y="60" width="680" height="300" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<!-- ground -->
<rect x="60" y="360" width="680" height="20" fill="#16a34a"/>
<!-- Sun (left) -->
<circle cx="170" cy="140" r="38" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
<g stroke="#f59e0b" stroke-width="3">
<line x1="170" y1="80" x2="170" y2="62"/>
<line x1="170" y1="200" x2="170" y2="218"/>
<line x1="110" y1="140" x2="92" y2="140"/>
<line x1="230" y1="140" x2="248" y2="140"/>
<line x1="128" y1="98" x2="115" y2="85"/>
<line x1="212" y1="98" x2="225" y2="85"/>
<line x1="128" y1="182" x2="115" y2="195"/>
<line x1="212" y1="182" x2="225" y2="195"/>
</g>
<text x="170" y="250" font-family="Arial,sans-serif" font-size="14" fill="#b45309" text-anchor="middle" font-weight="bold">Sol</text>
<!-- Cloud + rain (middle) -->
<ellipse cx="400" cy="150" rx="70" ry="34" fill="#9ca3af" stroke="#4b5563" stroke-width="2"/>
<ellipse cx="360" cy="160" rx="40" ry="26" fill="#cbd5e1" stroke="#4b5563" stroke-width="1.5"/>
<g stroke="#2563eb" stroke-width="3">
<line x1="360" y1="195" x2="355" y2="225"/>
<line x1="390" y1="195" x2="385" y2="228"/>
<line x1="420" y1="195" x2="415" y2="225"/>
</g>
<text x="400" y="265" font-family="Arial,sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">Moln och regn</text>
<!-- Wind (right) -->
<g stroke="#374151" stroke-width="3" fill="none">
<path d="M560 150 q60 -16 80 4 q14 18 -8 22 q-16 0 -16 -12"/>
<path d="M560 185 q90 -16 110 6 q12 16 -10 18 q-14 0 -14 -12"/>
<path d="M560 215 q50 -12 66 4"/>
</g>
<text x="630" y="265" font-family="Arial,sans-serif" font-size="14" fill="#374151" text-anchor="middle" font-weight="bold">Vind</text>
<!-- thermometer for temperature -->
<rect x="660" y="80" width="14" height="120" rx="7" fill="#fff" stroke="#6b7280" stroke-width="2"/>
<rect x="662" y="120" width="10" height="78" fill="#dc2626"/>
<circle cx="667" cy="208" r="14" fill="#dc2626" stroke="#6b7280" stroke-width="2"/>
<text x="700" y="115" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="start">°C</text>
<text x="400" y="420" font-family="Arial,sans-serif" font-size="15" fill="#374151" text-anchor="middle" font-weight="bold">Sol · regn · vind · temperatur</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Väder är hur det är i luften just nu — sol, regn, vind eller kyla</text>
</svg>
