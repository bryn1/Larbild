<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Moderator (i en kärnreaktor)</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Saktar ner neutroner så att klyvningen kan fortsätta — ofta används vatten</text>

<!-- BEFORE: fast neutron -->
<text x="180" y="105" font-family="Arial,sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">FÖRE</text>
<circle cx="120" cy="170" r="14" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
<text x="120" y="175" font-family="Arial,sans-serif" font-size="11" fill="white" text-anchor="middle">n</text>
<line x1="140" y1="170" x2="240" y2="170" stroke="#dc2626" stroke-width="4"/>
<polygon points="252,170 238,164 238,176" fill="#dc2626"/>
<text x="195" y="155" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">snabb neutron</text>

<!-- Moderator (water) block in middle -->
<rect x="330" y="120" width="140" height="240" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="4"/>
<text x="400" y="225" font-family="Arial,sans-serif" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="bold">Moderator</text>
<text x="400" y="248" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">(vatten)</text>
<!-- water molecules to bump against -->
<g fill="#2563eb">
<circle cx="360" cy="150" r="5"/><circle cx="440" cy="160" r="5"/>
<circle cx="375" cy="300" r="5"/><circle cx="430" cy="320" r="5"/>
<circle cx="400" cy="200" r="5"/>
</g>

<!-- AFTER: slow neutron -->
<text x="620" y="105" font-family="Arial,sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">EFTER</text>
<circle cx="540" cy="170" r="14" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
<text x="540" y="175" font-family="Arial,sans-serif" font-size="11" fill="white" text-anchor="middle">n</text>
<line x1="560" y1="170" x2="615" y2="170" stroke="#16a34a" stroke-width="3"/>
<polygon points="625,170 613,165 613,175" fill="#16a34a"/>
<text x="640" y="155" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="bold">långsam neutron</text>

<!-- explanation of why -->
<rect x="120" y="390" width="560" height="55" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" rx="4"/>
<text x="400" y="412" font-family="Arial,sans-serif" font-size="13" fill="#92400e" text-anchor="middle">Långsamma neutroner klyver atomkärnor lättare → kedjereaktionen hålls igång</text>
<text x="400" y="432" font-family="Arial,sans-serif" font-size="12" fill="#92400e" text-anchor="middle">Utan moderator skulle reaktorn inte kunna producera el till din lampa</text>

<text x="400" y="475" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Neutronen krockar med molekylerna i vattnet och tappar fart</text>
</svg>
