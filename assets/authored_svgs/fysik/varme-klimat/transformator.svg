<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Transformator</text>

<!-- ===== Shared iron core (rectangular ring) ===== -->
<rect x="330" y="110" width="140" height="280" rx="8" fill="none" stroke="#6b7280" stroke-width="22"/>
<text x="400" y="255" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="bold">järnkärna</text>

<!-- ===== PRIMARY coil (left leg, centre x~341) - ONE continuous wire wound around the leg ===== -->
<!-- Each loop: front (solid) on the left, crossing OVER the core leg to the right and back -->
<path d="M300 150
         C300 132 382 132 382 165
         C382 188 318 182 300 198
         M300 198
         C300 180 382 180 382 213
         C382 236 318 230 300 246
         M300 246
         C300 228 382 228 382 261
         C382 284 318 278 300 294
         M300 294
         C300 276 382 276 382 309
         C382 332 318 326 300 342"
      fill="none" stroke="#dc2626" stroke-width="3"/>
<!-- leads to AC source -->
<line x1="300" y1="150" x2="195" y2="150" stroke="#dc2626" stroke-width="3"/>
<line x1="300" y1="342" x2="195" y2="342" stroke="#dc2626" stroke-width="3"/>
<!-- AC source symbol -->
<circle cx="170" cy="246" r="28" fill="white" stroke="#dc2626" stroke-width="2.5"/>
<path d="M156 246 q7 -12 14 0 q7 12 14 0" fill="none" stroke="#dc2626" stroke-width="2"/>
<line x1="195" y1="150" x2="170" y2="150" stroke="#dc2626" stroke-width="3"/>
<line x1="170" y1="150" x2="170" y2="218" stroke="#dc2626" stroke-width="3"/>
<line x1="195" y1="342" x2="170" y2="342" stroke="#dc2626" stroke-width="3"/>
<line x1="170" y1="342" x2="170" y2="274" stroke="#dc2626" stroke-width="3"/>
<text x="143" y="250" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">in</text>
<text x="250" y="365" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">Primärspole</text>
<text x="250" y="383" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">230 V in - många varv</text>

<!-- ===== SECONDARY coil (right leg, centre x~459) - ONE continuous wire, FEWER loops ===== -->
<path d="M500 185
         C500 167 418 167 418 200
         C418 223 482 217 500 233
         M500 233
         C500 215 418 215 418 248
         C418 271 482 265 500 281
         M500 281
         C500 263 418 263 418 296
         C418 319 482 313 500 329"
      fill="none" stroke="#16a34a" stroke-width="3"/>
<!-- leads to output / bulb -->
<line x1="500" y1="185" x2="605" y2="185" stroke="#16a34a" stroke-width="3"/>
<line x1="500" y1="329" x2="605" y2="329" stroke="#16a34a" stroke-width="3"/>
<line x1="605" y1="185" x2="640" y2="185" stroke="#16a34a" stroke-width="3"/>
<line x1="640" y1="185" x2="640" y2="237" stroke="#16a34a" stroke-width="3"/>
<line x1="605" y1="329" x2="640" y2="329" stroke="#16a34a" stroke-width="3"/>
<line x1="640" y1="329" x2="640" y2="277" stroke="#16a34a" stroke-width="3"/>
<!-- lamp -->
<circle cx="640" cy="257" r="20" fill="#fef9c3" stroke="#f59e0b" stroke-width="2.5"/>
<line x1="628" y1="245" x2="652" y2="269" stroke="#f59e0b" stroke-width="2"/>
<line x1="652" y1="245" x2="628" y2="269" stroke="#f59e0b" stroke-width="2"/>
<text x="640" y="165" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="bold">ut</text>
<text x="550" y="365" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="bold">Sekundärspole</text>
<text x="550" y="383" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle">12 V ut - färre varv</text>

<text x="400" y="430" font-family="Arial,sans-serif" font-size="14" fill="#374151" text-anchor="middle" font-weight="bold">Varje spole är EN tråd som lindats många varv runt järnkärnan</text>
<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Färre varv på sekundärspolen ger lägre spänning ut</text>
</svg>
