<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Biologisk mångfald</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Många olika arter på samma plats gör naturen starkare</text>

<!-- ground -->
<rect x="60" y="380" width="680" height="60" fill="#86efac"/>
<line x1="60" y1="380" x2="740" y2="380" stroke="#15803d" stroke-width="2"/>

<!-- LEFT panel: high diversity -->
<rect x="60" y="90" width="320" height="290" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="4"/>
<text x="220" y="115" font-family="Arial,sans-serif" font-size="15" fill="#15803d" text-anchor="middle" font-weight="bold">Hög mångfald</text>

<!-- tree -->
<line x1="110" y1="380" x2="110" y2="300" stroke="#92400e" stroke-width="6"/>
<circle cx="110" cy="285" r="26" fill="#16a34a"/>
<!-- flowers -->
<circle cx="160" cy="370" r="8" fill="#f59e0b"/><line x1="160" y1="378" x2="160" y2="395" stroke="#15803d" stroke-width="2"/>
<circle cx="185" cy="365" r="8" fill="#dc2626"/><line x1="185" y1="373" x2="185" y2="395" stroke="#15803d" stroke-width="2"/>
<circle cx="210" cy="372" r="8" fill="#a855f7"/><line x1="210" y1="380" x2="210" y2="395" stroke="#15803d" stroke-width="2"/>
<!-- bee -->
<ellipse cx="250" cy="200" rx="9" ry="6" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/>
<!-- bird -->
<path d="M 290 160 Q 300 150 310 160 Q 320 150 330 160" fill="none" stroke="#1f2937" stroke-width="2.5"/>
<!-- hedgehog -->
<ellipse cx="320" cy="350" rx="22" ry="14" fill="#92400e"/>
<line x1="305" y1="342" x2="300" y2="332" stroke="#451a03" stroke-width="2"/>
<line x1="315" y1="338" x2="313" y2="326" stroke="#451a03" stroke-width="2"/>
<line x1="328" y1="340" x2="332" y2="330" stroke="#451a03" stroke-width="2"/>
<!-- butterfly -->
<circle cx="200" cy="160" r="7" fill="#2563eb"/><circle cx="214" cy="160" r="7" fill="#2563eb"/>
<text x="235" y="343" font-family="Arial,sans-serif" font-size="11" fill="#15803d" text-anchor="middle">tål störningar bra</text>

<!-- RIGHT panel: low diversity -->
<rect x="420" y="90" width="320" height="290" fill="#fef2f2" stroke="#dc2626" stroke-width="2" rx="4"/>
<text x="580" y="115" font-family="Arial,sans-serif" font-size="15" fill="#991b1b" text-anchor="middle" font-weight="bold">Låg mångfald</text>
<!-- only grass, one species -->
<line x1="470" y1="395" x2="470" y2="370" stroke="#16a34a" stroke-width="3"/>
<line x1="500" y1="395" x2="500" y2="368" stroke="#16a34a" stroke-width="3"/>
<line x1="530" y1="395" x2="530" y2="372" stroke="#16a34a" stroke-width="3"/>
<line x1="560" y1="395" x2="560" y2="368" stroke="#16a34a" stroke-width="3"/>
<line x1="590" y1="395" x2="590" y2="371" stroke="#16a34a" stroke-width="3"/>
<line x1="620" y1="395" x2="620" y2="369" stroke="#16a34a" stroke-width="3"/>
<line x1="650" y1="395" x2="650" y2="372" stroke="#16a34a" stroke-width="3"/>
<line x1="680" y1="395" x2="680" y2="368" stroke="#16a34a" stroke-width="3"/>
<text x="580" y="250" font-family="Arial,sans-serif" font-size="13" fill="#991b1b" text-anchor="middle">bara en art</text>
<text x="580" y="365" font-family="Arial,sans-serif" font-size="11" fill="#991b1b" text-anchor="middle">känslig för störningar</text>

<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Ju fler arter av växter och djur, desto bättre tål naturen förändringar</text>
</svg>
