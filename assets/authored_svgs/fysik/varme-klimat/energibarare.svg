<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Energibärare</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Transporterar energi från källan – men är inte själva källan</text>

<!-- Source -->
<rect x="60" y="150" width="160" height="110" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
<text x="140" y="180" font-family="Arial,sans-serif" font-size="14" fill="#92400e" text-anchor="middle" font-weight="bold">Energikälla</text>
<text x="140" y="200" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(t.ex. kraftverk)</text>
<path d="M 120 215 Q 115 225 125 228 Q 122 235 130 232 Q 140 222 135 215 Q 150 228 138 240 L 122 240 Q 110 228 120 215 Z" fill="#dc2626" stroke="#92400e" stroke-width="1"/>

<!-- Carrier (highlighted, middle) -->
<rect x="300" y="150" width="200" height="110" fill="#dbeafe" stroke="#2563eb" stroke-width="3" rx="4"/>
<text x="400" y="180" font-family="Arial,sans-serif" font-size="15" fill="#1e40af" text-anchor="middle" font-weight="bold">Energibärare</text>
<!-- electricity symbol -->
<polygon points="360,205 380,205 372,220 388,220 358,250 366,228 350,228" fill="#f59e0b" stroke="#92400e" stroke-width="1"/>
<text x="365" y="265" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">el</text>
<!-- warm water symbol -->
<rect x="420" y="208" width="55" height="20" fill="#fca5a5" stroke="#dc2626" stroke-width="1.5" rx="10"/>
<text x="447" y="222" font-family="Arial,sans-serif" font-size="10" fill="#991b1b" text-anchor="middle">varmt</text>
<text x="447" y="245" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">vatten</text>

<!-- Use -->
<rect x="580" y="150" width="160" height="110" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="4"/>
<text x="660" y="180" font-family="Arial,sans-serif" font-size="14" fill="#15803d" text-anchor="middle" font-weight="bold">Användning</text>
<text x="660" y="200" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(t.ex. mobil, element)</text>
<rect x="635" y="212" width="50" height="35" fill="#16a34a" rx="4"/>
<rect x="652" y="218" width="16" height="23" fill="#dcfce7"/>

<!-- arrows -->
<line x1="220" y1="205" x2="290" y2="205" stroke="#1f2937" stroke-width="3"/>
<polygon points="300,205 288,200 288,210" fill="#1f2937"/>
<line x1="500" y1="205" x2="570" y2="205" stroke="#1f2937" stroke-width="3"/>
<polygon points="580,205 568,200 568,210" fill="#1f2937"/>

<text x="400" y="330" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">Energin flyttas: källa → bärare → användning</text>
<text x="400" y="370" font-family="Arial,sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">El i sladden bär energi från uttaget till mobilens batteri</text>

<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Energibäraren transporterar energi – den skapar den inte själv</text>
</svg>
