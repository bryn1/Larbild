<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Fokusera ljus med en lins</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Strålar samlas till en punkt – där blir energin mycket starkare</text>

<!-- sun rays incoming (parallel) -->
<text x="90" y="130" font-family="Arial,sans-serif" font-size="13" fill="#f59e0b" text-anchor="middle" font-weight="bold">Solstrålar</text>
<line x1="60" y1="160" x2="330" y2="160" stroke="#f59e0b" stroke-width="2.5"/>
<line x1="60" y1="210" x2="330" y2="210" stroke="#f59e0b" stroke-width="2.5"/>
<line x1="60" y1="260" x2="330" y2="260" stroke="#f59e0b" stroke-width="2.5"/>
<line x1="60" y1="310" x2="330" y2="310" stroke="#f59e0b" stroke-width="2.5"/>

<!-- convex lens at x=340 -->
<path d="M 340 130 Q 380 235 340 340 Q 300 235 340 130 Z" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5"/>
<text x="340" y="375" font-family="Arial,sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">Lins (förstoringsglas)</text>

<!-- refracted rays converging to focal point at (600,235) -->
<line x1="340" y1="160" x2="600" y2="235" stroke="#f59e0b" stroke-width="2.5"/>
<line x1="340" y1="210" x2="600" y2="235" stroke="#f59e0b" stroke-width="2.5"/>
<line x1="340" y1="260" x2="600" y2="235" stroke="#f59e0b" stroke-width="2.5"/>
<line x1="340" y1="310" x2="600" y2="235" stroke="#f59e0b" stroke-width="2.5"/>

<!-- optical axis -->
<line x1="60" y1="235" x2="700" y2="235" stroke="#9ca3af" stroke-width="1" stroke-dasharray="6,4"/>

<!-- focal point hot spot -->
<circle cx="600" cy="235" r="14" fill="#dc2626"/>
<circle cx="600" cy="235" r="22" fill="none" stroke="#f59e0b" stroke-width="2"/>
<path d="M 600 205 Q 592 190 602 182 Q 598 198 608 190" fill="none" stroke="#dc2626" stroke-width="2"/>
<text x="600" y="290" font-family="Arial,sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold">Brännpunkt</text>
<text x="600" y="310" font-family="Arial,sans-serif" font-size="12" fill="#991b1b" text-anchor="middle">hett – kan börja ryka</text>

<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Linsen samlar ljuset till en liten punkt där energin koncentreras</text>
</svg>
