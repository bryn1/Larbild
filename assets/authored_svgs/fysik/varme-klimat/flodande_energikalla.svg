<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Flödande energikälla</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Förnyas hela tiden av sig själv – tar aldrig slut</text>

<!-- Sun -->
<circle cx="170" cy="170" r="40" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
<line x1="170" y1="115" x2="170" y2="100" stroke="#f59e0b" stroke-width="3"/>
<line x1="170" y1="225" x2="170" y2="240" stroke="#f59e0b" stroke-width="3"/>
<line x1="115" y1="170" x2="100" y2="170" stroke="#f59e0b" stroke-width="3"/>
<line x1="225" y1="170" x2="240" y2="170" stroke="#f59e0b" stroke-width="3"/>
<line x1="131" y1="131" x2="120" y2="120" stroke="#f59e0b" stroke-width="3"/>
<line x1="209" y1="131" x2="220" y2="120" stroke="#f59e0b" stroke-width="3"/>
<text x="170" y="280" font-family="Arial,sans-serif" font-size="14" fill="#92400e" text-anchor="middle" font-weight="bold">Sol</text>

<!-- Wind -->
<line x1="400" y1="240" x2="400" y2="160" stroke="#6b7280" stroke-width="5"/>
<circle cx="400" cy="160" r="5" fill="#2563eb"/>
<line x1="400" y1="160" x2="400" y2="125" stroke="#2563eb" stroke-width="4"/>
<line x1="400" y1="160" x2="430" y2="178" stroke="#2563eb" stroke-width="4"/>
<line x1="400" y1="160" x2="370" y2="178" stroke="#2563eb" stroke-width="4"/>
<path d="M 300 130 Q 330 125 350 135" fill="none" stroke="#9ca3af" stroke-width="2"/>
<path d="M 300 145 Q 335 140 358 150" fill="none" stroke="#9ca3af" stroke-width="2"/>
<text x="400" y="280" font-family="Arial,sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">Vind</text>

<!-- Running water -->
<path d="M 580 130 L 600 130 L 600 200 L 700 200 L 700 215 L 580 215 Z" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/>
<path d="M 600 145 Q 620 160 600 175 Q 620 190 600 200" fill="none" stroke="#1e40af" stroke-width="3"/>
<circle cx="660" cy="208" r="14" fill="none" stroke="#1e40af" stroke-width="2"/>
<text x="640" y="280" font-family="Arial,sans-serif" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="bold">Rinnande vatten</text>

<!-- infinity / never-ends band -->
<rect x="120" y="330" width="560" height="70" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="8"/>
<text x="400" y="362" font-family="Arial,sans-serif" font-size="15" fill="#15803d" text-anchor="middle" font-weight="bold">Förnyas av naturen → tar aldrig slut</text>
<!-- cycle arrow -->
<path d="M 250 385 A 30 12 0 1 1 248 384" fill="none" stroke="#16a34a" stroke-width="2.5"/>
<polygon points="248,384 256,388 252,378" fill="#16a34a"/>
<path d="M 550 385 A 30 12 0 1 1 548 384" fill="none" stroke="#16a34a" stroke-width="2.5"/>
<polygon points="548,384 556,388 552,378" fill="#16a34a"/>

<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Sol, vind och rinnande vatten flödar ständigt och kan inte ta slut</text>
</svg>
