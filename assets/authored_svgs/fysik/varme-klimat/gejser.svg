<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Gejser</text>

<!-- sky -->
<rect x="0" y="50" width="800" height="280" fill="#dbeafe"/>
<!-- ground -->
<rect x="0" y="330" width="800" height="130" fill="#a16207"/>
<rect x="0" y="400" width="800" height="60" fill="#92400e"/>
<line x1="0" y1="330" x2="800" y2="330" stroke="#78350f" stroke-width="2"/>

<!-- erupting water + steam plume -->
<path d="M 385 330 Q 360 200 400 100 Q 440 200 415 330 Z" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
<circle cx="400" cy="95" r="18" fill="#e0f2fe" stroke="#93c5fd" stroke-width="1.5"/>
<circle cx="378" cy="120" r="14" fill="#e0f2fe" stroke="#93c5fd" stroke-width="1.5"/>
<circle cx="422" cy="120" r="14" fill="#e0f2fe" stroke="#93c5fd" stroke-width="1.5"/>
<circle cx="400" cy="150" r="12" fill="#e0f2fe" stroke="#93c5fd" stroke-width="1.5"/>
<!-- water droplets -->
<circle cx="360" cy="200" r="4" fill="#3b82f6"/>
<circle cx="440" cy="210" r="4" fill="#3b82f6"/>
<circle cx="350" cy="260" r="4" fill="#3b82f6"/>
<circle cx="450" cy="270" r="4" fill="#3b82f6"/>
<text x="500" y="130" font-family="Arial,sans-serif" font-size="14" fill="#2563eb" text-anchor="start" font-weight="bold">Kokande vatten</text>
<text x="500" y="150" font-family="Arial,sans-serif" font-size="14" fill="#2563eb" text-anchor="start" font-weight="bold">och ånga sprutar upp</text>

<!-- underground channel -->
<path d="M 385 330 L 390 430 L 410 430 L 415 330 Z" fill="#1e3a8a"/>
<ellipse cx="400" cy="430" rx="13" ry="6" fill="#1e40af"/>

<!-- hot rock / heat from below -->
<path d="M 370 460 Q 380 440 390 460" fill="none" stroke="#dc2626" stroke-width="3"/>
<path d="M 400 460 Q 410 438 420 460" fill="none" stroke="#dc2626" stroke-width="3"/>
<line x1="350" y1="455" x2="350" y2="438" stroke="#dc2626" stroke-width="3"/>
<polygon points="350,432 345,444 355,444" fill="#dc2626"/>
<line x1="450" y1="455" x2="450" y2="438" stroke="#dc2626" stroke-width="3"/>
<polygon points="450,432 445,444 455,444" fill="#dc2626"/>
<text x="200" y="445" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">Värme från berget djupt nere</text>

<text x="400" y="490" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Värmen kokar grundvattnet som med jämna mellanrum sprutar upp ur marken</text>
</svg>
