<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Meteorolog</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">En person som studerar vädret och gör prognoser om hur det blir framåt</text>

<!-- Person (pictogram, vector shapes) -->
<circle cx="200" cy="180" r="34" fill="#fcd9b6" stroke="#b45309" stroke-width="2"/>
<path d="M 150 320 Q 150 230 200 230 Q 250 230 250 320 Z" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
<text x="200" y="360" font-family="Arial,sans-serif" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="bold">Meteorolog</text>
<!-- pointing arm toward map -->
<line x1="245" y1="255" x2="330" y2="220" stroke="#1e40af" stroke-width="8" stroke-linecap="round"/>

<!-- Weather map / forecast board -->
<rect x="360" y="110" width="370" height="250" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="6"/>
<text x="545" y="138" font-family="Arial,sans-serif" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="bold">Väderprognos</text>

<!-- High pressure H -->
<circle cx="445" cy="200" r="24" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="445" y="208" font-family="Arial,sans-serif" font-size="22" fill="#92400e" text-anchor="middle" font-weight="bold">H</text>
<text x="445" y="245" font-family="Arial,sans-serif" font-size="11" fill="#92400e" text-anchor="middle">högtryck</text>

<!-- Low pressure L -->
<circle cx="640" cy="200" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="640" y="208" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">L</text>
<text x="640" y="245" font-family="Arial,sans-serif" font-size="11" fill="#1e40af" text-anchor="middle">lågtryck</text>

<!-- sun + cloud icons on map -->
<circle cx="445" cy="300" r="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<ellipse cx="600" cy="300" rx="34" ry="15" fill="#9ca3af"/>
<g stroke="#2563eb" stroke-width="2">
<line x1="585" y1="318" x2="582" y2="330"/>
<line x1="605" y1="318" x2="602" y2="330"/>
<line x1="620" y1="318" x2="617" y2="330"/>
</g>
<text x="545" y="345" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">sol i väster, regn i öster</text>

<text x="400" y="420" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Använder mätdata om tryck, temperatur och vind för att förutsäga vädret</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Meteorologen på tv sa att det skulle snöa, så jag tog fram vinterjackan</text>
</svg>
