<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Elleverantör</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Företaget som säljer elen vidare och skickar räkningen</text>

<!-- Producer -->
<rect x="60" y="180" width="150" height="90" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="4"/>
<text x="135" y="210" font-family="Arial,sans-serif" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="bold">Kraftverk</text>
<text x="135" y="232" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">producerar elen</text>
<!-- small turbine icon -->
<circle cx="135" cy="252" r="10" fill="none" stroke="#2563eb" stroke-width="2"/>
<line x1="135" y1="252" x2="135" y2="242" stroke="#2563eb" stroke-width="2"/>
<line x1="135" y1="252" x2="143" y2="258" stroke="#2563eb" stroke-width="2"/>
<line x1="135" y1="252" x2="127" y2="258" stroke="#2563eb" stroke-width="2"/>

<!-- Leverantör (middle, highlighted) -->
<rect x="325" y="160" width="150" height="130" fill="#fef3c7" stroke="#f59e0b" stroke-width="3" rx="4"/>
<text x="400" y="195" font-family="Arial,sans-serif" font-size="15" fill="#92400e" text-anchor="middle" font-weight="bold">Elleverantör</text>
<text x="400" y="222" font-family="Arial,sans-serif" font-size="12" fill="#92400e" text-anchor="middle">köper elen</text>
<text x="400" y="240" font-family="Arial,sans-serif" font-size="12" fill="#92400e" text-anchor="middle">och säljer vidare</text>
<!-- invoice icon -->
<rect x="375" y="252" width="50" height="28" fill="white" stroke="#92400e" stroke-width="1.5"/>
<line x1="382" y1="261" x2="418" y2="261" stroke="#92400e" stroke-width="1.5"/>
<line x1="382" y1="269" x2="418" y2="269" stroke="#92400e" stroke-width="1.5"/>

<!-- Customer / home -->
<rect x="590" y="180" width="150" height="90" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="4"/>
<polygon points="610,180 720,180 665,150" fill="#16a34a"/>
<text x="665" y="212" font-family="Arial,sans-serif" font-size="14" fill="#15803d" text-anchor="middle" font-weight="bold">Hemmet</text>
<text x="665" y="234" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">använder elen</text>

<!-- arrows: el flows producer -> leverantör -> home -->
<line x1="210" y1="210" x2="315" y2="210" stroke="#2563eb" stroke-width="3"/>
<polygon points="325,210 313,205 313,215" fill="#2563eb"/>
<text x="262" y="200" font-family="Arial,sans-serif" font-size="11" fill="#2563eb" text-anchor="middle">el</text>

<line x1="475" y1="210" x2="580" y2="210" stroke="#2563eb" stroke-width="3"/>
<polygon points="590,210 578,205 578,215" fill="#2563eb"/>
<text x="532" y="200" font-family="Arial,sans-serif" font-size="11" fill="#2563eb" text-anchor="middle">el</text>

<!-- invoice / money flows home -> leverantör -->
<path d="M 620 295 Q 510 360 410 300" fill="none" stroke="#dc2626" stroke-width="3"/>
<polygon points="402,296 415,298 410,308" fill="#dc2626"/>
<text x="510" y="360" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold">Räkning / betalning</text>

<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Leverantören äger inte kraftverket – den köper elen och fakturerar dig</text>
</svg>
