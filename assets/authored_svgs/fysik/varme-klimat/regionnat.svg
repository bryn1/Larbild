<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Regionnät</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Fördelar strömmen inom ett landskap — mellan stamnätet och lokalnätet</text>

<!-- Stamnät (gray, in) -->
<line x1="70" y1="140" x2="70" y2="240" stroke="#6b7280" stroke-width="3"/>
<line x1="48" y1="160" x2="92" y2="160" stroke="#6b7280" stroke-width="2"/>
<line x1="48" y1="180" x2="92" y2="180" stroke="#6b7280" stroke-width="2"/>
<text x="70" y="265" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Stamnät</text>
<line x1="70" y1="150" x2="180" y2="190" stroke="#9ca3af" stroke-width="3"/>

<!-- Transformer down -->
<rect x="180" y="165" width="90" height="55" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="3"/>
<text x="225" y="190" font-family="Arial,sans-serif" font-size="10" fill="#92400e" text-anchor="middle" font-weight="bold">Transformator</text>
<text x="225" y="208" font-family="Arial,sans-serif" font-size="10" fill="#92400e" text-anchor="middle">sänker spänning</text>

<!-- REGIONNÄT: red highlighted, branches across a region -->
<rect x="320" y="95" width="200" height="26" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="3"/>
<text x="420" y="113" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">REGIONNÄT ~130 000 V</text>
<line x1="270" y1="190" x2="420" y2="150" stroke="#dc2626" stroke-width="4"/>
<line x1="420" y1="150" x2="560" y2="150" stroke="#dc2626" stroke-width="4"/>
<line x1="420" y1="150" x2="420" y2="250" stroke="#dc2626" stroke-width="4"/>
<line x1="560" y1="150" x2="640" y2="220" stroke="#dc2626" stroke-width="4"/>

<!-- pylons along region line -->
<g stroke="#6b7280" stroke-width="2">
<line x1="420" y1="130" x2="420" y2="170"/>
<line x1="400" y1="142" x2="440" y2="142"/>
</g>

<!-- to lokalnät (gray, out) -->
<rect x="380" y="250" width="90" height="50" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" rx="3"/>
<text x="425" y="280" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">→ Lokalnät</text>
<rect x="600" y="220" width="90" height="50" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" rx="3"/>
<text x="645" y="250" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">→ industri</text>

<!-- hierarchy ladder -->
<text x="400" y="350" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Elnätets nivåer (efter spänning):</text>
<text x="285" y="380" font-family="Arial,sans-serif" font-size="14" fill="#6b7280" text-anchor="end">Stamnät</text>
<text x="315" y="380" font-family="Arial,sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">→</text>
<text x="400" y="380" font-family="Arial,sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold">Regionnät</text>
<text x="485" y="380" font-family="Arial,sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">→</text>
<text x="515" y="380" font-family="Arial,sans-serif" font-size="14" fill="#6b7280" text-anchor="start">Lokalnät (lägst)</text>

<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Strömmen till din skola tar vägen via regionnätet innan den når byggnaden</text>
</svg>
