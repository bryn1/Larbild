<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Elproducent</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Den som tillverkar el och skickar ut den i elnätet</text>

<!-- Vattenkraft -->
<rect x="60" y="110" width="180" height="120" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="4"/>
<path d="M 75 150 L 120 150 L 120 200 L 225 200 L 225 215 L 75 215 Z" fill="#93c5fd"/>
<line x1="120" y1="155" x2="160" y2="195" stroke="#1e40af" stroke-width="3"/>
<text x="150" y="135" font-family="Arial,sans-serif" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="bold">Vattenkraft</text>

<!-- Vindkraft -->
<rect x="310" y="110" width="180" height="120" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="4"/>
<line x1="400" y1="220" x2="400" y2="160" stroke="#6b7280" stroke-width="4"/>
<circle cx="400" cy="160" r="4" fill="#1e40af"/>
<line x1="400" y1="160" x2="400" y2="135" stroke="#1e40af" stroke-width="3"/>
<line x1="400" y1="160" x2="422" y2="173" stroke="#1e40af" stroke-width="3"/>
<line x1="400" y1="160" x2="378" y2="173" stroke="#1e40af" stroke-width="3"/>
<text x="400" y="135" font-family="Arial,sans-serif" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="bold">Vindkraft</text>

<!-- Kärnkraft -->
<rect x="560" y="110" width="180" height="120" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="4"/>
<path d="M 625 215 Q 615 175 650 175 Q 685 175 675 215 Z" fill="#9ca3af"/>
<ellipse cx="650" cy="160" rx="22" ry="10" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
<text x="650" y="135" font-family="Arial,sans-serif" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="bold">Kärnkraft</text>

<!-- all feed into the grid -->
<line x1="150" y1="230" x2="350" y2="300" stroke="#f59e0b" stroke-width="3"/>
<line x1="400" y1="230" x2="400" y2="300" stroke="#f59e0b" stroke-width="3"/>
<line x1="650" y1="230" x2="450" y2="300" stroke="#f59e0b" stroke-width="3"/>

<!-- the grid / nät -->
<rect x="290" y="300" width="220" height="55" fill="#fef3c7" stroke="#f59e0b" stroke-width="3" rx="4"/>
<text x="400" y="333" font-family="Arial,sans-serif" font-size="16" fill="#92400e" text-anchor="middle" font-weight="bold">Elnätet</text>

<!-- grid to homes -->
<line x1="400" y1="355" x2="400" y2="395" stroke="#f59e0b" stroke-width="3"/>
<polygon points="400,405 395,393 405,393" fill="#f59e0b"/>

<!-- homes row -->
<rect x="250" y="410" width="60" height="45" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<polygon points="245,410 315,410 280,388" fill="#16a34a"/>
<rect x="370" y="410" width="60" height="45" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<polygon points="365,410 435,410 400,388" fill="#16a34a"/>
<rect x="490" y="410" width="60" height="45" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<polygon points="485,410 555,410 520,388" fill="#16a34a"/>
<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Olika kraftverk producerar el som skickas ut i nätet till alla hus</text>
</svg>
