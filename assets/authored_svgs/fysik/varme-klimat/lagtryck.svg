<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Lågtryck</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Ett område där luften stiger uppåt — ger ofta moln, regn och blåst</text>

<!-- Ground -->
<rect x="60" y="400" width="680" height="50" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
<!-- L marker -->
<circle cx="400" cy="380" r="26" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
<text x="400" y="389" font-family="Arial,sans-serif" font-size="26" fill="white" text-anchor="middle" font-weight="bold">L</text>
<text x="400" y="435" font-family="Arial,sans-serif" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="bold">lågtryckets centrum</text>

<!-- Rising air arrows (up) -->
<line x1="400" y1="350" x2="400" y2="180" stroke="#2563eb" stroke-width="4"/>
<polygon points="400,170 393,185 407,185" fill="#2563eb"/>
<line x1="340" y1="360" x2="365" y2="220" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="363,212 360,226 372,222" fill="#2563eb"/>
<line x1="460" y1="360" x2="435" y2="220" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="437,212 428,222 440,226" fill="#2563eb"/>
<text x="490" y="280" font-family="Arial,sans-serif" font-size="14" fill="#2563eb" text-anchor="start" font-weight="bold">luften stiger</text>

<!-- Wind in toward centre at ground -->
<line x1="120" y1="385" x2="360" y2="385" stroke="#6b7280" stroke-width="2.5"/>
<polygon points="370,385 358,380 358,390" fill="#6b7280"/>
<line x1="680" y1="385" x2="440" y2="385" stroke="#6b7280" stroke-width="2.5"/>
<polygon points="430,385 442,380 442,390" fill="#6b7280"/>
<text x="180" y="375" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">vind in (blåst)</text>

<!-- Clouds + rain at top -->
<ellipse cx="400" cy="135" rx="90" ry="32" fill="#9ca3af"/>
<ellipse cx="340" cy="145" rx="45" ry="22" fill="#9ca3af"/>
<ellipse cx="460" cy="145" rx="45" ry="22" fill="#9ca3af"/>
<text x="400" y="118" font-family="Arial,sans-serif" font-size="13" fill="#374151" text-anchor="middle" font-weight="bold">moln bildas</text>
<g stroke="#2563eb" stroke-width="2">
<line x1="350" y1="168" x2="345" y2="185"/>
<line x1="385" y1="168" x2="380" y2="185"/>
<line x1="420" y1="168" x2="415" y2="185"/>
<line x1="455" y1="168" x2="450" y2="185"/>
</g>
<text x="540" y="160" font-family="Arial,sans-serif" font-size="13" fill="#2563eb" text-anchor="start">regn</text>

<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Ett lågtryck drog in över helgen, så utflykten blev till en filmkväll inne</text>
</svg>
