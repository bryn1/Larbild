<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Klyvningsprodukter</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">De nya ämnen som bildas när en atomkärna delas</text>

<!-- neutron hitting nucleus -->
<circle cx="120" cy="200" r="8" fill="#6b7280"/>
<text x="120" y="180" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">neutron</text>
<line x1="135" y1="200" x2="185" y2="200" stroke="#1f2937" stroke-width="2"/>
<polygon points="195,200 183,195 183,205" fill="#1f2937"/>

<!-- big nucleus (uranium) -->
<circle cx="250" cy="200" r="40" fill="#fde68a" stroke="#ca8a04" stroke-width="2"/>
<circle cx="238" cy="190" r="7" fill="#dc2626"/>
<circle cx="258" cy="188" r="7" fill="#2563eb"/>
<circle cx="245" cy="208" r="7" fill="#dc2626"/>
<circle cx="263" cy="210" r="7" fill="#2563eb"/>
<text x="250" y="260" font-family="Arial,sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="bold">Tung kärna (uran)</text>

<!-- split arrow -->
<line x1="300" y1="200" x2="360" y2="200" stroke="#1f2937" stroke-width="3"/>
<polygon points="370,200 358,194 358,206" fill="#1f2937"/>
<text x="335" y="185" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">delas</text>

<!-- two fragments = klyvningsprodukter -->
<circle cx="450" cy="140" r="26" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
<circle cx="442" cy="135" r="6" fill="#991b1b"/>
<circle cx="458" cy="145" r="6" fill="#991b1b"/>
<text x="450" y="100" font-family="Arial,sans-serif" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="bold">Klyvningsprodukt 1</text>

<circle cx="450" cy="270" r="26" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
<circle cx="442" cy="265" r="6" fill="#991b1b"/>
<circle cx="458" cy="275" r="6" fill="#991b1b"/>
<text x="450" y="315" font-family="Arial,sans-serif" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="bold">Klyvningsprodukt 2</text>

<!-- free neutrons + energy -->
<circle cx="510" cy="190" r="6" fill="#6b7280"/>
<circle cx="510" cy="220" r="6" fill="#6b7280"/>
<path d="M 500 200 Q 510 195 500 210" fill="none" stroke="#f59e0b" stroke-width="2"/>

<!-- radioactivity warning + safe storage -->
<rect x="560" y="120" width="200" height="170" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="6"/>
<text x="660" y="148" font-family="Arial,sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="bold">Radioaktiva länge</text>
<!-- radiation trefoil simplified -->
<circle cx="660" cy="200" r="10" fill="#92400e"/>
<path d="M 660 200 L 660 170 A 30 30 0 0 1 686 215 Z" fill="#f59e0b" stroke="#92400e" stroke-width="1"/>
<path d="M 660 200 L 686 215 A 30 30 0 0 1 634 215 Z" fill="#f59e0b" stroke="#92400e" stroke-width="1"/>
<path d="M 660 200 L 634 215 A 30 30 0 0 1 660 170 Z" fill="#f59e0b" stroke="#92400e" stroke-width="1"/>
<text x="660" y="270" font-family="Arial,sans-serif" font-size="12" fill="#92400e" text-anchor="middle">måste förvaras säkert</text>

<!-- storage in bedrock -->
<rect x="250" y="380" width="300" height="60" fill="#9ca3af" stroke="#4b5563" stroke-width="2"/>
<rect x="370" y="395" width="60" height="35" fill="#fde68a" stroke="#ca8a04" stroke-width="2"/>
<text x="400" y="418" font-family="Arial,sans-serif" font-size="11" fill="#92400e" text-anchor="middle">avfall</text>
<text x="400" y="370" font-family="Arial,sans-serif" font-size="12" fill="#4b5563" text-anchor="middle">förvaras djupt i berget</text>

<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">När kärnan klyvs bildas nya ämnen – flera är radioaktiva mycket länge</text>
</svg>
