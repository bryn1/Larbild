<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Nederbörd</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Allt vatten som faller från himlen</text>

<!-- Cloud across top -->
<ellipse cx="400" cy="115" rx="260" ry="40" fill="#9ca3af"/>
<ellipse cx="220" cy="120" rx="80" ry="30" fill="#9ca3af"/>
<ellipse cx="580" cy="120" rx="80" ry="30" fill="#9ca3af"/>
<text x="400" y="105" font-family="Arial,sans-serif" font-size="13" fill="#374151" text-anchor="middle" font-weight="bold">Moln</text>

<!-- Ground -->
<rect x="60" y="410" width="680" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>

<!-- REGN -->
<g stroke="#2563eb" stroke-width="3" stroke-linecap="round">
<line x1="150" y1="170" x2="142" y2="380"/>
<line x1="180" y1="170" x2="172" y2="380"/>
<line x1="210" y1="170" x2="202" y2="380"/>
</g>
<text x="180" y="405" font-family="Arial,sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">Regn</text>

<!-- SNÖ (snowflakes drawn as 6-line vector stars) -->
<g stroke="#1e40af" stroke-width="2" stroke-linecap="round">
<!-- flake 1 at (320,215) -->
<line x1="320" y1="203" x2="320" y2="227"/>
<line x1="309.6" y1="209" x2="330.4" y2="221"/>
<line x1="309.6" y1="221" x2="330.4" y2="209"/>
<!-- flake 2 at (350,270) -->
<line x1="350" y1="258" x2="350" y2="282"/>
<line x1="339.6" y1="264" x2="360.4" y2="276"/>
<line x1="339.6" y1="276" x2="360.4" y2="264"/>
<!-- flake 3 at (310,320) -->
<line x1="310" y1="308" x2="310" y2="332"/>
<line x1="299.6" y1="314" x2="320.4" y2="326"/>
<line x1="299.6" y1="326" x2="320.4" y2="314"/>
<!-- flake 4 at (345,370) -->
<line x1="345" y1="358" x2="345" y2="382"/>
<line x1="334.6" y1="364" x2="355.4" y2="376"/>
<line x1="334.6" y1="376" x2="355.4" y2="364"/>
</g>
<text x="330" y="405" font-family="Arial,sans-serif" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="bold">Snö</text>

<!-- HAGEL (little circles) -->
<g fill="#6b7280">
<circle cx="470" cy="210" r="7"/>
<circle cx="490" cy="270" r="7"/>
<circle cx="460" cy="320" r="7"/>
<circle cx="485" cy="370" r="7"/>
</g>
<text x="475" y="405" font-family="Arial,sans-serif" font-size="14" fill="#374151" text-anchor="middle" font-weight="bold">Hagel</text>

<!-- SLASK (mix: drops + dots) -->
<g>
<line x1="600" y1="200" x2="595" y2="240" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
<circle cx="630" cy="250" r="6" fill="#9ca3af"/>
<line x1="615" y1="290" x2="610" y2="330" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
<circle cx="640" cy="340" r="6" fill="#9ca3af"/>
</g>
<text x="620" y="405" font-family="Arial,sans-serif" font-size="14" fill="#374151" text-anchor="middle" font-weight="bold">Slask</text>

<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Det blev mycket nederbörd i natt, så skolgården var full av pölar på morgonen</text>
</svg>
