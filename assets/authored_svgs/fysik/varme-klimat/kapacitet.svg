<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Kapacitet</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Hur mycket något klarar av att lagra eller producera</text>

<!-- Small battery -->
<rect x="120" y="160" width="90" height="180" fill="white" stroke="#1f2937" stroke-width="3" rx="6"/>
<rect x="150" y="148" width="30" height="14" fill="#1f2937"/>
<!-- fill -->
<rect x="125" y="270" width="80" height="65" fill="#16a34a"/>
<line x1="120" y1="200" x2="210" y2="200" stroke="#d1d5db" stroke-width="1"/>
<line x1="120" y1="240" x2="210" y2="240" stroke="#d1d5db" stroke-width="1"/>
<line x1="120" y1="280" x2="210" y2="280" stroke="#d1d5db" stroke-width="1"/>
<text x="165" y="370" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Litet batteri</text>
<text x="165" y="390" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle">liten kapacitet</text>
<text x="165" y="408" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">räcker kort tid</text>

<!-- Large battery -->
<rect x="500" y="110" width="130" height="230" fill="white" stroke="#1f2937" stroke-width="3" rx="6"/>
<rect x="545" y="96" width="40" height="16" fill="#1f2937"/>
<!-- fill (more) -->
<rect x="505" y="170" width="120" height="165" fill="#16a34a"/>
<line x1="500" y1="160" x2="630" y2="160" stroke="#d1d5db" stroke-width="1"/>
<line x1="500" y1="210" x2="630" y2="210" stroke="#d1d5db" stroke-width="1"/>
<line x1="500" y1="260" x2="630" y2="260" stroke="#d1d5db" stroke-width="1"/>
<line x1="500" y1="300" x2="630" y2="300" stroke="#d1d5db" stroke-width="1"/>
<text x="565" y="370" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Stort batteri</text>
<text x="565" y="390" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle">stor kapacitet</text>
<text x="565" y="408" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">räcker länge</text>

<!-- comparison arrow -->
<line x1="240" y1="250" x2="470" y2="250" stroke="#f59e0b" stroke-width="3"/>
<polygon points="480,250 468,245 468,255" fill="#f59e0b"/>
<text x="355" y="240" font-family="Arial,sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="bold">mer kapacitet</text>

<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Större kapacitet betyder att mer energi kan lagras eller produceras</text>
</svg>
