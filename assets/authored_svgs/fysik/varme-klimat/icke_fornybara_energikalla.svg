<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Icke förnybar energikälla</text>
<text x="400" y="62" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Tar slut när vi använt upp den – nybildas alldeles för långsamt</text>

<!-- three sources -->
<!-- Oil -->
<rect x="80" y="110" width="140" height="100" fill="#1f2937" stroke="#000000" stroke-width="2" rx="4"/>
<ellipse cx="150" cy="110" rx="70" ry="14" fill="#374151"/>
<path d="M 150 145 Q 138 160 150 168 Q 162 160 150 145 Z" fill="#f59e0b"/>
<text x="150" y="240" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Olja</text>

<!-- Coal -->
<polygon points="330,200 355,150 380,165 410,145 435,200" fill="#374151" stroke="#1f2937" stroke-width="2"/>
<polygon points="345,200 365,170 390,200" fill="#1f2937"/>
<text x="383" y="240" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Kol</text>

<!-- Uranium -->
<circle cx="620" cy="160" r="45" fill="#fde68a" stroke="#ca8a04" stroke-width="2"/>
<circle cx="620" cy="160" r="10" fill="#92400e"/>
<ellipse cx="620" cy="160" rx="40" ry="15" fill="none" stroke="#a16207" stroke-width="2"/>
<ellipse cx="620" cy="160" rx="40" ry="15" fill="none" stroke="#a16207" stroke-width="2" transform="rotate(60 620 160)"/>
<ellipse cx="620" cy="160" rx="40" ry="15" fill="none" stroke="#a16207" stroke-width="2" transform="rotate(120 620 160)"/>
<text x="620" y="240" font-family="Arial,sans-serif" font-size="14" fill="#92400e" text-anchor="middle" font-weight="bold">Uran</text>

<!-- depleting bar -->
<rect x="120" y="300" width="560" height="40" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="4"/>
<rect x="120" y="300" width="200" height="40" fill="#fca5a5"/>
<line x1="320" y1="295" x2="320" y2="345" stroke="#991b1b" stroke-width="2" stroke-dasharray="4,3"/>
<text x="220" y="325" font-family="Arial,sans-serif" font-size="13" fill="#991b1b" text-anchor="middle">kvar</text>
<text x="500" y="325" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">redan förbrukat</text>

<!-- arrow pointing to empty / runs out -->
<line x1="400" y1="360" x2="640" y2="360" stroke="#dc2626" stroke-width="3"/>
<polygon points="650,360 638,355 638,365" fill="#dc2626"/>
<text x="660" y="364" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="start" font-weight="bold">slut</text>
<text x="280" y="385" font-family="Arial,sans-serif" font-size="12" fill="#991b1b" text-anchor="middle">förrådet minskar för varje år</text>

<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Olja, kol och uran är begränsade förråd som en dag tar slut</text>
</svg>
