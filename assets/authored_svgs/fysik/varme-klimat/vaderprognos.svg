<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Väderprognos</text>
<!-- Step 1: measurements -->
<rect x="50" y="150" width="170" height="150" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="135" y="178" font-family="Arial,sans-serif" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="bold">1. Mätningar</text>
<!-- thermometer -->
<rect x="78" y="200" width="9" height="55" rx="4" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
<rect x="80" y="225" width="5" height="30" fill="#dc2626"/>
<circle cx="82" cy="262" r="8" fill="#dc2626" stroke="#6b7280" stroke-width="1.5"/>
<!-- wind -->
<path d="M110 215 q40 -10 52 4 q8 12 -8 12" fill="none" stroke="#374151" stroke-width="2"/>
<path d="M110 240 q50 -10 64 4" fill="none" stroke="#374151" stroke-width="2"/>
<text x="135" y="285" font-family="Arial,sans-serif" font-size="11" fill="#1e40af" text-anchor="middle">temperatur, vind, tryck</text>
<!-- arrow 1 -->
<line x1="225" y1="225" x2="295" y2="225" stroke="#1f2937" stroke-width="3"/>
<polygon points="307,225 295,230 295,220" fill="#1f2937"/>
<!-- Step 2: calculation -->
<rect x="312" y="150" width="170" height="150" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="397" y="178" font-family="Arial,sans-serif" font-size="14" fill="#b45309" text-anchor="middle" font-weight="bold">2. Beräkning</text>
<!-- computer screen -->
<rect x="350" y="200" width="94" height="62" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2"/>
<text x="397" y="228" font-family="Arial,sans-serif" font-size="11" fill="#22c55e" text-anchor="middle">dator</text>
<text x="397" y="245" font-family="Arial,sans-serif" font-size="11" fill="#22c55e" text-anchor="middle">räknar</text>
<rect x="388" y="262" width="18" height="10" fill="#475569"/>
<text x="397" y="290" font-family="Arial,sans-serif" font-size="11" fill="#b45309" text-anchor="middle">utifrån mätningarna</text>
<!-- arrow 2 -->
<line x1="487" y1="225" x2="557" y2="225" stroke="#1f2937" stroke-width="3"/>
<polygon points="569,225 557,230 557,220" fill="#1f2937"/>
<!-- Step 3: forecast -->
<rect x="574" y="150" width="176" height="150" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="662" y="178" font-family="Arial,sans-serif" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="bold">3. Prognos</text>
<!-- sun icon -->
<circle cx="640" cy="225" r="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<g stroke="#f59e0b" stroke-width="2">
<line x1="640" y1="195" x2="640" y2="185"/>
<line x1="640" y1="255" x2="640" y2="265"/>
<line x1="610" y1="225" x2="600" y2="225"/>
<line x1="670" y1="225" x2="680" y2="225"/>
</g>
<text x="700" y="222" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="bold">Sol</text>
<text x="700" y="240" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="bold">på lördag</text>
<text x="662" y="290" font-family="Arial,sans-serif" font-size="11" fill="#16a34a" text-anchor="middle">gissning om vädret framåt</text>
<text x="400" y="370" font-family="Arial,sans-serif" font-size="14" fill="#374151" text-anchor="middle" font-weight="bold">Mätningar  →  beräkning  →  gissning om vädret framåt</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">En gissning om hur vädret blir, gjord utifrån mätningar och beräkningar</text>
</svg>
