<text x="655" y="310" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">punkten sitter snett</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Acentrisk: punkten eller banan ligger inte i mitten — centrum är förskjutet</text>
