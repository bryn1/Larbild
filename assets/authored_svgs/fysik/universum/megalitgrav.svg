<polygon points="600.0,158.0 610.5,151.1 611.4,163.2" fill="#dc2626"/>
<text x="705" y="150" font-family="Arial,sans-serif" font-size="14" fill="#dc2626" text-anchor="start" font-weight="bold">Takhäll</text>
<line x1="150.0" y1="250.0" x2="247.2" y2="268.0" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="258.0,270.0 246.1,273.9 248.3,262.0" fill="#dc2626"/>
<text x="145" y="250" font-family="Arial,sans-serif" font-size="14" fill="#dc2626" text-anchor="end" font-weight="bold">Bärande</text>
<text x="145" y="268" font-family="Arial,sans-serif" font-size="14" fill="#dc2626" text-anchor="end" font-weight="bold">stenblock</text>
<text x="400" y="300" font-family="Arial,sans-serif" font-size="15" fill="#1e40af" text-anchor="middle" font-weight="bold">Gravkammare</text>
<text x="400" y="320" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(här begravdes de döda)</text>
<text x="400" y="415" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Byggd för flera tusen år sedan av enorma stenar</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">En megalitgrav är en grav byggd av väldigt stora stenar</text>
</svg>
