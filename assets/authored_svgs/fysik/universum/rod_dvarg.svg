<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Röd dvärg — liten, sval och långlivad</text>
<circle cx="250.0" cy="250.0" r="70.0" fill="#fde047" stroke="#f97316" stroke-width="2.5"/>
<text x="250" y="250" font-family="Arial,sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="bold">Solen</text>
<text x="250" y="345" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(till jämförelse)</text>
<circle cx="540.0" cy="250.0" r="28.0" fill="#ef4444" stroke="#991b1b" stroke-width="2.5"/>
<text x="540" y="250" font-family="Arial,sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Röd</text>
<text x="540" y="263" font-family="Arial,sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">dvärg</text>
<text x="540" y="305" font-family="Arial,sans-serif" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="bold">liten och sval</text>
<rect x="120" y="380" width="560" height="60" fill="#fef2f2" stroke="#b91c1c" stroke-width="2" rx="8"/>
<text x="160" y="405" font-family="Arial,sans-serif" font-size="13" fill="#b91c1c" text-anchor="start" font-weight="bold">Lyser rödaktigt</text>
<text x="160" y="425" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="start">(låg temperatur)</text>
<line x1="400.0" y1="388.0" x2="400.0" y2="432.0" stroke="#fca5a5" stroke-width="1.5"/>
<text x="560" y="405" font-family="Arial,sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="bold">Bränner bränslet</text>
<text x="560" y="425" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">långsamt → lever länge</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">En röd dvärg är en liten, sval stjärna som lever mycket länge</text>
</svg>
