<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Gravitationskraft — massor drar i varandra</text>

<!-- ===== top row: two equal-ish masses attract each other ===== -->
<text x="400" y="92" font-family="Arial,sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Alla föremål drar i varandra</text>

<!-- mass A (medium) -->
<circle cx="250" cy="160" r="40" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2.5"/>
<text x="250" y="166" font-family="Arial,sans-serif" font-size="15" fill="#1e3a8a" text-anchor="middle" font-weight="bold">massa</text>
<!-- mass B (medium) -->
<circle cx="550" cy="160" r="40" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2.5"/>
<text x="550" y="166" font-family="Arial,sans-serif" font-size="15" fill="#1e3a8a" text-anchor="middle" font-weight="bold">massa</text>

<!-- force arrows pointing toward each other (equal length) -->
<line x1="300" y1="160" x2="378" y2="160" stroke="#dc2626" stroke-width="4"/>
<polygon points="392,160 376,152 376,168" fill="#dc2626"/>
<line x1="500" y1="160" x2="422" y2="160" stroke="#dc2626" stroke-width="4"/>
<polygon points="408,160 424,152 424,168" fill="#dc2626"/>
<text x="345" y="146" font-family="Arial,sans-serif" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">F</text>
<text x="455" y="146" font-family="Arial,sans-serif" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">F</text>
<text x="400" y="216" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">kraften drar dem mot varandra</text>

<!-- divider -->
<line x1="80" y1="248" x2="720" y2="248" stroke="#e5e7eb" stroke-width="2"/>

<!-- ===== bottom row: bigger mass => bigger pull ===== -->
<text x="400" y="288" font-family="Arial,sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Större massa → större dragningskraft</text>

<!-- big mass (left) -->
<circle cx="220" cy="358" r="54" fill="#fca5a5" stroke="#b91c1c" stroke-width="2.5"/>
<text x="220" y="356" font-family="Arial,sans-serif" font-size="15" fill="#7f1d1d" text-anchor="middle" font-weight="bold">stor</text>
<text x="220" y="374" font-family="Arial,sans-serif" font-size="15" fill="#7f1d1d" text-anchor="middle" font-weight="bold">massa</text>

<!-- small mass (right) -->
<circle cx="600" cy="358" r="24" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2.5"/>
<text x="600" y="363" font-family="Arial,sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle" font-weight="bold">liten</text>

<!-- big pull on each (large arrow to show "stark kraft") -->
<line x1="282" y1="358" x2="430" y2="358" stroke="#dc2626" stroke-width="6"/>
<polygon points="448,358 426,348 426,368" fill="#dc2626"/>
<line x1="566" y1="358" x2="490" y2="358" stroke="#dc2626" stroke-width="6"/>
<polygon points="472,358 494,348 494,368" fill="#dc2626"/>
<text x="362" y="338" font-family="Arial,sans-serif" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold">stor F</text>
<text x="528" y="338" font-family="Arial,sans-serif" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold">stor F</text>

<text x="400" y="440" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Ju större massa ett föremål har, desto starkare drar det — därför håller jorden oss kvar</text>

<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Gravitationskraft är dragningen mellan massor. Den håller oss på marken och månen i sin bana</text>
</svg>
