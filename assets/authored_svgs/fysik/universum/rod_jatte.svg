<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Röd jätte — gammal stjärna som svällt upp</text>
<circle cx="160.0" cy="250.0" r="34.0" fill="#fde047" stroke="#f97316" stroke-width="2.5"/>
<text x="160" y="320" font-family="Arial,sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="bold">Solen idag</text>
<text x="160" y="338" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(gul stjärna)</text>
<line x1="215.0" y1="250.0" x2="307.0" y2="250.0" stroke="#dc2626" stroke-width="3"/>
<polygon points="320.0,250.0 307.0,257.1 307.0,242.8" fill="#dc2626"/>
<text x="268" y="232" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold">blir gammal</text>
<circle cx="520.0" cy="250.0" r="130.0" fill="#f87171" stroke="#b91c1c" stroke-width="3"/>
<circle cx="520.0" cy="250.0" r="130.0" fill="none" stroke="#fca5a5" stroke-width="6" stroke-dasharray="2,8"/>
<text x="520" y="250" font-family="Arial,sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">RÖD JÄTTE</text>
<text x="520" y="270" font-family="Arial,sans-serif" font-size="12" fill="white" text-anchor="middle">stor och rödaktig</text>
<circle cx="520.0" cy="250.0" r="12.0" fill="none" stroke="#fee2e2" stroke-width="1.5" stroke-dasharray="3,3"/>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">När vår sol blir gammal sväller den upp och blir en röd jätte</text>
</svg>
