<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Solfläck</text>
<!-- Sun disk -->
<circle cx="320" cy="250" r="170" fill="#fde68a" stroke="#f59e0b" stroke-width="3"/>
<text x="320" y="100" font-family="Arial,sans-serif" font-size="15" fill="#92400e" text-anchor="middle" font-weight="bold">Solens yta (~5500 °C)</text>
<!-- Sunspot: dark umbra + lighter penumbra -->
<ellipse cx="300" cy="270" rx="58" ry="44" fill="#d97706" opacity="0.55"/>
<ellipse cx="300" cy="270" rx="32" ry="24" fill="#4b2e05"/>
<!-- a second smaller spot -->
<ellipse cx="400" cy="190" rx="26" ry="20" fill="#d97706" opacity="0.55"/>
<ellipse cx="400" cy="190" rx="13" ry="10" fill="#4b2e05"/>
<!-- callout to main spot -->
<line x1="300" y1="270" x2="600" y2="200" stroke="#1f2937" stroke-width="1.5"/>
<rect x="600" y="170" width="180" height="62" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
<text x="690" y="192" font-family="Arial,sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="bold">Solfläck</text>
<text x="690" y="210" font-family="Arial,sans-serif" font-size="12" fill="#92400e" text-anchor="middle">mörkare = svalare</text>
<text x="690" y="226" font-family="Arial,sans-serif" font-size="12" fill="#92400e" text-anchor="middle">(~4000 °C)</text>
<!-- magnetic field lines through the spot -->
<path d="M 270 270 C 250 200, 350 200, 330 270" fill="none" stroke="#dc2626" stroke-width="2"/>
<path d="M 280 290 C 260 360, 340 360, 320 290" fill="none" stroke="#dc2626" stroke-width="2"/>
<text x="300" y="345" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold">starkt magnetfält</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Ett mörkare, svalare område på solens yta där magnetfältet är extra starkt</text>
</svg>
