<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="36" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Svart hål — inte ens ljus tar sig ut</text>

<!-- Faint gravity field glow -->
<circle cx="400" cy="265" r="190" fill="#fde68a" opacity="0.12"/>

<!-- Event horizon ring -->
<circle cx="400" cy="265" r="120" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,5" opacity="0.8"/>
<!-- The black hole itself -->
<circle cx="400" cy="265" r="78" fill="#0b1020" stroke="#f59e0b" stroke-width="2.5"/>
<text x="400" y="270" font-family="Arial,sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">svart hål</text>
<text x="400" y="158" font-family="Arial,sans-serif" font-size="13" fill="#92400e" text-anchor="middle">Händelsehorisont</text>

<!-- Light ray 1: comes from far, bends and is captured (ends at horizon, no escape) -->
<path d="M 110 150 C 240 180 330 200 372 235" fill="none" stroke="#facc15" stroke-width="3"/>
<polygon points="378,240 364,235 369,227" fill="#facc15"/>
<text x="110" y="138" font-family="Arial,sans-serif" font-size="13" fill="#a16207" text-anchor="start">Ljus som kommer för nära...</text>

<!-- Light ray 2: from the side, also curving in and captured -->
<path d="M 150 410 C 230 400 320 380 384 332" fill="none" stroke="#facc15" stroke-width="3"/>
<polygon points="390,327 376,330 380,339" fill="#facc15"/>
<text x="150" y="398" font-family="Arial,sans-serif" font-size="13" fill="#a16207" text-anchor="start">...dras in och kommer aldrig ut</text>

<!-- Light ray that tries to leave but bends back (cannot escape) -->
<path d="M 430 215 C 470 160 470 140 440 110" fill="none" stroke="#dc2626" stroke-width="3"/>
<polygon points="437,118 433,104 446,108" fill="#dc2626"/>
<text x="500" y="120" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="start">Ljuset kan inte</text>
<text x="500" y="138" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="start" font-weight="bold">ta sig ut</text>

<!-- Matter being pulled in (dots spiralling toward horizon) -->
<circle cx="620" cy="300" r="4" fill="#6b7280"/>
<circle cx="585" cy="305" r="3.5" fill="#6b7280"/>
<circle cx="552" cy="300" r="3" fill="#9ca3af"/>
<circle cx="522" cy="292" r="2.5" fill="#9ca3af"/>
<line x1="640" y1="305" x2="500" y2="280" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="3,4"/>
<text x="650" y="300" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="start">materia dras in</text>

<text x="400" y="442" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">Tyngdkraften är så stark att allt som kommer för nära dras in —</text>
<text x="400" y="464" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">till och med ljuset, så det syns helt svart</text>
</svg>
