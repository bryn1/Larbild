<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Meteoroid — storlek i rymden</text>
<circle cx="170.0" cy="320.0" r="5.0" fill="#6b7280" stroke="#1f2937" stroke-width="1.5"/>
<text x="170" y="365" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Dammkorn</text>
<text x="170" y="383" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(mindre)</text>
<circle cx="400.0" cy="312.0" r="26.0" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
<line x1="388.0" y1="302.0" x2="412.0" y2="322.0" stroke="#6b7280" stroke-width="1.2"/>
<line x1="394.0" y1="318.0" x2="410.0" y2="306.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="400" y="365" font-family="Arial,sans-serif" font-size="15" fill="#92400e" text-anchor="middle" font-weight="bold">METEOROID</text>
<text x="400" y="383" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">liten sten- eller metallklump</text>
<polygon points="600.0,265.0 660.0,258.0 695.0,295.0 685.0,345.0 625.0,365.0 572.0,335.0 575.0,290.0" fill="#9ca3af" stroke="#6b7280" stroke-width="2.5"/>
<circle cx="640.0" cy="305.0" r="7.0" fill="none" stroke="#6b7280" stroke-width="1.3"/>
<circle cx="610.0" cy="330.0" r="5.0" fill="none" stroke="#6b7280" stroke-width="1.3"/>
<text x="635" y="400" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Asteroid</text>
<text x="635" y="418" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(större)</text>
<line x1="120.0" y1="120.0" x2="687.0" y2="120.0" stroke="#2563eb" stroke-width="3"/>
<polygon points="700.0,120.0 687.0,127.2 687.0,112.8" fill="#2563eb"/>
<text x="400" y="105" font-family="Arial,sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">Allt mindre  →  allt större</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">En meteoroid är större än ett dammkorn men mindre än en asteroid</text>
</svg>
