<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Svart dvärg — utslocknad stjärnrest</text>
<line x1="100" y1="350" x2="700" y2="350" stroke="#9ca3af" stroke-width="2"/>
<line x1="700.0" y1="350.0" x2="710.0" y2="350.0" stroke="#9ca3af" stroke-width="2"/>
<polygon points="720.0,350.0 710.0,354.5 710.0,345.5" fill="#9ca3af"/>
<text x="720" y="370" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="start">tid</text>
<circle cx="200" cy="230" r="30" fill="#fef9c3" stroke="#fde047" stroke-width="2"/>
<line x1="200" y1="260" x2="200" y2="348" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>
<text x="200" y="380" font-family="Arial,sans-serif" font-size="13" fill="#374151" text-anchor="middle" font-weight="bold">Vit dvärg</text>
<text x="200" y="398" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">het, lyser svagt</text>
<circle cx="400" cy="230" r="28" fill="#9ca3af" stroke="#6b7280" stroke-width="2"/>
<line x1="400" y1="258" x2="400" y2="348" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>
<text x="400" y="380" font-family="Arial,sans-serif" font-size="13" fill="#374151" text-anchor="middle" font-weight="bold">Svalnar</text>
<text x="400" y="398" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">lyser allt mörkare</text>
<circle cx="600" cy="230" r="28" fill="#1f2937" stroke="#111827" stroke-width="2"/>
<line x1="600" y1="258" x2="600" y2="348" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>
<text x="600" y="380" font-family="Arial,sans-serif" font-size="13" fill="#374151" text-anchor="middle" font-weight="bold">Svart dvärg</text>
<text x="600" y="398" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">kall och mörk</text>
<circle cx="200" cy="230" r="40" fill="#fde047" opacity="0.18"/>
<line x1="238.0" y1="230.0" x2="352.0" y2="230.0" stroke="#374151" stroke-width="2"/>
<polygon points="362.0,230.0 352.0,234.5 352.0,225.5" fill="#374151"/>
<line x1="438.0" y1="230.0" x2="552.0" y2="230.0" stroke="#374151" stroke-width="2"/>
<polygon points="562.0,230.0 552.0,234.5 552.0,225.5" fill="#374151"/>
<text x="400" y="130" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">En vit dvärg som slocknat helt och kallnat</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Som en grillkolbit som ligger kvar dagen efter — kall och mörk</text>
</svg>