<text x="400" y="200" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">linjerna flyttas mot rött</text>
<text x="180" y="95" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="start">blått</text>
<text x="620" y="95" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="end">rött</text>
<text x="400" y="360" font-family="Arial,sans-serif" font-size="13" fill="#374151" text-anchor="middle">Bortrörelse → längre våglängd (rödare).</text>
<text x="400" y="382" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Som ambulanssirenen som låter mörkare när bilen kör bort.</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Ljus från galaxer som flyr blir rödare — så vet vi att universum växer</text>
