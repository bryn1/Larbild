<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Ellips (oval bana)</text>
<!-- the elliptical orbit itself -->
<ellipse cx="400" cy="240" rx="250" ry="130" stroke="#2563eb" stroke-width="3" fill="none"/>
<!-- major + minor axes (faint guides) -->
<line x1="150" y1="240" x2="650" y2="240" stroke="#d1d5db" stroke-width="1" stroke-dasharray="5,4"/>
<line x1="400" y1="110" x2="400" y2="370" stroke="#d1d5db" stroke-width="1" stroke-dasharray="5,4"/>
<!-- centre of the ellipse (so it is clear the Sun is NOT in the centre) -->
<circle cx="400" cy="240" r="2.5" fill="#9ca3af"/>
<text x="400" y="228" font-family="Arial,sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">centrum</text>
<!-- the two foci: the Sun sits IN one focus, not in the centre -->
<circle cx="186.5" cy="240" r="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="186.5" y="244" font-family="Arial,sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="bold">Sol</text>
<text x="186.5" y="290" font-family="Arial,sans-serif" font-size="11" fill="#b45309" text-anchor="middle">brännpunkt 1</text>
<circle cx="613.5" cy="240" r="4" fill="#9ca3af"/>
<text x="613.5" y="266" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">brännpunkt 2</text>
<!-- radius line Sun -> planet: the planet's distance to the Sun varies along the ellipse -->
<line x1="186.5" y1="240" x2="591.5" y2="156.4" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3"/>
<!-- ghost (earlier) position on the SAME ellipse, to show the planet travels the whole oval -->
<circle cx="239.3" cy="140.4" r="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
<!-- the planet, sitting ON the ellipse -->
<circle cx="591.5" cy="156.4" r="10" fill="#16a34a"/>
<text x="603" y="150" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="start" font-weight="bold">planet</text>
<!-- direction-of-motion arrowhead, tangent to the ellipse at the planet -->
<polygon points="577.9,148.0 593.5,149.4 586.1,161.3" fill="#16a34a"/>
<text x="400" y="455" font-family="Arial,sans-serif" font-size="13" fill="#374151" text-anchor="middle">En ellips är en tillplattad cirkel med två brännpunkter.</text>
<text x="400" y="476" font-family="Arial,sans-serif" font-size="13" fill="#374151" text-anchor="middle">Planeten går runt i ellipsen — solen ligger i den ena brännpunkten, inte i mitten.</text>
</svg>
