<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Infraröd strålning</text>
<!-- ===== Electromagnetic spectrum strip: LEFT = long wavelength, RIGHT = short ===== -->
<!-- Radio / Mikro / Infraröd (left of visible) -->
<rect x="80" y="150" width="90" height="60" fill="#94a3b8"/>
<rect x="170" y="150" width="80" height="60" fill="#64748b"/>
<rect x="250" y="150" width="90" height="60" fill="#b91c1c"/>
<!-- Synligt ljus: röd -> orange -> gul -> grön -> blå -> violett -->
<rect x="340" y="150" width="22" height="60" fill="#ef4444"/>
<rect x="362" y="150" width="21" height="60" fill="#f97316"/>
<rect x="383" y="150" width="22" height="60" fill="#facc15"/>
<rect x="405" y="150" width="22" height="60" fill="#22c55e"/>
<rect x="427" y="150" width="21" height="60" fill="#3b82f6"/>
<rect x="448" y="150" width="22" height="60" fill="#7c3aed"/>
<!-- UV / Röntgen / Gamma (right of visible) -->
<rect x="470" y="150" width="80" height="60" fill="#6d28d9"/>
<rect x="550" y="150" width="80" height="60" fill="#4338ca"/>
<rect x="630" y="150" width="90" height="60" fill="#312e81"/>
<!-- strip outline -->
<rect x="80" y="150" width="640" height="60" fill="none" stroke="#1f2937" stroke-width="1.5"/>
<!-- band labels -->
<text x="125" y="185" font-family="Arial,sans-serif" font-size="11" fill="white" text-anchor="middle">Radio</text>
<text x="210" y="185" font-family="Arial,sans-serif" font-size="11" fill="white" text-anchor="middle">Mikro</text>
<text x="295" y="180" font-family="Arial,sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Infraröd</text>
<text x="405" y="135" font-family="Arial,sans-serif" font-size="11" fill="#374151" text-anchor="middle">Synligt ljus</text>
<text x="510" y="185" font-family="Arial,sans-serif" font-size="11" fill="white" text-anchor="middle">UV</text>
<text x="590" y="185" font-family="Arial,sans-serif" font-size="11" fill="white" text-anchor="middle">Röntgen</text>
<text x="675" y="185" font-family="Arial,sans-serif" font-size="11" fill="white" text-anchor="middle">Gamma</text>
<!-- wavelength direction arrows -->
<text x="120" y="248" font-family="Arial,sans-serif" font-size="12" fill="#374151" text-anchor="middle">lång våglängd</text>
<text x="680" y="248" font-family="Arial,sans-serif" font-size="12" fill="#374151" text-anchor="middle">kort våglängd</text>
<line x1="200" y1="232" x2="100" y2="232" stroke="#374151" stroke-width="1.5"/>
<polygon points="100,232 114,226 114,238" fill="#374151"/>
<line x1="600" y1="232" x2="700" y2="232" stroke="#374151" stroke-width="1.5"/>
<polygon points="700,232 686,226 686,238" fill="#374151"/>
<!-- Highlight box around the Infraröd band -->
<rect x="248" y="148" width="94" height="64" fill="none" stroke="#dc2626" stroke-width="3"/>
<line x1="295" y1="212" x2="295" y2="300" stroke="#dc2626" stroke-width="1.5"/>
<!-- Heat illustration: IR carries heat -->
<text x="295" y="320" font-family="Arial,sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold">Infraröd = värmestrålning</text>
<g stroke="#dc2626" stroke-width="2">
<path d="M 250 345 q 8 8 0 16 q -8 8 0 16" fill="none"/>
<path d="M 280 345 q 8 8 0 16 q -8 8 0 16" fill="none"/>
<path d="M 310 345 q 8 8 0 16 q -8 8 0 16" fill="none"/>
<path d="M 340 345 q 8 8 0 16 q -8 8 0 16" fill="none"/>
</g>
<text x="295" y="398" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">varma föremål sänder ut infrarött ljus</text>
<text x="400" y="452" font-family="Arial,sans-serif" font-size="14" fill="#374151" text-anchor="middle" font-weight="bold">Infraröd strålning ligger till vänster om det röda ljuset (längre våglängd)</text>
<text x="400" y="476" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">UV, röntgen och gamma ligger till höger om det violetta ljuset</text>
</svg>
