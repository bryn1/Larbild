<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Positiv lins (samlingslins)</text>
<line x1="60" y1="270" x2="740" y2="270" stroke="#9ca3af" stroke-width="1" stroke-dasharray="8,5"/>
<ellipse cx="400" cy="270" rx="16" ry="140" stroke="#2563eb" stroke-width="3" fill="#dbeafe" opacity="0.45"/>
<text x="400" y="130" font-family="Arial,sans-serif" font-size="11" fill="#2563eb" text-anchor="middle">tjockast i mitten</text>
<circle cx="600" cy="270" r="5" fill="#16a34a"/>
<text x="600" y="294" font-family="Arial,sans-serif" font-size="14" fill="#16a34a" text-anchor="middle">F (fokus)</text>
<line x1="90" y1="180" x2="400.0" y2="180.0" stroke="#dc2626" stroke-width="2"/>
<polygon points="400,180 400.0,180.0 400.0,180.0" fill="#dc2626"/>
<line x1="90" y1="270" x2="400.0" y2="270.0" stroke="#dc2626" stroke-width="2"/>
<polygon points="400,270 400.0,270.0 400.0,270.0" fill="#dc2626"/>
<line x1="90" y1="360" x2="400.0" y2="360.0" stroke="#dc2626" stroke-width="2"/>
<polygon points="400,360 400.0,360.0 400.0,360.0" fill="#dc2626"/>
<line x1="400" y1="180" x2="590.9" y2="265.9" stroke="#dc2626" stroke-width="2"/>
<polygon points="600,270 590.0,270.0 593.3,262.5" fill="#dc2626"/>
<line x1="400" y1="360" x2="590.9" y2="274.1" stroke="#dc2626" stroke-width="2"/>
<polygon points="600,270 593.3,277.5 590.0,270.0" fill="#dc2626"/>
<line x1="400" y1="270" x2="690.0" y2="270.0" stroke="#dc2626" stroke-width="2"/>
<polygon points="700,270 690.9,274.1 690.9,265.9" fill="#dc2626"/>
<text x="150" y="170" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">Parallella strålar</text>
<text x="660" y="252" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">samlas i fokus</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">En positiv lins är tjockast i mitten och samlar parallella ljusstrålar i en punkt (fokus)</text>
</svg>