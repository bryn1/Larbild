<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Positiv lins (samlingslins)</text>
<!-- Optical axis -->
<line x1="60" y1="250" x2="760" y2="250" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,4"/>
<!-- Biconvex (converging) lens at x=400: thick in the middle, thin at the edges -->
<path d="M 400 130 Q 432 250 400 370 Q 368 250 400 130 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="400" y="120" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">konvex lins (samlingslins)</text>
<text x="400" y="388" font-family="Arial,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">tjock i mitten, tunn vid kanterna</text>
<!-- Focal point F to the right on the axis -->
<circle cx="620" cy="250" r="6" fill="#dc2626"/>
<text x="620" y="232" font-family="Arial,sans-serif" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold">F</text>
<text x="620" y="285" font-family="Arial,sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">brännpunkt</text>
<!-- ===== Parallel incoming rays (red), arrowheads toward the lens ===== -->
<line x1="80" y1="180" x2="392" y2="180" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="392,180 378,174 378,186" fill="#dc2626"/>
<line x1="80" y1="250" x2="386" y2="250" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="386,250 372,244 372,256" fill="#dc2626"/>
<line x1="80" y1="320" x2="392" y2="320" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="392,320 378,314 378,326" fill="#dc2626"/>
<text x="150" y="165" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">parallella strålar</text>
<!-- ===== Rays converge from lens through F, then CONTINUE past F (diverging) ===== -->
<!-- upper ray: (400,180) -> F(620,250) -> continues to (740,288) -->
<line x1="400" y1="180" x2="740" y2="288" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="740,288 725,285 728,273" fill="#dc2626"/>
<!-- centre ray: straight through along axis -->
<line x1="400" y1="250" x2="740" y2="250" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="740,250 726,244 726,256" fill="#dc2626"/>
<!-- lower ray: (400,320) -> F(620,250) -> continues to (740,212) -->
<line x1="400" y1="320" x2="740" y2="212" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="740,212 728,221 725,209" fill="#dc2626"/>
<text x="530" y="162" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="bold">strålarna samlas i F</text>
<text x="695" y="330" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="bold">och sprids isär efteråt</text>
<text x="400" y="455" font-family="Arial,sans-serif" font-size="14" fill="#374151" text-anchor="middle" font-weight="bold">En samlingslins samlar de parallella strålarna i brännpunkten F</text>
<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Efter F korsar strålarna varandra och fortsätter — de sprids isär igen</text>
</svg>
