<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Ljusbrytning</text>
<!-- two media: air (top) and glass (bottom), boundary at y=260 -->
<rect x="120" y="80" width="560" height="180" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
<rect x="120" y="260" width="560" height="170" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
<text x="150" y="110" font-family="Arial,sans-serif" font-size="14" fill="#0369a1" font-weight="bold">Luft</text>
<text x="150" y="410" font-family="Arial,sans-serif" font-size="14" fill="#1e40af" font-weight="bold">Glas</text>
<!-- boundary surface -->
<line x1="120" y1="260" x2="680" y2="260" stroke="#475569" stroke-width="2.5"/>
<text x="635" y="253" font-family="Arial,sans-serif" font-size="12" fill="#475569">yta</text>
<!-- normal (dashed) through point of incidence (400,260) -->
<line x1="400" y1="100" x2="400" y2="420" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6,5"/>
<text x="408" y="118" font-family="Arial,sans-serif" font-size="12" fill="#6b7280">normal</text>
<!-- Incident ray (red): arrow pointing TOWARD the surface point (400,260), large angle -->
<line x1="170" y1="130" x2="400" y2="260" stroke="#dc2626" stroke-width="3"/>
<polygon points="400,260 386,251 391,243" fill="#dc2626"/>
<text x="225" y="150" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" font-weight="bold">infallande stråle</text>
<!-- angle of incidence arc i: between upward normal and incident ray (left side, above surface) -->
<path d="M 400 195 A 65 65 0 0 0 343 226" fill="none" stroke="#16a34a" stroke-width="1.8"/>
<text x="360" y="212" font-family="Arial,sans-serif" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="bold">i</text>
<!-- Refracted ray (blue): arrow pointing AWAY into glass, bent TOWARD normal (smaller angle) -->
<line x1="400" y1="260" x2="475" y2="405" stroke="#2563eb" stroke-width="3"/>
<polygon points="475,405 463,396 472,391" fill="#2563eb"/>
<text x="520" y="390" font-family="Arial,sans-serif" font-size="13" fill="#2563eb" font-weight="bold">bruten stråle</text>
<!-- angle of refraction arc b: between downward normal and refracted ray (right side, below surface) -->
<path d="M 400 325 A 65 65 0 0 0 427 384" fill="none" stroke="#16a34a" stroke-width="1.8"/>
<text x="424" y="335" font-family="Arial,sans-serif" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="bold">b</text>
<text x="400" y="452" font-family="Arial,sans-serif" font-size="14" fill="#374151" text-anchor="middle" font-weight="bold">I tätare glas bryts strålen mot normalen: brytningsvinkeln b är mindre än infallsvinkeln i</text>
<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Röd = stråle i luften, blå = stråle i glaset. Normalen står vinkelrätt mot ytan.</text>
</svg>
