<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="33" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">UV-ljus</text>
<!-- ===== Compact spectrum reference strip: UV is just RIGHT of violet ===== -->
<rect x="150" y="58" width="50" height="26" fill="#64748b"/>
<rect x="200" y="58" width="50" height="26" fill="#b91c1c"/>
<rect x="250" y="58" width="14" height="26" fill="#ef4444"/>
<rect x="264" y="58" width="14" height="26" fill="#f97316"/>
<rect x="278" y="58" width="14" height="26" fill="#facc15"/>
<rect x="292" y="58" width="14" height="26" fill="#22c55e"/>
<rect x="306" y="58" width="13" height="26" fill="#3b82f6"/>
<rect x="319" y="58" width="14" height="26" fill="#7c3aed"/>
<rect x="333" y="58" width="50" height="26" fill="#6d28d9"/>
<rect x="383" y="58" width="50" height="26" fill="#4338ca"/>
<rect x="433" y="58" width="50" height="26" fill="#312e81"/>
<rect x="150" y="58" width="333" height="26" fill="none" stroke="#1f2937" stroke-width="1.3"/>
<text x="175" y="76" font-family="Arial,sans-serif" font-size="9" fill="white" text-anchor="middle">Infraröd</text>
<text x="290" y="100" font-family="Arial,sans-serif" font-size="9" fill="#374151" text-anchor="middle">synligt</text>
<text x="358" y="76" font-family="Arial,sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">UV</text>
<text x="408" y="76" font-family="Arial,sans-serif" font-size="8" fill="white" text-anchor="middle">Röntgen</text>
<text x="458" y="76" font-family="Arial,sans-serif" font-size="8" fill="white" text-anchor="middle">Gamma</text>
<text x="600" y="76" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">UV ligger strax till höger om violett</text>

<!-- ===== Sun (left) -> UV rays -> sunscreen on skin (right) ===== -->
<!-- Sun -->
<circle cx="130" cy="270" r="48" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
<g stroke="#f59e0b" stroke-width="3">
<line x1="130" y1="200" x2="130" y2="180"/>
<line x1="80" y1="220" x2="66" y2="206"/>
<line x1="180" y1="220" x2="194" y2="206"/>
<line x1="62" y1="270" x2="42" y2="270"/>
<line x1="80" y1="320" x2="66" y2="334"/>
<line x1="180" y1="320" x2="194" y2="334"/>
<line x1="130" y1="340" x2="130" y2="360"/>
</g>
<text x="130" y="275" font-family="Arial,sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="bold">Solen</text>
<!-- UV rays travelling toward the skin -->
<line x1="195" y1="240" x2="470" y2="225" stroke="#7c3aed" stroke-width="3"/>
<polygon points="470,225 455,221 457,233" fill="#7c3aed"/>
<line x1="195" y1="270" x2="470" y2="270" stroke="#7c3aed" stroke-width="3"/>
<polygon points="470,270 456,264 456,276" fill="#7c3aed"/>
<line x1="195" y1="300" x2="470" y2="315" stroke="#7c3aed" stroke-width="3"/>
<polygon points="470,315 457,307 455,319" fill="#7c3aed"/>
<text x="320" y="200" font-family="Arial,sans-serif" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="bold">UV-strålning</text>

<!-- Sunscreen layer (yellow band) on the skin surface -->
<rect x="478" y="170" width="26" height="200" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="2.5"/>
<!-- Skin behind the sunscreen -->
<rect x="504" y="170" width="150" height="200" fill="#fed7aa" stroke="#fb923c" stroke-width="1.5"/>
<text x="585" y="160" font-family="Arial,sans-serif" font-size="13" fill="#9a3412" text-anchor="middle" font-weight="bold">Huden</text>
<!-- "solkräm skyddar" label on the sunscreen, with "blockerar UV" placed right next to it -->
<text x="491" y="395" font-family="Arial,sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="bold">solkräm</text>
<text x="491" y="411" font-family="Arial,sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="bold">skyddar</text>
<text x="491" y="429" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold">(blockerar UV)</text>
<!-- show that few rays get past: stub arrows stopped at the sunscreen -->
<text x="585" y="270" font-family="Arial,sans-serif" font-size="11" fill="#16a34a" text-anchor="middle">UV stoppas</text>
<text x="585" y="286" font-family="Arial,sans-serif" font-size="11" fill="#16a34a" text-anchor="middle">vid solkrämen</text>

<text x="400" y="455" font-family="Arial,sans-serif" font-size="14" fill="#374151" text-anchor="middle" font-weight="bold">Solen sänder ut UV-strålning som kan skada huden</text>
<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Solkräm blockerar UV-ljuset och skyddar huden</text>
</svg>
