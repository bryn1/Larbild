<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Optisk täthet</text>
<rect x="120" y="270" width="560" height="170" fill="#dbeafe" stroke="#2563eb" stroke-width="2" opacity="0.45"/>
<text x="620" y="300" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">Vatten</text>
<text x="620" y="316" font-family="Arial,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(hög täthet)</text>
<text x="620" y="255" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Luft (låg täthet)</text>
<line x1="400" y1="150" x2="400" y2="420" stroke="#bbb" stroke-width="1" stroke-dasharray="8,5"/>
<text x="455" y="165" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Normal</text>
<line x1="250" y1="165" x2="391.0" y2="263.7" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="400,270 389.2,267.9 394.3,260.6" fill="#dc2626"/>
<text x="290" y="200" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">Infallande</text>
<line x1="400" y1="270" x2="451.1" y2="404.7" stroke="#16a34a" stroke-width="2.5"/>
<polygon points="455,415 447.2,407.2 455.6,404.0" fill="#16a34a"/>
<text x="490" y="400" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle">Bryts mot normalen</text>
<path d="M 400.0 224.0 A 46 46 0 0 0 362.3 243.6" stroke="#dc2626" stroke-width="1.5" fill="none"/>
<text x="369.5" y="216.5" font-family="Arial,sans-serif" font-size="14" fill="#dc2626" text-anchor="middle">i</text>
<path d="M 400.0 316.0 A 46 46 0 0 0 416.3 313.0" stroke="#16a34a" stroke-width="1.5" fill="none"/>
<text x="411.9" y="339.9" font-family="Arial,sans-serif" font-size="14" fill="#16a34a" text-anchor="middle">r</text>
<text x="400" y="250" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">i större än r</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Högre optisk täthet bromsar ljuset mer — strålen bryts mot normalen</text>
</svg>