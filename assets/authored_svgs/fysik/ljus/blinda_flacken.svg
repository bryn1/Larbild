<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Synnerven och blinda fläcken på samma ställe</text>
<!-- Eyeball cross-section, front (cornea) to the LEFT -->
<circle cx="380" cy="250" r="150" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<!-- Vitreous body (clear filling) -->
<circle cx="400" cy="250" r="120" fill="#bae6fd" opacity="0.5"/>
<!-- Cornea bulge at the front (left) -->
<path d="M 238 188 Q 202 250 238 312" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
<text x="212" y="160" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">hornhinna</text>
<line x1="220" y1="172" x2="228" y2="205" stroke="#2563eb" stroke-width="1"/>
<!-- Eye lens just behind the cornea -->
<ellipse cx="272" cy="250" rx="14" ry="42" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
<text x="272" y="335" font-family="Arial,sans-serif" font-size="12" fill="#1e40af" text-anchor="middle">lins</text>
<line x1="272" y1="294" x2="272" y2="322" stroke="#1e40af" stroke-width="1"/>
<!-- Retina along the back (right) inner wall, with a GAP where the optic nerve exits -->
<path d="M 478 142 A 150 150 0 0 1 510 322" fill="none" stroke="#16a34a" stroke-width="5" opacity="0.8"/>
<path d="M 502 350 A 150 150 0 0 1 478 358" fill="none" stroke="#16a34a" stroke-width="5" opacity="0.8"/>
<text x="430" y="135" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle">näthinna (ljuskänsliga celler)</text>
<line x1="455" y1="148" x2="478" y2="170" stroke="#16a34a" stroke-width="1"/>
<!-- Optic nerve exits at the gap (back wall, slightly below centre). SAME spot as the blind spot. -->
<path d="M 505 322 L 505 358 L 600 372 L 600 308 Z" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
<line x1="600" y1="340" x2="690" y2="340" stroke="#d97706" stroke-width="6"/>
<text x="645" y="395" font-family="Arial,sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="bold">synnerv</text>
<text x="645" y="412" font-family="Arial,sans-serif" font-size="11" fill="#d97706" text-anchor="middle">(lämnar ögat här)</text>
<!-- Blind spot marker exactly at the same location (the gap in the retina) -->
<circle cx="505" cy="340" r="9" fill="#dc2626"/>
<line x1="505" y1="340" x2="560" y2="210" stroke="#dc2626" stroke-width="1.2"/>
<text x="600" y="200" font-family="Arial,sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold">blinda fläcken</text>
<text x="600" y="220" font-family="Arial,sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">inga ljuskänsliga celler här</text>
<text x="400" y="455" font-family="Arial,sans-serif" font-size="14" fill="#374151" text-anchor="middle" font-weight="bold">Blinda fläcken ligger precis där synnerven lämnar ögat</text>
<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Där finns inga ljuskänsliga celler, så ögat ser ingenting på just den punkten</text>
</svg>
