<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Blinda fläcken i ögat</text>
<!-- Eyeball: large circle, opening to the left where light enters -->
<circle cx="380" cy="250" r="150" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
<!-- Cornea bulge on the left (front of eye) -->
<path d="M 248 180 Q 205 250 248 320" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<!-- Lens -->
<ellipse cx="262" cy="250" rx="14" ry="42" fill="#bfdbfe" stroke="#1e40af" stroke-width="2"/>
<text x="262" y="160" font-family="Arial,sans-serif" font-size="12" fill="#1e40af" text-anchor="middle">Lins</text>
<line x1="262" y1="208" x2="262" y2="172" stroke="#1e40af" stroke-width="1"/>
<!-- Retina: inner back wall arc -->
<path d="M 462 130 A 150 150 0 0 1 462 370" fill="none" stroke="#dc2626" stroke-width="6" opacity="0.55"/>
<text x="560" y="135" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">Näthinna</text>
<line x1="528" y1="150" x2="505" y2="180" stroke="#dc2626" stroke-width="1"/>
<!-- Optic nerve exit + blind spot (the gap in the retina) -->
<rect x="524" y="278" width="56" height="34" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
<!-- the gap: a white wedge cutting the retina arc -->
<path d="M 530 270 L 470 250 L 530 230 Z" fill="white" stroke="#f59e0b" stroke-width="2"/>
<text x="528" y="299" font-family="Arial,sans-serif" font-size="11" fill="#92400e" text-anchor="middle">Synnerv</text>
<text x="615" y="262" font-family="Arial,sans-serif" font-size="13" fill="#f59e0b" text-anchor="middle" font-weight="bold">Blinda</text>
<text x="615" y="280" font-family="Arial,sans-serif" font-size="13" fill="#f59e0b" text-anchor="middle" font-weight="bold">fläcken</text>
<text x="615" y="300" font-family="Arial,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(inga sinnesceller)</text>
<line x1="612" y1="285" x2="540" y2="255" stroke="#f59e0b" stroke-width="1"/>
<!-- Incoming light rays hitting the blind spot -->
<line x1="120" y1="250" x2="468" y2="250" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4"/>
<polygon points="478,250 466,254 466,246" fill="#f59e0b"/>
<text x="180" y="240" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Ljus</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Där synnerven lämnar ögat saknas ljuskänsliga celler — ögat ser ingenting där</text>
</svg>
