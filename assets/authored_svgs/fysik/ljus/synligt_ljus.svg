<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Synligt ljus i det elektromagnetiska spektrumet</text>

<!-- full spectrum baseline arrow -->
<line x1="70" y1="430" x2="730" y2="430" stroke="#374151" stroke-width="2"/>
<polygon points="742,430 728,424 728,436" fill="#374151"/>
<text x="90" y="458" font-family="Arial,sans-serif" font-size="12" fill="#6b7280">lång våglängd</text>
<text x="710" y="458" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="end">kort våglängd</text>

<!-- ===== IR band (OUTSIDE visible, on the long-wavelength / left side, beyond red) ===== -->
<rect x="90" y="150" width="150" height="120" fill="#7f1d1d" opacity="0.55" stroke="#991b1b" stroke-width="2"/>
<text x="165" y="135" font-family="Arial,sans-serif" font-size="15" fill="#991b1b" text-anchor="middle" font-weight="bold">Infrarött (IR)</text>
<text x="165" y="215" font-family="Arial,sans-serif" font-size="12" fill="white" text-anchor="middle">värmestrålning</text>
<text x="165" y="233" font-family="Arial,sans-serif" font-size="12" fill="white" text-anchor="middle">syns inte</text>
<!-- tick to baseline -->
<line x1="165" y1="270" x2="165" y2="430" stroke="#991b1b" stroke-width="1.3" stroke-dasharray="4 4"/>

<!-- gap label: outside visible -->
<text x="270" y="300" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">utanför</text>
<text x="270" y="316" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">det synliga</text>

<!-- ===== VISIBLE band (middle): rainbow red -> violet ===== -->
<g>
<rect x="310" y="150" width="30" height="120" fill="#dc2626"/>
<rect x="340" y="150" width="30" height="120" fill="#f97316"/>
<rect x="370" y="150" width="30" height="120" fill="#eab308"/>
<rect x="400" y="150" width="30" height="120" fill="#16a34a"/>
<rect x="430" y="150" width="30" height="120" fill="#2563eb"/>
<rect x="460" y="150" width="30" height="120" fill="#4338ca"/>
<rect x="490" y="150" width="30" height="120" fill="#7c3aed"/>
</g>
<rect x="310" y="150" width="210" height="120" fill="none" stroke="#1f2937" stroke-width="2"/>
<text x="415" y="135" font-family="Arial,sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Synligt ljus</text>
<text x="318" y="290" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" font-weight="bold">rött</text>
<text x="512" y="290" font-family="Arial,sans-serif" font-size="12" fill="#7c3aed" text-anchor="end" font-weight="bold">violett</text>
<line x1="415" y1="270" x2="415" y2="430" stroke="#1f2937" stroke-width="1.3" stroke-dasharray="4 4"/>

<!-- gap label right -->
<text x="555" y="300" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">utanför</text>
<text x="555" y="316" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">det synliga</text>

<!-- ===== UV band (OUTSIDE visible, on the short-wavelength / right side, beyond violet) ===== -->
<rect x="590" y="150" width="150" height="120" fill="#4c1d95" opacity="0.6" stroke="#5b21b6" stroke-width="2"/>
<text x="665" y="135" font-family="Arial,sans-serif" font-size="15" fill="#5b21b6" text-anchor="middle" font-weight="bold">Ultraviolett (UV)</text>
<text x="665" y="215" font-family="Arial,sans-serif" font-size="12" fill="white" text-anchor="middle">ger solbränna</text>
<text x="665" y="233" font-family="Arial,sans-serif" font-size="12" fill="white" text-anchor="middle">syns inte</text>
<line x1="665" y1="270" x2="665" y2="430" stroke="#5b21b6" stroke-width="1.3" stroke-dasharray="4 4"/>

<text x="400" y="388" font-family="Arial,sans-serif" font-size="14" fill="#374151" text-anchor="middle" font-weight="bold">Bara den smala mittenremsan kan ögat se - IR och UV ligger utanför</text>
</svg>
