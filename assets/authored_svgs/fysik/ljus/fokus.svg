<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Fokus (skarp bild via lins)</text>
<!-- Optical axis -->
<line x1="60" y1="260" x2="740" y2="260" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,4"/>
<!-- Object: upright arrow on the left -->
<line x1="130" y1="260" x2="130" y2="170" stroke="#16a34a" stroke-width="3"/>
<polygon points="130,165 125,177 135,177" fill="#16a34a"/>
<text x="130" y="290" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle">Föremål</text>
<!-- Lens at x=380 -->
<path d="M 380 150 Q 415 260 380 370 Q 345 260 380 150 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="380" y="140" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">Lins</text>
<!-- Ray 1: parallel from object top, then through far focal point -->
<line x1="130" y1="170" x2="380" y2="170" stroke="#dc2626" stroke-width="2"/>
<line x1="380" y1="170" x2="600" y2="335" stroke="#dc2626" stroke-width="2"/>
<!-- Ray 2: through lens centre (straight) -->
<line x1="130" y1="170" x2="600" y2="335" stroke="#f59e0b" stroke-width="2"/>
<!-- Screen / image plane at x=600 -->
<line x1="600" y1="130" x2="600" y2="390" stroke="#6b7280" stroke-width="3"/>
<text x="640" y="200" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Skärm /</text>
<text x="640" y="216" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">näthinna</text>
<!-- Inverted image arrow (downward) at screen -->
<line x1="600" y1="260" x2="600" y2="335" stroke="#dc2626" stroke-width="4"/>
<polygon points="600,340 594,328 606,328" fill="#dc2626"/>
<!-- Focus point marker where rays meet -->
<circle cx="600" cy="335" r="7" fill="#1e40af" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="660" y="335" font-family="Arial,sans-serif" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="bold">Fokus</text>
<text x="660" y="353" font-family="Arial,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(skarp bild)</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">När strålarna möts på skärmen är bilden i fokus — då blir den skarp</text>
</svg>
