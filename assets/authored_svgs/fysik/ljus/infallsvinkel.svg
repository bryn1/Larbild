<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Infallsvinkel</text>
<!-- Mirror / surface -->
<rect x="150" y="320" width="500" height="22" fill="#cbd5e1" stroke="#6b7280" stroke-width="1.5"/>
<!-- hatching under mirror -->
<line x1="170" y1="342" x2="155" y2="360" stroke="#6b7280" stroke-width="1"/>
<line x1="220" y1="342" x2="205" y2="360" stroke="#6b7280" stroke-width="1"/>
<line x1="270" y1="342" x2="255" y2="360" stroke="#6b7280" stroke-width="1"/>
<line x1="320" y1="342" x2="305" y2="360" stroke="#6b7280" stroke-width="1"/>
<line x1="370" y1="342" x2="355" y2="360" stroke="#6b7280" stroke-width="1"/>
<line x1="420" y1="342" x2="405" y2="360" stroke="#6b7280" stroke-width="1"/>
<line x1="470" y1="342" x2="455" y2="360" stroke="#6b7280" stroke-width="1"/>
<line x1="520" y1="342" x2="505" y2="360" stroke="#6b7280" stroke-width="1"/>
<line x1="570" y1="342" x2="555" y2="360" stroke="#6b7280" stroke-width="1"/>
<line x1="620" y1="342" x2="605" y2="360" stroke="#6b7280" stroke-width="1"/>
<text x="600" y="312" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Spegel / yta</text>
<!-- Normal at hit point (400,320) -->
<line x1="400" y1="120" x2="400" y2="320" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="408" y="135" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="start">normal</text>
<!-- Incoming ray from upper-left to (400,320) -->
<line x1="220" y1="150" x2="400" y2="320" stroke="#dc2626" stroke-width="3"/>
<polygon points="400,320 388,314 394,307" fill="#dc2626"/>
<text x="245" y="165" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">Infallande stråle</text>
<!-- Reflected ray to upper-right (mirror angle) -->
<line x1="400" y1="320" x2="580" y2="150" stroke="#2563eb" stroke-width="3"/>
<polygon points="580,150 569,160 562,153" fill="#2563eb"/>
<text x="560" y="165" font-family="Arial,sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">Reflekterad stråle</text>
<!-- Angle of incidence arc (between normal and incoming) -->
<path d="M 400 220 A 100 100 0 0 0 343 238" fill="none" stroke="#16a34a" stroke-width="2"/>
<text x="360" y="245" font-family="Arial,sans-serif" font-size="16" fill="#16a34a" text-anchor="middle" font-weight="bold">i</text>
<!-- Angle of reflection arc -->
<path d="M 457 238 A 100 100 0 0 0 400 220" fill="none" stroke="#16a34a" stroke-width="2"/>
<text x="440" y="245" font-family="Arial,sans-serif" font-size="16" fill="#16a34a" text-anchor="middle" font-weight="bold">r</text>
<text x="400" y="445" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">Infallsvinkeln (i) mäts mellan strålen och normalen</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Vid reflektion gäller: infallsvinkel i = reflektionsvinkel r</text>
</svg>
