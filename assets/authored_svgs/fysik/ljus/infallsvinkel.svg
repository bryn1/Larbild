<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Infallsvinkel och reflektionsvinkel (i = r)</text>
<!-- Mirror surface: horizontal line at y=300. Reflective side faces UP. -->
<line x1="120" y1="300" x2="680" y2="300" stroke="#475569" stroke-width="3"/>
<!-- hatch marks BELOW the surface to show the solid/back side of the mirror -->
<line x1="150" y1="300" x2="138" y2="318" stroke="#94a3b8" stroke-width="1.6"/>
<line x1="200" y1="300" x2="188" y2="318" stroke="#94a3b8" stroke-width="1.6"/>
<line x1="250" y1="300" x2="238" y2="318" stroke="#94a3b8" stroke-width="1.6"/>
<line x1="300" y1="300" x2="288" y2="318" stroke="#94a3b8" stroke-width="1.6"/>
<line x1="350" y1="300" x2="338" y2="318" stroke="#94a3b8" stroke-width="1.6"/>
<line x1="450" y1="300" x2="438" y2="318" stroke="#94a3b8" stroke-width="1.6"/>
<line x1="500" y1="300" x2="488" y2="318" stroke="#94a3b8" stroke-width="1.6"/>
<line x1="550" y1="300" x2="538" y2="318" stroke="#94a3b8" stroke-width="1.6"/>
<line x1="600" y1="300" x2="588" y2="318" stroke="#94a3b8" stroke-width="1.6"/>
<line x1="650" y1="300" x2="638" y2="318" stroke="#94a3b8" stroke-width="1.6"/>
<text x="620" y="335" font-family="Arial,sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">spegel</text>
<!-- Normal: dashed vertical line through the point of incidence (400,300) -->
<line x1="400" y1="90" x2="400" y2="300" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6,5"/>
<text x="408" y="105" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="start">normal</text>
<!-- Incident ray (red): from upper-left to the point (400,300), angle i = 50 deg from normal -->
<line x1="224" y1="152" x2="400" y2="300" stroke="#dc2626" stroke-width="3"/>
<polygon points="400,300 384,292 388,283" fill="#dc2626"/>
<text x="232" y="142" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">infallande stråle</text>
<!-- Reflected ray (blue): from the point (400,300) to upper-right, angle r = 50 deg from normal -->
<line x1="400" y1="300" x2="576" y2="152" stroke="#2563eb" stroke-width="3"/>
<polygon points="576,152 560,159 567,168" fill="#2563eb"/>
<text x="585" y="142" font-family="Arial,sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">reflekterad stråle</text>
<!-- Angle of incidence arc i: between upward normal and incident ray, LEFT side. radius 70 -->
<path d="M 400 230 A 70 70 0 0 0 346 255" fill="none" stroke="#16a34a" stroke-width="2"/>
<text x="362" y="240" font-family="Arial,sans-serif" font-size="16" fill="#16a34a" text-anchor="middle" font-weight="bold">i</text>
<!-- Angle of reflection arc r: between upward normal and reflected ray, RIGHT side. radius 70 (equal) -->
<path d="M 454 255 A 70 70 0 0 0 400 230" fill="none" stroke="#16a34a" stroke-width="2"/>
<text x="438" y="240" font-family="Arial,sans-serif" font-size="16" fill="#16a34a" text-anchor="middle" font-weight="bold">r</text>
<text x="400" y="455" font-family="Arial,sans-serif" font-size="14" fill="#374151" text-anchor="middle" font-weight="bold">Vid reflektion är infallsvinkeln i lika stor som reflektionsvinkeln r</text>
<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Båda vinklarna mäts från normalen och ligger på var sin sida om den</text>
</svg>
