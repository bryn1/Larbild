<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Lux (lx) — ljus som faller på en yta</text>
<!-- Lamp at top -->
<circle cx="400" cy="110" r="28" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
<text x="400" y="115" font-family="Arial,sans-serif" font-size="11" fill="#92400e" text-anchor="middle" font-weight="bold">Lampa</text>
<!-- Light cone falling onto a desk surface -->
<polygon points="378,132 422,132 560,330 240,330" fill="#fde68a" stroke="#f59e0b" stroke-width="1.5" opacity="0.6"/>
<!-- a few ray arrows -->
<line x1="370" y1="140" x2="280" y2="320" stroke="#f59e0b" stroke-width="2"/>
<polygon points="276,328 277,316 285,322" fill="#f59e0b"/>
<line x1="400" y1="140" x2="400" y2="320" stroke="#f59e0b" stroke-width="2"/>
<polygon points="400,328 395,316 405,316" fill="#f59e0b"/>
<line x1="430" y1="140" x2="520" y2="320" stroke="#f59e0b" stroke-width="2"/>
<polygon points="524,328 515,322 523,316" fill="#f59e0b"/>
<!-- Desk / surface -->
<rect x="200" y="330" width="400" height="30" fill="#d6d3d1" stroke="#78716c" stroke-width="2"/>
<text x="400" y="350" font-family="Arial,sans-serif" font-size="13" fill="#44403c" text-anchor="middle" font-weight="bold">Skrivbordets yta</text>
<!-- Area markers under the lit patch -->
<line x1="240" y1="375" x2="560" y2="375" stroke="#16a34a" stroke-width="1.5"/>
<line x1="240" y1="368" x2="240" y2="382" stroke="#16a34a" stroke-width="1.5"/>
<line x1="560" y1="368" x2="560" y2="382" stroke="#16a34a" stroke-width="1.5"/>
<text x="400" y="397" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle">belyst yta (m²)</text>
<!-- lux label -->
<text x="650" y="250" font-family="Arial,sans-serif" font-size="18" fill="#16a34a" text-anchor="middle" font-weight="bold">lx</text>
<text x="650" y="272" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">lux = lumen</text>
<text x="650" y="287" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">per yta</text>
<text x="400" y="445" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">Lux mäter hur mycket ljus som träffar ytan — hur ljust det är där</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Vid skrivbordet behövs många lux för att läsa läxan utan att kisa</text>
</svg>
