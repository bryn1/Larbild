<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Konvex spegel</text>
<!-- optical axis -->
<line x1="80" y1="250" x2="730" y2="250" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,5"/>
<text x="712" y="242" font-family="Arial,sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">axel</text>
<!-- Convex mirror: reflective side bulges LEFT toward the rays; centre of curvature to the RIGHT.
     Vertex on axis at x=540. -->
<path d="M 561.4 120 A 200 200 0 0 0 561.4 380" fill="none" stroke="#1f2937" stroke-width="4"/>
<!-- hatch marks on the BACK (right, non-reflective, concave) side -->
<line x1="563" y1="123" x2="579" y2="116" stroke="#6b7280" stroke-width="2"/>
<line x1="545" y1="170" x2="561" y2="164" stroke="#6b7280" stroke-width="2"/>
<line x1="535" y1="210" x2="552" y2="206" stroke="#6b7280" stroke-width="2"/>
<line x1="533" y1="250" x2="550" y2="250" stroke="#6b7280" stroke-width="2"/>
<line x1="535" y1="290" x2="552" y2="294" stroke="#6b7280" stroke-width="2"/>
<line x1="545" y1="330" x2="561" y2="336" stroke="#6b7280" stroke-width="2"/>
<line x1="563" y1="377" x2="579" y2="384" stroke="#6b7280" stroke-width="2"/>
<text x="585" y="205" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">spegelns baksida</text>
<text x="500" y="98" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">speglande sida</text>
<!-- virtual focal point F behind the mirror, on axis -->
<circle cx="640" cy="250" r="5" fill="#dc2626"/>
<text x="640" y="240" font-family="Arial,sans-serif" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">F</text>
<text x="640" y="298" font-family="Arial,sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">skenbar brännpunkt</text>
<!-- ===== Parallel rays in (blue, arrowheads) hit mirror; reflect diverging (green, arrowheads) ===== -->
<!-- ray 1 (upper): surface (561.4,160) -->
<line x1="120" y1="160" x2="561.4" y2="160" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="350,160 336,154 336,166" fill="#2563eb"/>
<line x1="561.4" y1="160" x2="482.8" y2="70" stroke="#16a34a" stroke-width="2.5"/>
<polygon points="482.8,70 496,80 487,88" fill="#16a34a"/>
<!-- dashed virtual back-extension to F -->
<line x1="561.4" y1="160" x2="640" y2="250" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5,4"/>
<!-- ray 2 (lower): surface (561.4,340) -->
<line x1="120" y1="340" x2="561.4" y2="340" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="350,340 336,334 336,346" fill="#2563eb"/>
<line x1="561.4" y1="340" x2="482.8" y2="430" stroke="#16a34a" stroke-width="2.5"/>
<polygon points="482.8,430 496,420 487,412" fill="#16a34a"/>
<line x1="561.4" y1="340" x2="640" y2="250" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5,4"/>
<!-- ray 3 (along axis): hits vertex (540,250), reflects straight back to the left -->
<line x1="120" y1="250" x2="540" y2="250" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="345,250 331,244 331,256" fill="#2563eb"/>
<text x="180" y="150" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="bold">parallella strålar</text>
<text x="300" y="105" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="bold">strålarna sprids isär</text>
<text x="400" y="455" font-family="Arial,sans-serif" font-size="14" fill="#374151" text-anchor="middle" font-weight="bold">En konvex spegel buktar utåt och sprider strålarna isär</text>
<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Strålarna verkar komma från en skenbar brännpunkt bakom spegeln</text>
</svg>
