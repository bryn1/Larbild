<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Negativ lins (sprider ljus)</text>
<!-- Optical axis -->
<line x1="60" y1="250" x2="740" y2="250" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,4"/>
<!-- Concave lens at x=400: thin in middle, thick at edges -->
<path d="M 372 140 Q 400 250 372 360 L 428 360 Q 400 250 428 140 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="400" y="125" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">Negativ lins</text>
<text x="400" y="385" font-family="Arial,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">tunn i mitten</text>
<!-- Parallel incoming rays -->
<line x1="80" y1="195" x2="390" y2="195" stroke="#dc2626" stroke-width="2.5"/>
<line x1="80" y1="250" x2="372" y2="250" stroke="#dc2626" stroke-width="2.5"/>
<line x1="80" y1="305" x2="390" y2="305" stroke="#dc2626" stroke-width="2.5"/>
<text x="150" y="180" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Parallella strålar</text>
<!-- Diverging rays after lens (spread outward) -->
<line x1="390" y1="195" x2="700" y2="120" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="700,120 689,124 690,132" fill="#dc2626"/>
<line x1="372" y1="250" x2="700" y2="250" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="700,250 689,246 689,254" fill="#dc2626"/>
<line x1="390" y1="305" x2="700" y2="380" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="700,380 690,368 689,376" fill="#dc2626"/>
<!-- Virtual focal point: backward extension dashed to a point on the left -->
<line x1="390" y1="195" x2="245" y2="230" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="390" y1="305" x2="245" y2="270" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,4"/>
<circle cx="245" cy="250" r="6" fill="none" stroke="#16a34a" stroke-width="2"/>
<text x="245" y="320" font-family="Arial,sans-serif" font-size="11" fill="#16a34a" text-anchor="middle">skenbar</text>
<text x="245" y="335" font-family="Arial,sans-serif" font-size="11" fill="#16a34a" text-anchor="middle">brännpunkt</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">En negativ lins sprider strålarna utåt — bilden ser mindre ut (för närsynta)</text>
</svg>
