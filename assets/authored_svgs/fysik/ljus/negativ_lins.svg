<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Negativ lins (sprider ljus)</text>
<!-- Optical axis -->
<line x1="60" y1="250" x2="740" y2="250" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,4"/>
<!-- Biconcave (diverging) lens at x=400: thin in the middle, thick at the edges -->
<path d="M 374 135 Q 400 250 374 365 L 426 365 Q 400 250 426 135 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="400" y="122" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">konkav lins (spridningslins)</text>
<text x="400" y="388" font-family="Arial,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">tunn i mitten, tjock vid kanterna</text>
<!-- Parallel incoming rays (red), arrowheads toward the lens -->
<line x1="80" y1="190" x2="392" y2="190" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="392,190 378,184 378,196" fill="#dc2626"/>
<line x1="80" y1="250" x2="386" y2="250" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="386,250 372,244 372,256" fill="#dc2626"/>
<line x1="80" y1="310" x2="392" y2="310" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="392,310 378,304 378,316" fill="#dc2626"/>
<text x="150" y="175" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">parallella strålar</text>
<!-- Diverging rays after the lens (spread outward), arrowheads at the ends.
     Back-extensions all meet at the virtual focus F=(250,250) on the incoming side. -->
<line x1="400" y1="190" x2="700" y2="70" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="700,70 686,73 689,85" fill="#dc2626"/>
<line x1="400" y1="250" x2="700" y2="250" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="700,250 686,244 686,256" fill="#dc2626"/>
<line x1="400" y1="310" x2="700" y2="430" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="700,430 686,427 689,415" fill="#dc2626"/>
<text x="640" y="120" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold">strålarna sprids</text>
<!-- Dashed virtual back-extensions to the focal point on the left -->
<line x1="400" y1="190" x2="250" y2="250" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,4"/>
<line x1="400" y1="310" x2="250" y2="250" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,4"/>
<!-- Clear virtual focal point F -->
<circle cx="250" cy="250" r="6" fill="#16a34a"/>
<text x="250" y="232" font-family="Arial,sans-serif" font-size="15" fill="#16a34a" text-anchor="middle" font-weight="bold">F</text>
<text x="250" y="290" font-family="Arial,sans-serif" font-size="11" fill="#16a34a" text-anchor="middle">skenbar brännpunkt</text>
<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">En negativ lins sprider strålarna utåt — de tycks komma från brännpunkten F</text>
</svg>
