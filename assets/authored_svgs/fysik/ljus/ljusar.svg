<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Ljusår — sträckan ljus hinner på 1 år</text>
<!-- Earth on the left -->
<circle cx="130" cy="220" r="34" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
<path d="M 104 205 Q 120 215 110 230 Q 130 240 150 228 Q 158 212 142 205 Z" fill="#16a34a"/>
<text x="130" y="280" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Jorden</text>
<!-- Star on the right -->
<polygon points="680,200 690,228 720,228 696,246 706,275 680,257 654,275 664,246 640,228 670,228"
         fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
<text x="680" y="300" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Stjärna</text>
<!-- Light beam travelling from star to Earth -->
<line x1="640" y1="225" x2="175" y2="222" stroke="#dc2626" stroke-width="3"/>
<polygon points="165,222 178,216 178,228" fill="#dc2626"/>
<!-- speed label on the beam -->
<text x="400" y="200" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">Ljuset färdas 300 000 km varje sekund</text>
<!-- time bracket under the beam -->
<line x1="175" y1="250" x2="640" y2="250" stroke="#16a34a" stroke-width="1.5"/>
<line x1="175" y1="243" x2="175" y2="257" stroke="#16a34a" stroke-width="1.5"/>
<line x1="640" y1="243" x2="640" y2="257" stroke="#16a34a" stroke-width="1.5"/>
<text x="400" y="272" font-family="Arial,sans-serif" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="bold">1 ljusår = sträckan på 1 helt år</text>
<!-- conversion box -->
<rect x="200" y="330" width="400" height="70" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
<text x="400" y="358" font-family="Arial,sans-serif" font-size="14" fill="#92400e" text-anchor="middle" font-weight="bold">1 ljusår ≈ 9 500 000 000 000 km</text>
<text x="400" y="382" font-family="Arial,sans-serif" font-size="12" fill="#92400e" text-anchor="middle">(används för riktigt långa avstånd i rymden)</text>
<text x="400" y="448" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Ett ljusår är en sträcka — inte en tid</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Stjärnan på kvällshimlen kan ligga många ljusår bort från jorden</text>
</svg>
