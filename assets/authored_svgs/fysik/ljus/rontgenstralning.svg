<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="33" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Röntgenstrålning</text>
<!-- ===== Compact spectrum reference: Röntgen lies to the RIGHT (short wavelength) ===== -->
<rect x="200" y="56" width="40" height="22" fill="#b91c1c"/>
<rect x="240" y="56" width="11" height="22" fill="#ef4444"/>
<rect x="251" y="56" width="11" height="22" fill="#f97316"/>
<rect x="262" y="56" width="11" height="22" fill="#facc15"/>
<rect x="273" y="56" width="11" height="22" fill="#22c55e"/>
<rect x="284" y="56" width="10" height="22" fill="#3b82f6"/>
<rect x="294" y="56" width="11" height="22" fill="#7c3aed"/>
<rect x="305" y="56" width="40" height="22" fill="#6d28d9"/>
<rect x="345" y="56" width="40" height="22" fill="#4338ca"/>
<rect x="385" y="56" width="40" height="22" fill="#312e81"/>
<rect x="200" y="56" width="225" height="22" fill="none" stroke="#1f2937" stroke-width="1.3"/>
<text x="220" y="72" font-family="Arial,sans-serif" font-size="8" fill="white" text-anchor="middle">IR</text>
<text x="272" y="93" font-family="Arial,sans-serif" font-size="8" fill="#374151" text-anchor="middle">synligt</text>
<text x="325" y="72" font-family="Arial,sans-serif" font-size="8" fill="white" text-anchor="middle">UV</text>
<text x="365" y="72" font-family="Arial,sans-serif" font-size="8" fill="white" text-anchor="middle" font-weight="bold">Röntgen</text>
<text x="405" y="72" font-family="Arial,sans-serif" font-size="8" fill="white" text-anchor="middle">Gamma</text>
<text x="560" y="72" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">kort våglängd, mycket energi</text>

<!-- ===== Röntgen source (left) -> arm (soft tissue + bone) -> film (right) ===== -->
<!-- Source -->
<rect x="60" y="240" width="44" height="60" rx="6" fill="#374151"/>
<text x="82" y="330" font-family="Arial,sans-serif" font-size="11" fill="#374151" text-anchor="middle">röntgen-</text>
<text x="82" y="345" font-family="Arial,sans-serif" font-size="11" fill="#374151" text-anchor="middle">källa</text>

<!-- Arm cross-section: soft tissue (outer, light) with bone (inner, opaque) -->
<ellipse cx="400" cy="270" rx="70" ry="120" fill="#fed7aa" stroke="#fb923c" stroke-width="2"/>
<text x="400" y="160" font-family="Arial,sans-serif" font-size="12" fill="#9a3412" text-anchor="middle" font-weight="bold">mjuk vävnad</text>
<ellipse cx="400" cy="270" rx="26" ry="55" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="400" y="274" font-family="Arial,sans-serif" font-size="12" fill="#475569" text-anchor="middle" font-weight="bold">ben</text>

<!-- Detector / film behind the arm -->
<rect x="640" y="150" width="30" height="240" rx="4" fill="#1f2937"/>
<!-- shadow region on the film where the bone blocked the rays (lighter band) -->
<rect x="640" y="218" width="30" height="104" fill="#cbd5e1"/>
<text x="700" y="265" font-family="Arial,sans-serif" font-size="11" fill="#475569" text-anchor="middle">ljus skugga</text>
<text x="700" y="281" font-family="Arial,sans-serif" font-size="11" fill="#475569" text-anchor="middle">efter benet</text>
<text x="655" y="408" font-family="Arial,sans-serif" font-size="11" fill="#374151" text-anchor="middle">film</text>

<!-- Rays through SOFT TISSUE (top + bottom): pass all the way to the film -->
<line x1="104" y1="195" x2="640" y2="180" stroke="#16a34a" stroke-width="2.5"/>
<polygon points="640,180 625,177 627,189" fill="#16a34a"/>
<line x1="104" y1="355" x2="640" y2="360" stroke="#16a34a" stroke-width="2.5"/>
<polygon points="640,360 625,355 626,367" fill="#16a34a"/>
<text x="250" y="180" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="bold">går igenom mjuk vävnad</text>

<!-- Rays toward the BONE: stopped at the bone (no continuation past it) -->
<line x1="104" y1="258" x2="374" y2="262" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="374,262 360,256 359,268" fill="#dc2626"/>
<line x1="104" y1="282" x2="374" y2="278" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="374,278 360,272 359,284" fill="#dc2626"/>
<text x="225" y="430" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold">stoppas av benet</text>
<line x1="225" y1="418" x2="395" y2="320" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,3"/>

<text x="400" y="455" font-family="Arial,sans-serif" font-size="14" fill="#374151" text-anchor="middle" font-weight="bold">Röntgenstrålning går igenom mjuk vävnad men stoppas av ben</text>
<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Benet kastar en skugga på filmen — så blir skelettet synligt på röntgenbilden</text>
</svg>
