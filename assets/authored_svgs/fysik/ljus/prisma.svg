<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Prisma - vitt ljus delas upp</text>

<!-- ===== Triangular prism (apex up) ===== -->
<polygon points="360,120 270,360 450,360" fill="#e0f2fe" stroke="#0284c7" stroke-width="3" opacity="0.85"/>
<text x="360" y="390" font-family="Arial,sans-serif" font-size="13" fill="#0284c7" text-anchor="middle" font-weight="bold">glasprisma</text>

<!-- ===== Incoming WHITE ray (left), hits the LEFT face at (315,240) ===== -->
<line x1="100" y1="215" x2="315" y2="240" stroke="#374151" stroke-width="3"/>
<polygon points="250,229 234,225 238,239" fill="#374151"/>
<text x="150" y="205" font-family="Arial,sans-serif" font-size="13" fill="#374151" font-weight="bold">vitt ljus</text>

<!-- normal at entry face (dashed, short) to show refraction occurs -->
<line x1="285" y1="212" x2="348" y2="262" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="4 4"/>

<!-- ===== Ray bent ALREADY inside the prism (grey), entry (315,240) -> exit on right face (427,300) ===== -->
<line x1="315" y1="240" x2="427" y2="300" stroke="#6b7280" stroke-width="3"/>
<text x="340" y="298" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" transform="rotate(28 340 298)">bryts vid ytan</text>

<!-- normal at exit (right) face (dashed) -->
<line x1="402" y1="275" x2="470" y2="312" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="4 4"/>

<!-- ===== Dispersed spectrum leaving the RIGHT face at (427,300) (bends again + splits) ===== -->
<line x1="427" y1="300" x2="700" y2="250" stroke="#dc2626" stroke-width="3"/>
<line x1="427" y1="300" x2="700" y2="278" stroke="#f97316" stroke-width="3"/>
<line x1="427" y1="300" x2="700" y2="305" stroke="#eab308" stroke-width="3"/>
<line x1="427" y1="300" x2="700" y2="332" stroke="#16a34a" stroke-width="3"/>
<line x1="427" y1="300" x2="700" y2="358" stroke="#2563eb" stroke-width="3"/>
<line x1="427" y1="300" x2="700" y2="384" stroke="#7c3aed" stroke-width="3"/>

<text x="715" y="254" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" font-weight="bold">röd</text>
<text x="715" y="310" font-family="Arial,sans-serif" font-size="12" fill="#eab308" font-weight="bold">gul</text>
<text x="715" y="362" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" font-weight="bold">blå</text>
<text x="715" y="388" font-family="Arial,sans-serif" font-size="12" fill="#7c3aed" font-weight="bold">violett</text>

<text x="400" y="445" font-family="Arial,sans-serif" font-size="14" fill="#374151" text-anchor="middle" font-weight="bold">Ljuset bryts vid bägge ytorna - och delas upp i regnbågens färger</text>
<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Röd bryts minst, violett bryts mest - därför sprids färgerna isär</text>
</svg>
