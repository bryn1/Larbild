<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Polaroidglas</text>
<!-- Light ray travelling left to right along y=250 -->
<line x1="60" y1="250" x2="740" y2="250" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,4"/>
<polygon points="740,250 724,243 724,257" fill="#9ca3af"/>
<text x="690" y="240" font-family="Arial,sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">ljusets riktning</text>

<!-- ===== LEFT: unpolarised light — vibrations in ALL directions (double-headed arrows) ===== -->
<g stroke="#dc2626" stroke-width="2.5">
<line x1="155" y1="190" x2="155" y2="310"/>
<line x1="113" y1="208" x2="197" y2="292"/>
<line x1="95" y1="250" x2="215" y2="250"/>
<line x1="113" y1="292" x2="197" y2="208"/>
</g>
<!-- arrowheads (both ends) for the four orientations -->
<g fill="#dc2626">
<polygon points="155,190 149,204 161,204"/><polygon points="155,310 149,296 161,296"/>
<polygon points="113,208 124,217 117,226"/><polygon points="197,292 186,283 193,274"/>
<polygon points="95,250 109,244 109,256"/><polygon points="215,250 201,244 201,256"/>
<polygon points="113,292 117,278 124,285"/><polygon points="197,208 193,222 186,215"/>
</g>
<text x="155" y="350" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">opolariserat ljus</text>
<text x="155" y="368" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">svänger åt alla håll</text>

<!-- ===== POLAROID FILTER: panel with vertical slits (passes vertical vibration) ===== -->
<rect x="370" y="130" width="60" height="240" rx="6" fill="#e0e7ff" stroke="#4338ca" stroke-width="2.5"/>
<line x1="382" y1="142" x2="382" y2="358" stroke="#4338ca" stroke-width="2"/>
<line x1="394" y1="142" x2="394" y2="358" stroke="#4338ca" stroke-width="2"/>
<line x1="406" y1="142" x2="406" y2="358" stroke="#4338ca" stroke-width="2"/>
<line x1="418" y1="142" x2="418" y2="358" stroke="#4338ca" stroke-width="2"/>
<text x="400" y="118" font-family="Arial,sans-serif" font-size="13" fill="#4338ca" text-anchor="middle" font-weight="bold">polaroidfilter</text>
<text x="400" y="392" font-family="Arial,sans-serif" font-size="11" fill="#4338ca" text-anchor="middle">släpper bara igenom</text>
<text x="400" y="407" font-family="Arial,sans-serif" font-size="11" fill="#4338ca" text-anchor="middle">en svängningsriktning</text>

<!-- ===== RIGHT: only the vertical vibration passes (one orientation) ===== -->
<line x1="600" y1="185" x2="600" y2="315" stroke="#16a34a" stroke-width="3"/>
<polygon points="600,185 593,200 607,200" fill="#16a34a"/>
<polygon points="600,315 593,300 607,300" fill="#16a34a"/>
<text x="600" y="350" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="bold">polariserat ljus</text>
<text x="600" y="368" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">svänger åt ett håll</text>

<text x="400" y="452" font-family="Arial,sans-serif" font-size="14" fill="#374151" text-anchor="middle" font-weight="bold">Opolariserat ljus svänger åt alla håll — polaroidglaset släpper bara igenom ett håll</text>
<text x="400" y="476" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Ljuset efter filtret är polariserat och svagare</text>
</svg>
