<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="36" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Medium — ämnet som ljuset rör sig genom</text>

<!-- Upper medium: air -->
<rect x="120" y="80" width="560" height="160" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<!-- Lower medium: water -->
<rect x="120" y="240" width="560" height="160" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>

<text x="150" y="108" font-family="Arial,sans-serif" font-size="16" fill="#6b7280" text-anchor="start" font-weight="bold">Luft (ljuset går snabbt)</text>
<text x="150" y="372" font-family="Arial,sans-serif" font-size="16" fill="#1e40af" text-anchor="start" font-weight="bold">Vatten (ljuset går långsammare)</text>

<!-- Boundary highlight -->
<line x1="120" y1="240" x2="680" y2="240" stroke="#1e3a8a" stroke-width="2.5"/>

<!-- Normal (dashed) at the point of incidence -->
<line x1="400" y1="120" x2="400" y2="360" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5,4"/>
<text x="408" y="135" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="start">normal</text>

<!-- Incoming ray in air: shallow relative to normal (large angle of incidence) -->
<line x1="250" y1="120" x2="400" y2="240" stroke="#dc2626" stroke-width="3"/>
<!-- Refracted ray in water: closer to the normal (smaller angle) -->
<line x1="400" y1="240" x2="470" y2="360" stroke="#dc2626" stroke-width="3"/>
<polygon points="470,360 458,353 466,346" fill="#dc2626"/>

<text x="250" y="138" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">Ljusstråle</text>

<!-- Angle markers -->
<path d="M 400 200 A 40 40 0 0 0 374 209" fill="none" stroke="#b45309" stroke-width="1.6"/>
<text x="360" y="200" font-family="Arial,sans-serif" font-size="13" fill="#b45309" text-anchor="middle">stor vinkel</text>
<path d="M 400 282 A 42 42 0 0 0 419 320" fill="none" stroke="#b45309" stroke-width="1.6"/>
<text x="448" y="305" font-family="Arial,sans-serif" font-size="13" fill="#b45309" text-anchor="middle">mindre vinkel</text>

<text x="400" y="438" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">När ljuset går in i ett tätare medium saktar det ner och böjs mot normalen</text>
<text x="400" y="476" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Mediet är ämnet ljuset rör sig genom — till exempel luft, vatten eller glas</text>
</svg>
