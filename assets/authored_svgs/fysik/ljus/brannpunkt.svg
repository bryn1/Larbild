<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Brännpunkt (samlande lins)</text>
<!-- Optical axis -->
<line x1="60" y1="250" x2="740" y2="250" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,4"/>
<!-- Convex lens at x=330 -->
<path d="M 330 130 Q 370 250 330 370 Q 290 250 330 130 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="330" y="120" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">Lins</text>
<!-- Parallel incoming rays (from left) -->
<line x1="80" y1="180" x2="330" y2="180" stroke="#f59e0b" stroke-width="2.5"/>
<line x1="80" y1="215" x2="330" y2="215" stroke="#f59e0b" stroke-width="2.5"/>
<line x1="80" y1="250" x2="330" y2="250" stroke="#f59e0b" stroke-width="2.5"/>
<line x1="80" y1="285" x2="330" y2="285" stroke="#f59e0b" stroke-width="2.5"/>
<line x1="80" y1="320" x2="330" y2="320" stroke="#f59e0b" stroke-width="2.5"/>
<text x="140" y="165" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Parallella strålar</text>
<!-- Converging rays after lens to focal point at (560,250) -->
<line x1="330" y1="180" x2="560" y2="250" stroke="#f59e0b" stroke-width="2.5"/>
<line x1="330" y1="215" x2="560" y2="250" stroke="#f59e0b" stroke-width="2.5"/>
<line x1="330" y1="250" x2="560" y2="250" stroke="#f59e0b" stroke-width="2.5"/>
<line x1="330" y1="285" x2="560" y2="250" stroke="#f59e0b" stroke-width="2.5"/>
<line x1="330" y1="320" x2="560" y2="250" stroke="#f59e0b" stroke-width="2.5"/>
<!-- Focal point marker -->
<circle cx="560" cy="250" r="9" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
<text x="560" y="300" font-family="Arial,sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold">Brännpunkt</text>
<text x="560" y="320" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(strålarna möts)</text>
<line x1="560" y1="285" x2="560" y2="262" stroke="#dc2626" stroke-width="1"/>
<!-- Focal length f marker -->
<line x1="330" y1="395" x2="560" y2="395" stroke="#16a34a" stroke-width="1.5"/>
<line x1="330" y1="388" x2="330" y2="402" stroke="#16a34a" stroke-width="1.5"/>
<line x1="560" y1="388" x2="560" y2="402" stroke="#16a34a" stroke-width="1.5"/>
<text x="445" y="415" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle">f (brännvidd)</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Linsen samlar parallella strålar till en prick — där blir det riktigt varmt</text>
</svg>
