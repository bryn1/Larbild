<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Lins (samlande lins)</text>
<!-- optical axis -->
<line x1="60" y1="250" x2="740" y2="250" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="80" y="242" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="start">optisk axel</text>
<!-- convex lens (two arcs) at x=360 -->
<path d="M 360 130 C 410 190, 410 310, 360 370 C 310 310, 310 190, 360 130 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<!-- incoming parallel rays (left) -->
<g stroke="#dc2626" stroke-width="2">
<line x1="80" y1="170" x2="345" y2="170"/>
<line x1="80" y1="210" x2="350" y2="210"/>
<line x1="80" y1="290" x2="350" y2="290"/>
<line x1="80" y1="330" x2="345" y2="330"/>
</g>
<text x="150" y="155" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">parallella strålar</text>
<!-- refracted rays converging to focal point at x=620, then CONTINUING (diverging) past it -->
<g stroke="#dc2626" stroke-width="2">
<line x1="375" y1="170" x2="725" y2="284.3"/>
<line x1="372" y1="210" x2="725" y2="266.9"/>
<line x1="372" y1="290" x2="725" y2="233.1"/>
<line x1="375" y1="330" x2="725" y2="215.7"/>
</g>
<!-- focal point F -->
<circle cx="620" cy="250" r="6" fill="#16a34a"/>
<text x="620" y="235" font-family="Arial,sans-serif" font-size="16" fill="#16a34a" text-anchor="middle" font-weight="bold">F</text>
<text x="660" y="255" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="start">brännpunkt</text>
<!-- focal length bracket -->
<line x1="360" y1="395" x2="620" y2="395" stroke="#16a34a" stroke-width="2"/>
<line x1="360" y1="387" x2="360" y2="403" stroke="#16a34a" stroke-width="2"/>
<line x1="620" y1="387" x2="620" y2="403" stroke="#16a34a" stroke-width="2"/>
<text x="490" y="415" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle">f (brännvidd)</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">En lins böjer ljusstrålarna så att de samlas i brännpunkten</text>
</svg>
