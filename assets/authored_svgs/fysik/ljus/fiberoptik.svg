<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Fiberoptik (totalreflektion i glastråd)</text>
<!-- Cladding (outer) -->
<rect x="90" y="160" width="620" height="180" fill="#e0f2fe" stroke="#2563eb" stroke-width="2"/>
<text x="400" y="135" font-family="Arial,sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">Glastråd (optisk fiber)</text>
<!-- Core: the inner channel, walls at y=180 (top) and y=320 (bottom) -->
<rect x="90" y="180" width="620" height="140" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2.5"/>
<text x="135" y="205" font-family="Arial,sans-serif" font-size="11" fill="#1e3a8a" text-anchor="middle">kärna</text>
<!-- Light zig-zag: every segment at 45deg; bounces land EXACTLY on the core walls y=180 and y=320 -->
<polyline points="90,285 195,180 335,320 475,180 615,320 710,225"
          fill="none" stroke="#dc2626" stroke-width="3"/>
<polygon points="710,225 705.0,237.0 698.0,230.0" fill="#dc2626"/>
<!-- Reflection points marked on the walls -->
<circle cx="195" cy="180" r="4.5" fill="#f59e0b"/>
<circle cx="335" cy="320" r="4.5" fill="#f59e0b"/>
<circle cx="475" cy="180" r="4.5" fill="#f59e0b"/>
<circle cx="615" cy="320" r="4.5" fill="#f59e0b"/>
<!-- Entry / exit labels -->
<text x="95" y="360" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="start" font-weight="bold">Ljus in</text>
<text x="705" y="360" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="end" font-weight="bold">Ljus ut</text>
<text x="400" y="388" font-family="Arial,sans-serif" font-size="13" fill="#f59e0b" text-anchor="middle" font-weight="bold">Totalreflektion vid varje vägg — inget ljus läcker ut</text>
<text x="400" y="430" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">Ljuset studsar mot kärnans väggar och leds långa sträckor inuti tråden</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Internet hemma kommer ofta via fiberoptik som skickar ljussignaler</text>
</svg>
