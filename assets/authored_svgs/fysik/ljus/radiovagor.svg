<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Radiovågor</text>
<!-- ===== Electromagnetic spectrum strip: LEFT = long wavelength, RIGHT = short ===== -->
<rect x="80" y="120" width="90" height="56" fill="#94a3b8"/>
<rect x="170" y="120" width="80" height="56" fill="#64748b"/>
<rect x="250" y="120" width="90" height="56" fill="#b91c1c"/>
<rect x="340" y="120" width="22" height="56" fill="#ef4444"/>
<rect x="362" y="120" width="21" height="56" fill="#f97316"/>
<rect x="383" y="120" width="22" height="56" fill="#facc15"/>
<rect x="405" y="120" width="22" height="56" fill="#22c55e"/>
<rect x="427" y="120" width="21" height="56" fill="#3b82f6"/>
<rect x="448" y="120" width="22" height="56" fill="#7c3aed"/>
<rect x="470" y="120" width="80" height="56" fill="#6d28d9"/>
<rect x="550" y="120" width="80" height="56" fill="#4338ca"/>
<rect x="630" y="120" width="90" height="56" fill="#312e81"/>
<rect x="80" y="120" width="640" height="56" fill="none" stroke="#1f2937" stroke-width="1.5"/>
<text x="125" y="153" font-family="Arial,sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Radio</text>
<text x="210" y="153" font-family="Arial,sans-serif" font-size="11" fill="white" text-anchor="middle">Mikro</text>
<text x="295" y="153" font-family="Arial,sans-serif" font-size="11" fill="white" text-anchor="middle">Infraröd</text>
<text x="405" y="108" font-family="Arial,sans-serif" font-size="11" fill="#374151" text-anchor="middle">Synligt ljus</text>
<text x="510" y="153" font-family="Arial,sans-serif" font-size="11" fill="white" text-anchor="middle">UV</text>
<text x="590" y="153" font-family="Arial,sans-serif" font-size="11" fill="white" text-anchor="middle">Röntgen</text>
<text x="675" y="153" font-family="Arial,sans-serif" font-size="11" fill="white" text-anchor="middle">Gamma</text>
<text x="120" y="200" font-family="Arial,sans-serif" font-size="11" fill="#374151" text-anchor="middle">lång våglängd</text>
<text x="680" y="200" font-family="Arial,sans-serif" font-size="11" fill="#374151" text-anchor="middle">kort våglängd</text>
<!-- Highlight Radio at the long-wavelength (left) end -->
<rect x="78" y="118" width="94" height="60" fill="none" stroke="#dc2626" stroke-width="3"/>

<!-- ===== A real SINE wave (radio: long wavelength), baseline y=320, amplitude 60, wavelength 200 ===== -->
<line x1="90" y1="320" x2="690" y2="320" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,4"/>
<path d="M 90,320.0 L 98,305.1 L 106,291.1 L 114,278.9 L 122,269.3 L 130,262.9 L 138,260.1 L 146,261.1 L 154,265.7 L 162,273.8 L 170,284.7 L 178,297.9 L 186,312.5 L 194,327.5 L 202,342.1 L 210,355.3 L 218,366.2 L 226,374.3 L 234,378.9 L 242,379.9 L 250,377.1 L 258,370.7 L 266,361.1 L 274,348.9 L 282,334.9 L 290,320.0 L 298,305.1 L 306,291.1 L 314,278.9 L 322,269.3 L 330,262.9 L 338,260.1 L 346,261.1 L 354,265.7 L 362,273.8 L 370,284.7 L 378,297.9 L 386,312.5 L 394,327.5 L 402,342.1 L 410,355.3 L 418,366.2 L 426,374.3 L 434,378.9 L 442,379.9 L 450,377.1 L 458,370.7 L 466,361.1 L 474,348.9 L 482,334.9 L 490,320.0 L 498,305.1 L 506,291.1 L 514,278.9 L 522,269.3 L 530,262.9 L 538,260.1 L 546,261.1 L 554,265.7 L 562,273.8 L 570,284.7 L 578,297.9 L 586,312.5 L 594,327.5 L 602,342.1 L 610,355.3 L 618,366.2 L 626,374.3 L 634,378.9 L 642,379.9 L 650,377.1 L 658,370.7 L 666,361.1 L 674,348.9 L 682,334.9 L 690,320.0" fill="none" stroke="#2563eb" stroke-width="3"/>

<!-- crest markers (tops) at x=140 and x=340 -->
<circle cx="140" cy="260" r="4" fill="#dc2626"/>
<circle cx="340" cy="260" r="4" fill="#dc2626"/>
<!-- crest-to-crest measurement ABOVE the wave -->
<line x1="140" y1="260" x2="140" y2="232" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3"/>
<line x1="340" y1="260" x2="340" y2="232" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3"/>
<line x1="140" y1="238" x2="340" y2="238" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="140,238 156,232 156,244" fill="#dc2626"/>
<polygon points="340,238 324,232 324,244" fill="#dc2626"/>
<text x="240" y="228" font-family="Arial,sans-serif" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">λ — vågtopp till vågtopp</text>

<!-- trough markers (bottoms) at x=240 and x=440 -->
<circle cx="240" cy="380" r="4" fill="#16a34a"/>
<circle cx="440" cy="380" r="4" fill="#16a34a"/>
<!-- trough-to-trough measurement BELOW the wave -->
<line x1="240" y1="380" x2="240" y2="408" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4,3"/>
<line x1="440" y1="380" x2="440" y2="408" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4,3"/>
<line x1="240" y1="402" x2="440" y2="402" stroke="#16a34a" stroke-width="2.5"/>
<polygon points="240,402 256,396 256,408" fill="#16a34a"/>
<polygon points="440,402 424,396 424,408" fill="#16a34a"/>
<text x="340" y="425" font-family="Arial,sans-serif" font-size="15" fill="#16a34a" text-anchor="middle" font-weight="bold">λ — vågdal till vågdal</text>

<!-- the two are equal -->
<text x="610" y="345" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Lika långa:</text>
<text x="610" y="367" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">topp–topp = dal–dal</text>

<text x="400" y="452" font-family="Arial,sans-serif" font-size="14" fill="#374151" text-anchor="middle" font-weight="bold">Radiovågor har lång våglängd och ligger längst till vänster i spektrumet</text>
<text x="400" y="476" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Våglängden λ är lika stor mätt från vågtopp till vågtopp som från vågdal till vågdal</text>
</svg>