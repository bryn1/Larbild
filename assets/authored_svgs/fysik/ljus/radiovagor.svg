<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Radiovågor</text>
<!-- ===== Electromagnetic spectrum strip: LEFT = long wavelength, RIGHT = short ===== -->
<rect x="80" y="120" width="90" height="56" fill="#94a3b8"/>
<rect x="170" y="120" width="80" height="56" fill="#64748b"/>
<rect x="250" y="120" width="90" height="56" fill="#b91c1c"/>
<rect x="340" y="120" width="22" height="56" fill="#ef4444"/>
<rect x="362" y="120" width="21" height="56" fill="#f97316"/>
<rect x="383" y="120" width="22" height="56" fill="#facc15"/>
<rect x="405" y="120" width="22" height="56" fill="#22c55e"/>
<rect x="427" y="120" width="21" height="56" fill="#3b82f6"/>
<rect x="448" y="120" width="22" height="56" fill="#7c3aed"/>
<rect x="470" y="120" width="80" height="56" fill="#6d28d9"/>
<rect x="550" y="120" width="80" height="56" fill="#4338ca"/>
<rect x="630" y="120" width="90" height="56" fill="#312e81"/>
<rect x="80" y="120" width="640" height="56" fill="none" stroke="#1f2937" stroke-width="1.5"/>
<text x="125" y="153" font-family="Arial,sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Radio</text>
<text x="210" y="153" font-family="Arial,sans-serif" font-size="11" fill="white" text-anchor="middle">Mikro</text>
<text x="295" y="153" font-family="Arial,sans-serif" font-size="11" fill="white" text-anchor="middle">Infraröd</text>
<text x="405" y="108" font-family="Arial,sans-serif" font-size="11" fill="#374151" text-anchor="middle">Synligt ljus</text>
<text x="510" y="153" font-family="Arial,sans-serif" font-size="11" fill="white" text-anchor="middle">UV</text>
<text x="590" y="153" font-family="Arial,sans-serif" font-size="11" fill="white" text-anchor="middle">Röntgen</text>
<text x="675" y="153" font-family="Arial,sans-serif" font-size="11" fill="white" text-anchor="middle">Gamma</text>
<text x="120" y="200" font-family="Arial,sans-serif" font-size="11" fill="#374151" text-anchor="middle">lång våglängd</text>
<text x="680" y="200" font-family="Arial,sans-serif" font-size="11" fill="#374151" text-anchor="middle">kort våglängd</text>
<!-- Highlight Radio at the long-wavelength (left) end -->
<rect x="78" y="118" width="94" height="60" fill="none" stroke="#dc2626" stroke-width="3"/>
<!-- ===== Wave below with a CLEAR crest-to-crest wavelength marking ===== -->
<!-- baseline (centre line of the wave) -->
<line x1="90" y1="320" x2="720" y2="320" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,4"/>
<!-- A long-wavelength sine wave (radio): few, wide humps. Crests at x=180 and x=380 (period 200). -->
<path d="M 90 320
         Q 130 250 180 250 Q 230 250 280 390 Q 330 390 380 250
         Q 430 250 480 250 Q 530 250 580 390 Q 630 390 680 250
         L 720 280" fill="none" stroke="#2563eb" stroke-width="3"/>
<!-- vertical guide lines at two adjacent crests (x=180 and x=380) -->
<line x1="180" y1="250" x2="180" y2="430" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5,4"/>
<line x1="380" y1="250" x2="380" y2="430" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5,4"/>
<!-- crest-to-crest double arrow labelled lambda -->
<line x1="180" y1="415" x2="380" y2="415" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="180,415 196,409 196,421" fill="#dc2626"/>
<polygon points="380,415 364,409 364,421" fill="#dc2626"/>
<text x="280" y="405" font-family="Arial,sans-serif" font-size="18" fill="#dc2626" text-anchor="middle" font-weight="bold">λ (våglängd)</text>
<!-- crest markers -->
<circle cx="180" cy="250" r="4" fill="#dc2626"/>
<circle cx="380" cy="250" r="4" fill="#dc2626"/>
<text x="280" y="240" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">avstånd mellan två vågtoppar</text>
<text x="400" y="452" font-family="Arial,sans-serif" font-size="14" fill="#374151" text-anchor="middle" font-weight="bold">Radiovågor har lång våglängd och ligger längst till vänster i spektrumet</text>
<text x="400" y="476" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Våglängden λ mäts från en vågtopp till nästa</text>
</svg>
