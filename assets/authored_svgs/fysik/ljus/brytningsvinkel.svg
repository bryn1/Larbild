<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Brytningsvinkel</text>
<!-- Two media -->
<rect x="150" y="100" width="500" height="140" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<rect x="150" y="240" width="500" height="160" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<line x1="150" y1="240" x2="650" y2="240" stroke="#2563eb" stroke-width="2.5"/>
<text x="600" y="160" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Luft</text>
<text x="600" y="360" font-family="Arial,sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">Vatten</text>
<!-- Normal at entry point (400,240) -->
<line x1="400" y1="100" x2="400" y2="400" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="408" y="118" font-family="Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="start">normal</text>
<!-- Incoming ray -->
<line x1="270" y1="130" x2="400" y2="240" stroke="#2563eb" stroke-width="3"/>
<polygon points="400,240 389,232 396,226" fill="#2563eb"/>
<text x="290" y="135" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">Infallande ljus</text>
<!-- Refracted ray bent toward normal -->
<line x1="400" y1="240" x2="455" y2="390" stroke="#dc2626" stroke-width="3"/>
<polygon points="455,390 444,383 452,378" fill="#dc2626"/>
<text x="510" y="370" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">Bruten stråle</text>
<!-- Refraction angle arc: between normal (down) and refracted ray -->
<path d="M 400 300 A 60 60 0 0 0 422 356" fill="none" stroke="#16a34a" stroke-width="2"/>
<text x="430" y="320" font-family="Arial,sans-serif" font-size="16" fill="#16a34a" text-anchor="middle" font-weight="bold">b</text>
<text x="305" y="320" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle">b = brytningsvinkel</text>
<text x="400" y="450" font-family="Arial,sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Mäts mellan den brutna strålen och normalen (linjen rakt ut från ytan)</text>
<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">När ljus går in i vatten böjs det mot normalen — mindre brytningsvinkel</text>
</svg>
