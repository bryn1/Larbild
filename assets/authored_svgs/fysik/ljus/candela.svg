<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Candela (cd) — ljusstyrka i en riktning</text>
<!-- Light source on the left, cone apex at (180,250) -->
<circle cx="160" cy="250" r="26" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
<text x="160" y="255" font-family="Arial,sans-serif" font-size="11" fill="#92400e" text-anchor="middle" font-weight="bold">Lampa</text>
<!-- A single cone/beam of light to the RIGHT (apex at source, ~17 deg half-angle) -->
<polygon points="186,250 600,128 600,372" fill="#fde68a" stroke="#f59e0b" stroke-width="2" opacity="0.55"/>
<!-- central direction arrow along the cone axis -->
<line x1="200" y1="250" x2="600" y2="250" stroke="#dc2626" stroke-width="3"/>
<polygon points="612,250 597,242 597,258" fill="#dc2626"/>
<text x="400" y="240" font-family="Arial,sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold">en bestämd riktning</text>
<!-- Solid-angle wedge: arc centered at the source apex, spanning the cone opening, opening RIGHT -->
<path d="M 270 222 A 90 90 0 0 0 270 278" fill="none" stroke="#16a34a" stroke-width="2"/>
<line x1="186" y1="250" x2="276" y2="223" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="4,3"/>
<line x1="186" y1="250" x2="276" y2="277" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="4,3"/>
<text x="298" y="210" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="bold">rymdvinkel</text>
<line x1="285" y1="216" x2="272" y2="234" stroke="#16a34a" stroke-width="1"/>
<!-- measurement label at far end -->
<text x="650" y="244" font-family="Arial,sans-serif" font-size="17" fill="#16a34a" text-anchor="middle" font-weight="bold">cd</text>
<text x="650" y="264" font-family="Arial,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">candela</text>
<text x="400" y="425" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">Candela mäter hur starkt lampan lyser åt ett visst håll</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">En cykellampa anges i candela — hur skarpt den lyser framåt på vägen</text>
</svg>
