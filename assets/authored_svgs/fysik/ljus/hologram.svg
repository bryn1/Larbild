<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Hologram — en tredimensionell bild av ljus</text>
<!-- Laser source on the left -->
<rect x="80" y="235" width="60" height="34" fill="#9ca3af" stroke="#6b7280" stroke-width="2" rx="3"/>
<text x="110" y="290" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">Laser</text>
<!-- Beam splitting into two paths that meet at the plate -->
<line x1="140" y1="252" x2="250" y2="252" stroke="#dc2626" stroke-width="3"/>
<!-- split point -->
<circle cx="250" cy="252" r="5" fill="#1f2937"/>
<!-- reference beam (upper) to plate -->
<line x1="250" y1="252" x2="430" y2="160" stroke="#dc2626" stroke-width="2.5"/>
<text x="320" y="195" font-family="Arial,sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">referensstråle</text>
<!-- object beam (lower) to plate -->
<line x1="250" y1="252" x2="430" y2="345" stroke="#f59e0b" stroke-width="2.5"/>
<text x="320" y="320" font-family="Arial,sans-serif" font-size="11" fill="#f59e0b" text-anchor="middle">objektstråle</text>
<!-- Holographic plate (the card) -->
<rect x="430" y="150" width="20" height="210" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
<text x="440" y="385" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">platta / kort</text>
<!-- Two waves meeting / interfering on the plate -->
<text x="500" y="135" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">vågorna möts</text>
<!-- The 3D image emerging on the right (a shimmering cube wireframe) -->
<g stroke="#7c3aed" stroke-width="2" fill="none" opacity="0.85">
<rect x="560" y="200" width="80" height="80"/>
<rect x="600" y="170" width="80" height="80"/>
<line x1="560" y1="200" x2="600" y2="170"/>
<line x1="640" y1="200" x2="680" y2="170"/>
<line x1="560" y1="280" x2="600" y2="250"/>
<line x1="640" y1="280" x2="680" y2="250"/>
</g>
<!-- glitter sparkles -->
<text x="700" y="190" font-family="Arial,sans-serif" font-size="16" fill="#f59e0b" text-anchor="middle">*</text>
<text x="555" y="175" font-family="Arial,sans-serif" font-size="14" fill="#f59e0b" text-anchor="middle">*</text>
<text x="620" y="300" font-family="Arial,sans-serif" font-size="13" fill="#f59e0b" text-anchor="middle">*</text>
<text x="630" y="330" font-family="Arial,sans-serif" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="bold">3D-bild</text>
<text x="400" y="430" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">Ljus som möts på ett särskilt sätt bygger upp en bild som ser tredimensionell ut</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">På busskortet eller en sedel finns ofta ett hologram som glittrar när du vrider det</text>
</svg>
