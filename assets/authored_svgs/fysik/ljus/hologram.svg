<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="32" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Hologram — tredimensionell bild av ljus</text>
<!-- Laser source, left -->
<rect x="60" y="225" width="64" height="32" fill="#9ca3af" stroke="#6b7280" stroke-width="2" rx="3"/>
<text x="92" y="246" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Laser</text>
<!-- Beam from laser to the beam-splitter -->
<line x1="124" y1="241" x2="245" y2="241" stroke="#dc2626" stroke-width="3"/>
<polygon points="245,241 233,235 233,247" fill="#dc2626"/>
<!-- Beam-splitter: a diagonal half-mirror -->
<line x1="232" y1="223" x2="262" y2="259" stroke="#2563eb" stroke-width="4"/>
<text x="248" y="300" font-family="Arial,sans-serif" font-size="11" fill="#2563eb" text-anchor="middle">stråldelare</text>
<!-- Reference beam: continues straight to the plate -->
<line x1="262" y1="241" x2="555" y2="241" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="555,241 543,235 543,247" fill="#dc2626"/>
<text x="400" y="232" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold">referensstråle</text>
<!-- Object beam: deflected downward to the object -->
<line x1="247" y1="241" x2="300" y2="370" stroke="#f59e0b" stroke-width="2.5"/>
<polygon points="300,370 290,357 282,365" fill="#f59e0b"/>
<text x="232" y="350" font-family="Arial,sans-serif" font-size="11" fill="#d97706" text-anchor="middle">objektstråle</text>
<!-- The object (a small apple/sphere) -->
<circle cx="320" cy="385" r="24" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
<text x="320" y="430" font-family="Arial,sans-serif" font-size="12" fill="#d97706" text-anchor="middle">föremål</text>
<!-- Scattered object light travels up to the plate -->
<line x1="344" y1="375" x2="555" y2="300" stroke="#f59e0b" stroke-width="2.5"/>
<polygon points="555,300 541,300 547,311" fill="#f59e0b"/>
<!-- Photographic plate -->
<rect x="558" y="180" width="18" height="170" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
<text x="567" y="372" font-family="Arial,sans-serif" font-size="11" fill="#2563eb" text-anchor="middle">fotoplatta</text>
<text x="567" y="166" font-family="Arial,sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">vågorna möts här</text>
<!-- The reconstructed 3D wireframe image, right -->
<g stroke="#7c3aed" stroke-width="2" fill="none">
<rect x="635" y="205" width="74" height="74"/>
<rect x="672" y="178" width="74" height="74"/>
<line x1="635" y1="205" x2="672" y2="178"/>
<line x1="709" y1="205" x2="746" y2="178"/>
<line x1="635" y1="279" x2="672" y2="252"/>
<line x1="709" y1="279" x2="746" y2="252"/>
</g>
<text x="690" y="305" font-family="Arial,sans-serif" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="bold">3D-bild</text>
<text x="400" y="463" font-family="Arial,sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">Laserns ljus delas i två: referens- och objektstråle som möts på plattan</text>
<text x="400" y="485" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Mönstret på plattan återskapar en bild som ser tredimensionell ut</text>
</svg>
