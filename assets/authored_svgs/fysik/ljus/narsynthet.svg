<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="33" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Närsynthet (myopi)</text>
<!-- divider between the two panels -->
<line x1="400" y1="70" x2="400" y2="410" stroke="#e5e7eb" stroke-width="1.5"/>

<!-- ============ PANEL 1 (left): uncorrected myopic eye ============ -->
<text x="205" y="92" font-family="Arial,sans-serif" font-size="14" fill="#374151" text-anchor="middle" font-weight="bold">Utan glasögon</text>
<!-- Elongated eyeball (too long front-to-back) -->
<ellipse cx="215" cy="240" rx="130" ry="98" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
<!-- Eye lens near the front (left) -->
<ellipse cx="118" cy="240" rx="11" ry="40" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
<text x="100" y="300" font-family="Arial,sans-serif" font-size="11" fill="#1e40af" text-anchor="middle">lins</text>
<!-- Retina along the back (right) inner wall -->
<path d="M 322 175 A 98 98 0 0 1 322 305" fill="none" stroke="#16a34a" stroke-width="4" opacity="0.8"/>
<text x="345" y="244" font-family="Arial,sans-serif" font-size="11" fill="#16a34a" text-anchor="middle">näthinna</text>
<!-- Two parallel rays come in, refract at lens, converge to a focus IN FRONT of retina, then diverge -->
<!-- upper ray -->
<line x1="40" y1="212" x2="118" y2="212" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="118,212 104,206 104,218" fill="#dc2626"/>
<line x1="118" y1="212" x2="235" y2="240" stroke="#dc2626" stroke-width="2.5"/>
<line x1="235" y1="240" x2="312" y2="258" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="312,258 298,250 295,261" fill="#dc2626"/>
<!-- lower ray -->
<line x1="40" y1="268" x2="118" y2="268" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="118,268 104,262 104,274" fill="#dc2626"/>
<line x1="118" y1="268" x2="235" y2="240" stroke="#dc2626" stroke-width="2.5"/>
<line x1="235" y1="240" x2="312" y2="222" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="312,222 298,219 301,230" fill="#dc2626"/>
<!-- focus point in front of retina -->
<circle cx="235" cy="240" r="5" fill="#dc2626"/>
<text x="235" y="368" font-family="Arial,sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">skärpan hamnar</text>
<text x="235" y="383" font-family="Arial,sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">framför näthinnan</text>

<!-- ============ PANEL 2 (right): corrected with concave lens ============ -->
<text x="595" y="92" font-family="Arial,sans-serif" font-size="14" fill="#374151" text-anchor="middle" font-weight="bold">Med konkav glasögonlins</text>
<!-- Elongated eyeball -->
<ellipse cx="600" cy="240" rx="130" ry="98" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
<!-- Eye lens near the front -->
<ellipse cx="503" cy="240" rx="11" ry="40" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
<!-- Retina at the back, drawn so its vertex (at y=240) is at x=718 -->
<path d="M 700 158 A 187 187 0 0 1 700 322" fill="none" stroke="#16a34a" stroke-width="4" opacity="0.85"/>
<text x="690" y="150" font-family="Arial,sans-serif" font-size="11" fill="#16a34a" text-anchor="middle">näthinna</text>
<!-- CONCAVE (diverging) correcting lens, CLEARLY in front of the eye (well to the left, not over the eyeball) -->
<path d="M 420 178 Q 444 240 420 302 L 452 302 Q 432 240 452 178 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="436" y="168" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="bold">konkav lins</text>
<text x="436" y="330" font-family="Arial,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">tunn i mitten</text>
<!-- Rays: parallel in, concave lens spreads them slightly, eye lens converges them EXACTLY onto the retina -->
<!-- upper ray -->
<line x1="360" y1="212" x2="423" y2="212" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="423,212 409,206 409,218" fill="#dc2626"/>
<!-- diverged a bit by the concave lens -->
<line x1="449" y1="212" x2="503" y2="205" stroke="#dc2626" stroke-width="2.5"/>
<!-- converged by the eye lens onto the retina vertex (718,240) -->
<line x1="503" y1="205" x2="718" y2="240" stroke="#dc2626" stroke-width="2.5"/>
<!-- lower ray -->
<line x1="360" y1="268" x2="423" y2="268" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="423,268 409,262 409,274" fill="#dc2626"/>
<line x1="449" y1="268" x2="503" y2="275" stroke="#dc2626" stroke-width="2.5"/>
<line x1="503" y1="275" x2="718" y2="240" stroke="#dc2626" stroke-width="2.5"/>
<!-- focus EXACTLY on the retina -->
<circle cx="718" cy="240" r="5" fill="#16a34a"/>
<text x="600" y="375" font-family="Arial,sans-serif" font-size="11" fill="#16a34a" text-anchor="middle">skärpan hamnar nu på näthinnan</text>

<text x="400" y="452" font-family="Arial,sans-serif" font-size="14" fill="#374151" text-anchor="middle" font-weight="bold">Vid närsynthet är ögat för långt — bilden blir skarp framför näthinnan</text>
<text x="400" y="476" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">En konkav (spridande) lins flyttar skärpan bakåt så att den hamnar på näthinnan</text>
</svg>