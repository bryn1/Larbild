<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Konkav spegel</text>

<!-- optical axis -->
<line x1="80" y1="250" x2="720" y2="250" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="708" y="242" font-family="Arial,sans-serif" font-size="11" fill="#9ca3af">axel</text>

<!-- ===== Concave mirror: curve bulging RIGHT, reflective face on the LEFT ===== -->
<!-- The mirror line (reflective surface faces left toward incoming rays) -->
<path d="M560 110 q-90 140 0 280" fill="none" stroke="#1f2937" stroke-width="4"/>
<!-- hatch marks on the BACK (right, non-reflective) side -->
<line x1="513" y1="135" x2="528" y2="125" stroke="#6b7280" stroke-width="2"/>
<line x1="498" y1="170" x2="514" y2="162" stroke="#6b7280" stroke-width="2"/>
<line x1="490" y1="208" x2="507" y2="202" stroke="#6b7280" stroke-width="2"/>
<line x1="488" y1="250" x2="505" y2="250" stroke="#6b7280" stroke-width="2"/>
<line x1="490" y1="292" x2="507" y2="298" stroke="#6b7280" stroke-width="2"/>
<line x1="498" y1="330" x2="514" y2="338" stroke="#6b7280" stroke-width="2"/>
<line x1="513" y1="365" x2="528" y2="375" stroke="#6b7280" stroke-width="2"/>
<text x="610" y="160" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">spegelns baksida</text>
<text x="470" y="95" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">speglande sida</text>

<!-- focal point F (in front of the mirror, on the axis) -->
<circle cx="370" cy="250" r="5" fill="#dc2626"/>
<text x="370" y="278" font-family="Arial,sans-serif" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">F</text>
<text x="370" y="296" font-family="Arial,sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">brännpunkt</text>

<!-- ===== Parallel incoming rays (blue) hitting mirror, converging to F (green) ===== -->
<!-- ray 1 (upper) -->
<line x1="120" y1="160" x2="497" y2="160" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="360,160 346,154 346,166" fill="#2563eb"/>
<line x1="497" y1="160" x2="370" y2="250" stroke="#16a34a" stroke-width="2.5"/>
<polygon points="430,206 444,204 437,217" fill="#16a34a"/>
<!-- ray 2 (lower) -->
<line x1="120" y1="340" x2="497" y2="340" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="360,340 346,334 346,346" fill="#2563eb"/>
<line x1="497" y1="340" x2="370" y2="250" stroke="#16a34a" stroke-width="2.5"/>
<polygon points="430,294 444,296 437,283" fill="#16a34a"/>
<!-- ray 3 (along axis) -->
<line x1="120" y1="250" x2="487" y2="250" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="300,250 286,244 286,256" fill="#2563eb"/>

<text x="180" y="150" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" font-weight="bold">parallella strålar</text>

<text x="400" y="430" font-family="Arial,sans-serif" font-size="14" fill="#374151" text-anchor="middle" font-weight="bold">En konkav spegel buktar inåt och samlar strålarna i brännpunkten F</text>
<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Strecken på baksidan visar vilken sida som är spegel</text>
</svg>
