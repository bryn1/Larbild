<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Konkav spegel</text>
<!-- optical axis -->
<line x1="80" y1="250" x2="720" y2="250" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,5"/>
<text x="700" y="242" font-family="Arial,sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">axel</text>
<!-- Concave mirror: hollow (reflective) side faces LEFT toward the incoming rays.
     Arc of a circle, centre of curvature to the LEFT, vertex on axis at x=540. -->
<path d="M 501.7 120 A 240 240 0 0 1 501.7 380" fill="none" stroke="#1f2937" stroke-width="4"/>
<!-- hatch marks on the BACK (right, non-reflective, convex) side -->
<line x1="503" y1="123" x2="519" y2="116" stroke="#6b7280" stroke-width="2"/>
<line x1="522" y1="170" x2="539" y2="164" stroke="#6b7280" stroke-width="2"/>
<line x1="535" y1="210" x2="552" y2="206" stroke="#6b7280" stroke-width="2"/>
<line x1="540" y1="250" x2="557" y2="250" stroke="#6b7280" stroke-width="2"/>
<line x1="535" y1="290" x2="552" y2="294" stroke="#6b7280" stroke-width="2"/>
<line x1="522" y1="330" x2="539" y2="336" stroke="#6b7280" stroke-width="2"/>
<line x1="503" y1="377" x2="519" y2="384" stroke="#6b7280" stroke-width="2"/>
<text x="595" y="160" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">spegelns baksida</text>
<text x="455" y="98" font-family="Arial,sans-serif" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">speglande sida</text>
<!-- focal point F (in front of the mirror, on the axis, between vertex and centre) -->
<circle cx="420" cy="250" r="5" fill="#dc2626"/>
<text x="420" y="240" font-family="Arial,sans-serif" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">F</text>
<text x="420" y="298" font-family="Arial,sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">brännpunkt</text>
<!-- ===== Parallel incoming rays (blue) hit the mirror surface, reflect (green) through F ===== -->
<!-- ray 1 (upper): surface point (522.5,160) -->
<line x1="120" y1="160" x2="522.5" y2="160" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="330,160 316,154 316,166" fill="#2563eb"/>
<line x1="522.5" y1="160" x2="420" y2="250" stroke="#16a34a" stroke-width="2.5"/>
<polygon points="455,219 469,219 461,231" fill="#16a34a"/>
<!-- ray 2 (lower): surface point (522.5,340) -->
<line x1="120" y1="340" x2="522.5" y2="340" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="330,340 316,334 316,346" fill="#2563eb"/>
<line x1="522.5" y1="340" x2="420" y2="250" stroke="#16a34a" stroke-width="2.5"/>
<polygon points="455,281 469,281 461,269" fill="#16a34a"/>
<!-- ray 3 (along axis): surface point (540,250), reflects straight back through F -->
<line x1="120" y1="250" x2="540" y2="250" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="320,250 306,244 306,256" fill="#2563eb"/>
<text x="185" y="150" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="bold">parallella strålar</text>
<text x="350" y="200" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="bold">reflekterade</text>
<text x="400" y="438" font-family="Arial,sans-serif" font-size="14" fill="#374151" text-anchor="middle" font-weight="bold">En konkav spegel buktar inåt och samlar strålarna i brännpunkten F</text>
<text x="400" y="478" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Strecken på baksidan visar vilken sida som är spegel</text>
</svg>
