<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Laser — samlat ljus i en färg</text>
<!-- TOP: ordinary lamp, scattered multi-colour light -->
<text x="120" y="115" font-family="Arial,sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="bold">Vanlig lampa</text>
<circle cx="170" cy="160" r="22" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<!-- scattered rays in many directions and colours -->
<line x1="190" y1="145" x2="380" y2="100" stroke="#dc2626" stroke-width="2"/>
<line x1="192" y1="160" x2="400" y2="160" stroke="#16a34a" stroke-width="2"/>
<line x1="190" y1="175" x2="380" y2="220" stroke="#2563eb" stroke-width="2"/>
<line x1="180" y1="140" x2="300" y2="80" stroke="#f59e0b" stroke-width="2"/>
<line x1="180" y1="182" x2="300" y2="240" stroke="#7c3aed" stroke-width="2"/>
<text x="500" y="150" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Spritt ljus, många färger,</text>
<text x="500" y="168" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="start">åt alla håll</text>
<!-- Divider -->
<line x1="60" y1="270" x2="740" y2="270" stroke="#e5e7eb" stroke-width="1.5"/>
<!-- BOTTOM: laser, tight single-colour parallel beam, waves in step -->
<text x="120" y="320" font-family="Arial,sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold">Laser</text>
<rect x="120" y="345" width="60" height="40" fill="#9ca3af" stroke="#6b7280" stroke-width="2" rx="3"/>
<!-- tight parallel red beam -->
<line x1="180" y1="358" x2="700" y2="358" stroke="#dc2626" stroke-width="3"/>
<line x1="180" y1="365" x2="700" y2="365" stroke="#dc2626" stroke-width="3"/>
<line x1="180" y1="372" x2="700" y2="372" stroke="#dc2626" stroke-width="3"/>
<polygon points="710,365 696,358 696,372" fill="#dc2626"/>
<text x="450" y="345" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">Tunn, samlad stråle — en enda färg</text>
<text x="450" y="405" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Alla ljusvågor går i takt (parallella)</text>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Laserljus är samlat, enfärgat och går i takt — som den röda pricken på golvet</text>
</svg>
