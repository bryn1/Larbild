<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Glaskroppen i ögat</text>
<!-- Single eyeball cross-section, front (cornea) to the LEFT -->
<circle cx="400" cy="250" r="150" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<!-- Glaskropp (vitreous body): the large clear region filling the eye between lens and retina -->
<circle cx="425" cy="250" r="118" fill="#bae6fd" opacity="0.6"/>
<text x="455" y="248" font-family="Arial,sans-serif" font-size="15" fill="#0369a1" text-anchor="middle" font-weight="bold">Glaskropp</text>
<text x="455" y="268" font-family="Arial,sans-serif" font-size="11" fill="#0369a1" text-anchor="middle">(klar geléartad massa)</text>
<!-- Cornea bulge at the front (left), drawn as part of the same eye wall -->
<path d="M 258 188 Q 222 250 258 312" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
<text x="232" y="160" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">Hornhinna</text>
<line x1="240" y1="172" x2="248" y2="205" stroke="#2563eb" stroke-width="1"/>
<!-- Lens just behind the cornea -->
<ellipse cx="292" cy="250" rx="14" ry="42" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
<text x="292" y="335" font-family="Arial,sans-serif" font-size="12" fill="#1e40af" text-anchor="middle">Lins</text>
<line x1="292" y1="294" x2="292" y2="322" stroke="#1e40af" stroke-width="1"/>
<!-- Retina along the back (right) inner wall -->
<path d="M 498 138 A 150 150 0 0 1 498 362" fill="none" stroke="#16a34a" stroke-width="5" opacity="0.7"/>
<text x="612" y="250" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle">Näthinna</text>
<line x1="578" y1="250" x2="552" y2="250" stroke="#16a34a" stroke-width="1"/>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Den klara geléartade glaskroppen fyller ut ögat mellan linsen och näthinnan</text>
</svg>
