<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="white"/>
<text x="400" y="35" font-family="Arial,sans-serif" font-size="22" fill="#1e40af" text-anchor="middle" font-weight="bold">Glaskroppen i ögat</text>
<!-- Eyeball -->
<circle cx="400" cy="250" r="150" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<!-- Highlight: the vitreous body fills the eye behind the lens -->
<path d="M 295 168 A 150 150 0 1 0 295 332 Q 320 250 295 168 Z" fill="#bae6fd" stroke="#0ea5e9" stroke-width="1.5" opacity="0.7"/>
<text x="430" y="255" font-family="Arial,sans-serif" font-size="14" fill="#0369a1" text-anchor="middle" font-weight="bold">Glaskropp</text>
<text x="430" y="275" font-family="Arial,sans-serif" font-size="11" fill="#0369a1" text-anchor="middle">(geléartad massa)</text>
<!-- Cornea bulge at front (left) -->
<path d="M 268 195 Q 230 250 268 305" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
<text x="245" y="160" font-family="Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">Hornhinna</text>
<line x1="252" y1="200" x2="248" y2="172" stroke="#2563eb" stroke-width="1"/>
<!-- Lens -->
<ellipse cx="285" cy="250" rx="14" ry="40" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
<text x="285" y="335" font-family="Arial,sans-serif" font-size="12" fill="#1e40af" text-anchor="middle">Lins</text>
<line x1="285" y1="292" x2="285" y2="322" stroke="#1e40af" stroke-width="1"/>
<!-- Retina back wall -->
<path d="M 485 145 A 150 150 0 0 1 485 355" fill="none" stroke="#16a34a" stroke-width="5" opacity="0.6"/>
<text x="600" y="250" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" text-anchor="middle">Näthinna</text>
<line x1="560" y1="250" x2="545" y2="250" stroke="#16a34a" stroke-width="1"/>
<text x="400" y="475" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Den klara geléartade glaskroppen fyller ut ögat och håller det i form</text>
</svg>
